name: Build Android APK - V2.1

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f firebase/google-services.json ]; then
            echo "ERRO: firebase/google-services.json não encontrado."
            exit 1
          fi

          cp firebase/google-services.json app/google-services.json

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERRO: Nenhuma planilha XLSX encontrada dentro de dados/"
            exit 1
          fi

          echo "Planilha encontrada: $XLSX_FILE"
          cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx

      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="barcode_ui"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

      - name: Criar layout principal
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F5F5F5">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="14dp"
                  android:background="#1565C0">

                  <TextView
                      android:id="@+id/tvTitulo"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Registro de Reposição"
                      android:textColor="#FFFFFF"
                      android:textSize="22sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/tvOperador"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Operador: Operador 1"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"/>
              </LinearLayout>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnModoReposicao"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="📦 REPOSIÇÃO"/>

                          <Button
                              android:id="@+id/btnModoConsulta"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="5dp"
                              android:text="🔎 CONSULTAR"/>
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnNomeOperador"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="ALTERAR NOME DO OPERADOR"/>

                      <TextView
                          android:id="@+id/tvModoDescricao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="Bipe ou digite o produto para solicitar reposição."
                          android:textColor="#616161"/>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <EditText
                              android:id="@+id/etCodigo"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:hint="Bipe ou digite o Código Mate"
                              android:inputType="number"
                              android:maxLength="30"
                              android:imeOptions="actionDone"
                              android:padding="14dp"/>

                          <Button
                              android:id="@+id/btnScanner"
                              android:layout_width="58dp"
                              android:layout_height="58dp"
                              android:layout_marginStart="6dp"
                              android:text="📷"
                              android:textSize="22sp"
                              android:contentDescription="Ler código de barras pela câmera"/>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerProdutoEncontrado"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:padding="12dp"
                          android:orientation="vertical"
                          android:background="#E3F2FD"
                          android:visibility="gone">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="PRODUTO ENCONTRADO"
                              android:textColor="#1565C0"
                              android:textStyle="bold"
                              android:textSize="12sp"/>

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="5dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:id="@+id/tvCodigoEncontrado"
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:textColor="#212121"
                                  android:textSize="18sp"
                                  android:textStyle="bold"/>

                              <Button
                                  android:id="@+id/btnCopiarCodigo"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="📋 COPIAR"
                                  android:minHeight="0dp"
                                  android:minWidth="0dp"/>
                          </LinearLayout>

                          <TextView
                              android:id="@+id/tvProdutoEncontrado"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="5dp"
                              android:textColor="#212121"
                              android:textSize="15sp"/>

                          <TextView
                              android:id="@+id/tvEnderecoEncontrado"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:textColor="#1565C0"
                              android:textSize="15sp"
                              android:textStyle="bold"/>
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnProcessar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="ADICIONAR REPOSIÇÃO"/>

                      <Button
                          android:id="@+id/btnLimparConsultas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="🗑 LIMPAR CONSULTAS"
                          android:visibility="gone"/>

                      <TextView
                          android:id="@+id/tvFeedback"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:padding="10dp"
                          android:textColor="#2E7D32"
                          android:textStyle="bold"
                          android:visibility="gone"/>

                      <LinearLayout
                          android:id="@+id/containerContadores"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="14dp"
                          android:orientation="horizontal"
                          android:weightSum="3">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="10dp"
                              android:background="#FFCDD2">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="PENDENTES"
                                  android:textColor="#B71C1C"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvPendentes"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="#B71C1C"
                                  android:textSize="22sp"
                                  android:textStyle="bold"/>
                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="10dp"
                              android:background="#C8E6C9">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="CONCLUÍDOS"
                                  android:textColor="#1B5E20"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvConcluidos"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="#1B5E20"
                                  android:textSize="22sp"
                                  android:textStyle="bold"/>
                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="10dp"
                              android:background="#FFF59D">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="TOTAL"
                                  android:textColor="#F57F17"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvTotal"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="#F57F17"
                                  android:textSize="22sp"
                                  android:textStyle="bold"/>
                          </LinearLayout>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerAbas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnPendentes"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="PENDENTES"/>

                          <Button
                              android:id="@+id/btnConcluidos"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="5dp"
                              android:text="CONCLUÍDOS"/>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerLista"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="vertical"/>
                  </LinearLayout>
              </ScrollView>
          </LinearLayout>
          EOF

      - name: Criar layout dos registros
        run: |
          cat << 'EOF' > app/src/main/res/layout/item_reposicao.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="6dp"
              android:background="#FFFFFF"
              android:orientation="vertical"
              android:padding="14dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/tvCodigo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textColor="#212121"
                      android:textSize="19sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:padding="6dp"
                      android:textStyle="bold"/>
              </LinearLayout>

              <TextView
                  android:id="@+id/tvProduto"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="5dp"
                  android:textColor="#424242"
                  android:textSize="15sp"/>

              <TextView
                  android:id="@+id/tvEndereco"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#1565C0"
                  android:textSize="15sp"
                  android:textStyle="bold"/>

              <TextView
                  android:id="@+id/tvDetalhes"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="5dp"
                  android:textColor="#757575"
                  android:textSize="12sp"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:gravity="end"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btnCopiarItem"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📋"
                      android:contentDescription="Copiar código"
                      android:minWidth="0dp"
                      android:minHeight="0dp"/>

                  <Button
                      android:id="@+id/btnAcao"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"/>

                  <Button
                      android:id="@+id/btnExcluir"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="6dp"
                      android:text="EXCLUIR"/>
              </LinearLayout>
          </LinearLayout>
          EOF

      - name: Criar MainActivity com Firebase Firestore
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
          package com.separacao.bip

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.util.Xml
          import android.view.LayoutInflater
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.SetOptions
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanning
          import org.json.JSONArray
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.UUID
          import java.util.zip.ZipFile

          data class EnderecoProduto(
              val codigo: String,
              val descricao: String,
              val rua: String,
              val rack: String,
              val coluna: String,
              val linha: String
          )

          data class ItemReposicao(
              val id: String,
              val codigo: String,
              val descricao: String,
              var quantidade: Int,
              val rua: String,
              val rack: String,
              val coluna: String,
              val linha: String,
              val operador: String,
              val timestamp: Long,
              var concluido: Boolean
          )

          data class ItemConsulta(
              val codigo: String,
              val descricao: String,
              val rua: String,
              val rack: String,
              val coluna: String,
              val linha: String,
              val timestamp: Long
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var tvTitulo: TextView
              private lateinit var tvOperador: TextView
              private lateinit var tvModoDescricao: TextView
              private lateinit var etCodigo: EditText
              private lateinit var btnScanner: Button
              private lateinit var containerProdutoEncontrado: LinearLayout
              private lateinit var tvCodigoEncontrado: TextView
              private lateinit var tvProdutoEncontrado: TextView
              private lateinit var tvEnderecoEncontrado: TextView
              private lateinit var btnCopiarCodigo: Button
              private lateinit var btnProcessar: Button
              private lateinit var btnLimparConsultas: Button
              private lateinit var btnModoReposicao: Button
              private lateinit var btnModoConsulta: Button
              private lateinit var btnNomeOperador: Button
              private lateinit var tvFeedback: TextView
              private lateinit var containerContadores: LinearLayout
              private lateinit var containerAbas: LinearLayout
              private lateinit var containerLista: LinearLayout
              private lateinit var tvPendentes: TextView
              private lateinit var tvConcluidos: TextView
              private lateinit var tvTotal: TextView
              private lateinit var btnPendentes: Button
              private lateinit var btnConcluidos: Button

              private val baseProdutos = mutableMapOf<String, EnderecoProduto>()
              private val registros = mutableListOf<ItemReposicao>()
              private val consultas = mutableListOf<ItemConsulta>()

              private val db by lazy { FirebaseFirestore.getInstance() }
              private var firestoreListener: ListenerRegistration? = null

              private var nomeOperador = "Operador 1"
              private var modoConsulta = false
              private var abaConcluidos = false

              companion object {
                  const val PREFS = "reposicao_prefs"
                  const val KEY_REGISTROS = "registros"
                  const val KEY_OPERADOR = "operador"
                  const val REQUEST_IMPORT_XLSX = 500
                  const val PLANILHA_INTERNA = "enderecos_atualizados.xlsx"
                  const val COLECAO_REPOSICOES = "reposicoes"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContentView(R.layout.activity_main)

                  inicializarViews()
                  carregarOperador()
                  carregarRegistros()
                  carregarBaseEnderecos()
                  configurarEventos()
                  atualizarModo()
                  atualizarInterface()
                  iniciarSincronizacaoFirestore()

                  etCodigo.requestFocus()
              }

              override fun onDestroy() {
                  firestoreListener?.remove()
                  firestoreListener = null
                  super.onDestroy()
              }

              private fun inicializarViews() {
                  tvTitulo = findViewById(R.id.tvTitulo)
                  tvOperador = findViewById(R.id.tvOperador)
                  tvModoDescricao = findViewById(R.id.tvModoDescricao)
                  etCodigo = findViewById(R.id.etCodigo)
                  btnScanner = findViewById(R.id.btnScanner)
                  containerProdutoEncontrado = findViewById(R.id.containerProdutoEncontrado)
                  tvCodigoEncontrado = findViewById(R.id.tvCodigoEncontrado)
                  tvProdutoEncontrado = findViewById(R.id.tvProdutoEncontrado)
                  tvEnderecoEncontrado = findViewById(R.id.tvEnderecoEncontrado)
                  btnCopiarCodigo = findViewById(R.id.btnCopiarCodigo)
                  btnProcessar = findViewById(R.id.btnProcessar)
                  btnLimparConsultas = findViewById(R.id.btnLimparConsultas)
                  btnModoReposicao = findViewById(R.id.btnModoReposicao)
                  btnModoConsulta = findViewById(R.id.btnModoConsulta)
                  btnNomeOperador = findViewById(R.id.btnNomeOperador)
                  tvFeedback = findViewById(R.id.tvFeedback)
                  containerContadores = findViewById(R.id.containerContadores)
                  containerAbas = findViewById(R.id.containerAbas)
                  containerLista = findViewById(R.id.containerLista)
                  tvPendentes = findViewById(R.id.tvPendentes)
                  tvConcluidos = findViewById(R.id.tvConcluidos)
                  tvTotal = findViewById(R.id.tvTotal)
                  btnPendentes = findViewById(R.id.btnPendentes)
                  btnConcluidos = findViewById(R.id.btnConcluidos)
              }

              private fun configurarEventos() {
                  btnModoReposicao.setOnClickListener {
                      modoConsulta = false
                      atualizarModo()
                      atualizarInterface()
                  }

                  btnModoConsulta.setOnClickListener {
                      modoConsulta = true
                      atualizarModo()
                      atualizarConsultas()
                  }

                  btnScanner.setOnClickListener {
                      abrirScanner()
                  }

                  btnCopiarCodigo.setOnClickListener {
                      val codigo = tvCodigoEncontrado.text.toString().trim()
                      .removePrefix("Código:")
                      .trim()
                      if (codigo.isNotEmpty()) {
                          val clipboard =
                              getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(
                              android.content.ClipData.newPlainText(
                                  "Código Material",
                                  codigo
                              )
                          )
                          Toast.makeText(
                              this,
                              "Código $codigo copiado!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

                  etCodigo.addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(
                          s: CharSequence?,
                          start: Int,
                          count: Int,
                          after: Int
                      ) = Unit

                      override fun onTextChanged(
                          s: CharSequence?,
                          start: Int,
                          before: Int,
                          count: Int
                      ) {
                          val codigo = extrairCodigoMate(s?.toString().orEmpty())
                          if (codigo.length == 5 && baseProdutos.isNotEmpty()) {
                              mostrarProdutoEncontrado(codigo)
                          } else if (codigo.length < 5) {
                              esconderProdutoEncontrado()
                          }
                      }

                      override fun afterTextChanged(s: android.text.Editable?) = Unit
                  })

                  btnProcessar.setOnClickListener {
                      processarCodigo()
                  }

                  etCodigo.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_DONE) {
                          processarCodigo()
                          true
                      } else {
                          false
                      }
                  }

                  btnNomeOperador.setOnClickListener {
                      alterarNomeOperador()
                  }

                  btnPendentes.setOnClickListener {
                      abaConcluidos = false
                      atualizarInterface()
                  }

                  btnConcluidos.setOnClickListener {
                      abaConcluidos = true
                      atualizarInterface()
                  }

                  btnLimparConsultas.setOnClickListener {
                      confirmarLimparConsultas()
                  }
              }

              private fun atualizarModo() {
                  tvFeedback.visibility = View.GONE
                  esconderProdutoEncontrado()
                  etCodigo.setText("")

                  if (modoConsulta) {
                      tvTitulo.text = "Consulta de Endereços"
                      tvModoDescricao.text =
                          "Bipe ou digite o Código Mate para consultar produtos."
                      btnProcessar.text = "CONSULTAR ENDEREÇO"
                      btnLimparConsultas.visibility = View.VISIBLE
                      containerContadores.visibility = View.GONE
                      containerAbas.visibility = View.GONE
                  } else {
                      tvTitulo.text = "Registro de Reposição"
                      tvModoDescricao.text =
                          "Bipe ou digite o produto para solicitar reposição."
                      btnProcessar.text = "ADICIONAR REPOSIÇÃO"
                      btnLimparConsultas.visibility = View.GONE
                      containerContadores.visibility = View.VISIBLE
                      containerAbas.visibility = View.VISIBLE
                  }

                  etCodigo.requestFocus()
              }

              private fun abrirScanner() {
                  val scanner = GmsBarcodeScanning.getClient(this)

                  scanner.startScan()
                      .addOnSuccessListener { barcode ->
                          val valor = barcode.rawValue?.trim().orEmpty()

                          if (valor.isEmpty()) {
                              Toast.makeText(
                                  this,
                                  "Não foi possível obter o código.",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return@addOnSuccessListener
                          }

                          etCodigo.setText(valor)
                          etCodigo.setSelection(etCodigo.text.length)

                          val codigo = extrairCodigoMate(valor)
                          if (codigo.length == 5) {
                              mostrarProdutoEncontrado(codigo)
                          } else {
                              Toast.makeText(
                                  this,
                                  "Código lido, mas não foi possível identificar os 5 números do Código Mate.",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                      .addOnCanceledListener {
                          // O operador simplesmente fechou o scanner.
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Não foi possível abrir o leitor: ${e.message ?: "erro desconhecido"}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun mostrarProdutoEncontrado(codigo: String) {
                  val produto = baseProdutos[codigo]

                  if (produto == null) {
                      tvCodigoEncontrado.text = "Código $codigo"
                      tvProdutoEncontrado.text = "Produto não encontrado na planilha."
                      tvEnderecoEncontrado.text = ""
                      containerProdutoEncontrado.visibility = View.VISIBLE
                      return
                  }

                  tvCodigoEncontrado.text = produto.codigo
                  tvProdutoEncontrado.text = produto.descricao
                  tvEnderecoEncontrado.text =
                      "📍 ${produto.rua} — ${produto.rack}\n" +
                      "Coluna ${produto.coluna} — Linha ${produto.linha}"
                  containerProdutoEncontrado.visibility = View.VISIBLE
              }

              private fun esconderProdutoEncontrado() {
                  containerProdutoEncontrado.visibility = View.GONE
              }

              private fun processarCodigo() {
                  val entrada = etCodigo.text.toString().trim()
                  val codigo = extrairCodigoMate(entrada)

                  if (codigo.length != 5) {
                      Toast.makeText(
                          this,
                          "Digite os 5 números do Código Mate ou bipe o código de barras.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val produto = baseProdutos[codigo]

                  if (produto == null) {
                      Toast.makeText(
                          this,
                          "Código $codigo não encontrado na planilha.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  if (modoConsulta) {
                      adicionarConsulta(produto)
                  } else {
                      adicionarReposicao(produto)
                  }

                  etCodigo.setText("")
                  etCodigo.requestFocus()
              }

              private fun extrairCodigoMate(entrada: String): String {
                  val numeros = entrada.filter { it.isDigit() }

                  return when {
                      numeros.length == 5 -> numeros
                      numeros.length >= 6 -> numeros.dropLast(1).takeLast(5)
                      else -> ""
                  }
              }

              private fun adicionarConsulta(produto: EnderecoProduto) {
                  consultas.add(
                      ItemConsulta(
                          codigo = produto.codigo,
                          descricao = produto.descricao,
                          rua = produto.rua,
                          rack = produto.rack,
                          coluna = produto.coluna,
                          linha = produto.linha,
                          timestamp = System.currentTimeMillis()
                      )
                  )

                  atualizarConsultas()
              }

              private fun atualizarConsultas() {
                  containerLista.removeAllViews()

                  if (consultas.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = "Nenhuma consulta realizada ainda."
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                      return
                  }

                  for (consulta in consultas.reversed()) {
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.VERTICAL
                      card.setPadding(28, 24, 28, 24)
                      card.setBackgroundColor(Color.WHITE)

                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      params.setMargins(0, 8, 0, 8)
                      card.layoutParams = params

                      val tvCodigo = TextView(this)
                      tvCodigo.text = consulta.codigo
                      tvCodigo.textSize = 21f
                      tvCodigo.setTextColor(Color.parseColor("#1565C0"))
                      tvCodigo.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )
                      card.addView(tvCodigo)

                      val btnCopiar = Button(this)
                      btnCopiar.text = "📋 COPIAR CÓDIGO"
                      btnCopiar.setOnClickListener {
                          val clipboard =
                              getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(
                              android.content.ClipData.newPlainText(
                                  "Código Material",
                                  consulta.codigo
                              )
                          )
                          Toast.makeText(
                              this,
                              "Código ${consulta.codigo} copiado!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      val copiarParams = LinearLayout.LayoutParams(-2, -2)
                      copiarParams.topMargin = 4
                      btnCopiar.layoutParams = copiarParams
                      card.addView(btnCopiar)

                      val tvProduto = TextView(this)
                      tvProduto.text = consulta.descricao
                      tvProduto.textSize = 16f
                      tvProduto.setTextColor(Color.parseColor("#212121"))

                      val produtoParams = LinearLayout.LayoutParams(-1, -2)
                      produtoParams.topMargin = 8
                      tvProduto.layoutParams = produtoParams
                      card.addView(tvProduto)

                      val tvEndereco = TextView(this)
                      tvEndereco.text =
                          "${consulta.rua} — ${consulta.rack}\n" +
                          "Coluna ${consulta.coluna} — Linha ${consulta.linha}"
                      tvEndereco.textSize = 17f
                      tvEndereco.setTextColor(Color.parseColor("#1565C0"))
                      tvEndereco.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      val enderecoParams = LinearLayout.LayoutParams(-1, -2)
                      enderecoParams.topMargin = 18
                      tvEndereco.layoutParams = enderecoParams
                      card.addView(tvEndereco)

                      containerLista.addView(card)
                  }
              }

              private fun confirmarLimparConsultas() {
                  if (consultas.isEmpty()) {
                      Toast.makeText(
                          this,
                          "Não há consultas para limpar.",
                          Toast.LENGTH_SHORT
                      ).show()
                      return
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Limpar consultas?")
                      .setMessage(
                          "Todos os resultados de consulta desta sessão serão removidos."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("LIMPAR") { _, _ ->
                          consultas.clear()
                          atualizarConsultas()
                      }
                      .show()
              }

              private fun adicionarReposicao(produto: EnderecoProduto) {
                  val existente = registros.find {
                      it.codigo == produto.codigo && !it.concluido
                  }

                  if (existente != null) {
                      AlertDialog.Builder(this)
                          .setTitle("Código já solicitado")
                          .setMessage(
                              "O código ${produto.codigo} já possui " +
                              "${existente.quantidade} caixa(s) pendente(s).\n\n" +
                              "Adicionar mais uma caixa?"
                          )
                          .setNegativeButton("CANCELAR", null)
                          .setPositiveButton("ADICIONAR") { _, _ ->
                              existente.quantidade += 1

                              salvarRegistros()
                              salvarNoFirestore(existente)

                              tvFeedback.text =
                                  "${existente.quantidade} cx ${produto.codigo} pendentes"
                              tvFeedback.visibility = View.VISIBLE

                              atualizarInterface()
                          }
                          .show()

                      return
                  }

                  val novo = ItemReposicao(
                      id = UUID.randomUUID().toString(),
                      codigo = produto.codigo,
                      descricao = produto.descricao,
                      quantidade = 1,
                      rua = produto.rua,
                      rack = produto.rack,
                      coluna = produto.coluna,
                      linha = produto.linha,
                      operador = nomeOperador,
                      timestamp = System.currentTimeMillis(),
                      concluido = false
                  )

                  registros.add(novo)

                  salvarRegistros()
                  salvarNoFirestore(novo)

                  tvFeedback.text =
                      "Produto ${produto.codigo} adicionado à reposição."
                  tvFeedback.visibility = View.VISIBLE

                  atualizarInterface()
              }

              private fun atualizarInterface() {
                  if (modoConsulta) {
                      atualizarConsultas()
                      return
                  }

                  val pendentes = registros.filter { !it.concluido }
                  val concluidos = registros.filter { it.concluido }

                  tvPendentes.text =
                      pendentes.sumOf { it.quantidade }.toString()

                  tvConcluidos.text =
                      concluidos.sumOf { it.quantidade }.toString()

                  tvTotal.text =
                      registros.sumOf { it.quantidade }.toString()

                  containerLista.removeAllViews()

                  val lista =
                      if (abaConcluidos) {
                          concluidos.sortedByDescending { it.timestamp }
                      } else {
                          pendentes.sortedBy { it.timestamp }
                      }

                  btnPendentes.setBackgroundColor(
                      if (!abaConcluidos)
                          Color.parseColor("#1565C0")
                      else
                          Color.parseColor("#E0E0E0")
                  )

                  btnConcluidos.setBackgroundColor(
                      if (abaConcluidos)
                          Color.parseColor("#1565C0")
                      else
                          Color.parseColor("#E0E0E0")
                  )

                  btnPendentes.setTextColor(
                      if (!abaConcluidos) Color.WHITE else Color.BLACK
                  )

                  btnConcluidos.setTextColor(
                      if (abaConcluidos) Color.WHITE else Color.BLACK
                  )

                  if (lista.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text =
                          if (abaConcluidos)
                              "Nenhuma reposição concluída."
                          else
                              "Nenhum produto pendente de reposição."
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                      return
                  }

                  val formato =
                      SimpleDateFormat(
                          "dd/MM/yyyy HH:mm",
                          Locale.getDefault()
                      )

                  for (item in lista) {
                      val view =
                          LayoutInflater.from(this).inflate(
                              R.layout.item_reposicao,
                              containerLista,
                              false
                          )

                      val tvCodigo =
                          view.findViewById<TextView>(R.id.tvCodigo)

                      val tvProduto =
                          view.findViewById<TextView>(R.id.tvProduto)

                      val tvEndereco =
                          view.findViewById<TextView>(R.id.tvEndereco)

                      val tvDetalhes =
                          view.findViewById<TextView>(R.id.tvDetalhes)

                      val tvStatus =
                          view.findViewById<TextView>(R.id.tvStatus)

                      val btnAcao =
                          view.findViewById<Button>(R.id.btnAcao)

                      val btnExcluir =
                          view.findViewById<Button>(R.id.btnExcluir)

                      val btnCopiarItem =
                          view.findViewById<Button>(R.id.btnCopiarItem)

                      btnCopiarItem.setOnClickListener {
                          val clipboard =
                              getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(
                              android.content.ClipData.newPlainText(
                                  "Código Material",
                                  item.codigo
                              )
                          )
                          Toast.makeText(
                              this,
                              "Código ${item.codigo} copiado!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      tvCodigo.text =
                          "${item.quantidade} cx ${item.codigo}"

                      tvProduto.text =
                          item.descricao

                      tvEndereco.text =
                          "${item.rua} — ${item.rack}\n" +
                          "Coluna ${item.coluna} — Linha ${item.linha}"

                      tvDetalhes.text =
                          "Solicitado por: ${item.operador}\n" +
                          formato.format(Date(item.timestamp))

                      if (item.concluido) {
                          tvStatus.text = "CONCLUÍDO"
                          tvStatus.setTextColor(
                              Color.parseColor("#1B5E20")
                          )
                          tvStatus.setBackgroundColor(
                              Color.parseColor("#C8E6C9")
                          )

                          btnAcao.text = "DESFAZER"
                          btnExcluir.visibility = View.VISIBLE

                          btnAcao.setOnClickListener {
                              item.concluido = false
                              salvarRegistros()
                              salvarNoFirestore(item)
                              atualizarInterface()
                          }

                          btnExcluir.setOnClickListener {
                              confirmarExcluir(item)
                          }
                      } else {
                          tvStatus.text = "PENDENTE"
                          tvStatus.setTextColor(
                              Color.parseColor("#B71C1C")
                          )
                          tvStatus.setBackgroundColor(
                              Color.parseColor("#FFCDD2")
                          )

                          btnAcao.text = "CONCLUIR"
                          btnExcluir.visibility = View.VISIBLE

                          btnAcao.setOnClickListener {
                              item.concluido = true
                              salvarRegistros()
                              salvarNoFirestore(item)
                              atualizarInterface()
                          }

                          btnExcluir.setOnClickListener {
                              confirmarExcluir(item)
                          }
                      }

                      containerLista.addView(view)
                  }
              }

              private fun confirmarExcluir(item: ItemReposicao) {
                  AlertDialog.Builder(this)
                      .setTitle("Excluir registro?")
                      .setMessage(
                          "Esse registro será apagado permanentemente em todos os aparelhos."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("EXCLUIR") { _, _ ->
                          registros.removeAll { it.id == item.id }
                          salvarRegistros()
                          excluirDoFirestore(item)
                          atualizarInterface()
                      }
                      .show()
              }

              private fun carregarOperador() {
                  val prefs =
                      getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )

                  nomeOperador =
                      prefs.getString(
                          KEY_OPERADOR,
                          "Operador 1"
                      ) ?: "Operador 1"

                  tvOperador.text =
                      "Operador: $nomeOperador"
              }

              private fun alterarNomeOperador() {
                  val input = EditText(this)
                  input.setText(nomeOperador)
                  input.selectAll()

                  AlertDialog.Builder(this)
                      .setTitle("Nome do operador")
                      .setMessage(
                          "Digite o nome que identificará este aparelho."
                      )
                      .setView(input)
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("SALVAR") { _, _ ->
                          val novo =
                              input.text.toString().trim()

                          if (novo.isNotEmpty()) {
                              nomeOperador = novo

                              getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                              )
                                  .edit()
                                  .putString(
                                      KEY_OPERADOR,
                                      novo
                                  )
                                  .apply()

                              tvOperador.text =
                                  "Operador: $nomeOperador"
                          }
                      }
                      .show()
              }

              private fun salvarRegistros() {
                  val array = JSONArray()

                  for (item in registros) {
                      val obj = JSONObject()

                      obj.put("id", item.id)
                      obj.put("codigo", item.codigo)
                      obj.put("descricao", item.descricao)
                      obj.put("quantidade", item.quantidade)
                      obj.put("rua", item.rua)
                      obj.put("rack", item.rack)
                      obj.put("coluna", item.coluna)
                      obj.put("linha", item.linha)
                      obj.put("operador", item.operador)
                      obj.put("timestamp", item.timestamp)
                      obj.put("concluido", item.concluido)

                      array.put(obj)
                  }

                  getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          KEY_REGISTROS,
                          array.toString()
                      )
                      .apply()
              }

              private fun carregarRegistros() {
                  try {
                      val texto =
                          getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                              .getString(
                                  KEY_REGISTROS,
                                  null
                              ) ?: return

                      val array = JSONArray(texto)

                      registros.clear()

                      for (i in 0 until array.length()) {
                          val obj =
                              array.getJSONObject(i)

                          registros.add(
                              ItemReposicao(
                                  id = obj.getString("id"),
                                  codigo = obj.getString("codigo"),
                                  descricao = obj.optString(
                                      "descricao",
                                      ""
                                  ),
                                  quantidade = obj.getInt(
                                      "quantidade"
                                  ),
                                  rua = obj.getString("rua"),
                                  rack = obj.getString("rack"),
                                  coluna = obj.getString("coluna"),
                                  linha = obj.getString("linha"),
                                  operador = obj.getString("operador"),
                                  timestamp = obj.getLong("timestamp"),
                                  concluido = obj.getBoolean("concluido")
                              )
                          )
                      }
                  } catch (_: Exception) {
                      registros.clear()
                  }
              }

              // =========================================================
              // FIRESTORE
              // =========================================================

              private fun dadosFirestore(
                  item: ItemReposicao
              ): HashMap<String, Any> {
                  return hashMapOf(
                      "id" to item.id,
                      "codigo" to item.codigo,
                      "descricao" to item.descricao,
                      "quantidade" to item.quantidade,
                      "rua" to item.rua,
                      "rack" to item.rack,
                      "coluna" to item.coluna,
                      "linha" to item.linha,
                      "operador" to item.operador,
                      "timestamp" to item.timestamp,
                      "concluido" to item.concluido
                  )
              }

              private fun salvarNoFirestore(
                  item: ItemReposicao
              ) {
                  db.collection(COLECAO_REPOSICOES)
                      .document(item.id)
                      .set(
                          dadosFirestore(item),
                          SetOptions.merge()
                      )
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Não foi possível sincronizar ${item.codigo}: ${e.message}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun excluirDoFirestore(
                  item: ItemReposicao
              ) {
                  db.collection(COLECAO_REPOSICOES)
                      .document(item.id)
                      .delete()
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Erro ao excluir do Firestore: ${e.message}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun iniciarSincronizacaoFirestore() {
                  firestoreListener?.remove()

                  firestoreListener =
                      db.collection(COLECAO_REPOSICOES)
                          .addSnapshotListener { snapshot, error ->

                              if (error != null) {
                                  Toast.makeText(
                                      this,
                                      "Firebase: não foi possível sincronizar. Verifique a conexão.",
                                      Toast.LENGTH_LONG
                                  ).show()
                                  return@addSnapshotListener
                              }

                              if (snapshot == null) return@addSnapshotListener

                              val remotos =
                                  snapshot.documents.mapNotNull { doc ->
                                      try {
                                          ItemReposicao(
                                              id = doc.getString("id")
                                                  ?: doc.id,
                                              codigo = doc.getString("codigo")
                                                  ?: return@mapNotNull null,
                                              descricao = doc.getString("descricao")
                                                  ?: "",
                                              quantidade =
                                                  (doc.getLong("quantidade")
                                                      ?: 1L).toInt(),
                                              rua = doc.getString("rua")
                                                  ?: "",
                                              rack = doc.getString("rack")
                                                  ?: "",
                                              coluna = doc.getString("coluna")
                                                  ?: "",
                                              linha = doc.getString("linha")
                                                  ?: "",
                                              operador = doc.getString("operador")
                                                  ?: "",
                                              timestamp =
                                                  doc.getLong("timestamp")
                                                      ?: 0L,
                                              concluido =
                                                  doc.getBoolean("concluido")
                                                      ?: false
                                          )
                                      } catch (_: Exception) {
                                          null
                                      }
                                  }

                              registros.clear()
                              registros.addAll(remotos)
                              salvarRegistros()
                              atualizarInterface()
                          }
              }

              private fun abrirConfiguracoes() {
                  val opcoes =
                      arrayOf(
                          "Atualizar planilha de endereços (.xlsx)",
                          "Informações da base atual",
                          "Recarregar sincronização Firebase"
                      )

                  AlertDialog.Builder(this)
                      .setTitle("Configurações")
                      .setItems(opcoes) { _, posicao ->
                          when (posicao) {
                              0 -> selecionarPlanilha()

                              1 -> mostrarInformacoesBase()

                              2 -> iniciarSincronizacaoFirestore()
                          }
                      }
                      .show()
              }

              private fun selecionarPlanilha() {
                  val intent =
                      Intent(Intent.ACTION_OPEN_DOCUMENT)

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  )

                  intent.type =
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

                  intent.putExtra(
                      Intent.EXTRA_MIME_TYPES,
                      arrayOf(
                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                          "application/vnd.ms-excel.sheet.macroEnabled.12",
                          "application/vnd.ms-excel"
                      )
                  )

                  startActivityForResult(
                      intent,
                      REQUEST_IMPORT_XLSX
                  )
              }

              private fun mostrarInformacoesBase() {
                  AlertDialog.Builder(this)
                      .setTitle("Base de endereços")
                      .setMessage(
                          "Produtos mapeados: ${baseProdutos.size}\n\n" +
                          "Campos utilizados:\n\n" +
                          "• Código Mate\n" +
                          "• Descrição do produto\n" +
                          "• Rua / Estação\n" +
                          "• Rack\n" +
                          "• Coluna\n" +
                          "• Linha\n\n" +
                          "Reposições: sincronizadas em tempo real pelo Firebase Firestore."
                      )
                      .setPositiveButton("OK", null)
                      .show()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == REQUEST_IMPORT_XLSX &&
                      resultCode == Activity.RESULT_OK
                  ) {
                      val uri = data?.data ?: return
                      importarPlanilha(uri)
                  }
              }

              private fun importarPlanilha(
                  uri: Uri
              ) {
                  try {
                      val arquivo =
                          File(
                              filesDir,
                              PLANILHA_INTERNA
                          )

                      contentResolver
                          .openInputStream(uri)
                          ?.use { input ->
                              FileOutputStream(arquivo)
                                  .use { output ->
                                      input.copyTo(output)
                                  }
                          }

                      carregarPlanilha(
                          FileInputStream(arquivo)
                      )

                      Toast.makeText(
                          this,
                          "Planilha atualizada!\n${baseProdutos.size} produtos encontrados.",
                          Toast.LENGTH_LONG
                      ).show()

                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Erro ao importar planilha: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun carregarBaseEnderecos() {
                  val arquivo =
                      File(
                          filesDir,
                          PLANILHA_INTERNA
                      )

                  try {
                      if (arquivo.exists()) {
                          carregarPlanilha(
                              FileInputStream(arquivo)
                          )
                      } else {
                          assets
                              .open("enderecos.xlsx")
                              .use { input ->
                                  carregarPlanilha(input)
                              }
                      }
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Erro ao carregar a planilha de endereços.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun carregarPlanilha(
                  input: InputStream
              ) {
                  val arquivoTemp =
                      File(
                          cacheDir,
                          "planilha_temp.xlsx"
                      )

                  FileOutputStream(arquivoTemp)
                      .use { output ->
                          input.copyTo(output)
                      }

                  baseProdutos.clear()

                  ZipFile(arquivoTemp).use { zip ->
                      val sharedStrings =
                          mutableListOf<String>()

                      val shared =
                          zip.getEntry(
                              "xl/sharedStrings.xml"
                          )

                      if (shared != null) {
                          zip.getInputStream(shared)
                              .use {
                                  sharedStrings.addAll(
                                      lerSharedStrings(it)
                                  )
                              }
                      }

                      val sheet =
                          zip.entries()
                              .asSequence()
                              .firstOrNull {
                                  it.name.startsWith(
                                      "xl/worksheets/sheet"
                                  ) &&
                                  it.name.endsWith(".xml")
                              }
                              ?: throw Exception(
                                  "Nenhuma planilha encontrada."
                              )

                      zip.getInputStream(sheet)
                          .use {
                              val linhas =
                                  lerPlanilhaXML(
                                      it,
                                      sharedStrings
                                  )

                              processarLinhas(linhas)
                          }
                  }

                  arquivoTemp.delete()
              }

              private fun lerSharedStrings(
                  input: InputStream
              ): List<String> {
                  val resultado =
                      mutableListOf<String>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var textoAtual = ""
                  var event = parser.eventType

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              if (parser.name == "si") {
                                  textoAtual = ""
                              }
                          }

                          XmlPullParser.TEXT -> {
                              textoAtual += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              if (parser.name == "si") {
                                  resultado.add(textoAtual)
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun lerPlanilhaXML(
                  input: InputStream,
                  sharedStrings: List<String>
              ): List<List<String>> {
                  val resultado =
                      mutableListOf<List<String>>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var event = parser.eventType

                  var linhaAtual =
                      mutableMapOf<Int, String>()

                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              when (parser.name) {
                                  "row" -> {
                                      linhaAtual =
                                          mutableMapOf()
                                  }

                                  "c" -> {
                                      val referencia =
                                          parser.getAttributeValue(
                                              null,
                                              "r"
                                          ) ?: ""

                                      colunaAtual =
                                          numeroColuna(
                                              referencia
                                          )

                                      tipoCelula =
                                          parser.getAttributeValue(
                                              null,
                                              "t"
                                          ) ?: ""

                                      valor = ""
                                  }

                                  "v", "t" -> {
                                      valor = ""
                                  }
                              }
                          }

                          XmlPullParser.TEXT -> {
                              valor += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "c" -> {
                                      var final =
                                          valor.trim()

                                      if (
                                          tipoCelula == "s" &&
                                          final.isNotEmpty()
                                      ) {
                                          val indice =
                                              final.toIntOrNull()

                                          if (
                                              indice != null &&
                                              indice < sharedStrings.size
                                          ) {
                                              final =
                                                  sharedStrings[indice]
                                          }
                                      }

                                      linhaAtual[colunaAtual] =
                                          final
                                  }

                                  "row" -> {
                                      if (
                                          linhaAtual.isNotEmpty()
                                      ) {
                                          val max =
                                              linhaAtual.keys.maxOrNull()
                                                  ?: 0

                                          val lista =
                                              MutableList(
                                                  max + 1
                                              ) { "" }

                                          for (
                                              (indice, texto)
                                              in linhaAtual
                                          ) {
                                              if (
                                                  indice < lista.size
                                              ) {
                                                  lista[indice] =
                                                      texto
                                              }
                                          }

                                          resultado.add(lista)
                                      }
                                  }
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun numeroColuna(
                  referencia: String
              ): Int {
                  var resultado = 0

                  for (c in referencia) {
                      if (c.isDigit()) break

                      resultado =
                          resultado * 26 +
                          (
                              c.uppercaseChar() -
                              'A' +
                              1
                          )
                  }

                  return resultado - 1
              }

              private fun processarLinhas(
                  linhas: List<List<String>>
              ) {
                  if (linhas.isEmpty()) return

                  var indiceCabecalho = -1

                  for (i in linhas.indices) {
                      val texto =
                          linhas[i]
                              .joinToString("|")
                              .lowercase()

                      if (
                          texto.contains("cod material") &&
                          texto.contains("desc material")
                      ) {
                          indiceCabecalho = i
                          break
                      }
                  }

                  if (
                      indiceCabecalho == -1
                  ) {
                      throw Exception(
                          "Não foi possível localizar os cabeçalhos da planilha."
                      )
                  }

                  val cabecalho =
                      linhas[indiceCabecalho]

                  fun localizar(
                      nome: String
                  ): Int {
                      return cabecalho.indexOfFirst {
                          it.trim().equals(
                              nome,
                              ignoreCase = true
                          )
                      }
                  }

                  val codMaterial =
                      localizar("Cod Material")

                  val descMaterial =
                      localizar("Desc Material")

                  val estacao =
                      localizar("Estacao")

                  val rack =
                      localizar("Rack")

                  val linhaProd =
                      localizar("Linha prod alocado")

                  val colunaProd =
                      localizar("Coluna prod alocado")

                  if (
                      codMaterial < 0 ||
                      descMaterial < 0 ||
                      estacao < 0 ||
                      rack < 0 ||
                      linhaProd < 0 ||
                      colunaProd < 0
                  ) {
                      throw Exception(
                          "A planilha não possui todas as colunas necessárias."
                      )
                  }

                  for (
                      i in
                      (indiceCabecalho + 1)
                          until
                          linhas.size
                  ) {
                      val linha =
                          linhas[i]

                      fun valor(
                          indice: Int
                      ): String {
                          return if (
                              indice >= 0 &&
                              indice < linha.size
                          ) {
                              linha[indice].trim()
                          } else {
                              ""
                          }
                      }

                      val codigo =
                          valor(codMaterial)
                              .filter { it.isDigit() }
                              .takeLast(5)

                      if (
                          codigo.length != 5
                      ) {
                          continue
                      }

                      baseProdutos[codigo] =
                          EnderecoProduto(
                              codigo = codigo,
                              descricao = valor(descMaterial),
                              rua = valor(estacao),
                              rack = valor(rack),
                              coluna = valor(linhaProd),
                              linha = valor(colunaProd)
                          )
                  }

                  if (
                      baseProdutos.isEmpty()
                  ) {
                      throw Exception(
                          "Nenhum produto válido foi encontrado."
                      )
                  }
              }
          }
          EOF

      - name: Criar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reposicao-v7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
