                      }
                  }
          
                  btnScannerValidade.setOnClickListener {
                      abrirScanner { valor ->
                          val validade = normalizarValidade(valor)
                          if (validade == null) {
                              Toast.makeText(this, "Validade inválida. Use MM/AA ou MM/AAAA.", Toast.LENGTH_LONG).show()
                              return@abrirScanner
                          }
                          etValidade.setText(validade)
                          registrarCaixa(true)
                      }
                  }
          
                  btnSemValidade.setOnClickListener {
                      registrarCaixa(false)
                  }
          
                  btnRegistrar.setOnClickListener {
                      if (etValidade.text.toString().trim().isNotEmpty()) {
                          registrarCaixa(true)
                      } else {
                          AlertDialog.Builder(this)
                              .setTitle("Sem validade?")
                              .setMessage("Esta caixa não possui validade ou você deseja cadastrá-la sem validade?")
                              .setNegativeButton("VOLTAR", null)
                              .setPositiveButton("SEM VALIDADE") { _, _ -> registrarCaixa(false) }
                              .show()
                      }
                  }
          
                  btnLimparLocal.setOnClickListener {
                      localizacaoAtual = ""
                      etLocalizacao.setText("")
                      atualizarLocalizacaoAtual()
                      etLocalizacao.requestFocus()
                  }
          
                  etLocalizacao.setOnEditorActionListener { _, _, _ ->
                      confirmarLocalDigitada()
                      true
                  }
          
                  etCodigo.setOnEditorActionListener { _, _, _ ->
                      atualizarProdutoInformativo(extrairCodigo(etCodigo.text.toString()))
                      etValidade.requestFocus()
                      true
                  }
          
                  etValidade.setOnEditorActionListener { _, _, _ ->
                      if (etValidade.text.toString().trim().isNotEmpty()) registrarCaixa(true)
                      else registrarCaixa(false)
                      true
                  }
          
                  etPesquisaEstoque.addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) = Unit
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
