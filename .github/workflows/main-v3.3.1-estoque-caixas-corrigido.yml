              private fun abrirScanner() {
                  val scanner = GmsBarcodeScanning.getClient(this)

                  scanner.startScan()
                      .addOnSuccessListener { barcode ->
                          val valor = barcode.rawValue?.trim().orEmpty()

                          if (valor.isEmpty()) {
                              Toast.makeText(
                                  this,
                                  "Não foi possível obter o código.",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return@addOnSuccessListener
                          }

                          etCodigo.setText(valor)
                          etCodigo.setSelection(etCodigo.text.length)

                          // Leitura pela câmera executa imediatamente a ação do modo atual.
                          // No modo Reposição, não é mais necessário tocar em"ADICIONAR REPOSIÇÃO" depois do bip.
                          processarCodigo()
                      }
                      .addOnCanceledListener {
                          // O operador simplesmente fechou o scanner.
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Não foi possível abrir o leitor: ${e.message ?: "erro desconhecido"}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun mostrarProdutoEncontrado(codigo: String) {
                  val produto = baseProdutos[codigo]

                  if (produto == null) {
                      tvCodigoEncontrado.text = "Código $codigo"
                      tvProdutoEncontrado.text = "Produto não encontrado na planilha."
                      tvEnderecoEncontrado.text = ""
                      containerProdutoEncontrado.visibility = View.VISIBLE
                      return
                  }

                  tvCodigoEncontrado.text = produto.codigo
                  tvProdutoEncontrado.text = produto.descricao
                  tvEnderecoEncontrado.text = if (enderecoTemDados(produto)) {
                      "📍 ${produto.rua} — ${produto.rack}\n" +
                      "Coluna ${produto.coluna} — Linha ${produto.linha}"
                  } else {
                      "⚠ Sem endereço cadastrado"
                  }
                  containerProdutoEncontrado.visibility = View.VISIBLE
              }

              private fun esconderProdutoEncontrado() {
                  containerProdutoEncontrado.visibility = View.GONE
              }

              private fun enderecoTemDados(produto: EnderecoProduto): Boolean {
                  val campos = listOf(
                      produto.rua, produto.rack, produto.coluna, produto.linha
                  )
                  return campos.any { valor ->
                      val normalizado = valor.trim().lowercase(Locale.getDefault())
                      normalizado.isNotEmpty() &&
                          normalizado != "-" &&
                          normalizado != "n/a" &&
                          normalizado != "sem endereço" &&
                          normalizado != "sem endereco"
                  }
              }

              private fun confirmarCodigoSemEndereco(produto: EnderecoProduto) {
                  AlertDialog.Builder(this)
                      .setTitle("Código sem endereço")
