              private fun confirmarLocalDigitada() {
                  val local = etLocalizacao.text.toString().trim()
                  if (local.isEmpty()) {
                      Toast.makeText(this, "Informe ou bipe a localização.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  localizacaoAtual = local
                  atualizarLocalizacaoAtual()
                  etCodigo.requestFocus()
              }
          
              private fun atualizarLocalizacaoAtual() {
                  tvLocalizacaoAtual.text = if (localizacaoAtual.isBlank()) {
                      "📍 Nenhuma localização selecionada"
                  } else {
                      "📍 Localização atual: $localizacaoAtual"
                  }
              }
          
              private fun atualizarTelaEntrada() {
                  modoEstoque = false
                  containerEntrada.visibility = View.VISIBLE
                  containerEstoque.visibility = View.GONE
                  btnEntrada.setBackgroundColor(Color.parseColor("#1565C0"))
                  btnEstoque.setBackgroundColor(Color.parseColor("#E0E0E0"))
                  btnEntrada.setTextColor(Color.WHITE)
                  btnEstoque.setTextColor(Color.BLACK)
                  tvFeedback.visibility = View.GONE
                  atualizarLocalizacaoAtual()
                  etCodigo.requestFocus()
              }
          
              private fun atualizarTelaEstoque() {
                  modoEstoque = true
                  containerEntrada.visibility = View.GONE
                  containerEstoque.visibility = View.VISIBLE
                  btnEntrada.setBackgroundColor(Color.parseColor("#E0E0E0"))
                  btnEstoque.setBackgroundColor(Color.parseColor("#1565C0"))
                  btnEntrada.setTextColor(Color.BLACK)
                  btnEstoque.setTextColor(Color.WHITE)
                  atualizarListaEstoque()
              }
          
              private fun atualizarProdutoInformativo(codigo: String) {
                  if (codigo.isBlank()) {
                      tvProduto.text = ""
