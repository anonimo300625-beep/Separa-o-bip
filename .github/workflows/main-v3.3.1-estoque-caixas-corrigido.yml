                          "Código sem endereço, adicionar assim mesmo?"
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("ADICIONAR") { _, _ ->
                          adicionarReposicao(produto)
                      }
                      .show()
              }

              private fun processarCodigo() {
                  val entrada = etCodigo.text.toString().trim()

                  if (entrada.isEmpty()) {
                      Toast.makeText(
                          this,
                          if (modoConsulta) {
                              "Digite um Código Mate ou um endereço para consultar."
                          } else {
                              "Digite os 5 números do Código Mate ou bipe o código de barras."
                          },
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  if (modoConsulta) {
                      consultarEntrada(entrada)
                      etCodigo.setText("")
                      etCodigo.requestFocus()
                      return
                  }

                  val codigo = extrairCodigoMate(entrada)

                  if (codigo.length != 5) {
                      Toast.makeText(
                          this,
                          "Digite os 5 números do Código Mate ou bipe o código de barras.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val produto = baseProdutos[codigo]

                  if (produto == null) {
                      Toast.makeText(
                          this,
                          "Código $codigo não encontrado na planilha.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  if (!enderecoTemDados(produto)) {
                      confirmarCodigoSemEndereco(produto)
                  } else {
                      adicionarReposicao(produto)
                  }

                  etCodigo.setText("")
                  etCodigo.requestFocus()
              }

              private fun consultarEntrada(entrada: String) {
                  val codigo = extrairCodigoMate(entrada)
                  val produto = if (codigo.length == 5) baseProdutos[codigo] else null
                  if (produto != null) {
                      adicionarConsulta(produto)
                      return
                  }

                  Toast.makeText(
                      this,
                      "Código não encontrado. Para consultar por endereço, use o campo específico abaixo.",
                      Toast.LENGTH_LONG
                  ).show()
              }

              private fun consultarPorEnderecoSeparadamente() {
                  val buscaOriginal = etEnderecoConsulta.text.toString().trim()
                  val busca = normalizarTexto(buscaOriginal)
                  if (busca.isEmpty()) {
                      Toast.makeText(this, "Informe o endereço para pesquisar.", Toast.LENGTH_SHORT).show()
                      return
                  }

                  // A consulta por endereço usa a posição dos campos:
                  // Rua/Estação + Rack + Coluna + Linha.
                  // Ex.: "1 1 5 B" = Rua 1 / Rack 1 / Coluna 5 / Linha B.
                  // Também aceita os nomes dos campos, por exemplo:
                  // "Rua 1 Rack 1 Coluna 5 Linha B".
                  val partesBusca = interpretarBuscaEndereco(busca)

                  if (partesBusca == null) {
                      Toast.makeText(
                          this,
                          "Formato inválido. Use: Rua Rack Coluna Linha\nEx.: 1 1 5 B",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val encontrados = baseProdutos.values
                      .filter { produto ->
                          enderecoBateExatamente(
                              produto,
                              partesBusca
                          )
                      }
                      .sortedWith(
                          compareBy<EnderecoProduto> { numeroEndereco(it.rua) }
                              .thenBy { numeroEndereco(it.rack) }
                              .thenBy { numeroEndereco(it.coluna) }
                              .thenBy { textoEndereco(it.linha) }
                              .thenBy { textoEndereco(it.descricao) }
                      )

                  containerLista.removeAllViews()
                  consultas.clear()

                  if (encontrados.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = "Nenhum produto encontrado nesse endereço na base atual."
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                  } else {
                      encontrados.forEach { adicionarConsulta(it) }
                      Toast.makeText(
                          this,
                          "${encontrados.size} produto(s) encontrado(s).",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  etEnderecoConsulta.setText("")
              }

              private fun interpretarBuscaEndereco(
                  busca: String
              ): List<String>? {
                  val tokens = busca
                      .replace(Regex("[,;/|]+"), " ")
                      .split(Regex("\\s+"))
                      .filter { it.isNotBlank() }
                      .toMutableList()

                  if (tokens.isEmpty()) return null

                  // Aceita tanto a forma curta "1 1 5 B" quanto a forma
                  // identificada "Rua 1 Rack 1 Coluna 5 Linha B".
                  val palavrasCampo = setOf(
                      "rua", "estacao", "rack", "coluna", "linha"
                  )

                  val possuiNomesDeCampo = tokens.any { it in palavrasCampo }

                  if (!possuiNomesDeCampo) {
                      return if (tokens.size in 1..4) tokens else null
                  }

                  val resultado = arrayOfNulls<String>(4)
                  var i = 0

                  while (i < tokens.size) {
                      val campo = tokens[i]
                      if (campo !in palavrasCampo || i + 1 >= tokens.size) {
                          return null
                      }

                      val indice = when (campo) {
                          "rua", "estacao" -> 0
                          "rack" -> 1
                          "coluna" -> 2
                          "linha" -> 3
                          else -> -1
                      }

                      if (indice < 0 || resultado[indice] != null) return null

                      resultado[indice] = tokens[i + 1]
                      i += 2
                  }

                  // Não permite pular um campo no formato identificado.
                  // Para buscas parciais, a forma curta deve ser usada.
                  if (resultado.any { it == null }) return null

                  return resultado.map { it!! }
              }

              private fun enderecoBateExatamente(
                  produto: EnderecoProduto,
                  partesBusca: List<String>
              ): Boolean {
                  if (partesBusca.isEmpty() || partesBusca.size > 4) return false

                  val valoresProduto = listOf(
                      produto.rua,
                      produto.rack,
                      produto.coluna,
                      produto.linha
                  )

                  return partesBusca.indices.all { indice ->
                      componenteEnderecoIgual(
                          valoresProduto[indice],
                          partesBusca[indice]
                      )
                  }
              }

              private fun componenteEnderecoIgual(
                  valorProduto: String,
                  valorBusca: String
              ): Boolean {
                  val produto = normalizarComponenteEndereco(valorProduto)
                  val busca = normalizarComponenteEndereco(valorBusca)

                  if (produto.isEmpty() || busca.isEmpty()) return false

                  // Para campos numéricos, "01" e "1" representam o mesmo
                  // endereço, mas "1" não casa com "10".
                  val numeroProduto = Regex("^\\d+$").matchEntire(produto)?.value
                  val numeroBusca = Regex("^\\d+$").matchEntire(busca)?.value

                  if (numeroProduto != null && numeroBusca != null) {
                      return numeroProduto.toIntOrNull() == numeroBusca.toIntOrNull()
                  }

                  // Para linha/texto, a comparação é exata.
                  return produto == busca
              }

              private fun normalizarComponenteEndereco(
                  valor: String
              ): String {
                  return normalizarTexto(valor)
                      .replace(
                          Regex("^(rua|estacao|rack|coluna|linha)\\s+"),
                          ""
                      )
                      .trim()
              }

              private fun enderecoCorresponde(
                  produto: EnderecoProduto,
                  busca: String
              ): Boolean {
                  val normalizadoBusca = normalizarTexto(busca)
                  if (normalizadoBusca.isEmpty()) return false
                  val endereco = normalizarTexto(
                      listOf(produto.rua, produto.rack, produto.coluna, produto.linha)
                          .filter { it.isNotBlank() }
                          .joinToString(" ")
                  )
                  val termos = normalizadoBusca.split(Regex("\\s+"))
                      .filter { it.isNotBlank() }
                  return endereco.isNotEmpty() && termos.all { endereco.contains(it) }
              }

              private fun normalizarTexto(texto: String): String {
                  return java.text.Normalizer.normalize(
                      texto.trim().lowercase(Locale.getDefault()),
                      java.text.Normalizer.Form.NFD
                  ).replace(Regex("\\p{InCombiningDiacriticalMarks}+"), "")
                      .replace(Regex("\\s+"), " ")
              }

              private fun extrairCodigoMate(entrada: String): String {
                  val numeros = entrada.filter { it.isDigit() }
                  return when {
                      numeros.length == 5 -> numeros
                      numeros.length >= 6 -> numeros.dropLast(1).takeLast(5)
                      else -> ""
                  }
              }

              private fun adicionarConsulta(produto: EnderecoProduto) {
                  consultas.add(
                      ItemConsulta(
                          codigo = produto.codigo,
                          descricao = produto.descricao,
                          rua = produto.rua,
                          rack = produto.rack,
                          coluna = produto.coluna,
                          linha = produto.linha,
                          timestamp = System.currentTimeMillis()
                      )
                  )

                  atualizarConsultas()
              }

              private fun atualizarConsultas() {
                  containerLista.removeAllViews()

                  if (consultas.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = "Nenhuma consulta realizada ainda."
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                      return
                  }

                  for (consulta in consultas.reversed()) {
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.VERTICAL
                      card.setPadding(28, 24, 28, 24)
                      card.setBackgroundColor(Color.WHITE)

                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      params.setMargins(0, 8, 0, 8)
                      card.layoutParams = params

                      val tvCodigo = TextView(this)
                      tvCodigo.text = consulta.codigo
                      tvCodigo.textSize = 21f
                      tvCodigo.setTextColor(Color.parseColor("#1565C0"))
                      tvCodigo.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )
                      card.addView(tvCodigo)

                      val btnCopiar = Button(this)
                      btnCopiar.text = "📋 COPIAR CÓDIGO"
                      btnCopiar.setOnClickListener {
                          val clipboard =
                              getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(
                              android.content.ClipData.newPlainText(
                                  "Código Material",
                                  consulta.codigo
                              )
                          )
                          Toast.makeText(
                              this,
                              "Código ${consulta.codigo} copiado!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      val copiarParams = LinearLayout.LayoutParams(-2, -2)
                      copiarParams.topMargin = 4
                      btnCopiar.layoutParams = copiarParams
                      card.addView(btnCopiar)

                      val tvProduto = TextView(this)
                      tvProduto.text = consulta.descricao
                      tvProduto.textSize = 16f
                      tvProduto.setTextColor(Color.parseColor("#212121"))

                      val produtoParams = LinearLayout.LayoutParams(-1, -2)
                      produtoParams.topMargin = 8
                      tvProduto.layoutParams = produtoParams
                      card.addView(tvProduto)

                      val tvEndereco = TextView(this)
                      tvEndereco.text = if (consulta.rua.isBlank() && consulta.rack.isBlank() &&
                          consulta.coluna.isBlank() && consulta.linha.isBlank()) {
                          "⚠ Sem endereço cadastrado"
                      } else {
                          "${consulta.rua} — ${consulta.rack}\n" +
                          "Coluna ${consulta.coluna} — Linha ${consulta.linha}"
                      }
                      tvEndereco.textSize = 17f
                      tvEndereco.setTextColor(Color.parseColor("#1565C0"))
                      tvEndereco.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      val enderecoParams = LinearLayout.LayoutParams(-1, -2)
                      enderecoParams.topMargin = 18
                      tvEndereco.layoutParams = enderecoParams
                      card.addView(tvEndereco)

                      containerLista.addView(card)
                  }
              }

              private fun confirmarLimparConsultas() {
                  if (consultas.isEmpty()) {
                      Toast.makeText(
                          this,
                          "Não há consultas para limpar.",
                          Toast.LENGTH_SHORT
                      ).show()
                      return
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Limpar consultas?")
                      .setMessage(
                          "Todos os resultados de consulta desta sessão serão removidos."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("LIMPAR") { _, _ ->
                          consultas.clear()
                          atualizarConsultas()
                      }
                      .show()
              }

              private fun adicionarReposicao(produto: EnderecoProduto) {
                  val existente = registros.find {
                      it.codigo == produto.codigo && it.status != STATUS_CONCLUIDO
                  }

                  if (existente != null) {
                      AlertDialog.Builder(this)
                          .setTitle("Código já solicitado")
                          .setMessage(
                              "O código ${produto.codigo} já possui " +
                              "${existente.quantidade} caixa(s) pendente(s).\n\n" +
                              "Adicionar mais uma caixa?"
                          )
                          .setNegativeButton("CANCELAR", null)
                          .setPositiveButton("ADICIONAR") { _, _ ->
                              existente.quantidade += 1

                              salvarRegistros()
                              salvarNoFirestore(existente)

                              tvFeedback.text =
                                  "${existente.quantidade} cx ${produto.codigo} pendentes"
                              tvFeedback.visibility = View.VISIBLE

                              atualizarInterface()
                          }
                          .show()

                      return
                  }

                  val novo = ItemReposicao(
                      id = UUID.randomUUID().toString(),
                      codigo = produto.codigo,
                      descricao = produto.descricao,
                      quantidade = 1,
                      rua = produto.rua,
                      rack = produto.rack,
                      coluna = produto.coluna,
                      linha = produto.linha,
                      operador = nomeOperador,
                      timestamp = System.currentTimeMillis(),
                      status = STATUS_PENDENTE,
                      separador = "",
                      dispositivo = dispositivoId
                  )

                  registros.add(novo)

                  salvarRegistros()
                  salvarNoFirestore(novo)

                  tvFeedback.text =
                      "Produto ${produto.codigo} adicionado à reposição."
                  tvFeedback.visibility = View.VISIBLE

                  atualizarInterface()
              }

              private fun atualizarBotoesOrdenacao() {
                  btnOrdenarEndereco.alpha = if (ordenarPorEndereco) 1.0f else 0.55f
                  btnOrdenarAntigos.alpha = if (!ordenarPorEndereco) 1.0f else 0.55f
              }

              private fun numeroEndereco(valor: String): Int {
                  return Regex("\\d+").find(valor)?.value?.toIntOrNull() ?: Int.MAX_VALUE
              }

              private fun textoEndereco(valor: String): String {
                  return valor.trim().lowercase(Locale.getDefault())
              }

              private fun atualizarInterface() {
                  if (modoConsulta) {
                      atualizarConsultas()
                      return
                  }

                  val pendentes = registros.filter { it.status == STATUS_PENDENTE }
                  val emSeparacao = registros.filter { it.status == STATUS_SEPARACAO }
                  val concluidos = registros.filter { it.status == STATUS_CONCLUIDO }

                  tvPendentes.text =
                      pendentes.sumOf { it.quantidade }.toString()

                  tvConcluidos.text =
                      concluidos.sumOf { it.quantidade }.toString()

                  tvTotal.text =
                      registros.sumOf { it.quantidade }.toString()

                  containerLista.removeAllViews()

                  val termoPesquisa = etPesquisa.text.toString().trim().lowercase(Locale.getDefault())

                  val todos = when {
                      abaConcluidos -> concluidos
                      abaEmSeparacao -> emSeparacao
                      else -> pendentes
                  }

                  val filtrados = if (termoPesquisa.isEmpty()) {
                      todos
                  } else {
                      todos.filter { item ->
                          listOf(item.codigo, item.descricao, item.rua, item.rack, item.coluna, item.linha)
                              .any { valor -> valor.lowercase(Locale.getDefault()).contains(termoPesquisa) }
                      }
                  }

                  val lista = if (ordenarPorEndereco) {
                      filtrados.sortedWith(
                          compareBy<ItemReposicao> { numeroEndereco(it.rua) }
                              .thenBy { textoEndereco(it.rua) }
                              .thenBy { numeroEndereco(it.rack) }
                              .thenBy { textoEndereco(it.rack) }
                              .thenBy { numeroEndereco(it.coluna) }
                              .thenBy { textoEndereco(it.coluna) }
                              .thenBy { textoEndereco(it.linha) }
                              .thenBy { it.timestamp }
                      )
                  } else {
                      filtrados.sortedWith(
                          compareBy<ItemReposicao> { it.timestamp }
                              .thenBy { numeroEndereco(it.rua) }
                              .thenBy { textoEndereco(it.rua) }
                              .thenBy { numeroEndereco(it.rack) }
                              .thenBy { numeroEndereco(it.coluna) }
                      )
                  }

                  btnPendentes.setText("PENDENTES (${pendentes.sumOf { it.quantidade }})")
                  btnEmSeparacao.setText("EM SEPARAÇÃO (${emSeparacao.sumOf { it.quantidade }})")
                  btnConcluidos.setText("CONCLUÍDOS (${concluidos.sumOf { it.quantidade }})")

                  btnPendentes.setBackgroundColor(if (!abaConcluidos && !abaEmSeparacao) Color.parseColor("#1565C0") else Color.parseColor("#E0E0E0"))
                  btnEmSeparacao.setBackgroundColor(if (abaEmSeparacao) Color.parseColor("#E65100") else Color.parseColor("#E0E0E0"))
                  btnConcluidos.setBackgroundColor(if (abaConcluidos) Color.parseColor("#1565C0") else Color.parseColor("#E0E0E0"))
                  btnPendentes.setTextColor(if (!abaConcluidos && !abaEmSeparacao) Color.WHITE else Color.BLACK)
                  btnEmSeparacao.setTextColor(if (abaEmSeparacao) Color.WHITE else Color.BLACK)
                  btnConcluidos.setTextColor(if (abaConcluidos) Color.WHITE else Color.BLACK)

                  if (lista.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = when {
                          abaConcluidos -> "Nenhuma reposição concluída."
                          abaEmSeparacao -> "Nenhuma reposição em separação."
                          else -> "Nenhum produto pendente de reposição."
                      }
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                      return
                  }

                  val formato =
                      SimpleDateFormat(
                          "dd/MM/yyyy HH:mm",
                          Locale.getDefault()
                      )

                  for (item in lista) {
                      val view =
                          LayoutInflater.from(this).inflate(
                              R.layout.item_reposicao,
                              containerLista,
                              false
                          )

                      val tvCodigo =
                          view.findViewById<TextView>(R.id.tvCodigo)

                      val tvProduto =
                          view.findViewById<TextView>(R.id.tvProduto)

                      val tvEndereco =
                          view.findViewById<TextView>(R.id.tvEndereco)

                      val tvDetalhes =
                          view.findViewById<TextView>(R.id.tvDetalhes)

                      val tvStatus =
                          view.findViewById<TextView>(R.id.tvStatus)

                      val btnAcao =
                          view.findViewById<Button>(R.id.btnAcao)

                      val btnExcluir =
                          view.findViewById<Button>(R.id.btnExcluir)

                      val btnCopiarItem =
                          view.findViewById<Button>(R.id.btnCopiarItem)

                      btnCopiarItem.setOnClickListener {
                          val clipboard =
                              getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(
                              android.content.ClipData.newPlainText(
                                  "Código Material",
                                  item.codigo
                              )
                          )
                          Toast.makeText(
                              this,
                              "Código ${item.codigo} copiado!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      tvCodigo.text =
                          "${item.quantidade} cx ${item.codigo}"

                      tvProduto.text =
                          item.descricao

                      tvEndereco.text =
                          "${item.rua} — ${item.rack}\n" +
                          "Coluna ${item.coluna} — Linha ${item.linha}"

                      tvDetalhes.text =
                          "Solicitado por: ${item.operador}\n" +
                          (if (item.separador.isNotBlank()) "Em separação por: ${item.separador}\n" else "") +
                          formato.format(Date(item.timestamp))

                      when (item.status) {
                          STATUS_CONCLUIDO -> {
                              tvStatus.text = "CONCLUÍDO"
                              tvStatus.setTextColor(Color.parseColor("#1B5E20"))
                              tvStatus.setBackgroundColor(Color.parseColor("#C8E6C9"))
                              btnAcao.text = "DESFAZER"
                              btnExcluir.visibility = View.VISIBLE
                              btnAcao.setOnClickListener {
                                  item.status = STATUS_PENDENTE
                                  item.separador = ""
                                  salvarRegistros()
                                  salvarNoFirestore(item)
                                  atualizarInterface()
                              }
                          }
                          STATUS_SEPARACAO -> {
                              tvStatus.text = "EM SEPARAÇÃO"
                              tvStatus.setTextColor(Color.parseColor("#E65100"))
                              tvStatus.setBackgroundColor(Color.parseColor("#FFE0B2"))
                              btnAcao.text = "CONCLUIR"
                              btnExcluir.visibility = View.VISIBLE
                              btnAcao.setOnClickListener {
                                  item.status = STATUS_CONCLUIDO
                                  salvarRegistros()
                                  salvarNoFirestore(item)
                                  atualizarInterface()
                              }
                          }
                          else -> {
                              tvStatus.text = "PENDENTE"
                              tvStatus.setTextColor(Color.parseColor("#B71C1C"))
                              tvStatus.setBackgroundColor(Color.parseColor("#FFCDD2"))
                              btnAcao.text = "EM SEPARAÇÃO"
                              btnExcluir.visibility = View.VISIBLE
                              btnAcao.setOnClickListener {
                                  item.status = STATUS_SEPARACAO
                                  item.separador = nomeOperador
                                  salvarRegistros()
                                  salvarNoFirestore(item)
                                  atualizarInterface()
                              }
                          }
                      }

                      btnExcluir.setOnClickListener {
                          confirmarExcluir(item)
                      }

                      containerLista.addView(view)
                  }
              }

              private fun confirmarExcluir(item: ItemReposicao) {
                  AlertDialog.Builder(this)
                      .setTitle("Excluir registro?")
                      .setMessage(
                          "Esse registro será apagado permanentemente em todos os aparelhos."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("EXCLUIR") { _, _ ->
                          registros.removeAll { it.id == item.id }
                          salvarRegistros()
                          excluirDoFirestore(item)
                          atualizarInterface()
                      }
                      .show()
              }

              private fun carregarOperador() {
                  val prefs =
                      getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )

                  nomeOperador =
                      prefs.getString(
                          KEY_OPERADOR,
                          "Operador 1"
                      ) ?: "Operador 1"

                  tvOperador.text =
                      "Operador: $nomeOperador"
              }

              private fun carregarOperadorDaNuvem() {
                  operadorListener?.remove()
                  operadorListener =
                      db.collection(COLECAO_OPERADORES)
                          .document(dispositivoId)
                          .addSnapshotListener { doc, error ->
                              if (error != null || doc == null) return@addSnapshotListener

                              val nomeNuvem = doc.getString("nomeOperador")?.trim()
                              if (!nomeNuvem.isNullOrEmpty()) {
                                  nomeOperador = nomeNuvem
                                  getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                      .edit()
                                      .putString(KEY_OPERADOR, nomeOperador)
                                      .apply()
                                  tvOperador.text = "Operador: $nomeOperador"
                              } else {
                                  salvarOperadorNaNuvem()
                              }
                          }
              }

              private fun salvarOperadorNaNuvem() {
                  db.collection(COLECAO_OPERADORES)
                      .document(dispositivoId)
                      .set(
                          hashMapOf(
                              "nomeOperador" to nomeOperador,
                              "dispositivo" to dispositivoId,
                              "atualizadoEm" to System.currentTimeMillis()
                          ),
                          SetOptions.merge()
                      )
              }

              private fun alterarNomeOperador() {
                  val input = EditText(this)
                  input.setText(nomeOperador)
                  input.selectAll()

                  AlertDialog.Builder(this)
                      .setTitle("Nome do operador")
                      .setMessage(
                          "Digite o nome que identificará este aparelho."
                      )
                      .setView(input)
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("SALVAR") { _, _ ->
                          val novo =
                              input.text.toString().trim()

                          if (novo.isNotEmpty()) {
                              nomeOperador = novo

                              getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                              )
                                  .edit()
                                  .putString(
                                      KEY_OPERADOR,
                                      novo
                                  )
                                  .apply()

                              tvOperador.text =
                                  "Operador: $nomeOperador"

                              salvarOperadorNaNuvem()
                          }
                      }
                      .show()
              }

              private fun salvarRegistros() {
                  val array = JSONArray()

                  for (item in registros) {
                      val obj = JSONObject()

                      obj.put("id", item.id)
                      obj.put("codigo", item.codigo)
                      obj.put("descricao", item.descricao)
                      obj.put("quantidade", item.quantidade)
                      obj.put("rua", item.rua)
                      obj.put("rack", item.rack)
                      obj.put("coluna", item.coluna)
                      obj.put("linha", item.linha)
                      obj.put("operador", item.operador)
                      obj.put("timestamp", item.timestamp)
                      obj.put("concluido", item.concluido)
                      obj.put("status", item.status)
                      obj.put("separador", item.separador)
                      obj.put("dispositivo", item.dispositivo)

                      array.put(obj)
                  }

                  getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          KEY_REGISTROS,
                          array.toString()
                      )
                      .apply()
              }

              private fun carregarRegistros() {
                  try {
                      val texto =
                          getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                              .getString(
                                  KEY_REGISTROS,
                                  null
                              ) ?: return

                      val array = JSONArray(texto)

                      registros.clear()

                      for (i in 0 until array.length()) {
                          val obj =
                              array.getJSONObject(i)

                          registros.add(
                              ItemReposicao(
                                  id = obj.getString("id"),
                                  codigo = obj.getString("codigo"),
                                  descricao = obj.optString(
                                      "descricao",
                                      ""
                                  ),
                                  quantidade = obj.getInt(
                                      "quantidade"
                                  ),
                                  rua = obj.getString("rua"),
                                  rack = obj.getString("rack"),
                                  coluna = obj.getString("coluna"),
                                  linha = obj.getString("linha"),
                                  operador = obj.getString("operador"),
                                  timestamp = obj.getLong("timestamp"),
                                  status = obj.optString("status", if (obj.optBoolean("concluido", false)) STATUS_CONCLUIDO else STATUS_PENDENTE),
                                  separador = obj.optString("separador", ""),
                                  dispositivo = obj.optString("dispositivo", "")
                              )
                          )
                      }
                  } catch (_: Exception) {
                      registros.clear()
                  }
              }

              // =========================================================
              // FIRESTORE
              // =========================================================

              private fun dadosFirestore(
                  item: ItemReposicao
              ): HashMap<String, Any> {
                  return hashMapOf(
                      "id" to item.id,
                      "codigo" to item.codigo,
                      "descricao" to item.descricao,
                      "quantidade" to item.quantidade,
                      "rua" to item.rua,
                      "rack" to item.rack,
                      "coluna" to item.coluna,
                      "linha" to item.linha,
                      "operador" to item.operador,
                      "timestamp" to item.timestamp,
                      "concluido" to item.concluido,
                      "status" to item.status,
                      "separador" to item.separador,
                      "dispositivo" to item.dispositivo
                  )
              }

              private fun salvarNoFirestore(
                  item: ItemReposicao
              ) {
                  db.collection(COLECAO_REPOSICOES)
                      .document(item.id)
                      .set(
                          dadosFirestore(item),
                          SetOptions.merge()
                      )
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Não foi possível sincronizar ${item.codigo}: ${e.message}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun excluirDoFirestore(
                  item: ItemReposicao
              ) {
                  db.collection(COLECAO_REPOSICOES)
                      .document(item.id)
                      .delete()
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Erro ao excluir do Firestore: ${e.message}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun iniciarSincronizacaoFirestore() {
                  firestoreListener?.remove()
                  firestoreSnapshotInicial = true

                  firestoreListener =
                      db.collection(COLECAO_REPOSICOES)
                          .addSnapshotListener { snapshot, error ->

                              if (error != null) {
                                  Toast.makeText(
                                      this,
                                      "Firebase: não foi possível sincronizar. Verifique a conexão.",
                                      Toast.LENGTH_LONG
                                  ).show()
                                  return@addSnapshotListener
                              }

                              if (snapshot == null) return@addSnapshotListener

                              firestoreSnapshotInicial = false

                              val remotos =
                                  snapshot.documents.mapNotNull { doc ->
                                      try {
                                          ItemReposicao(
                                              id = doc.getString("id")
                                                  ?: doc.id,
                                              codigo = doc.getString("codigo")
                                                  ?: return@mapNotNull null,
                                              descricao = doc.getString("descricao")
                                                  ?: "",
                                              quantidade =
                                                  (doc.getLong("quantidade")
                                                      ?: 1L).toInt(),
                                              rua = doc.getString("rua")
                                                  ?: "",
                                              rack = doc.getString("rack")
                                                  ?: "",
                                              coluna = doc.getString("coluna")
                                                  ?: "",
                                              linha = doc.getString("linha")
                                                  ?: "",
                                              operador = doc.getString("operador")
                                                  ?: "",
                                              timestamp =
                                                  doc.getLong("timestamp")
                                                      ?: 0L,
                                              status =
                                                  doc.getString("status")
                                                      ?: if (doc.getBoolean("concluido") == true) STATUS_CONCLUIDO else STATUS_PENDENTE,
                                              separador =
                                                  doc.getString("separador")
                                                      ?: "",
                                              dispositivo =
                                                  doc.getString("dispositivo")
                                                      ?: ""
                                          )
                                      } catch (_: Exception) {
                                          null
                                      }
                                  }

                              registros.clear()
                              registros.addAll(remotos)
                              salvarRegistros()
                              atualizarInterface()
                          }
              }

              // =========================================================
              // CONFIGURAÇÕES
              // =========================================================
              // A tela de configurações permite substituir a planilha de
              // endereços salva no aparelho. A nova base passa a ser usada
              // imediatamente nas consultas, bipagens e leituras pela câmera.
              private fun abrirConfiguracoes() {
                  val opcoes =
                      arrayOf(
                          "🔔 Notificações e monitoramento",
                          "📦 Estoque de caixas fechadas",
                          "Atualizar planilha de endereços (.xlsx)",
                          "Informações da base atual",
                          "Recarregar sincronização Firebase"
                      )

                  AlertDialog.Builder(this)
                      .setTitle("Configurações")
                      .setItems(opcoes) { _, posicao ->
                          when (posicao) {
                              0 -> abrirConfiguracoesNotificacao()
                              1 -> abrirEstoqueCaixas()
                              2 -> selecionarPlanilha()
                              3 -> mostrarInformacoesBase()
                              4 -> iniciarSincronizacaoFirestore()
                          }
                      }
                      .show()
              }

              private fun abrirEstoqueCaixas() {
                  startActivity(Intent(this, CaixasActivity::class.java))
              }

              private fun selecionarPlanilha() {
                  val intent =
                      Intent(Intent.ACTION_OPEN_DOCUMENT)

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  )

                  intent.type =
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

                  intent.putExtra(
                      Intent.EXTRA_MIME_TYPES,
                      arrayOf(
                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                          "application/vnd.ms-excel.sheet.macroEnabled.12",
                          "application/vnd.ms-excel"
                      )
                  )

                  startActivityForResult(
                      intent,
                      REQUEST_IMPORT_XLSX
                  )
              }

              private fun mostrarInformacoesBase() {
                  AlertDialog.Builder(this)
                      .setTitle("Base de endereços")
                      .setMessage(
                          "Produtos mapeados: ${baseProdutos.size}\n\n" +
                          "Campos utilizados:\n\n" +
                          "• Código Mate\n" +
                          "• Descrição do produto\n" +
                          "• Rua / Estação\n" +
                          "• Rack\n" +
                          "• Coluna\n" +
                          "• Linha\n\n" +
                          "Reposições: sincronizadas em tempo real pelo Firebase Firestore."
                      )
                      .setPositiveButton("OK", null)
                      .show()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == REQUEST_IMPORT_XLSX &&
                      resultCode == Activity.RESULT_OK
                  ) {
                      val uri = data?.data ?: return
                      importarPlanilha(uri)
                  }
              }

              private fun importarPlanilha(
                  uri: Uri
              ) {
                  try {
                      val arquivo =
                          File(
                              filesDir,
                              PLANILHA_INTERNA
                          )

                      val inputStream = contentResolver
                          .openInputStream(uri)
                          ?: throw Exception("Não foi possível abrir o arquivo selecionado.")

                      inputStream.use { input ->
                          FileOutputStream(arquivo).use { output ->
                              input.copyTo(output)
                          }
                      }

                      carregarPlanilha(
                          FileInputStream(arquivo)
                      )

                      Toast.makeText(
                          this,
                          "Planilha atualizada!\n${baseProdutos.size} produtos encontrados.",
                          Toast.LENGTH_LONG
                      ).show()

                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Erro ao importar planilha: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun carregarBaseEnderecos() {
                  val arquivo =
                      File(
                          filesDir,
                          PLANILHA_INTERNA
                      )

                  try {
                      if (arquivo.exists()) {
                          carregarPlanilha(
                              FileInputStream(arquivo)
                          )
                      } else {
                          assets
                              .open("enderecos.xlsx")
                              .use { input ->
                                  carregarPlanilha(input)
                              }
                      }
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Erro ao carregar a planilha de endereços.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun carregarPlanilha(
                  input: InputStream
              ) {
                  val arquivoTemp =
                      File(
                          cacheDir,
                          "planilha_temp.xlsx"
                      )

                  FileOutputStream(arquivoTemp)
                      .use { output ->
                          input.copyTo(output)
                      }

                  baseProdutos.clear()

                  ZipFile(arquivoTemp).use { zip ->
                      val sharedStrings =
                          mutableListOf<String>()

                      val shared =
                          zip.getEntry(
                              "xl/sharedStrings.xml"
                          )

                      if (shared != null) {
                          zip.getInputStream(shared)
                              .use {
                                  sharedStrings.addAll(
                                      lerSharedStrings(it)
                                  )
                              }
                      }

                      val sheet =
                          zip.entries()
                              .asSequence()
                              .firstOrNull {
                                  it.name.startsWith(
                                      "xl/worksheets/sheet"
                                  ) &&
                                  it.name.endsWith(".xml")
                              }
                              ?: throw Exception(
                                  "Nenhuma planilha encontrada."
                              )

                      zip.getInputStream(sheet)
                          .use {
                              val linhas =
                                  lerPlanilhaXML(
                                      it,
                                      sharedStrings
                                  )

                              processarLinhas(linhas)
                          }
                  }

                  arquivoTemp.delete()
              }

              private fun lerSharedStrings(
                  input: InputStream
              ): List<String> {
                  val resultado =
                      mutableListOf<String>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var textoAtual = ""
                  var event = parser.eventType

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              if (parser.name == "si") {
                                  textoAtual = ""
                              }
                          }

                          XmlPullParser.TEXT -> {
                              textoAtual += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              if (parser.name == "si") {
                                  resultado.add(textoAtual)
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun lerPlanilhaXML(
                  input: InputStream,
                  sharedStrings: List<String>
              ): List<List<String>> {
                  val resultado =
                      mutableListOf<List<String>>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var event = parser.eventType

                  var linhaAtual =
                      mutableMapOf<Int, String>()

                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              when (parser.name) {
                                  "row" -> {
                                      linhaAtual =
                                          mutableMapOf()
                                  }

                                  "c" -> {
                                      val referencia =
                                          parser.getAttributeValue(
                                              null,
                                              "r"
                                          ) ?: ""

                                      colunaAtual =
                                          numeroColuna(
                                              referencia
                                          )

                                      tipoCelula =
                                          parser.getAttributeValue(
                                              null,
                                              "t"
                                          ) ?: ""

                                      valor = ""
                                  }

                                  "v", "t" -> {
                                      valor = ""
                                  }
                              }
                          }

                          XmlPullParser.TEXT -> {
                              valor += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "c" -> {
                                      var final =
                                          valor.trim()

                                      if (
                                          tipoCelula == "s" &&
                                          final.isNotEmpty()
                                      ) {
                                          val indice =
                                              final.toIntOrNull()

                                          if (
                                              indice != null &&
                                              indice < sharedStrings.size
                                          ) {
                                              final =
                                                  sharedStrings[indice]
                                          }
                                      }

                                      linhaAtual[colunaAtual] =
                                          final
                                  }

                                  "row" -> {
                                      if (
                                          linhaAtual.isNotEmpty()
                                      ) {
                                          val max =
                                              linhaAtual.keys.maxOrNull()
                                                  ?: 0

                                          val lista =
                                              MutableList(
                                                  max + 1
                                              ) { "" }

                                          for (
                                              (indice, texto)
                                              in linhaAtual
                                          ) {
                                              if (
                                                  indice < lista.size
                                              ) {
                                                  lista[indice] =
                                                      texto
                                              }
                                          }

                                          resultado.add(lista)
                                      }
                                  }
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun numeroColuna(
                  referencia: String
              ): Int {
                  var resultado = 0

                  for (c in referencia) {
                      if (c.isDigit()) break

                      resultado =
                          resultado * 26 +
                          (
                              c.uppercaseChar() -
                              'A' +
                              1
                          )
                  }

                  return resultado - 1
              }

              private fun processarLinhas(
                  linhas: List<List<String>>
              ) {
                  if (linhas.isEmpty()) return

                  var indiceCabecalho = -1

                  for (i in linhas.indices) {
                      val texto =
                          linhas[i]
                              .joinToString("|")
                              .lowercase()

                      if (
                          texto.contains("cod material") &&
                          texto.contains("desc material")
                      ) {
                          indiceCabecalho = i
                          break
                      }
                  }

                  if (
                      indiceCabecalho == -1
                  ) {
                      throw Exception(
                          "Não foi possível localizar os cabeçalhos da planilha."
                      )
                  }

                  val cabecalho =
                      linhas[indiceCabecalho]

                  fun localizar(
                      nome: String
                  ): Int {
                      return cabecalho.indexOfFirst {
                          it.trim().equals(
                              nome,
                              ignoreCase = true
                          )
                      }
                  }

                  val codMaterial =
                      localizar("Cod Material")

                  val descMaterial =
                      localizar("Desc Material")

                  val estacao =
                      localizar("Estacao")

                  val rack =
                      localizar("Rack")

                  val linhaProd =
                      localizar("Linha prod alocado")

                  val colunaProd =
                      localizar("Coluna prod alocado")

                  if (
                      codMaterial < 0 ||
                      descMaterial < 0 ||
                      estacao < 0 ||
                      rack < 0 ||
                      linhaProd < 0 ||
                      colunaProd < 0
                  ) {
                      throw Exception(
                          "A planilha não possui todas as colunas necessárias."
                      )
                  }

                  for (
                      i in
                      (indiceCabecalho + 1)
                          until
                          linhas.size
                  ) {
                      val linha =
                          linhas[i]

                      fun valor(
                          indice: Int
                      ): String {
                          return if (
                              indice >= 0 &&
                              indice < linha.size
                          ) {
                              linha[indice].trim()
                          } else {
                              ""
                          }
                      }

                      val codigo =
                          valor(codMaterial)
                              .filter { it.isDigit() }
                              .takeLast(5)

                      if (
                          codigo.length != 5
                      ) {
                          continue
                      }

                      baseProdutos[codigo] =
                          EnderecoProduto(
                              codigo = codigo,
                              descricao = valor(descMaterial),
                              rua = valor(estacao),
                              rack = valor(rack),
                              coluna = valor(linhaProd),
                              linha = valor(colunaProd)
                          )
                  }

                  if (
                      baseProdutos.isEmpty()
                  ) {
                      throw Exception(
                          "Nenhum produto válido foi encontrado."
                      )
                  }
              }
          }
          EOF

