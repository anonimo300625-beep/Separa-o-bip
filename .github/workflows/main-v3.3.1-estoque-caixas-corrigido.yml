name: Build Android APK - V3.3.1 Estoque de caixas + assinatura estável

# V3.3.1: correção de compilação do módulo de estoque de caixas. A constante de status fica disponível para o modelo CaixaFechada. Mantém todas as funções da V3.3.

on:
  push:
    branches: [ "main", "principal" ]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

# Evita acumular várias compilações da mesma branch.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f firebase/google-services.json ]; then
            echo "ERRO: firebase/google-services.json não encontrado."
            exit 1
          fi

          cp firebase/google-services.json app/google-services.json

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERRO: Nenhuma planilha XLSX encontrada dentro de dados/"
            exit 1
          fi

          echo "Planilha encontrada: $XLSX_FILE"
          cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx

      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

      - name: Configurar assinatura estável (um único Secret)
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: |
          if [ -z "$ANDROID_SIGNING_CONFIG" ]; then
            echo "ERRO: O Secret ANDROID_SIGNING_CONFIG não foi configurado."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import base64

          config = json.loads(os.environ["ANDROID_SIGNING_CONFIG"])
          required = ["keystore_base64", "password"]
          missing = [key for key in required if not config.get(key)]
          if missing:
              raise SystemExit("ERRO: Secret incompleto: " + ", ".join(missing))

          try:
              keystore_bytes = base64.b64decode(config["keystore_base64"], validate=True)
          except Exception as exc:
              raise SystemExit("ERRO: Base64 do keystore inválido ou incompleto. Substitua o conteúdo do Secret pelo novo arquivo fornecido.") from exc

          if len(keystore_bytes) < 1000:
              raise SystemExit("ERRO: Keystore inválido ou incompleto.")

          with open("app/reposicao-signing.jks", "wb") as f:
              f.write(keystore_bytes)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("ANDROID_KEYSTORE_PASSWORD=" + config["password"] + "\n")
              env.write("ANDROID_KEY_ALIAS=reposicao\n")
              env.write("ANDROID_KEY_PASSWORD=" + config["password"] + "\n")

          # GITHUB_ENV só fica disponível nos PRÓXIMOS passos.
          # Para validar neste mesmo passo, exportamos também no shell.
          with open("/tmp/signing_password", "w", encoding="utf-8") as f:
              f.write(config["password"])
          PY

          ANDROID_KEYSTORE_PASSWORD=$(cat /tmp/signing_password)
          ANDROID_KEY_ALIAS=reposicao
          ANDROID_KEY_PASSWORD=$(cat /tmp/signing_password)
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD

          echo "Validando a chave de assinatura..."
          keytool -list -keystore app/reposicao-signing.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias reposicao >/dev/null
          echo "Assinatura estável configurada e validada."

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 21
                  versionName "9.3.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              signingConfigs {
                  reposicaoStable {
                      storeFile file("reposicao-signing.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.reposicaoStable
                  }
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>

              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="barcode_ui"/>


                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <activity
                      android:name=".CaixasActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"/>

                  <service
                      android:name=".MonitoramentoReposicaoService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Criar layout principal
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F5F5F5">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="14dp"
                  android:background="#1565C0">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/tvTitulo"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Registro de Reposição"
                          android:textColor="#FFFFFF"
                          android:textSize="22sp"
                          android:textStyle="bold"/>

                      <Button
                          android:id="@+id/btnConfiguracoes"
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:background="?android:attr/selectableItemBackgroundBorderless"
                          android:text="⚙"
                          android:textColor="#FFFFFF"
                          android:textSize="24sp"
                          android:contentDescription="Configurações"
                          android:minWidth="0dp"
                          android:minHeight="0dp"/>
                  </LinearLayout>

                  <TextView
                      android:id="@+id/tvOperador"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Operador: Operador 1"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"/>

                  <TextView
                      android:id="@+id/tvStatusNotificacao"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="🔕 Notificações desativadas"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"/>
              </LinearLayout>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnModoReposicao"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="📦 REPOSIÇÃO"/>

                          <Button
                              android:id="@+id/btnModoConsulta"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="5dp"
                              android:text="🔎 CONSULTAR"/>
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnNomeOperador"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="ALTERAR NOME DO OPERADOR"/>

                      <TextView
                          android:id="@+id/tvModoDescricao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="Bipe ou digite o produto para solicitar reposição."
                          android:textColor="#616161"/>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <EditText
                              android:id="@+id/etCodigo"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:hint="Bipe ou digite o Código Mate"
                              android:inputType="number"
                              android:maxLength="30"
                              android:imeOptions="actionDone"
                              android:padding="14dp"/>

                          <Button
                              android:id="@+id/btnScanner"
                              android:layout_width="58dp"
                              android:layout_height="58dp"
                              android:layout_marginStart="6dp"
                              android:text="📷"
                              android:textSize="22sp"
                              android:contentDescription="Ler código de barras pela câmera"/>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerConsultaEndereco"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:visibility="gone">

                          <EditText
                              android:id="@+id/etEnderecoConsulta"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:hint="📍 Rua / Rack / Coluna / Linha"
                              android:inputType="text"
                              android:imeOptions="actionDone"
                              android:padding="14dp"
                              android:background="#FFFFFF"/>

                          <Button
                              android:id="@+id/btnConsultarEndereco"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="6dp"
                              android:text="BUSCAR"/>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerProdutoEncontrado"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:padding="12dp"
                          android:orientation="vertical"
                          android:background="#E3F2FD"
                          android:visibility="gone">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="PRODUTO ENCONTRADO"
                              android:textColor="#1565C0"
                              android:textStyle="bold"
                              android:textSize="12sp"/>

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="5dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <TextView
                                  android:id="@+id/tvCodigoEncontrado"
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:textColor="#212121"
                                  android:textSize="18sp"
                                  android:textStyle="bold"/>

                              <Button
                                  android:id="@+id/btnCopiarCodigo"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="📋 COPIAR"
                                  android:minHeight="0dp"
                                  android:minWidth="0dp"/>
                          </LinearLayout>

                          <TextView
                              android:id="@+id/tvProdutoEncontrado"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="5dp"
                              android:textColor="#212121"
                              android:textSize="15sp"/>

                          <TextView
                              android:id="@+id/tvEnderecoEncontrado"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:textColor="#1565C0"
                              android:textSize="15sp"
                              android:textStyle="bold"/>
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnProcessar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
