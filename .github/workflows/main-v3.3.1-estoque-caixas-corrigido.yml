                  tvProduto.text = "Código: $codigo\nAguardando validade ou 'SEM VALIDADE'."
              }
          
              private fun registrarCaixa(comValidade: Boolean) {
                  val local = localizacaoAtual.ifBlank { etLocalizacao.text.toString().trim() }
                  val codigo = extrairCodigo(etCodigo.text.toString())
                  val validadeEntrada = etValidade.text.toString().trim()
          
                  if (local.isBlank()) {
                      Toast.makeText(this, "Primeiro bipe ou informe a localização.", Toast.LENGTH_LONG).show()
                      etLocalizacao.requestFocus()
                      return
                  }
                  if (codigo.length != 5) {
                      Toast.makeText(this, "Bipe ou informe um código de 5 números.", Toast.LENGTH_LONG).show()
                      etCodigo.requestFocus()
                      return
                  }
          
                  val validade = if (comValidade) normalizarValidade(validadeEntrada) else null
                  if (comValidade && validade == null) {
                      Toast.makeText(this, "Informe uma validade no formato MM/AA ou MM/AAAA.", Toast.LENGTH_LONG).show()
                      etValidade.requestFocus()
                      return
                  }
          
                  val agora = System.currentTimeMillis()
                  val caixa = CaixaFechada(
                      id = UUID.randomUUID().toString(),
                      codigo = codigo,
                      descricao = "",
                      localizacao = local,
                      validade = validade ?: "",
                      temValidade = validade != null,
                      validadeOrdem = validade?.let { validadeParaOrdem(it) },
                      dataEntrada = agora,
                      operador = nomeOperador,
                      dispositivo = dispositivoId
                  )
          
                  val dados = hashMapOf<String, Any?>(
                      "id" to caixa.id,
                      "codigo" to caixa.codigo,
                      "descricao" to caixa.descricao,
                      "localizacao" to caixa.localizacao,
                      "validade" to caixa.validade,
                      "temValidade" to caixa.temValidade,
                      "validadeOrdem" to caixa.validadeOrdem,
                      "dataEntrada" to caixa.dataEntrada,
                      "operador" to caixa.operador,
                      "dispositivo" to caixa.dispositivo,
                      "status" to caixa.status
                  )
          
                  db.collection(COLECAO_CAIXAS).document(caixa.id).set(dados)
                      .addOnSuccessListener {
                          etCodigo.setText("")
                          etValidade.setText("")
                          tvProduto.text = ""
                          tvFeedback.text = if (caixa.temValidade) {
                              "✅ Caixa ${caixa.codigo} registrada — validade ${caixa.validade}."
                          } else {
                              "✅ Caixa ${caixa.codigo} registrada — sem validade."
                          }
                          tvFeedback.visibility = View.VISIBLE
                          etCodigo.requestFocus()
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(this, "Erro ao registrar caixa: ${e.message}", Toast.LENGTH_LONG).show()
                      }
              }
          
              private fun iniciarSincronizacaoCaixas() {
                  caixasListener?.remove()
                  caixasListener = db.collection(COLECAO_CAIXAS)
                      .whereEqualTo("status", STATUS_DISPONIVEL)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) return@addSnapshotListener
          
                          caixas.clear()
                          for (doc in snapshot.documents) {
                              caixas.add(
                                  CaixaFechada(
                                      id = doc.getString("id") ?: doc.id,
                                      codigo = doc.getString("codigo") ?: "",
                                      descricao = doc.getString("descricao") ?: "",
                                      localizacao = doc.getString("localizacao") ?: "",
                                      validade = doc.getString("validade") ?: "",
                                      temValidade = doc.getBoolean("temValidade") ?: false,
                                      validadeOrdem = (doc.getLong("validadeOrdem"))?.toInt(),
                                      dataEntrada = doc.getLong("dataEntrada") ?: 0L,
                                      operador = doc.getString("operador") ?: "",
                                      dispositivo = doc.getString("dispositivo") ?: "",
                                      status = doc.getString("status") ?: STATUS_DISPONIVEL
                                  )
                              )
                          }
          
                          tvQuantidadeEstoque.text = "Caixas disponíveis: ${caixas.size}"
                          if (modoEstoque) atualizarListaEstoque()
                      }
              }
          
              private fun atualizarListaEstoque() {
                  containerListaCaixas.removeAllViews()
                  tvQuantidadeEstoque.text = "Caixas disponíveis: ${caixas.size}"
          
                  val termo = etPesquisaEstoque.text.toString().trim().lowercase(Locale.getDefault())
                  val filtradas = caixas.filter {
                      termo.isBlank() || it.codigo.contains(termo) || it.localizacao.lowercase(Locale.getDefault()).contains(termo) || it.validade.contains(termo)
                  }
          
                  val ordenadas = filtradas.sortedWith(
                      compareBy<CaixaFechada> { if (it.temValidade) 0 else 1 }
                          .thenBy { it.validadeOrdem ?: Int.MAX_VALUE }
                          .thenBy { it.codigo }
                          .thenBy { it.localizacao }
                  )
          
                  if (ordenadas.isEmpty()) {
                      val vazio = TextView(this).apply {
                          text = "Nenhuma caixa disponível encontrada."
                          textSize = 16f
                          setTextColor(Color.parseColor("#757575"))
                          setPadding(20, 30, 20, 30)
                      }
                      containerListaCaixas.addView(vazio)
                      return
                  }
          
                  for (caixa in ordenadas) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(22, 18, 22, 18)
                          setBackgroundColor(Color.WHITE)
                      }
                      val params = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(0, 6, 0, 6)
                      }
                      card.layoutParams = params
          
                      val titulo = TextView(this).apply {
                          text = "${if (caixa.temValidade) "🥇" else "📦"} ${caixa.codigo}"
                          textSize = 19f
                          setTextColor(Color.parseColor("#1565C0"))
                          setTypeface(null, android.graphics.Typeface.BOLD)
                      }
                      card.addView(titulo)
          
                      val validadeTexto = if (caixa.temValidade) "🗓️ Validade: ${caixa.validade}" else "🗓️ Sem validade"
                      val detalhes = TextView(this).apply {
                          text = "$validadeTexto\n📍 Localização: ${caixa.localizacao}\nEntrada: ${formatarData(caixa.dataEntrada)}"
                          textSize = 15f
                          setTextColor(Color.parseColor("#424242"))
                          setPadding(0, 8, 0, 0)
                      }
                      card.addView(detalhes)
          
                      val btnExcluir = Button(this).apply {
                          text = "EXCLUIR"
                          setOnClickListener { confirmarExcluir(caixa) }
                      }
                      card.addView(btnExcluir)
          
                      containerListaCaixas.addView(card)
                  }
              }
          
              private fun confirmarExcluir(caixa: CaixaFechada) {
                  AlertDialog.Builder(this)
                      .setTitle("Excluir caixa?")
                      .setMessage(
                          "Código: ${caixa.codigo}\n" +
                          "Local: ${caixa.localizacao}\n" +
                          (if (caixa.temValidade) "Validade: ${caixa.validade}" else "Sem validade") +
                          "\n\nUse esta opção apenas para corrigir um cadastro feito por engano."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("EXCLUIR") { _, _ ->
                          db.collection(COLECAO_CAIXAS).document(caixa.id).delete()
                              .addOnSuccessListener {
                                  Toast.makeText(this, "Caixa removida do estoque.", Toast.LENGTH_SHORT).show()
                              }
                              .addOnFailureListener { e ->
                                  Toast.makeText(this, "Erro ao excluir: ${e.message}", Toast.LENGTH_LONG).show()
                              }
                      }
                      .show()
              }
          
              private fun abrirScanner(onResult: (String) -> Unit) {
                  GmsBarcodeScanning.getClient(this).startScan()
                      .addOnSuccessListener { barcode ->
                          val valor = barcode.rawValue?.trim().orEmpty()
                          if (valor.isBlank()) {
                              Toast.makeText(this, "Não foi possível obter o código.", Toast.LENGTH_SHORT).show()
                          } else {
                              onResult(valor)
                          }
                      }
                      .addOnCanceledListener { }
                      .addOnFailureListener { e ->
                          Toast.makeText(this, "Não foi possível abrir o leitor: ${e.message ?: "erro desconhecido"}", Toast.LENGTH_LONG).show()
                      }
              }
          
              private fun extrairCodigo(valor: String): String {
                  val numeros = valor.filter { it.isDigit() }
                  return if (numeros.length == 5) numeros else ""
              }
          
              private fun normalizarValidade(valor: String): String? {
                  val texto = valor.trim()
                  val match = Regex("^(0[1-9]|1[0-2])[/.-](\\d{2}|\\d{4})$").find(texto) ?: return null
                  val mes = match.groupValues[1]
                  val ano = match.groupValues[2]
                  return if (ano.length == 2) "$mes/$ano" else "$mes/${ano.takeLast(2)}"
              }
          
              private fun validadeParaOrdem(validade: String): Int? {
                  val match = Regex("^(\\d{2})/(\\d{2})$").find(validade) ?: return null
                  return (2000 + match.groupValues[2].toInt()) * 100 + match.groupValues[1].toInt()
              }
          
              private fun formatarData(timestamp: Long): String {
                  if (timestamp <= 0) return "-"
                  return SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.getDefault()).format(Date(timestamp))
              }
          }
