              private fun numeroEndereco(valor: String): Int {
                  return Regex("\\d+").find(valor)?.value?.toIntOrNull() ?: Int.MAX_VALUE
              }

              private fun textoEndereco(valor: String): String {
                  return valor.trim().lowercase(Locale.getDefault())
              }

              private fun iniciarSincronizacaoCaixasDisponiveis() {
                  caixasDisponiveisListener?.remove()
                  caixasDisponiveisListener = db.collection(COLECAO_CAIXAS)
                      .whereEqualTo("status", STATUS_CAIXA_DISPONIVEL)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) {
                              if (error != null) DiagnosticLogger.firebase("caixas_fechadas.listener", error)
                              return@addSnapshotListener
                          }

                          caixasDisponiveis.clear()
                          for (doc in snapshot.documents) {
                              val codigo = doc.getString("codigo")?.trim().orEmpty()
                              val localizacao = doc.getString("localizacao")?.trim().orEmpty()
                              if (codigo.isBlank() || localizacao.isBlank()) continue

                              caixasDisponiveis.add(
                                  CaixaDisponivelResumo(
                                      id = doc.getString("id") ?: doc.id,
                                      codigo = codigo,
                                      localizacao = localizacao,
                                      validade = doc.getString("validade") ?: "",
                                      temValidade = doc.getBoolean("temValidade") ?: false,
                                      validadeOrdem = doc.getLong("validadeOrdem")?.toInt()
                                  )
                              )
                          }

                          atualizarInterface()
                      }
              }

              private fun obterCaixasSugeridas(codigo: String, quantidade: Int): List<CaixaDisponivelResumo> {
                  if (quantidade <= 0) return emptyList()

                  val agora = java.util.Calendar.getInstance()
                  val mesAtual = agora.get(java.util.Calendar.YEAR) * 100 +
                      (agora.get(java.util.Calendar.MONTH) + 1)

                  val candidatas = caixasDisponiveis.filter { it.codigo == codigo }

                  val comValidade = candidatas
                      .filter {
                          it.temValidade &&
                              it.validadeOrdem != null &&
                              it.validadeOrdem >= mesAtual
                      }
                      .sortedWith(
                          compareBy<CaixaDisponivelResumo> { it.validadeOrdem ?: Int.MAX_VALUE }
                              .thenBy { it.localizacao.toIntOrNull() ?: Int.MAX_VALUE }
                              .thenBy { it.localizacao }
                      )

                  val semValidade = candidatas
                      .filter { !it.temValidade }
                      .sortedWith(
                          compareBy<CaixaDisponivelResumo> { it.localizacao.toIntOrNull() ?: Int.MAX_VALUE }
                              .thenBy { it.localizacao }
                      )

                  return (comValidade + semValidade).take(quantidade)
              }

              private fun obterQuantidadeCaixasVencidas(codigo: String): Int {
                  val agora = java.util.Calendar.getInstance()
                  val mesAtual = agora.get(java.util.Calendar.YEAR) * 100 +
                      (agora.get(java.util.Calendar.MONTH) + 1)

                  return caixasDisponiveis.count {
                      it.codigo == codigo &&
                          it.temValidade &&
                          it.validadeOrdem != null &&
                          it.validadeOrdem < mesAtual
                  }
              }

              private fun formatarSugestaoCaixa(item: ItemReposicao): String {
                  val candidatas = caixasDisponiveis.filter { it.codigo == item.codigo }
                  if (candidatas.isEmpty()) {
                      return "📦 CAIXA SUGERIDA\nNenhuma caixa disponível no estoque."
                  }

                  val sugestoes = obterCaixasSugeridas(item.codigo, item.quantidade)
                  val vencidas = obterQuantidadeCaixasVencidas(item.codigo)

                  if (sugestoes.isEmpty()) {
                      return if (vencidas > 0) {
                          "📦 CAIXA SUGERIDA\n⚠️ Não há caixa dentro da validade. $vencidas caixa(s) vencida(s) no estoque."
                      } else {
                          "📦 CAIXA SUGERIDA\nNenhuma caixa disponível para esta quantidade."
                      }
                  }

                  val linhas = sugestoes.mapIndexed { index, caixa ->
                      val validadeTexto = if (caixa.temValidade) caixa.validade else "Sem validade"
                      "${index + 1}. #${caixa.localizacao} • Validade: $validadeTexto"
                  }

                  val faltantes = item.quantidade - sugestoes.size
                  return buildString {
                      append("📦 CAIXA(S) SUGERIDA(S) — FEFO\n")
                      append(linhas.joinToString("\n"))
                      if (faltantes > 0) {
                          append("\n⚠️ Faltam $faltantes caixa(s) disponível(is) para completar a solicitação.")
                      }
                      append("\n\nNão reservada — apenas sugestão.")
                  }
              }

              private fun atualizarInterface() {
                  if (modoConsulta) {
                      atualizarConsultas()
                      return
                  }

                  val pendentes = registros.filter { it.status == STATUS_PENDENTE }
                  val emSeparacao = registros.filter { it.status == STATUS_SEPARACAO }
                  val concluidos = registros.filter { it.status == STATUS_CONCLUIDO }

                  tvPendentes.text =
                      pendentes.sumOf { it.quantidade }.toString()

                  tvConcluidos.text =
                      emSeparacao.sumOf { it.quantidade }.toString()

                  containerLista.removeAllViews()

                  val termoPesquisa = ""

                  val todos = when {
                      abaConcluidos -> concluidos
                      abaEmSeparacao -> emSeparacao
                      else -> pendentes
                  }

                  val filtrados = if (termoPesquisa.isEmpty()) {
                      todos
                  } else {
                      todos.filter { item ->
                          listOf(item.codigo, item.descricao, item.rua, item.rack, item.coluna, item.linha)
                              .any { valor -> valor.lowercase(Locale.getDefault()).contains(termoPesquisa) }
                      }
                  }

                  val lista = if (ordenarPorEndereco) {
                      filtrados.sortedWith(
                          compareBy<ItemReposicao> { numeroEndereco(it.rua) }
                              .thenBy { textoEndereco(it.rua) }
                              .thenBy { numeroEndereco(it.rack) }
                              .thenBy { textoEndereco(it.rack) }
                              .thenBy { numeroEndereco(it.coluna) }
                              .thenBy { textoEndereco(it.coluna) }
                              .thenBy { textoEndereco(it.linha) }
                              .thenBy { it.timestamp }
                      )
                  } else {
                      filtrados.sortedWith(
                          compareBy<ItemReposicao> { it.timestamp }
                              .thenBy { numeroEndereco(it.rua) }
                              .thenBy { textoEndereco(it.rua) }
                              .thenBy { numeroEndereco(it.rack) }
                              .thenBy { numeroEndereco(it.coluna) }
                      )
                  }

                  btnPendentes.setText("PENDENTES (${pendentes.sumOf { it.quantidade }})")
                  btnEmSeparacao.setText("EM SEPARAÇÃO (${emSeparacao.sumOf { it.quantidade }})")
                  btnConcluidos.setText("CONCLUÍDOS (${concluidos.sumOf { it.quantidade }})")

                  btnPendentes.setBackgroundColor(if (!abaConcluidos && !abaEmSeparacao) Color.parseColor("#C62828") else Color.parseColor("#FFCDD2"))
                  btnEmSeparacao.setBackgroundColor(if (abaEmSeparacao) Color.parseColor("#F9A825") else Color.parseColor("#FFF59D"))
                  btnEmSeparacao.setTextColor(if (abaEmSeparacao) Color.WHITE else Color.parseColor("#6D4C41"))
                  btnConcluidos.setBackgroundColor(if (abaConcluidos) Color.parseColor("#1565C0") else Color.parseColor("#E0E0E0"))
                  btnPendentes.setTextColor(if (!abaConcluidos && !abaEmSeparacao) Color.WHITE else Color.parseColor("#B71C1C"))
                  btnEmSeparacao.setTextColor(if (abaEmSeparacao) Color.WHITE else Color.BLACK)
                  btnConcluidos.setTextColor(if (abaConcluidos) Color.WHITE else Color.BLACK)

                  if (lista.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = when {
                          abaConcluidos -> "Nenhuma reposição concluída."
                          abaEmSeparacao -> "Nenhuma reposição em separação."
                          else -> "Nenhum produto pendente de reposição."
                      }
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                      return
                  }

                  val formato =
                      SimpleDateFormat(
                          "dd/MM/yyyy HH:mm",
                          Locale.getDefault()
                      )

                  for (item in lista) {
                      val view =
                          LayoutInflater.from(this).inflate(
                              R.layout.item_reposicao,
                              containerLista,
                              false
                          )

                      val tvCodigo =
                          view.findViewById<TextView>(R.id.tvCodigo)

                      val tvProduto =
                          view.findViewById<TextView>(R.id.tvProduto)

                      val tvEndereco =
                          view.findViewById<TextView>(R.id.tvEndereco)

                      val tvDetalhes =
                          view.findViewById<TextView>(R.id.tvDetalhes)

                      val tvCaixaSugerida =
                          view.findViewById<TextView>(R.id.tvCaixaSugerida)

                      val tvStatus =
                          view.findViewById<TextView>(R.id.tvStatus)

                      val btnAcao =
                          view.findViewById<Button>(R.id.btnAcao)

                      val btnExcluir =
                          view.findViewById<Button>(R.id.btnExcluir)

                      val btnCopiarItem =
                          view.findViewById<Button>(R.id.btnCopiarItem)

                      btnCopiarItem.setOnClickListener {
                          val clipboard =
                              getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(
                              android.content.ClipData.newPlainText(
                                  "Código Material",
                                  item.codigo
                              )
                          )
                          Toast.makeText(
                              this,
                              "Código ${item.codigo} copiado!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      tvCodigo.text =
                          "${item.quantidade} cx ${item.codigo}"

                      tvProduto.text =
                          item.descricao

                      tvEndereco.text =
                          "${item.rua} — ${item.rack}\n" +
                          "Coluna ${item.coluna} — Linha ${item.linha}"

                      tvDetalhes.text =
                          "Solicitado por: ${item.operador}\n" +
                          (if (item.separador.isNotBlank()) "Em separação por: ${item.separador}\n" else "") +
                          formato.format(Date(item.timestamp))

                      if (item.status == STATUS_PENDENTE || item.status == STATUS_SEPARACAO) {
                          tvCaixaSugerida.text = formatarSugestaoCaixa(item)
                          tvCaixaSugerida.visibility = View.VISIBLE
                      } else {
                          tvCaixaSugerida.visibility = View.GONE
                      }

                      when (item.status) {
                          STATUS_CONCLUIDO -> {
                              tvStatus.text = "CONCLUÍDO"
                              tvStatus.setTextColor(Color.parseColor("#1B5E20"))
                              tvStatus.setBackgroundColor(Color.parseColor("#C8E6C9"))
                              btnAcao.text = "DESFAZER"
                              btnExcluir.visibility = View.VISIBLE
                              btnAcao.setOnClickListener {
                                  item.status = STATUS_PENDENTE
                                  item.separador = ""
                                  item.concluidoTimestamp = 0L
                                  salvarRegistros()
                                  salvarNoFirestore(item)
                                  atualizarInterface()
                              }
                          }
                          STATUS_SEPARACAO -> {
                              tvStatus.text = "EM SEPARAÇÃO"
                              tvStatus.setTextColor(Color.parseColor("#E65100"))
                              tvStatus.setBackgroundColor(Color.parseColor("#FFE0B2"))
                              btnAcao.text = "CONCLUIR"
                              btnExcluir.visibility = View.VISIBLE
                              btnAcao.setOnClickListener {
                                  item.status = STATUS_CONCLUIDO
                                  item.concluidoTimestamp = System.currentTimeMillis()
                                  salvarRegistros()
                                  salvarNoFirestore(item)
                                  atualizarInterface()
                              }
                          }
                          else -> {
                              tvStatus.text = "PENDENTE"
                              tvStatus.setTextColor(Color.parseColor("#B71C1C"))
                              tvStatus.setBackgroundColor(Color.parseColor("#FFCDD2"))
                              btnAcao.text = "EM SEPARAÇÃO"
                              btnExcluir.visibility = View.VISIBLE
                              btnAcao.setOnClickListener {
                                  item.status = STATUS_SEPARACAO
                                  item.separador = nomeOperador
                                  salvarRegistros()
                                  salvarNoFirestore(item)
                                  atualizarInterface()
                              }
                          }
                      }

                      btnExcluir.setOnClickListener {
                          confirmarExcluir(item)
                      }

                      containerLista.addView(view)
                  }
              }

