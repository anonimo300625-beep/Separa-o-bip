              // =========================================================
              // CONFIGURAÇÕES
              // =========================================================
              // A tela de configurações permite substituir a planilha de
              // endereços salva no aparelho. A nova base passa a ser usada
              // imediatamente nas consultas, bipagens e leituras pela câmera.
              private fun mostrarRelatorioHistorico() {
                  val agora = System.currentTimeMillis()
                  val seteDias = 7L * 24L * 60L * 60L * 1000L
                  val formatoDia = SimpleDateFormat("dd/MM/yyyy", Locale.getDefault())
                  val formatoHora = SimpleDateFormat("dd/MM HH:mm", Locale.getDefault())

                  // Só entram no relatório registros com horário real de conclusão.
                  // Registros antigos sem esse campo permanecem guardados, mas não
                  // entram no cálculo para evitar tempos inventados.
                  val concluidos = registros.filter {
                      it.status == STATUS_CONCLUIDO &&
                          it.concluidoTimestamp > 0L &&
                          it.concluidoTimestamp <= agora &&
                          agora - it.concluidoTimestamp <= seteDias
                  }.sortedByDescending { it.concluidoTimestamp }

                  val texto = StringBuilder()
                  texto.append("HISTÓRICO DOS ÚLTIMOS 7 DIAS\n")
                  texto.append("Período baseado na data de conclusão.\n\n")

                  if (concluidos.isEmpty()) {
                      texto.append("Ainda não há conclusões com horário registrado neste período.\n")
                      texto.append("As novas conclusões serão registradas a partir desta versão.")
                  } else {
                      val porDia = concluidos.groupBy { formatoDia.format(Date(it.concluidoTimestamp)) }
                      texto.append("RESUMO POR DIA\n")
                      porDia.forEach { (dia, itensDia) ->
                          val duracoes = itensDia.map { (it.concluidoTimestamp - it.timestamp).coerceAtLeast(0L) }
                          val media = if (duracoes.isNotEmpty()) duracoes.average().toLong() else 0L
                          val mediaMin = media / 60000L
                          texto.append("• $dia: ${itensDia.size} solicitações, ")
                          texto.append("${itensDia.sumOf { it.quantidade }} caixa(s), média ${mediaMin} min\n")
                          val operadoresDia = itensDia.groupBy { it.operador.ifBlank { "Operador não identificado" } }
                          operadoresDia.forEach { (operador, itensOperador) ->
                              texto.append("   - $operador: ${itensOperador.size} solicitação(ões)\n")
                          }
                      }

                      texto.append("\nRESUMO POR OPERADOR\n")
                      concluidos.groupBy { it.operador.ifBlank { "Operador não identificado" } }
                          .toSortedMap()
                          .forEach { (operador, itensOperador) ->
                              val duracoes = itensOperador.map {
                                  (it.concluidoTimestamp - it.timestamp).coerceAtLeast(0L)
                              }
                              val mediaMin = if (duracoes.isNotEmpty()) duracoes.average().toLong() / 60000L else 0L
                              texto.append("• $operador: ${itensOperador.size} solicitações, ")
                              texto.append("${itensOperador.sumOf { it.quantidade }} caixa(s), média ${mediaMin} min\n")
                          }

                      texto.append("\nÚLTIMAS CONCLUSÕES\n")
                      concluidos.take(20).forEach { item ->
                          val duracaoMin = (item.concluidoTimestamp - item.timestamp).coerceAtLeast(0L) / 60000L
                          texto.append("${formatoHora.format(Date(item.concluidoTimestamp))} • ")
                          texto.append("${item.operador.ifBlank { "Sem operador" }} • ")
                          texto.append("${item.codigo} • ${duracaoMin} min\n")
                      }
                  }

                  val painel = ScrollView(this)
                  val corpo = TextView(this)
                  corpo.text = texto.toString()
                  corpo.textSize = 15f
                  corpo.setTextColor(Color.parseColor("#212121"))
                  corpo.setPadding(28, 20, 28, 20)
                  painel.addView(corpo)

                  AlertDialog.Builder(this)
                      .setTitle("📋 Histórico e relatórios")
                      .setView(painel)
                      .setPositiveButton("FECHAR", null)
                      .show()
              }

