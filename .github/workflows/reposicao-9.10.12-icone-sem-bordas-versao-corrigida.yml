          import base64
          from pathlib import Path
          from PIL import Image

          raw = base64.b64decode(Path('/tmp/app_icon.b64').read_text())
          source = Image.open(__import__('io').BytesIO(raw)).convert('RGB')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
