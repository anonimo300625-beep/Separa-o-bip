      - name: Criar sincronizador profissional da base de endereços
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/BaseEnderecosSync.kt
          package com.separacao.bip

          import android.content.Context
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.Source
          import com.google.firebase.firestore.QuerySnapshot
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream

          data class ResultadoBaseEnderecos(
              val versao: String,
              val quantidade: Int,
              val atualizadoEm: Long,
              val produtos: Map<String, EnderecoProduto>
          )

          class BaseEnderecosSync(
              private val context: Context,
              private val db: FirebaseFirestore
          ) {
              companion object {
                  const val PREFS = "reposicao_prefs"
                  const val KEY_BASE_VERSAO = "base_enderecos_versao"
                  const val KEY_BASE_CACHE = "base_enderecos_cache"
                  const val KEY_BASE_ARQUIVO = "base_enderecos.json"
                  const val KEY_BASE_QUANTIDADE = "base_enderecos_quantidade"
                  const val KEY_BASE_ATUALIZADA_EM = "base_enderecos_atualizada_em"
                  const val COLECAO_BASE_META = "base_enderecos_meta"
                  const val COLECAO_BASE_ITENS = "base_enderecos_itens"
              }

              private var listener: ListenerRegistration? = null
              private var atualizando = false

              fun iniciarMonitoramento(
                  aoAtualizar: (ResultadoBaseEnderecos) -> Unit,
                  aoStatus: (String) -> Unit
              ) {
                  listener?.remove()
                  listener = db.collection(COLECAO_BASE_META)
                      .document("atual")
                      .addSnapshotListener { meta, error ->
                          if (error != null) {
                              DiagnosticLogger.firebase("base_enderecos_meta.listener", error)
                              aoStatus("⚠️ Não foi possível verificar a base no Firebase")
                              return@addSnapshotListener
                          }
                          if (meta == null || !meta.exists()) {
                              aoStatus("⚪ Nenhuma base nova publicada ainda")
                              return@addSnapshotListener
                          }
                          processarMeta(meta.data ?: emptyMap(), false, aoAtualizar, aoStatus)
                      }
              }

              fun verificarAgora(
                  forcar: Boolean,
                  aoAtualizar: (ResultadoBaseEnderecos) -> Unit,
                  aoStatus: (String) -> Unit
              ) {
                  db.collection(COLECAO_BASE_META).document("atual").get(Source.SERVER)
                      .addOnSuccessListener { meta ->
                          if (!meta.exists()) {
                              aoStatus("⚪ Nenhuma base nova publicada ainda")
                              return@addOnSuccessListener
                          }
                          processarMeta(meta.data ?: emptyMap(), forcar, aoAtualizar, aoStatus)
                      }
                      .addOnFailureListener { e ->
                          DiagnosticLogger.firebase("base_enderecos_meta.get", e)
                          aoStatus("⚠️ Não foi possível verificar a base no Firebase")
                      }
              }

              private fun processarMeta(
                  dados: Map<String, Any>,
                  forcar: Boolean,
                  aoAtualizar: (ResultadoBaseEnderecos) -> Unit,
                  aoStatus: (String) -> Unit
              ) {
                  val versao = dados["versao"]?.toString()?.trim().orEmpty()
                  val estado = dados["estado"]?.toString()?.trim().orEmpty()
                  val quantidade = (dados["quantidade"] as? Number)?.toInt() ?: 0
                  val totalBlocos = (dados["totalBlocos"] as? Number)?.toInt() ?: 0
                  val atualizadoEm = (dados["atualizadoEm"] as? Number)?.toLong() ?: 0L

                  if (versao.isBlank()) {
                      aoStatus("⚠️ Publicação da base sem versão válida. A base atual foi preservada.")
                      return
                  }

                  // O único formato aceito a partir da V3.10 é o formato novo em blocos.
                  // Bases antigas não são mais interpretadas nem podem bloquear a aplicação.
                  if (totalBlocos <= 0) {
                      aoStatus("ℹ️ O Firebase ainda possui uma publicação antiga. Aguardando uma nova base no formato atualizado.")
                      return
                  }

                  // Enquanto a publicação estiver acontecendo, todos os aparelhos
                  // continuam usando a base anterior sem tentar baixar dados parciais.
                  if (estado.isNotBlank() && estado != "pronta") {
                      aoStatus("⏳ Nova base sendo publicada • ${totalBlocos} blocos")
                      return
                  }

                  if (estado != "pronta") {
                      aoStatus("⏳ Aguardando confirmação da nova base no Firebase")
                      return
                  }

                  if (quantidade <= 0) {
                      aoStatus("⚠️ Nova base sem quantidade válida. A base atual foi preservada.")
                      return
                  }

                  val local = lerVersaoLocal()
                  val quantidadeLocal = lerQuantidadeLocal()
                  if (!forcar && versao == local && quantidadeLocal == quantidade) {
                      aoStatus(statusLocal())
                      return
                  }

                  baixarVersaoNova(
                      versao = versao,
                      quantidadeEsperada = quantidade,
                      totalBlocosEsperado = totalBlocos,
                      atualizadoEm = atualizadoEm,
                      aoAtualizar = aoAtualizar,
                      aoStatus = aoStatus
                  )
              }

              private fun baixarVersaoNova(
                  versao: String,
                  quantidadeEsperada: Int,
                  totalBlocosEsperado: Int,
                  atualizadoEm: Long,
                  aoAtualizar: (ResultadoBaseEnderecos) -> Unit,
                  aoStatus: (String) -> Unit
              ) {
                  if (atualizando) return
                  atualizando = true
                  aoStatus("🔄 Baixando base de endereços • 0/$totalBlocosEsperado blocos")

                  db.collection(COLECAO_BASE_ITENS)
                      .whereEqualTo("versao", versao)
                      .get(Source.SERVER)
                      .addOnSuccessListener { snap ->
                          try {
                              val produtos = mutableMapOf<String, EnderecoProduto>()
                              val indices = mutableSetOf<Int>()
                              var quantidadeDeclarada = 0

                              for (doc in snap.documents) {
                                  val bloco = (doc.get("bloco") as? Number)?.toInt() ?: -1
                                  val totalDoDoc = (doc.get("totalBlocos") as? Number)?.toInt() ?: -1
                                  val quantidadeDoDoc = (doc.get("quantidade") as? Number)?.toInt() ?: -1
                                  val lista = doc.get("produtos") as? List<*> ?: throw IllegalStateException("bloco_sem_produtos")

                                  if (bloco !in 0 until totalBlocosEsperado) {
                                      throw IllegalStateException("indice_de_bloco_invalido")
                                  }
                                  if (totalDoDoc != totalBlocosEsperado) {
                                      throw IllegalStateException("total_de_blocos_incompativel")
                                  }
                                  if (!indices.add(bloco)) {
                                      throw IllegalStateException("bloco_duplicado")
                                  }
                                  if (quantidadeDoDoc != lista.size) {
                                      throw IllegalStateException("quantidade_do_bloco_invalida")
                                  }

                                  quantidadeDeclarada += quantidadeDoDoc

                                  for (entrada in lista) {
                                      val item = entrada as? Map<*, *> ?: throw IllegalStateException("produto_invalido")
                                      val codigo = item["codigo"]?.toString()?.trim().orEmpty()
                                      if (codigo.isBlank()) throw IllegalStateException("produto_sem_codigo")
                                      if (produtos.containsKey(codigo)) throw IllegalStateException("codigo_duplicado")

                                      produtos[codigo] = EnderecoProduto(
                                          codigo = codigo,
                                          descricao = item["descricao"]?.toString() ?: "",
                                          rua = item["rua"]?.toString() ?: "",
                                          rack = item["rack"]?.toString() ?: "",
                                          coluna = item["coluna"]?.toString() ?: "",
                                          linha = item["linha"]?.toString() ?: ""
                                      )
                                  }
                              }

                              if (indices.size != totalBlocosEsperado) {
                                  throw IllegalStateException("blocos_incompletos")
                              }
                              if (quantidadeDeclarada != quantidadeEsperada) {
                                  throw IllegalStateException("quantidade_declarada_incompativel")
                              }
                              if (produtos.size != quantidadeEsperada) {
                                  throw IllegalStateException("quantidade_de_produtos_incompativel")
                              }

                              val resultado = ResultadoBaseEnderecos(
                                  versao = versao,
                                  quantidade = produtos.size,
                                  atualizadoEm = atualizadoEm,
                                  produtos = produtos
                              )

                              // A validação terminou antes desta chamada. A troca local
                              // é atômica do ponto de vista do aplicativo: a base anterior
                              // continua intacta se qualquer etapa de gravação falhar.
                              salvarLocal(resultado)
                              DiagnosticLogger.info("BASE_ENDERECOS", "Base validada e aplicada • versão=$versao • produtos=${produtos.size}")
                              atualizando = false
                              aoAtualizar(resultado)
                              aoStatus(statusDaBase(resultado.atualizadoEm, resultado.quantidade))
                          } catch (e: Exception) {
                              atualizando = false
                              DiagnosticLogger.erro("BASE_ENDERECOS", "Validação da nova base falhou", e)
                              aoStatus("⚠️ Nova base incompleta ou inválida. A base atual foi preservada.")
                          }
                      }
                      .addOnFailureListener { e ->
                          atualizando = false
                          DiagnosticLogger.firebase("base_enderecos_itens.get", e, "versão=$versao")
                          aoStatus("⚠️ Não foi possível baixar a nova base. A base atual foi preservada.")
                      }
              }

              fun parar() {
                  listener?.remove()
                  listener = null
              }

              fun salvarLocal(resultado: ResultadoBaseEnderecos) {
                  val arquivoFinal = File(context.filesDir, KEY_BASE_ARQUIVO)
                  val arquivoTemp = File(context.filesDir, "$KEY_BASE_ARQUIVO.tmp")
                  val cache = JSONArray()

                  resultado.produtos.values.forEach { item ->
                      cache.put(JSONObject().apply {
                          put("codigo", item.codigo)
                          put("descricao", item.descricao)
                          put("rua", item.rua)
                          put("rack", item.rack)
                          put("coluna", item.coluna)
                          put("linha", item.linha)
                      })
                  }

                  FileOutputStream(arquivoTemp).use { output ->
                      output.write(cache.toString().toByteArray(Charsets.UTF_8))
                      output.flush()
                      output.fd.sync()
                  }

                  // O arquivo temporário só substitui o arquivo atual depois de estar completo.
                  // Se algo der errado antes da troca, a base antiga continua disponível.
                  if (arquivoFinal.exists()) {
                      val backup = File(context.filesDir, "$KEY_BASE_ARQUIVO.bak")
                      if (backup.exists()) backup.delete()
                      if (!arquivoFinal.renameTo(backup)) {
                          arquivoTemp.delete()
                          throw IllegalStateException("Não foi possível proteger a base local anterior.")
                      }
                      if (!arquivoTemp.renameTo(arquivoFinal)) {
                          backup.renameTo(arquivoFinal)
                          throw IllegalStateException("Não foi possível ativar a nova base local.")
                      }
                      backup.delete()
                  } else if (!arquivoTemp.renameTo(arquivoFinal)) {
                      throw IllegalStateException("Não foi possível ativar a nova base local.")
                  }

                  prefs().edit()
                      .putString(KEY_BASE_VERSAO, resultado.versao)
                      .putInt(KEY_BASE_QUANTIDADE, resultado.quantidade)
                      .putLong(KEY_BASE_ATUALIZADA_EM, resultado.atualizadoEm)
                      .remove(KEY_BASE_CACHE)
                      .apply()
              }

              fun lerVersaoLocal(): String = prefs().getString(KEY_BASE_VERSAO, "").orEmpty()

              fun lerQuantidadeLocal(): Int = prefs().getInt(KEY_BASE_QUANTIDADE, 0)

              fun lerAtualizadaEm(): Long = prefs().getLong(KEY_BASE_ATUALIZADA_EM, 0L)

              private fun statusLocal(): String {
                  val versao = lerVersaoLocal()
                  val quando = lerAtualizadaEm()
                  val quantidade = lerQuantidadeLocal()
                  if (versao.isBlank() || quando <= 0L) return "⚪ Base de endereços ainda não sincronizada"
                  return statusDaBase(quando, if (quantidade > 0) quantidade else null)
              }

              private fun statusDaBase(quando: Long, quantidade: Int?): String {
                  val data = java.text.SimpleDateFormat("dd/MM/yyyy HH:mm:ss", java.util.Locale.getDefault())
                      .format(java.util.Date(quando))
                  return if (quantidade != null) {
                      "🟢 Base atualizada • $quantidade produtos • $data"
                  } else {
                      "🟢 Base atualizada • $data"
                  }
              }

              private fun prefs() = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
          }
          EOF

      - name: Criar diagnóstico persistente do aplicativo
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/DiagnosticLogger.kt
          package com.separacao.bip

          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Registro local de diagnóstico. Não envia dados automaticamente para a nuvem.
           * Guarda somente eventos técnicos necessários para investigar falhas.
           */
          object DiagnosticLogger {
              private const val PREFS = "reposicao_diagnostico"
              private const val KEY_EVENTOS = "eventos"
              private const val MAX_EVENTOS = 500
              private const val MAX_DETALHE = 5000

              @Volatile
              private var appContext: Context? = null

              @Volatile
              private var initialized = false

              fun init(context: Context) {
                  if (initialized) return
                  synchronized(this) {
                      if (initialized) return
                      appContext = context.applicationContext
                      initialized = true
                      instalarCapturaDeExcecao()
                      info("APP", "Diagnóstico iniciado")
                  }
              }

              fun info(categoria: String, mensagem: String) = registrar("INFO", categoria, mensagem, null)
              fun aviso(categoria: String, mensagem: String) = registrar("WARN", categoria, mensagem, null)
              fun erro(categoria: String, mensagem: String, throwable: Throwable? = null) = registrar("ERROR", categoria, mensagem, throwable)

              fun firebase(operacao: String, throwable: Throwable?, contexto: String = "") {
                  val codigo = throwable?.let {
                      try {
                          val metodo = it.javaClass.methods.firstOrNull { m -> m.name == "getCode" && m.parameterTypes.isEmpty() }
                          metodo?.invoke(it)?.toString()
                      } catch (_: Exception) { null }
                  }
                  val detalhe = buildString {
                      append("operação=").append(operacao)
                      if (!codigo.isNullOrBlank()) append(" • código=").append(codigo)
                      if (contexto.isNotBlank()) append(" • ").append(contexto)
                      if (throwable?.message?.isNotBlank() == true) append(" • mensagem=").append(throwable.message)
                  }
                  erro("FIREBASE", detalhe, throwable)
              }

              fun gerarRelatorio(): String {
                  val context = appContext
                  val agora = System.currentTimeMillis()
                  val data = SimpleDateFormat("dd/MM/yyyy HH:mm:ss", Locale.getDefault()).format(Date(agora))
                  val sb = StringBuilder()
                  sb.append("RELATÓRIO DE DIAGNÓSTICO — REPOSIÇÃO\n")
                  sb.append("Gerado em: ").append(data).append("\n")
                  sb.append("========================================\n\n")

                  if (context == null) {
                      sb.append("Logger ainda não inicializado.\n")
                      return sb.toString()
                  }

                  val packageInfo = try {
                      context.packageManager.getPackageInfo(context.packageName, 0)
                  } catch (_: Exception) { null }
                  sb.append("APLICATIVO\n")
                  sb.append("• Pacote: ").append(context.packageName).append("\n")
                  sb.append("• Versão: ").append(packageInfo?.versionName ?: "desconhecida")
                      .append(" (code ").append(if (Build.VERSION.SDK_INT >= 28) packageInfo?.longVersionCode else packageInfo?.versionCode).append(")\n")
                  sb.append("• Android: ").append(Build.VERSION.RELEASE).append(" (API ").append(Build.VERSION.SDK_INT).append(")\n")
                  sb.append("• Fabricante/modelo: ").append(Build.MANUFACTURER).append(" / ").append(Build.MODEL).append("\n")
                  sb.append("• Idioma: ").append(Locale.getDefault()).append("\n")
                  sb.append("• Rede no momento do relatório: ").append(descreverRede(context)).append("\n\n")

                  val prefs = context.getSharedPreferences("reposicao_prefs", Context.MODE_PRIVATE)
                  sb.append("ESTADO LOCAL\n")
                  sb.append("• Operador: ").append(prefs.getString("operador", "não informado") ?: "não informado").append("\n")
                  sb.append("• Dispositivo: ").append(prefs.getString("dispositivo_id", "não informado") ?: "não informado").append("\n")
                  sb.append("• Registros locais: ").append(tamanhoArray(prefs.getString("registros", "[]") ?: "[]")).append("\n")
                  sb.append("• Operações pendentes na fila Firebase: ").append(tamanhoArray(prefs.getString("fila_firebase", "[]") ?: "[]")).append("\n")
                  sb.append("• Versão base local: ").append(prefs.getString("base_enderecos_versao", "não informada") ?: "não informada").append("\n")
                  sb.append("• Quantidade base local: ").append(prefs.getInt("base_enderecos_quantidade", 0)).append("\n")
                  sb.append("• Última atualização da base: ").append(formatarTimestamp(prefs.getLong("base_enderecos_atualizada_em", 0L))).append("\n")
                  sb.append("• Monitoramento: ").append(if (prefs.getBoolean("notificacoes_ativas", false)) "ativo" else "desativado").append("\n\n")

                  sb.append("EVENTOS REGISTRADOS\n")
                  sb.append("========================================\n")
                  val eventos = carregarEventos()
                  if (eventos.length() == 0) {
                      sb.append("Nenhum evento registrado.\n")
                  } else {
                      for (i in 0 until eventos.length()) {
                          val e = eventos.optJSONObject(i) ?: continue
                          sb.append("[").append(formatarTimestamp(e.optLong("timestamp", 0L))).append("] ")
                          sb.append(e.optString("nivel", "INFO")).append(" / ")
                          sb.append(e.optString("categoria", "GERAL")).append("\n")
                          sb.append(e.optString("mensagem", "")).append("\n")
                          val stack = e.optString("stackTrace", "")
                          if (stack.isNotBlank()) sb.append(stack).append("\n")
                          sb.append("----------------------------------------\n")
                      }
                  }
                  return sb.toString()
              }

              fun limpar() {
                  appContext?.getSharedPreferences(PREFS, Context.MODE_PRIVATE)?.edit()?.remove(KEY_EVENTOS)?.apply()
              }

              private fun registrar(nivel: String, categoria: String, mensagem: String, throwable: Throwable?) {
                  val context = appContext ?: return
                  try {
                      val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      val atual = carregarEventos(prefs)
                      val novo = JSONObject()
                          .put("timestamp", System.currentTimeMillis())
                          .put("nivel", nivel)
                          .put("categoria", categoria)
                          .put("mensagem", mensagem.take(MAX_DETALHE))
                      if (throwable != null) {
                          novo.put("stackTrace", stackTrace(throwable).take(MAX_DETALHE))
                      }
                      val resultado = JSONArray()
                      val inicio = maxOf(0, atual.length() - MAX_EVENTOS + 1)
                      for (i in inicio until atual.length()) resultado.put(atual.optJSONObject(i))
                      resultado.put(novo)
                      prefs.edit().putString(KEY_EVENTOS, resultado.toString()).apply()
                  } catch (_: Exception) {
                      // O diagnóstico nunca pode derrubar ou bloquear o aplicativo.
                  }
              }

              private fun instalarCapturaDeExcecao() {
                  val anterior = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      erro("CRASH", "Exceção não tratada na thread ${thread.name}", throwable)
                      anterior?.uncaughtException(thread, throwable)
                  }
              }

              private fun carregarEventos(): JSONArray = carregarEventos(
                  appContext?.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              )

              private fun carregarEventos(prefs: android.content.SharedPreferences?): JSONArray {
                  if (prefs == null) return JSONArray()
                  return try { JSONArray(prefs.getString(KEY_EVENTOS, "[]") ?: "[]") } catch (_: Exception) { JSONArray() }
              }

              private fun tamanhoArray(texto: String): Int {
                  return try { JSONArray(texto).length() } catch (_: Exception) { 0 }
              }

              private fun stackTrace(t: Throwable): String {
                  val sw = StringWriter()
                  t.printStackTrace(PrintWriter(sw))
                  return sw.toString()
              }

              private fun formatarTimestamp(timestamp: Long): String {
                  if (timestamp <= 0L) return "não informado"
                  return SimpleDateFormat("dd/MM/yyyy HH:mm:ss", Locale.getDefault()).format(Date(timestamp))
              }

              private fun descreverRede(context: Context): String {
                  return try {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val network = cm.activeNetwork ?: return "sem conexão ativa"
                      val caps = cm.getNetworkCapabilities(network) ?: return "rede desconhecida"
                      when {
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "Wi-Fi"
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "dados móveis"
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) -> "Ethernet"
                          else -> "rede conectada"
                      }
                  } catch (_: Exception) {
                      "não foi possível determinar"
                  }
              }

              fun compartilhar(context: Context) {
                  val relatorio = gerarRelatorio()
                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = "text/plain"
                      putExtra(Intent.EXTRA_SUBJECT, "Relatório de diagnóstico — Reposição")
                      putExtra(Intent.EXTRA_TEXT, relatorio)
                  }
                  try {
                      context.startActivity(Intent.createChooser(intent, "Enviar relatório de diagnóstico"))
                  } catch (_: android.content.ActivityNotFoundException) {
                      try {
                          val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          clipboard.setPrimaryClip(android.content.ClipData.newPlainText("Relatório de diagnóstico", relatorio))
                          android.widget.Toast.makeText(context, "Nenhum aplicativo de compartilhamento disponível. Relatório copiado para a área de transferência.", android.widget.Toast.LENGTH_LONG).show()
                      } catch (_: Exception) {
                          android.widget.Toast.makeText(context, "Não foi possível abrir o compartilhamento. Use SALVAR .TXT.", android.widget.Toast.LENGTH_LONG).show()
                      }
                  }
              }
          }
          EOF

      - name: Criar MainActivity com Firebase Firestore e monitoramento
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
          package com.separacao.bip

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.pm.PackageManager
          import android.content.Intent
          import android.graphics.Color
