                  etBipagem.filters = arrayOf(android.text.InputFilter.LengthFilter(5))
                  tvAjudaValidade.text = "⌨️ Digite 0427 e o app transforma em 04/27 automaticamente. A bipagem da validade continua funcionando."
                  tvAjudaValidade.visibility = View.VISIBLE
                  etBipagem.requestFocus()
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? android.view.inputmethod.InputMethodManager
                  imm?.showSoftInput(etBipagem, android.view.inputmethod.InputMethodManager.SHOW_IMPLICIT)
              }

              private fun configurarEntradaParaCodigo() {
                  etBipagem.inputType = android.text.InputType.TYPE_CLASS_TEXT
                  etBipagem.imeOptions = android.view.inputmethod.EditorInfo.IME_ACTION_DONE
                  etBipagem.hint = "Bipe ou digite aqui"
                  etBipagem.filters = arrayOf(android.text.InputFilter.LengthFilter(30))
                  tvAjudaValidade.visibility = View.GONE
              }

              private fun processarEntradaDigitada() {
                  val valor = etBipagem.text.toString().trim()
                  if (valor.isBlank()) return

                  if (processandoEntrada) {
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Leitura ignorada enquanto a caixa anterior está sendo gravada • entrada_em_gravacao=true • valor=$valor")
                      etBipagem.setText("")
                      Toast.makeText(this, "Aguarde a confirmação da caixa anterior antes de bipar a próxima.", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val localDetectada = detectarLocalizacao(valor)
                  if (localDetectada != null) {
                      if (codigoPendente.isNotBlank()) {
                          Toast.makeText(this, "Finalize a caixa $codigoPendente antes de trocar de localização.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      localizacaoAtual = localDetectada
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Localização capturada • local=#$localDetectada")
                      etBipagem.setText("")
                      atualizarLocalizacaoAtual()
                      atualizarEtapaEntrada()
                      mostrarFeedback("📍 Localização #$localDetectada selecionada.")
                      return
                  }

                  val validade = normalizarValidade(valor)
                  if (validade != null) {
                      if (localizacaoAtual.isBlank()) {
                          Toast.makeText(this, "Primeiro bipe a localização da caixaria.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      if (codigoPendente.isBlank()) {
                          Toast.makeText(this, "Primeiro bipe o código da caixa.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Validade capturada • codigo_pendente=$codigoPendente • validade=$validade • local=#$localizacaoAtual")
                      etBipagem.setText("")
                      registrarCaixa(validade)
                      return
                  }

                  val codigo = extrairCodigo(valor)
                  if (codigo.length == 5) {
                      if (localizacaoAtual.isBlank()) {
                          Toast.makeText(this, "Primeiro bipe a localização da caixaria.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      if (codigoPendente.isNotBlank()) {
                          Toast.makeText(this, "A caixa $codigoPendente está aguardando a validade.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      codigoPendente = codigo
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Código capturado • codigo=$codigo • local=#$localizacaoAtual")
                      etBipagem.setText("")
                      atualizarProdutoInformativo(codigo)
                      atualizarEtapaEntrada()
                      return
                  }

                  Toast.makeText(this, "Leitura não reconhecida. Use #localização, código de 5 números ou validade MM/AA.", Toast.LENGTH_LONG).show()
                  etBipagem.setText("")
              }

              private fun detectarLocalizacao(valor: String): String? {
                  val texto = valor.trim().replace(" ", "")
                  if (texto.startsWith("#")) {
                      val numeros = texto.removePrefix("#").filter { it.isDigit() }
                      return if (numeros.length >= 4) numeros else null
                  }

                  // Alguns bipadores devolvem #3002 como 33002. Nesse formato,
                  // o primeiro 3 adicional representa o caractere #.
                  if (codigoPendente.isBlank() && texto.matches(Regex("33\\d{3}"))) {
                      val possivelLocal = texto.substring(1)
                      if (possivelLocal.startsWith("3")) return possivelLocal
                  }
                  return null
              }

              private fun atualizarLocalizacaoAtual() {
                  tvLocalizacaoAtual.text = if (localizacaoAtual.isBlank()) {
                      "📍 Nenhuma localização selecionada"
                  } else {
                      "📍 Localização atual: #$localizacaoAtual"
                  }
              }

              private fun atualizarEtapaEntrada() {
