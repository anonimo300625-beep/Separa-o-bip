              private var exportacaoDiagnosticoPendente = ""

              private fun abrirDiagnostico() {
                  DiagnosticLogger.info("DIAGNOSTICO", "Tela de diagnóstico aberta")
                  val resumo = DiagnosticLogger.gerarRelatorio()
                  val preview = resumo.takeLast(12000)

                  // O histórico é a única parte rolável. Os botões ficam fora do
                  // ScrollView para permanecerem sempre visíveis em telefones.
                  val alturaTela = resources.displayMetrics.heightPixels
                  val larguraTela = resources.displayMetrics.widthPixels
                  val alturaDialogo = (alturaTela * 0.86f).toInt()
                  val alturaHistorico = (alturaTela * 0.45f).toInt().coerceAtLeast(240)

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 0, 20, 0)
                  }

                  val descricao = TextView(this).apply {
                      text = "O relatório é armazenado somente neste aparelho até você escolher compartilhar.\n\nVersão: 9.10.7\n\nAbaixo está a parte mais recente do histórico. Para enviar o relatório completo, use COMPARTILHAR RELATÓRIO."
                      textSize = 16f
                      setPadding(0, 0, 0, 12)
                  }

                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          alturaHistorico
                      )
                      isFillViewport = true
                      clipToPadding = false
                  }

                  val texto = TextView(this).apply {
                      text = preview
                      textSize = 12f
                      setPadding(0, 8, 0, 16)
                      setTextIsSelectable(true)
                  }
                  scroll.addView(texto)
                  container.addView(descricao)
                  container.addView(scroll)

                  val dialogo = AlertDialog.Builder(this)
                      .setTitle("Diagnóstico do aplicativo")
                      .setView(container)
                      .setPositiveButton("COMPARTILHAR", null)
                      .setNeutralButton("SALVAR .TXT", null)
                      .setNegativeButton("FECHAR", null)
                      .create()

                  dialogo.setOnShowListener {
                      // Limita a janela ao espaço disponível e impede que o
                      // conteúdo empurre os botões para fora da tela.
                      dialogo.window?.setLayout(
                          (larguraTela * 0.94f).toInt(),
                          alturaDialogo.coerceAtMost((alturaTela * 0.90f).toInt())
                      )

                      dialogo.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                          DiagnosticLogger.info("DIAGNOSTICO", "Relatório compartilhado")
                          DiagnosticLogger.compartilhar(this)
                      }

                      dialogo.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          exportacaoDiagnosticoPendente = DiagnosticLogger.gerarRelatorio()
                          val nome = "diagnostico_reposicao_${SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())}.txt"
                          val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "text/plain"
                              putExtra(Intent.EXTRA_TITLE, nome)
                          }
                          startActivityForResult(intent, REQUEST_EXPORTAR_DIAGNOSTICO)
                      }
                  }

                  dialogo.show()
              }

              private fun abrirEstoqueCaixas() {
                  startActivity(Intent(this, CaixasActivity::class.java))
              }

              private fun selecionarPlanilha() {
                  val intent =
                      Intent(Intent.ACTION_OPEN_DOCUMENT)

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  )

                  intent.type =
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

                  intent.putExtra(
                      Intent.EXTRA_MIME_TYPES,
                      arrayOf(
                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                          "application/vnd.ms-excel.sheet.macroEnabled.12",
                          "application/vnd.ms-excel"
                      )
                  )

                  startActivityForResult(
                      intent,
                      REQUEST_IMPORT_XLSX
                  )
              }

              private fun formatarDataBaseLocal(): String {
                  val quando = getSharedPreferences(PREFS, Context.MODE_PRIVATE).getLong(KEY_BASE_ATUALIZADA_EM, 0L)
                  if (quando <= 0L) return "ainda não sincronizada"
                  return SimpleDateFormat("dd/MM/yyyy HH:mm:ss", Locale.getDefault()).format(Date(quando))
              }

