              private fun configurarCampoEntradaInteligente() {
                  etBipagem.addTextChangedListener(object : TextWatcher {
                      private var alterando = false

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) = Unit
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) = Unit

                      override fun afterTextChanged(editable: Editable?) {
                          if (alterando || codigoPendente.isBlank()) return

                          val original = editable?.toString() ?: return
                          // Na etapa da validade, permite digitação rápida de 4 números:
                          // 0427 -> 04/27. Se o leitor já enviar 04/27, mantém o formato.
                          val numeros = original.filter { it.isDigit() }.take(4)
                          if (numeros.length <= 2) {
                              if (original != numeros) {
                                  alterando = true
                                  etBipagem.setText(numeros)
                                  etBipagem.setSelection(numeros.length)
                                  alterando = false
                              }
                          } else {
                              val formatado = numeros.substring(0, 2) + "/" + numeros.substring(2)
                              if (original != formatado) {
                                  alterando = true
                                  etBipagem.setText(formatado)
                                  etBipagem.setSelection(formatado.length)
                                  alterando = false
                              }
                          }
                      }
                  })
              }

              private fun configurarEntradaParaValidade() {
