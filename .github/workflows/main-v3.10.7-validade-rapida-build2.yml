                      tvEndereco.text = if (consulta.rua.isBlank() && consulta.rack.isBlank() &&
                          consulta.coluna.isBlank() && consulta.linha.isBlank()) {
                          "⚠ Sem endereço cadastrado"
                      } else {
                          "${consulta.rua} — ${consulta.rack}\n" +
                          "Coluna ${consulta.coluna} — Linha ${consulta.linha}"
                      }
                      tvEndereco.textSize = 17f
                      tvEndereco.setTextColor(Color.parseColor("#1565C0"))
                      tvEndereco.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
