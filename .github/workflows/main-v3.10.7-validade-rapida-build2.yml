              private fun atualizarProdutoInformativo(codigo: String) {
                  val descricao = descricoesProdutos[codigo].orEmpty()
                  tvProduto.text = if (descricao.isNotBlank()) {
                      "📦 $codigo\n$descricao"
                  } else {
                      "📦 $codigo\nDescrição não encontrada na base de endereços"
                  }
              }

              private fun mostrarFeedback(texto: String) {
                  tvFeedback.text = texto
                  tvFeedback.visibility = View.VISIBLE
              }

              private fun registrarCaixa(validade: String?) {
                  val local = localizacaoAtual
                  val codigo = codigoPendente
                  if (local.isBlank() || codigo.length != 5) return

                  val agora = System.currentTimeMillis()
                  val caixa = CaixaFechada(
                      id = UUID.randomUUID().toString(),
                      codigo = codigo,
                      descricao = descricoesProdutos[codigo].orEmpty(),
                      localizacao = local,
                      validade = validade ?: "",
                      temValidade = validade != null,
                      validadeOrdem = validade?.let { validadeParaOrdem(it) },
                      dataEntrada = agora,
                      operador = nomeOperador,
                      dispositivo = dispositivoId
                  )
                  val eventoId = UUID.randomUUID().toString()

                  // Primeiro salvamos a entrada COMPLETA no armazenamento local.
                  // Assim a leitura não depende da resposta do Firebase para ser considerada capturada.
                  salvarCaixaPendenteLocal(caixa, eventoId)
                  DiagnosticLogger.info(
                      "ESTOQUE_ENTRADA",
                      "Caixa salva localmente • id=${caixa.id} • evento=$eventoId • codigo=${caixa.codigo} • validade=${caixa.validade.ifBlank { "SEM_VALIDADE" }} • local=#${caixa.localizacao}"
                  )

                  processandoEntrada = false
                  codigoPendente = ""
                  etBipagem.isEnabled = true
                  etBipagem.setText("")
                  tvProduto.text = ""
                  mostrarFeedback(if (caixa.temValidade) {
                      "✅ Caixa ${caixa.codigo} registrada no aparelho • validade ${caixa.validade} • #${caixa.localizacao}\n☁️ Enviando para o Firebase..."
                  } else {
                      "✅ Caixa ${caixa.codigo} registrada no aparelho • sem validade • #${caixa.localizacao}\n☁️ Enviando para o Firebase..."
                  })
                  tocarSomEntradaSucesso()
                  atualizarEtapaEntrada()
                  etBipagem.requestFocus()

                  enviarCaixaPendente(caixa.id)
                  agendarTentativaCaixasPendentes()
              }

              private fun tocarSomEntradaSucesso() {
                  try {
                      val tone = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100)
                      tone.startTone(ToneGenerator.TONE_PROP_ACK, 140)
                      caixasPendentesHandler.postDelayed({ tone.release() }, 250)
                  } catch (e: Exception) {
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Não foi possível emitir som de confirmação: ${e.message}")
                  }
              }

              private fun salvarCaixaPendenteLocal(caixa: CaixaFechada, eventoId: String) {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val existente = prefs.getString(KEY_CAIXAS_PENDENTES, "[]") ?: "[]"
                  val array = try { JSONArray(existente) } catch (_: Exception) { JSONArray() }
                  val obj = JSONObject().apply {
                      put("id", caixa.id)
                      put("eventoId", eventoId)
                      put("codigo", caixa.codigo)
                      put("descricao", caixa.descricao)
                      put("localizacao", caixa.localizacao)
                      put("validade", caixa.validade)
                      put("temValidade", caixa.temValidade)
                      if (caixa.validadeOrdem != null) put("validadeOrdem", caixa.validadeOrdem) else put("validadeOrdem", JSONObject.NULL)
                      put("dataEntrada", caixa.dataEntrada)
                      put("operador", caixa.operador)
                      put("dispositivo", caixa.dispositivo)
                      put("status", caixa.status)
                  }
                  array.put(obj)
                  prefs.edit().putString(KEY_CAIXAS_PENDENTES, array.toString()).apply()
              }

              private fun carregarEEnviarCaixasPendentes() {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val texto = prefs.getString(KEY_CAIXAS_PENDENTES, "[]") ?: "[]"
                  val array = try { JSONArray(texto) } catch (_: Exception) { JSONArray() }
                  var quantidade = 0
                  for (i in 0 until array.length()) {
                      val obj = array.optJSONObject(i) ?: continue
                      val caixaId = obj.optString("id")
                      if (caixaId.isBlank()) continue
                      quantidade++
                      enviarCaixaPendente(caixaId)
                  }
                  if (quantidade > 0) {
                      mostrarFeedback("☁️ $quantidade caixa(s) aguardando sincronização com o Firebase.")
                      agendarTentativaCaixasPendentes()
                  }
              }

              private fun obterCaixaPendenteLocal(caixaId: String): JSONObject? {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val texto = prefs.getString(KEY_CAIXAS_PENDENTES, "[]") ?: "[]"
                  val array = try { JSONArray(texto) } catch (_: Exception) { JSONArray() }
                  for (i in 0 until array.length()) {
                      val obj = array.optJSONObject(i) ?: continue
                      if (obj.optString("id") == caixaId) return obj
                  }
                  return null
              }

              private fun removerCaixaPendenteLocal(caixaId: String) {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val texto = prefs.getString(KEY_CAIXAS_PENDENTES, "[]") ?: "[]"
                  val array = try { JSONArray(texto) } catch (_: Exception) { JSONArray() }
                  val novo = JSONArray()
                  for (i in 0 until array.length()) {
                      val obj = array.optJSONObject(i) ?: continue
                      if (obj.optString("id") != caixaId) novo.put(obj)
                  }
                  prefs.edit().putString(KEY_CAIXAS_PENDENTES, novo.toString()).apply()
              }

              private fun enviarCaixaPendente(caixaId: String) {
                  if (!caixasPendentesEmEnvio.add(caixaId)) return
                  val obj = obterCaixaPendenteLocal(caixaId)
                  if (obj == null) {
                      caixasPendentesEmEnvio.remove(caixaId)
                      return
                  }

                  val eventoId = obj.optString("eventoId").ifBlank { UUID.randomUUID().toString() }
                  val dados = hashMapOf<String, Any?>(
                      "id" to obj.optString("id"),
                      "codigo" to obj.optString("codigo"),
                      "descricao" to obj.optString("descricao"),
                      "localizacao" to obj.optString("localizacao"),
                      "validade" to obj.optString("validade"),
                      "temValidade" to obj.optBoolean("temValidade", false),
                      "validadeOrdem" to if (obj.isNull("validadeOrdem")) null else obj.optInt("validadeOrdem"),
                      "dataEntrada" to obj.optLong("dataEntrada"),
                      "operador" to obj.optString("operador"),
                      "dispositivo" to obj.optString("dispositivo"),
                      "status" to obj.optString("status", STATUS_DISPONIVEL)
                  )
                  val historico = hashMapOf<String, Any?>(
                      "id" to eventoId,
                      "caixaId" to obj.optString("id"),
                      "codigo" to obj.optString("codigo"),
                      "descricao" to obj.optString("descricao"),
                      "localizacao" to obj.optString("localizacao"),
                      "validade" to obj.optString("validade"),
                      "temValidade" to obj.optBoolean("temValidade", false),
                      "tipo" to "ENTRADA",
                      "statusAnterior" to "",
                      "statusNovo" to STATUS_DISPONIVEL,
                      "timestamp" to obj.optLong("dataEntrada"),
                      "operador" to obj.optString("operador"),
                      "dispositivo" to obj.optString("dispositivo"),
                      "observacao" to "Caixa cadastrada no estoque"
                  )

                  db.runBatch { batch ->
                      batch.set(db.collection(COLECAO_CAIXAS).document(obj.optString("id")), dados)
                      batch.set(db.collection(COLECAO_HISTORICO_CAIXAS).document(eventoId), historico)
                  }.addOnSuccessListener {
                      removerCaixaPendenteLocal(caixaId)
                      caixasPendentesEmEnvio.remove(caixaId)
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Sincronização Firebase confirmada • id=$caixaId • evento=$eventoId")
                      mostrarFeedback("☁️ Caixa ${obj.optString("codigo")} sincronizada com o Firebase • #${obj.optString("localizacao")}")
                  }.addOnFailureListener { e ->
                      caixasPendentesEmEnvio.remove(caixaId)
                      DiagnosticLogger.firebase(
                          "caixas_fechadas.sincronizacao_pendente",
                          e,
                          "id=$caixaId • codigo=${obj.optString("codigo")} • validade=${obj.optString("validade").ifBlank { "SEM_VALIDADE" }} • local=#${obj.optString("localizacao")}"
                      )
                      agendarTentativaCaixasPendentes()
                  }
              }

              private fun agendarTentativaCaixasPendentes() {
                  caixasPendentesHandler.removeCallbacksAndMessages(null)
                  caixasPendentesHandler.postDelayed({
                      carregarEEnviarCaixasPendentes()
                  }, 15000L)
              }

              private fun confirmarSemValidade() {
                  if (localizacaoAtual.isBlank()) {
                      Toast.makeText(this, "Primeiro bipe a localização.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (codigoPendente.isBlank()) {
                      Toast.makeText(this, "Primeiro bipe o código da caixa.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Registrar sem validade?")
                      .setMessage("Esta é uma exceção. Use somente para produtos que realmente não possuem validade.\n\nCódigo: $codigoPendente")
                      .setNegativeButton("VOLTAR", null)
                      .setPositiveButton("REGISTRAR SEM VALIDADE") { _, _ -> registrarCaixa(null) }
                      .show()
              }

              private fun iniciarSincronizacaoCaixas() {
                  caixasListener?.remove()
                  caixasListener = db.collection(COLECAO_CAIXAS)
                      .whereEqualTo("status", STATUS_DISPONIVEL)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) return@addSnapshotListener
                          caixas.clear()
                          for (doc in snapshot.documents) {
                              caixas.add(
                                  CaixaFechada(
                                      id = doc.getString("id") ?: doc.id,
                                      codigo = doc.getString("codigo") ?: "",
                                      descricao = doc.getString("descricao") ?: descricoesProdutos[doc.getString("codigo").orEmpty()].orEmpty(),
                                      localizacao = doc.getString("localizacao") ?: "",
                                      validade = doc.getString("validade") ?: "",
                                      temValidade = doc.getBoolean("temValidade") ?: false,
                                      validadeOrdem = doc.getLong("validadeOrdem")?.toInt(),
                                      dataEntrada = doc.getLong("dataEntrada") ?: 0L,
                                      operador = doc.getString("operador") ?: "",
                                      dispositivo = doc.getString("dispositivo") ?: "",
                                      status = doc.getString("status") ?: STATUS_DISPONIVEL
                                  )
                              )
                          }
                          tvQuantidadeEstoque.text = "${caixas.size} caixas • ${caixas.map { it.codigo }.distinct().size} códigos"
                          if (modoEstoque) atualizarListaEstoque()
                      }
              }

              private fun abrirFiltrosEstoque() {
                  val locais = listOf("todos") + caixas.map { it.localizacao }.filter { it.isNotBlank() }.distinct().sortedWith(compareBy<String> { it.toIntOrNull() ?: Int.MAX_VALUE }.thenBy { it })
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 10, 40, 0)
                  }

                  val spValidade = Spinner(this)
                  spValidade.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, listOf("Todos", "Somente com validade", "Somente sem validade"))
                  spValidade.setSelection(when (filtroValidade) { "com" -> 1; "sem" -> 2; else -> 0 })
                  layout.addView(TextView(this).apply { text = "Tipo de validade"; setPadding(0, 10, 0, 4) })
                  layout.addView(spValidade)

                  val spProximidade = Spinner(this)
                  spProximidade.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, listOf(
                      "Todas",
                      "Vencidas",
                      "Vencem em até 6 meses",
                      "Vencem em 7 a 12 meses",
                      "Vencem em 14 a 24 meses"
                  ))
                  spProximidade.setSelection(when (filtroProximidade) {
                      "vencidas" -> 1
                      "ate6" -> 2
                      "7a12" -> 3
                      "14a24" -> 4
                      else -> 0
                  })
                  layout.addView(TextView(this).apply { text = "Proximidade da validade"; setPadding(0, 14, 0, 4) })
                  layout.addView(spProximidade)

                  val spLocal = Spinner(this)
                  spLocal.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, locais.map { if (it == "todos") "Todas as localizações" else "#$it" })
                  spLocal.setSelection(locais.indexOf(filtroLocalizacao).coerceAtLeast(0))
                  layout.addView(TextView(this).apply { text = "Localização"; setPadding(0, 14, 0, 4) })
                  layout.addView(spLocal)

                  layout.addView(TextView(this).apply { text = "Código"; setPadding(0, 14, 0, 4) })
                  val etCodigo = EditText(this).apply {
                      hint = "Digite o código (ex.: 96294)"
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER
                      setSingleLine(true)
                      setText(if (filtroCodigo == "todos") "" else filtroCodigo)
                      selectAll()
                  }
                  layout.addView(etCodigo)

                  val spOrdenacao = Spinner(this)
                  spOrdenacao.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, listOf("FEFO — validade mais próxima", "Código", "Localização", "Entrada mais recente"))
                  spOrdenacao.setSelection(when (ordenacao) { "codigo" -> 1; "local" -> 2; "entrada" -> 3; else -> 0 })
                  layout.addView(TextView(this).apply { text = "Ordenar registros dentro das localizações"; setPadding(0, 14, 0, 4) })
                  layout.addView(spOrdenacao)

                  AlertDialog.Builder(this)
                      .setTitle("Filtros do estoque")
                      .setView(layout)
                      .setNegativeButton("CANCELAR", null)
                      .setNeutralButton("LIMPAR") { _, _ ->
                          filtroValidade = "todos"
                          filtroProximidade = "todas"
                          filtroLocalizacao = "todos"
                          filtroCodigo = "todos"
                          ordenacao = "fefo"
                          atualizarTextoFiltro()
                          atualizarListaEstoque()
                      }
                      .setPositiveButton("APLICAR") { _, _ ->
                          filtroValidade = when (spValidade.selectedItemPosition) { 1 -> "com"; 2 -> "sem"; else -> "todos" }
                          filtroProximidade = when (spProximidade.selectedItemPosition) {
                              1 -> "vencidas"
                              2 -> "ate6"
                              3 -> "7a12"
                              4 -> "14a24"
                              else -> "todas"
                          }
                          filtroLocalizacao = locais[spLocal.selectedItemPosition.coerceIn(0, locais.lastIndex)]
                          val codigoDigitado = etCodigo.text.toString().trim().filter { it.isDigit() }
                          filtroCodigo = if (codigoDigitado.isBlank()) "todos" else codigoDigitado
                          ordenacao = when (spOrdenacao.selectedItemPosition) { 1 -> "codigo"; 2 -> "local"; 3 -> "entrada"; else -> "fefo" }
                          atualizarTextoFiltro()
                          atualizarListaEstoque()
                      }
                      .show()
              }

              private fun atualizarTextoFiltro() {
                  val validadeTexto = when (filtroValidade) { "com" -> "Com validade"; "sem" -> "Sem validade"; else -> "Todos" }
                  val proximidadeTexto = when (filtroProximidade) {
                      "vencidas" -> "Vencidas"
                      "ate6" -> "Até 6 meses"
                      "7a12" -> "7–12 meses"
                      "14a24" -> "14–24 meses"
                      else -> "Todas"
                  }
                  val localTexto = if (filtroLocalizacao == "todos") "Todas" else "#${filtroLocalizacao}"
                  val codigoTexto = if (filtroCodigo == "todos") "Todos" else "Código: $filtroCodigo"
                  val ordemTexto = when (ordenacao) { "codigo" -> "Código"; "local" -> "Localização"; "entrada" -> "Entrada"; else -> "FEFO" }
                  tvFiltroEstoque.text = "Filtros: $validadeTexto • $proximidadeTexto • $localTexto • $codigoTexto\nOrdenação interna: $ordemTexto"
              }

              private fun atualizarListaEstoque() {
                  containerListaCaixas.removeAllViews()
                  val agora = Date()
                  val cal = java.util.Calendar.getInstance()
                  cal.time = agora
                  val anoAtual = cal.get(java.util.Calendar.YEAR)
                  val mesAtualNumero = cal.get(java.util.Calendar.MONTH) + 1
                  val mesAtual = anoAtual * 12 + mesAtualNumero
                  val cal6 = cal.clone() as java.util.Calendar
                  cal6.add(java.util.Calendar.MONTH, 6)
                  val limite6 = cal6.get(java.util.Calendar.YEAR) * 12 + (cal6.get(java.util.Calendar.MONTH) + 1)
                  val cal12 = cal.clone() as java.util.Calendar
                  cal12.add(java.util.Calendar.MONTH, 12)
                  val limite12 = cal12.get(java.util.Calendar.YEAR) * 12 + (cal12.get(java.util.Calendar.MONTH) + 1)
                  val cal13 = cal.clone() as java.util.Calendar
                  cal13.add(java.util.Calendar.MONTH, 13)
                  val limite13 = cal13.get(java.util.Calendar.YEAR) * 12 + (cal13.get(java.util.Calendar.MONTH) + 1)
                  val cal24 = cal.clone() as java.util.Calendar
                  cal24.add(java.util.Calendar.MONTH, 24)
                  val limite24 = cal24.get(java.util.Calendar.YEAR) * 12 + (cal24.get(java.util.Calendar.MONTH) + 1)

                  val filtradas = caixas.filter {
                      val passaValidade = when (filtroValidade) { "com" -> it.temValidade; "sem" -> !it.temValidade; else -> true }
                      val validadeMes = if (it.temValidade) {
                          val ordem = it.validadeOrdem ?: Int.MAX_VALUE
                          if (ordem == Int.MAX_VALUE) null else {
                              val ano = ordem / 100
                              val mes = ordem % 100
                              ano * 12 + mes
                          }
                      } else null
                      val passaProximidade = when (filtroProximidade) {
                          "vencidas" -> it.temValidade && (validadeMes ?: Int.MAX_VALUE) < mesAtual
                          "ate6" -> it.temValidade && (validadeMes ?: Int.MAX_VALUE) in mesAtual..limite6
                          "7a12" -> it.temValidade && (validadeMes ?: Int.MIN_VALUE) > limite6 && (validadeMes ?: Int.MIN_VALUE) <= limite12
                          "14a24" -> it.temValidade && (validadeMes ?: Int.MIN_VALUE) > limite13 && (validadeMes ?: Int.MIN_VALUE) <= limite24
                          else -> true
                      }
                      val passaLocal = filtroLocalizacao == "todos" || it.localizacao == filtroLocalizacao
                      val passaCodigo = filtroCodigo == "todos" || it.codigo.contains(filtroCodigo)
                      passaValidade && passaProximidade && passaLocal && passaCodigo
                  }

                  val ordenadas = when (ordenacao) {
                      "codigo" -> filtradas.sortedWith(compareBy<CaixaFechada> { it.codigo }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE }.thenBy { it.localizacao })
                      "local" -> filtradas.sortedWith(compareBy<CaixaFechada> { it.localizacao }.thenBy { it.codigo }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE })
                      "entrada" -> filtradas.sortedByDescending { it.dataEntrada }
                      else -> filtradas.sortedWith(compareBy<CaixaFechada> { if (it.temValidade) 0 else 1 }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE }.thenBy { it.codigo }.thenBy { it.localizacao })
                  }

                  if (ordenadas.isEmpty()) {
                      containerListaCaixas.addView(TextView(this).apply {
                          text = "Nenhuma caixa encontrada com os filtros atuais."
                          textSize = 16f
                          setTextColor(Color.parseColor("#757575"))
                          setPadding(20, 40, 20, 40)
                          gravity = Gravity.CENTER
                      })
                      return
                  }

                  // O estoque é apresentado agrupado por localização.
                  // Os filtros continuam valendo, mas o botão de refazer sempre atua
                  // sobre TODOS os registros disponíveis daquela localização.
                  val grupos = ordenadas.groupBy { it.localizacao }
                  // As localizações são sempre apresentadas da menor para a maior.
                  // A ordenação escolhida nos filtros vale apenas para os registros dentro de cada localização.
                  val locaisOrdenados = grupos.keys.sortedWith(
                      compareBy<String> { it.toIntOrNull() ?: Int.MAX_VALUE }.thenBy { it }
                  )

                  for (local in locaisOrdenados) {
                      val grupo = grupos[local].orEmpty()
                      val grupoOrdenado = when (ordenacao) {
                          "codigo" -> grupo.sortedWith(compareBy<CaixaFechada> { it.codigo }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE })
                          "entrada" -> grupo.sortedByDescending { it.dataEntrada }
                          else -> grupo.sortedWith(
                              compareBy<CaixaFechada> { if (it.temValidade) 0 else 1 }
                                  .thenBy { it.validadeOrdem ?: Int.MAX_VALUE }
                                  .thenBy { it.codigo }
                          )
                      }
                      adicionarCabecalhoLocalizacao(local, grupo, grupoOrdenado, ordenacao == "fefo")
                  }
              }

              private fun adicionarCabecalhoLocalizacao(localizacao: String, grupo: List<CaixaFechada>, caixasDoGrupo: List<CaixaFechada>, destacarFefo: Boolean) {
                  val bloco = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(0, 10, 0, 0)
                      }
                  }

                  val conteudo = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding(0, 0, 0, 4)
                  }

                  val cabecalho = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(14, 12, 6, 12)
                      setBackgroundColor(Color.parseColor("#E8EEF7"))
                  }

                  val titulo = TextView(this).apply {
                      text = "▶  #$localizacao  •  ${grupo.size} caixa${if (grupo.size == 1) "" else "s"}"
                      textSize = 17f
                      setTextColor(Color.parseColor("#1565C0"))
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  cabecalho.addView(titulo)

                  val menu = TextView(this).apply {
                      text = "⋮"
                      textSize = 30f
                      setTextColor(Color.parseColor("#424242"))
                      gravity = Gravity.CENTER
                      contentDescription = "Opções da localização #$localizacao"
                      isClickable = true
                      isFocusable = true
                      minWidth = 56
                      minHeight = 56
                      layoutParams = LinearLayout.LayoutParams(56, 56)
                      setPadding(0, 0, 0, 0)
                      setBackgroundResource(android.R.drawable.btn_default)
                      setOnClickListener {
                          DiagnosticLogger.info("ESTOQUE_MENU", "Menu da localização aberto • local=#$localizacao")
                          abrirMenuLocalizacao(this, localizacao)
                      }
                  }
                  cabecalho.addView(menu)

                  for (caixa in caixasDoGrupo) {
                      adicionarCardCaixa(caixa, destacarFefo, conteudo)
                  }

                  cabecalho.setOnClickListener {
                      val expandido = conteudo.visibility == View.VISIBLE
                      conteudo.visibility = if (expandido) View.GONE else View.VISIBLE
                      titulo.text = "${if (expandido) "▶" else "▼"}  #$localizacao  •  ${grupo.size} caixa${if (grupo.size == 1) "" else "s"}"
                  }

                  bloco.addView(cabecalho)
                  bloco.addView(conteudo)
                  containerListaCaixas.addView(bloco)
              }

              private fun abrirMenuLocalizacao(anchor: View, localizacao: String) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add("Refazer esta localização")
                  popup.setOnMenuItemClickListener { item ->
                      if (item.title.toString() == "Refazer esta localização") {
                          confirmarRefazerLocalizacao(localizacao)
                          true
                      } else false
                  }
                  popup.show()
              }

              private fun confirmarRefazerLocalizacao(localizacao: String) {
                  val quantidadeReal = caixas.count { it.localizacao == localizacao }
                  AlertDialog.Builder(this)
                      .setTitle("Refazer localização #$localizacao?")
                      .setMessage(
                          "Esta ação removerá do estoque todos os registros da localização #$localizacao " +
                              "($quantidadeReal caixa${if (quantidadeReal == 1) "" else "s"}).\n\n" +
                              "Depois disso, a localização ficará selecionada na entrada para você bipar novamente todas as caixas.\n\n" +
                              "As outras localizações não serão alteradas."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("REFazer LOCALIZAÇÃO") { _, _ -> refazerLocalizacao(localizacao) }
                      .show()
              }

              private fun refazerLocalizacao(localizacao: String) {
                  val registros = caixas.filter { it.localizacao == localizacao }
                  if (registros.isEmpty()) {
                      iniciarNovaEntradaNaLocalizacao(localizacao)
                      return
                  }

                  // V3.10: nunca apagar fisicamente caixas ao refazer uma localização.
                  // O registro atual vira CANCELADA e permanece consultável no histórico.
                  val agora = System.currentTimeMillis()
                  // Cada lote tem no máximo 200 caixas. Para cada caixa gravamos a atualização
                  // atual + o evento de histórico no MESMO WriteBatch, evitando deixar a caixa
                  // cancelada sem o respectivo evento de auditoria.
                  val batches = registros.chunked(200).map { grupo ->
                      db.batch().apply {
                          grupo.forEach { caixa ->
                              update(
                                  db.collection(COLECAO_CAIXAS).document(caixa.id),
                                  mapOf(
                                      "status" to STATUS_CANCELADA,
                                      "canceladaEm" to agora,
                                      "canceladaPor" to nomeOperador,
                                      "canceladaDispositivo" to dispositivoId,
                                      "motivoCancelamento" to "Refazer localização #$localizacao"
                                  )
                              )

                              val eventoId = UUID.randomUUID().toString()
                              set(
                                  db.collection(COLECAO_HISTORICO_CAIXAS).document(eventoId),
                                  hashMapOf<String, Any?>(
                                      "id" to eventoId,
                                      "caixaId" to caixa.id,
                                      "codigo" to caixa.codigo,
                                      "descricao" to caixa.descricao,
                                      "localizacao" to caixa.localizacao,
                                      "validade" to caixa.validade,
                                      "temValidade" to caixa.temValidade,
                                      "tipo" to "CANCELAMENTO",
                                      "statusAnterior" to caixa.status,
                                      "statusNovo" to STATUS_CANCELADA,
                                      "timestamp" to agora,
                                      "operador" to nomeOperador,
                                      "dispositivo" to dispositivoId,
                                      "observacao" to "Localização #$localizacao marcada para refazer a conferência"
                                  )
                              )
                          }
                      }
                  }

                  fun executar(indice: Int) {
                      if (indice >= batches.size) {
                          Toast.makeText(this, "Localização #$localizacao limpa. O histórico das caixas foi preservado. Refaça a bipagem de todas as caixas.", Toast.LENGTH_LONG).show()
                          iniciarNovaEntradaNaLocalizacao(localizacao)
                          return
                      }
                      batches[indice].commit()
                          .addOnSuccessListener { executar(indice + 1) }
                          .addOnFailureListener { e ->
                              DiagnosticLogger.firebase("caixas_fechadas.refazer_localizacao", e, "localização=$localizacao")
                              Toast.makeText(this, "Não foi possível refazer a localização: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                  }
                  executar(0)
              }

              private fun iniciarNovaEntradaNaLocalizacao(localizacao: String) {
                  localizacaoAtual = localizacao
                  codigoPendente = ""
                  etBipagem.setText("")
                  tvProduto.text = ""
                  mostrarFeedback("📍 #$localizacao pronta para nova conferência. Bipe todas as caixas desta localização.")
                  modoEstoque = false
                  atualizarTelaEntrada()
                  etBipagem.requestFocus()
              }

              private fun adicionarCardCaixa(caixa: CaixaFechada, destacarFefo: Boolean, destino: LinearLayout = containerListaCaixas) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 14, 12, 14)
                      setBackgroundColor(Color.WHITE)
                  }
                  card.layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 5, 0, 5) }

                  val topo = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titulo = TextView(this).apply {
                      text = caixa.codigo
                      textSize = 19f
                      setTextColor(Color.parseColor("#1565C0"))
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  topo.addView(titulo)

                  val menu = TextView(this).apply {
                      text = "⋮"
                      textSize = 30f
                      setTextColor(Color.parseColor("#424242"))
                      gravity = Gravity.CENTER
                      contentDescription = "Mais opções da caixa ${caixa.codigo}"
                      isClickable = true
                      isFocusable = true
                      minWidth = 56
                      minHeight = 56
                      layoutParams = LinearLayout.LayoutParams(56, 56)
                      setPadding(0, 0, 0, 0)
                      setBackgroundResource(android.R.drawable.btn_default)
                      setOnClickListener {
                          DiagnosticLogger.info("ESTOQUE_MENU", "Menu da caixa aberto • id=${caixa.id} • codigo=${caixa.codigo} • local=#${caixa.localizacao}")
                          abrirMenuCaixa(this, caixa)
                      }
                  }
                  topo.addView(menu)
                  card.addView(topo)

                  val descricao = caixa.descricao.ifBlank { descricoesProdutos[caixa.codigo].orEmpty() }
                  if (descricao.isNotBlank()) {
                      card.addView(TextView(this).apply {
                          text = descricao
                          textSize = 14f
                          setTextColor(Color.parseColor("#555555"))
                          setPadding(0, 1, 0, 6)
                      })
                  }

                  val validadeTexto = if (caixa.temValidade) {
                      if (destacarFefo) "📅 Validade: ${caixa.validade} • FEFO" else "📅 Validade: ${caixa.validade}"
                  } else "📅 Sem validade"
                  card.addView(TextView(this).apply {
                      text = validadeTexto
                      textSize = 15f
                      setTextColor(Color.parseColor("#333333"))
                      setPadding(0, 1, 0, 2)
                  })
                  card.addView(TextView(this).apply {
                      text = "📍 #${caixa.localizacao}"
                      textSize = 15f
                      setTextColor(Color.parseColor("#333333"))
                  })
                  destino.addView(card)
              }

              private fun abrirMenuCaixa(anchor: View, caixa: CaixaFechada) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add("Detalhes do registro")
                  popup.menu.add("Histórico desta caixa")
                  popup.menu.add("Excluir")
                  popup.setOnMenuItemClickListener { item ->
                      when (item.title.toString()) {
                          "Detalhes do registro" -> { DiagnosticLogger.info("ESTOQUE_MENU", "Ação: detalhes • caixa=${caixa.id}"); mostrarDetalhesCaixa(caixa); true }
                          "Histórico desta caixa" -> { DiagnosticLogger.info("ESTOQUE_MENU", "Ação: histórico • caixa=${caixa.id}"); mostrarHistoricoDaCaixa(caixa); true }
                          "Excluir" -> { DiagnosticLogger.info("ESTOQUE_MENU", "Ação: excluir • caixa=${caixa.id}"); confirmarExcluir(caixa); true }
                          else -> false
                      }
                  }
                  popup.show()
              }

              private fun mostrarDetalhesCaixa(caixa: CaixaFechada) {
                  val descricao = caixa.descricao.ifBlank { descricoesProdutos[caixa.codigo].orEmpty() }.ifBlank { "Não encontrada" }
                  val validade = if (caixa.temValidade) caixa.validade else "Sem validade"
                  val texto = "Código: ${caixa.codigo}\n" +
                      "Descrição: $descricao\n" +
                      "Validade: $validade\n" +
                      "Localização: #${caixa.localizacao}\n" +
                      "Registrado por: ${caixa.operador.ifBlank { "Não informado" }}\n" +
                      "Data/hora: ${formatarData(caixa.dataEntrada)}\n" +
                      "Dispositivo: ${caixa.dispositivo.ifBlank { "Não informado" }}\n" +
                      "Status: ${formatarStatusCaixa(caixa.status)}"
                  AlertDialog.Builder(this)
                      .setTitle("Detalhes da caixa")
                      .setMessage(texto)
                      .setPositiveButton("FECHAR", null)
                      .show()
              }

              private fun mostrarHistoricoDaCaixa(caixa: CaixaFechada) {
                  db.collection(COLECAO_HISTORICO_CAIXAS)
                      .whereEqualTo("caixaId", caixa.id)
                      .limit(LIMITE_HISTORICO.toLong())
                      .get()
                      .addOnSuccessListener { snapshot ->
                          if (snapshot.isEmpty) {
                              AlertDialog.Builder(this)
                                  .setTitle("Histórico da caixa ${caixa.codigo}")
                                  .setMessage("Nenhuma movimentação registrada para esta caixa.")
                                  .setPositiveButton("FECHAR", null)
                                  .show()
                              return@addOnSuccessListener
                          }

                          val itens = snapshot.documents
                              .sortedByDescending { it.getLong("timestamp") ?: 0L }
                              .map { doc ->
                              val tipo = formatarTipoMovimentacao(doc.getString("tipo").orEmpty())
                              val anterior = doc.getString("statusAnterior").orEmpty()
                              val novo = doc.getString("statusNovo").orEmpty()
                              val transicao = if (anterior.isBlank()) formatarStatusCaixa(novo) else "${formatarStatusCaixa(anterior)} → ${formatarStatusCaixa(novo)}"
                              val quando = formatarData(doc.getLong("timestamp") ?: 0L)
                              val operador = doc.getString("operador").orEmpty().ifBlank { "Não informado" }
                              val observacao = doc.getString("observacao").orEmpty()
                              "$tipo\n$transicao • $quando\n$operador\n$observacao"
                          }

                          AlertDialog.Builder(this)
                              .setTitle("Histórico da caixa ${caixa.codigo}")
                              .setItems(itens.toTypedArray(), null)
                              .setPositiveButton("FECHAR", null)
                              .show()
                      }
                      .addOnFailureListener { e ->
                          DiagnosticLogger.firebase("movimentacoes_caixas.historico", e, "caixa=${caixa.id}")
                          Toast.makeText(this, "Erro ao carregar histórico da caixa: ${e.message}", Toast.LENGTH_LONG).show()
                      }
              }

              private fun confirmarExcluir(caixa: CaixaFechada) {
                  AlertDialog.Builder(this)
                      .setTitle("Excluir caixa?")
                      .setMessage("Código: ${caixa.codigo}\nLocal: #${caixa.localizacao}\n" + (if (caixa.temValidade) "Validade: ${caixa.validade}" else "Sem validade") + "\n\nUse somente para corrigir um cadastro feito por engano.")
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("EXCLUIR") { _, _ ->
                          val atualizacao = hashMapOf<String, Any>(
                              "status" to STATUS_CANCELADA,
                              "canceladaEm" to System.currentTimeMillis(),
                              "canceladaPor" to nomeOperador,
                              "canceladaDispositivo" to dispositivoId
                          )
                          db.collection(COLECAO_CAIXAS).document(caixa.id).update(atualizacao)
                              .addOnSuccessListener {
                                  registrarMovimentacaoCaixa(
                                      caixa = caixa,
                                      tipo = "CANCELAMENTO",
                                      statusAnterior = caixa.status,
                                      statusNovo = STATUS_CANCELADA,
                                      observacao = "Cadastro cancelado pelo operador"
                                  )
                                  Toast.makeText(this, "Caixa cancelada e mantida no histórico.", Toast.LENGTH_SHORT).show()
                              }
                              .addOnFailureListener { e -> DiagnosticLogger.firebase("caixas_fechadas.cancelar", e, "caixa=${caixa.id}"); Toast.makeText(this, "Erro ao cancelar: ${e.message}", Toast.LENGTH_LONG).show() }
                      }
                      .show()
              }

              private fun formatarStatusCaixa(status: String): String = when (status) {
                  STATUS_DISPONIVEL -> "DISPONÍVEL"
                  STATUS_RESERVADA -> "RESERVADA"
                  STATUS_EM_TRANSFERENCIA -> "EM TRANSFERÊNCIA"
                  STATUS_NA_SEPARACAO -> "NA SEPARAÇÃO"
                  STATUS_UTILIZADA -> "UTILIZADA"
                  STATUS_CANCELADA -> "CANCELADA"
                  else -> status
              }

              private fun registrarMovimentacaoCaixa(
                  caixa: CaixaFechada,
                  tipo: String,
                  statusAnterior: String,
                  statusNovo: String,
                  observacao: String
              ) {
                  val eventoId = UUID.randomUUID().toString()
                  val agora = System.currentTimeMillis()
                  val dados = hashMapOf<String, Any?>(
                      "id" to eventoId,
                      "caixaId" to caixa.id,
                      "codigo" to caixa.codigo,
                      "descricao" to caixa.descricao,
                      "localizacao" to caixa.localizacao,
                      "validade" to caixa.validade,
                      "temValidade" to caixa.temValidade,
                      "tipo" to tipo,
                      "statusAnterior" to statusAnterior,
                      "statusNovo" to statusNovo,
                      "timestamp" to agora,
                      "operador" to nomeOperador,
                      "dispositivo" to dispositivoId,
                      "observacao" to observacao
                  )
                  db.collection(COLECAO_HISTORICO_CAIXAS).document(eventoId).set(dados)
              }

              private fun mostrarHistoricoCaixas() {
                  db.collection(COLECAO_HISTORICO_CAIXAS)
                      .orderBy("timestamp", com.google.firebase.firestore.Query.Direction.DESCENDING)
                      .limit(LIMITE_HISTORICO.toLong())
                      .get()
                      .addOnSuccessListener { snapshot ->
                          if (snapshot.isEmpty) {
                              AlertDialog.Builder(this)
                                  .setTitle("Histórico de caixas")
                                  .setMessage("Nenhuma movimentação registrada ainda.")
                                  .setPositiveButton("FECHAR", null)
                                  .show()
                              return@addOnSuccessListener
                          }

                          val itens = snapshot.documents.map { doc ->
                              val codigo = doc.getString("codigo").orEmpty()
                              val tipo = doc.getString("tipo").orEmpty()
                              val local = doc.getString("localizacao").orEmpty()
                              val anterior = doc.getString("statusAnterior").orEmpty()
                              val novo = doc.getString("statusNovo").orEmpty()
                              val operador = doc.getString("operador").orEmpty()
                              val quando = formatarData(doc.getLong("timestamp") ?: 0L)
                              val descricao = doc.getString("observacao").orEmpty()
                              val transicao = if (anterior.isBlank()) novo else "$anterior → $novo"
                              "${formatarTipoMovimentacao(tipo)} • $codigo • #$local\n$transicao • $quando\n$operador\n$descricao"
                          }

                          AlertDialog.Builder(this)
                              .setTitle("Histórico de caixas • ${snapshot.size()} eventos")
                              .setItems(itens.toTypedArray(), null)
                              .setPositiveButton("FECHAR", null)
                              .show()
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(this, "Erro ao carregar histórico: ${e.message}", Toast.LENGTH_LONG).show()
                      }
              }

              private fun formatarTipoMovimentacao(tipo: String): String = when (tipo) {
                  "ENTRADA" -> "📥 ENTRADA"
                  "CANCELAMENTO" -> "🛑 CANCELAMENTO"
                  "RESERVA" -> "📌 RESERVA"
                  "TRANSFERENCIA" -> "🚚 TRANSFERÊNCIA"
                  "SEPARACAO" -> "📦 SEPARAÇÃO"
                  "UTILIZACAO" -> "✅ UTILIZAÇÃO"
                  else -> tipo.ifBlank { "MOVIMENTAÇÃO" }
              }

              private fun exportarEstoqueCompleto() {
                  if (caixas.isEmpty()) {
                      Toast.makeText(this, "Não há caixas disponíveis para exportar.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val porCodigo = caixas.groupBy { it.codigo }
                  val linhas = mutableListOf<String>()
                  linhas.add("Código;Descrição;Validade da caixa;Tem validade;Localização;Quantidade de caixas do código;Validade mais próxima do código;Localização FEFO;Registrado por;Data de entrada")
                  val caixasOrdenadas = caixas.sortedWith(compareBy<CaixaFechada> { it.codigo }.thenBy { if (it.temValidade) 0 else 1 }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE }.thenBy { it.localizacao })
                  for (caixa in caixasOrdenadas) {
                      val grupo = porCodigo[caixa.codigo].orEmpty()
                      val comValidade = grupo.filter { it.temValidade && it.validadeOrdem != null }
                      val primeira = comValidade.minWithOrNull(compareBy<CaixaFechada> { it.validadeOrdem }.thenBy { it.localizacao })
                      val validadeMaisProxima = primeira?.validade ?: "Sem validade"
                      val localFefo = primeira?.localizacao?.let { "#$it" } ?: "-"
                      val descricao = caixa.descricao.ifBlank { descricoesProdutos[caixa.codigo].orEmpty() }
                      linhas.add(listOf(
                          caixa.codigo,
                          descricao,
                          if (caixa.temValidade) caixa.validade else "Sem validade",
                          if (caixa.temValidade) "SIM" else "NÃO",
                          "#${caixa.localizacao}",
                          grupo.size.toString(),
                          validadeMaisProxima,
                          localFefo,
                          caixa.operador,
                          formatarData(caixa.dataEntrada)
                      ).joinToString(";") { escaparCsv(it) })
                  }
                  exportacaoPendente = linhas.joinToString("\n")
                  val nome = "estoque_caixas_${SimpleDateFormat("yyyyMMdd_HHmm", Locale.getDefault()).format(Date())}.csv"
                  val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "text/csv"
                      putExtra(Intent.EXTRA_TITLE, nome)
                  }
                  startActivityForResult(intent, REQUEST_EXPORTAR)
              }

              private var exportacaoPendente = ""

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQUEST_EXPORTAR && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          contentResolver.openOutputStream(uri)?.use { output ->
                              output.write(byteArrayOf(0xEF.toByte(), 0xBB.toByte(), 0xBF.toByte()))
                              output.write(exportacaoPendente.toByteArray(Charsets.UTF_8))
                          }
                          Toast.makeText(this, "Estoque exportado com sucesso.", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Erro ao exportar: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun escaparCsv(valor: String): String {
                  return if (valor.contains(";") || valor.contains("\"") || valor.contains("\n")) "\"${valor.replace("\"", "\"\"")}\"" else valor
              }

              private fun extrairCodigo(valor: String): String {
                  val numeros = valor.filter { it.isDigit() }
                  if (numeros.length == 5 && valor.trim().matches(Regex("\\d{5}"))) return numeros
                  if (numeros.length < 6) return ""

                  // Compatibilidade com etiquetas antigas/novas: alguns códigos de barras
                  // carregam o Código Mate de 5 dígitos dentro do EAN/GTIN.
                  // Ex.: 7891033562961 -> janela conhecida 56296.
                  val candidatos = linkedSetOf<String>()
                  for (inicio in 0..(numeros.length - 5)) {
                      val candidato = numeros.substring(inicio, inicio + 5)
                      if (descricoesProdutos.containsKey(candidato)) candidatos.add(candidato)
                  }

                  if (numeros.length == 13) {
                      val legado = numeros.substring(7, 12)
                      if (descricoesProdutos.containsKey(legado)) {
                          DiagnosticLogger.info("ESTOQUE_ENTRADA", "Código de barras convertido • barras=$numeros • codigo=$legado • formato=EAN13_LEGADO")
                          return legado
                      }
                  }

                  if (candidatos.size == 1) {
                      val codigo = candidatos.first()
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Código de barras convertido • barras=$numeros • codigo=$codigo • candidatos=1")
                      return codigo
                  }

                  if (candidatos.size > 1) {
                      DiagnosticLogger.info("ESTOQUE_ENTRADA", "Código de barras ambíguo • barras=$numeros • candidatos=${candidatos.joinToString(",")}")
                  }
                  return ""
              }

              private fun normalizarValidade(valor: String): String? {
                  val texto = valor.trim()
                  val compacta = texto.filter { it.isDigit() }
                  if (texto.matches(Regex("^\\d{4}$")) && compacta.length == 4) {
                      val mes = compacta.substring(0, 2)
                      val ano = compacta.substring(2, 4)
                      if (mes.toIntOrNull() in 1..12) return "$mes/$ano"
                  }
                  val match = Regex("^(0[1-9]|1[0-2])[/.-](\\d{2}|\\d{4})$").find(texto) ?: return null
                  val mes = match.groupValues[1]
                  val ano = match.groupValues[2]
                  return if (ano.length == 2) "$mes/$ano" else "$mes/${ano.takeLast(2)}"
              }

              private fun validadeParaOrdem(validade: String): Int? {
                  val match = Regex("^(\\d{2})/(\\d{2})$").find(validade) ?: return null
                  return (2000 + match.groupValues[2].toInt()) * 100 + match.groupValues[1].toInt()
              }

              private fun formatarData(timestamp: Long): String {
                  if (timestamp <= 0) return "-"
                  return SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.getDefault()).format(Date(timestamp))
              }

              // Usa exatamente a mesma planilha atualmente carregada pelo módulo principal.
              // Isso evita que a área de estoque fique com uma base antiga quando o usuário
              // atualiza a planilha pelo aplicativo.
              private fun carregarDescricoesProdutos() {
                  val temp = java.io.File(cacheDir, "enderecos_caixas_temp.xlsx")
                  try {
                      val planilhaAtual = java.io.File(filesDir, "enderecos_atualizados.xlsx")
                      if (planilhaAtual.exists()) {
                          java.io.FileInputStream(planilhaAtual).use { input ->
                              FileOutputStream(temp).use { output -> input.copyTo(output) }
                          }
                      } else {
                          assets.open("enderecos.xlsx").use { input ->
                              FileOutputStream(temp).use { output -> input.copyTo(output) }
                          }
                      }

                      ZipFile(temp).use { zip ->
                          val sharedStrings = mutableListOf<String>()
                          val shared = zip.getEntry("xl/sharedStrings.xml")
                          if (shared != null) {
                              zip.getInputStream(shared).use {
                                  sharedStrings.addAll(lerSharedStrings(it))
                              }
                          }
                          val sheet = zip.entries().asSequence().firstOrNull {
                              it.name.startsWith("xl/worksheets/sheet") && it.name.endsWith(".xml")
                          } ?: throw Exception("Nenhuma planilha encontrada.")
                          zip.getInputStream(sheet).use {
                              processarLinhasPlanilha(lerPlanilhaXML(it, sharedStrings))
                          }
                      }
                  } catch (_: Exception) {
                      // A entrada continua funcionando mesmo se a descrição não puder ser carregada.
                  } finally {
                      temp.delete()
                  }
              }

              private fun lerSharedStrings(input: InputStream): List<String> {
                  val resultado = mutableListOf<String>()
                  val parser = Xml.newPullParser()
                  parser.setInput(input, "UTF-8")
                  var textoAtual = ""
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> if (parser.name == "si") textoAtual = ""
                          XmlPullParser.TEXT -> textoAtual += parser.text
                          XmlPullParser.END_TAG -> if (parser.name == "si") resultado.add(textoAtual)
                      }
                      event = parser.next()
                  }
                  return resultado
              }

              private fun lerPlanilhaXML(input: InputStream, sharedStrings: List<String>): List<List<String>> {
                  val resultado = mutableListOf<List<String>>()
                  val parser = Xml.newPullParser()
                  parser.setInput(input, "UTF-8")
                  var event = parser.eventType
                  var linhaAtual = mutableMapOf<Int, String>()
                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> when (parser.name) {
                              "row" -> linhaAtual = mutableMapOf()
                              "c" -> {
                                  val referencia = parser.getAttributeValue(null, "r") ?: ""
                                  colunaAtual = numeroColuna(referencia)
                                  tipoCelula = parser.getAttributeValue(null, "t") ?: ""
                                  valor = ""
                              }
                              "v", "t" -> valor = ""
                          }
                          XmlPullParser.TEXT -> valor += parser.text
                          XmlPullParser.END_TAG -> when (parser.name) {
                              "c" -> {
                                  var final = valor.trim()
                                  if (tipoCelula == "s" && final.isNotEmpty()) {
                                      val indice = final.toIntOrNull()
                                      if (indice != null && indice < sharedStrings.size) final = sharedStrings[indice]
                                  }
                                  linhaAtual[colunaAtual] = final
                              }
                              "row" -> if (linhaAtual.isNotEmpty()) {
                                  val max = linhaAtual.keys.maxOrNull() ?: 0
                                  val lista = MutableList(max + 1) { "" }
                                  for ((indice, texto) in linhaAtual) if (indice < lista.size) lista[indice] = texto
                                  resultado.add(lista)
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return resultado
              }

              private fun numeroColuna(referencia: String): Int {
                  var resultado = 0
                  for (c in referencia) {
                      if (c.isDigit()) break
                      resultado = resultado * 26 + (c.uppercaseChar() - 'A' + 1)
                  }
                  return resultado - 1
              }

              private fun processarLinhasPlanilha(linhas: List<List<String>>) {
                  if (linhas.isEmpty()) return
                  var indiceCabecalho = -1
                  for (i in linhas.indices) {
                      val texto = linhas[i].joinToString("|").lowercase()
                      if (texto.contains("cod material") && texto.contains("desc material")) {
                          indiceCabecalho = i
                          break
                      }
                  }
                  if (indiceCabecalho < 0) return
                  val cabecalho = linhas[indiceCabecalho]
                  fun localizar(nome: String) = cabecalho.indexOfFirst { it.trim().equals(nome, ignoreCase = true) }
                  val cod = localizar("Cod Material")
                  val desc = localizar("Desc Material")
                  if (cod < 0 || desc < 0) return
                  for (i in (indiceCabecalho + 1) until linhas.size) {
                      val linha = linhas[i]
                      fun valor(indice: Int) = if (indice >= 0 && indice < linha.size) linha[indice].trim() else ""
                      val codigo = valor(cod).filter { it.isDigit() }.takeLast(5)
                      if (codigo.length == 5) descricoesProdutos[codigo] = valor(desc)
                  }
              }
          }
          EOF

      - name: Criar serviço de monitoramento em segundo plano
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MonitoramentoReposicaoService.kt
          package com.separacao.bip

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.Query
          import com.google.firebase.firestore.QuerySnapshot
          import com.google.firebase.firestore.ListenerRegistration
          import java.util.UUID

          class MonitoramentoReposicaoService : Service() {

              private val db by lazy { FirebaseFirestore.getInstance() }
              private var firestoreListener: ListenerRegistration? = null
              private var baseEnderecosSync: BaseEnderecosSync? = null
              private var snapshotInicial = true

              private val dispositivoId: String by lazy {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs.getString(KEY_DISPOSITIVO, null) ?: run {
                      val androidId = android.provider.Settings.Secure.getString(
                          contentResolver,
                          android.provider.Settings.Secure.ANDROID_ID
                      )
                      val id = androidId?.takeIf { it.isNotBlank() }
                          ?: UUID.randomUUID().toString()
                      prefs.edit().putString(KEY_DISPOSITIVO, id).apply()
                      id
                  }
              }

              companion object {
                  private const val PREFS = "reposicao_prefs"
                  private const val KEY_NOTIFICACOES_ATIVAS = "notificacoes_ativas"
                  private const val KEY_DISPOSITIVO = "dispositivo_id"
                  private const val COLECAO_REPOSICOES = "reposicoes"
                  private const val CANAL_MONITORAMENTO = "monitoramento_reposicoes"
                  private const val CANAL_NOTIFICACOES = "novas_reposicoes"
                  private const val NOTIFICACAO_MONITORAMENTO = 7001
                  private const val STATUS_PENDENTE = "pendente"
              }

              override fun onCreate() {
                  super.onCreate()
                  criarCanais()
                  promoverParaForeground()
                  iniciarMonitoramento()
                  iniciarMonitoramentoBaseEnderecos()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (!notificacoesAtivas()) {
                      pararMonitoramento()
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (firestoreListener == null) {
                      iniciarMonitoramento()
                  }
                  if (baseEnderecosSync == null) {
                      iniciarMonitoramentoBaseEnderecos()
                  }

                  return START_STICKY
              }

              override fun onDestroy() {
                  pararMonitoramento()
                  baseEnderecosSync?.parar()
                  baseEnderecosSync = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun notificacoesAtivas(): Boolean {
                  if (!getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getBoolean(KEY_NOTIFICACOES_ATIVAS, false)
                  ) return false

                  return Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) == PackageManager.PERMISSION_GRANTED
              }

              private fun criarCanais() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return

                  val monitoramento = NotificationChannel(
                      CANAL_MONITORAMENTO,
                      "Monitoramento de reposições",
                      NotificationManager.IMPORTANCE_LOW
                  ).apply {
                      description = "Indica que o monitoramento em segundo plano está ativo"
                      setShowBadge(false)
                  }

                  val novas = NotificationChannel(
                      CANAL_NOTIFICACOES,
                      "Novas reposições",
                      NotificationManager.IMPORTANCE_HIGH
                  ).apply {
                      description = "Avisos de novas pendências de reposição"
                      enableVibration(true)
                  }

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.createNotificationChannel(monitoramento)
                  manager.createNotificationChannel(novas)
              }

              private fun promoverParaForeground() {
                  val intent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      NOTIFICACAO_MONITORAMENTO,
                      intent,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                  )

                  val notification = NotificationCompat.Builder(this, CANAL_MONITORAMENTO)
                      .setSmallIcon(android.R.drawable.ic_popup_sync)
                      .setContentTitle("Monitoramento ativo")
                      .setContentText("Aguardando novas reposições")
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICACAO_MONITORAMENTO,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                      )
                  } else {
                      startForeground(NOTIFICACAO_MONITORAMENTO, notification)
                  }
              }

              private fun iniciarMonitoramentoBaseEnderecos() {
                  baseEnderecosSync?.parar()
                  baseEnderecosSync = BaseEnderecosSync(this, db)
                  baseEnderecosSync?.iniciarMonitoramento(
                      aoAtualizar = { _ -> },
                      aoStatus = { _ -> }
                  )
              }

              private fun iniciarMonitoramento() {
                  if (!notificacoesAtivas()) return
                  firestoreListener?.remove()
                  snapshotInicial = true

                  firestoreListener = db.collection(COLECAO_REPOSICOES)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) {
                              if (error != null) DiagnosticLogger.firebase("monitoramento_reposicoes.listener", error)
                              return@addSnapshotListener
                          }

                          val primeira = snapshotInicial
                          snapshotInicial = false

                          if (!primeira) {
                              snapshot.documentChanges
                                  .filter { it.type == DocumentChange.Type.ADDED }
                                  .forEach { change ->
                                      val doc = change.document
                                      val status = doc.getString("status")
                                          ?: if (doc.getBoolean("concluido") == true) "concluido" else STATUS_PENDENTE
                                      val criador = doc.getString("dispositivo") ?: ""

                                      if (status == STATUS_PENDENTE && criador != dispositivoId) {
                                          mostrarNotificacao(
                                              id = doc.getString("id") ?: doc.id,
                                              codigo = doc.getString("codigo") ?: return@forEach,
                                              descricao = doc.getString("descricao") ?: "",
                                              rua = doc.getString("rua") ?: "",
                                              rack = doc.getString("rack") ?: ""
                                          )
                                      }
                                  }
                          }
                      }
              }

              private fun pararMonitoramento() {
                  firestoreListener?.remove()
                  firestoreListener = null
              }

              private fun mostrarNotificacao(
                  id: String,
                  codigo: String,
                  descricao: String,
                  rua: String,
                  rack: String
              ) {
                  if (!notificacoesAtivas()) return

                  val endereco = if (rua.isNotBlank() || rack.isNotBlank()) {
                      "${rua.ifBlank { "Sem rua" }} — ${rack.ifBlank { "Sem rack" }}"
                  } else {
                      "Sem endereço cadastrado"
                  }

                  val texto = "${codigo} • ${descricao.ifBlank { "Produto" }}\n$endereco"
                  val intent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      (id.hashCode() and 0x7fffffff),
                      intent,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                  )

                  val notification = NotificationCompat.Builder(this, CANAL_NOTIFICACOES)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("Nova reposição pendente")
                      .setContentText("Código $codigo — ${descricao.ifBlank { "Produto" }}")
                      .setStyle(NotificationCompat.BigTextStyle().bigText(texto))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setContentIntent(pendingIntent)
                      .setAutoCancel(true)
                      .build()

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.notify((id.hashCode() and 0x7fffffff), notification)
              }
          }
          EOF

      - name: Criar receptor de inicialização do aparelho
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/BootReceiver.kt
          package com.separacao.bip

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.content.ContextCompat

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != Intent.ACTION_BOOT_COMPLETED) return

                  val prefs = context.getSharedPreferences("reposicao_prefs", Context.MODE_PRIVATE)
                  val ativo = prefs.getBoolean("notificacoes_ativas", false)
                  if (!ativo) return

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(
                          context,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) return

                  val serviceIntent = Intent(context, MonitoramentoReposicaoService::class.java)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent)
                      } else {
                          context.startService(serviceIntent)
                      }
                  } catch (_: Exception) {
                      // O sistema pode impedir o início em determinadas condições.
                  }
              }
          }
          EOF

      - name: Criar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Verificar APK assinado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Enviar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reposicao-v9.10.7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
