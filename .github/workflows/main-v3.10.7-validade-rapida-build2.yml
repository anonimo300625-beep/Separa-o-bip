                      codigoPendente.isBlank() -> {
                          tvEtapaEntrada.text = "Bipe o código da próxima caixa."
                          btnProcessar.text = "PROCESSAR LEITURA"
                          configurarEntradaParaCodigo()
                      }
                      else -> {
                          tvEtapaEntrada.text = "Código $codigoPendente • agora informe a validade"
                          btnProcessar.text = "GRAVAR VALIDADE"
