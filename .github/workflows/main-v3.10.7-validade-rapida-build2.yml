              private fun abrirScanner() {
                  val scanner = GmsBarcodeScanning.getClient(this)

                  scanner.startScan()
                      .addOnSuccessListener { barcode ->
                          val valor = barcode.rawValue?.trim().orEmpty()

                          if (valor.isEmpty()) {
                              Toast.makeText(
                                  this,
                                  "Não foi possível obter o código.",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return@addOnSuccessListener
                          }

                          etCodigo.setText(valor)
                          etCodigo.setSelection(etCodigo.text.length)

                          // Leitura pela câmera executa imediatamente a ação do modo atual.
                          // No modo Reposição, não é mais necessário tocar em"ADICIONAR REPOSIÇÃO" depois do bip.
                          processarCodigo()
                      }
                      .addOnCanceledListener {
                          // O operador simplesmente fechou o scanner.
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(
                              this,
                              "Não foi possível abrir o leitor: ${e.message ?: "erro desconhecido"}",
                              Toast.LENGTH_LONG
                          ).show()
                      }
              }

              private fun mostrarProdutoEncontrado(codigo: String) {
                  val produto = baseProdutos[codigo]

                  if (produto == null) {
                      tvCodigoEncontrado.text = "Código $codigo"
                      tvProdutoEncontrado.text = "Produto não encontrado na planilha."
                      tvEnderecoEncontrado.text = ""
                      containerProdutoEncontrado.visibility = View.VISIBLE
                      return
                  }

                  tvCodigoEncontrado.text = produto.codigo
                  tvProdutoEncontrado.text = produto.descricao
                  tvEnderecoEncontrado.text = if (enderecoTemDados(produto)) {
                      "📍 ${produto.rua} — ${produto.rack}\n" +
                      "Coluna ${produto.coluna} — Linha ${produto.linha}"
                  } else {
                      "⚠ Sem endereço cadastrado"
                  }
                  containerProdutoEncontrado.visibility = View.VISIBLE
              }

              private fun esconderProdutoEncontrado() {
                  containerProdutoEncontrado.visibility = View.GONE
              }

              private fun enderecoTemDados(produto: EnderecoProduto): Boolean {
                  val campos = listOf(
                      produto.rua, produto.rack, produto.coluna, produto.linha
                  )
                  return campos.any { valor ->
                      val normalizado = valor.trim().lowercase(Locale.getDefault())
                      normalizado.isNotEmpty() &&
                          normalizado != "-" &&
                          normalizado != "n/a" &&
                          normalizado != "sem endereço" &&
                          normalizado != "sem endereco"
                  }
              }

              private fun confirmarCodigoSemEndereco(produto: EnderecoProduto) {
                  AlertDialog.Builder(this)
                      .setTitle("Código sem endereço")
                      .setMessage(
                          "O código ${produto.codigo} não possui endereço cadastrado.\n\n" +
                          "Código sem endereço, adicionar assim mesmo?"
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("ADICIONAR") { _, _ ->
                          adicionarReposicao(produto)
                      }
                      .show()
              }

              private fun processarCodigo() {
                  val entrada = etCodigo.text.toString().trim()

                  if (entrada.isEmpty()) {
                      Toast.makeText(
                          this,
                          if (modoConsulta) {
                              "Digite um Código Mate ou um endereço para consultar."
                          } else {
                              "Digite os 5 números do Código Mate ou bipe o código de barras."
                          },
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  if (modoConsulta) {
                      consultarEntrada(entrada)
                      etCodigo.setText("")
                      etCodigo.requestFocus()
                      return
                  }

                  val codigo = extrairCodigoMate(entrada)

                  if (codigo.length != 5) {
                      Toast.makeText(
                          this,
                          "Digite os 5 números do Código Mate ou bipe o código de barras.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val produto = baseProdutos[codigo]

                  if (produto == null) {
                      Toast.makeText(
                          this,
                          "Código $codigo não encontrado na planilha.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  if (!enderecoTemDados(produto)) {
                      confirmarCodigoSemEndereco(produto)
                  } else {
                      adicionarReposicao(produto)
                  }

                  etCodigo.setText("")
                  etCodigo.requestFocus()
              }

              private fun consultarEntrada(entrada: String) {
                  val codigo = extrairCodigoMate(entrada)
                  val produto = if (codigo.length == 5) baseProdutos[codigo] else null
                  if (produto != null) {
                      adicionarConsulta(produto)
                      return
                  }

                  Toast.makeText(
                      this,
                      "Código não encontrado. Para consultar por endereço, use o campo específico abaixo.",
                      Toast.LENGTH_LONG
                  ).show()
              }

              private fun consultarPorEnderecoSeparadamente() {
                  val buscaOriginal = etEnderecoConsulta.text.toString().trim()
                  val busca = normalizarTexto(buscaOriginal)
                  if (busca.isEmpty()) {
                      Toast.makeText(this, "Informe o endereço para pesquisar.", Toast.LENGTH_SHORT).show()
                      return
                  }

                  // A consulta por endereço usa a posição dos campos:
                  // Rua/Estação + Rack + Coluna + Linha.
                  // Ex.: "1 1 5 B" = Rua 1 / Rack 1 / Coluna 5 / Linha B.
                  // Também aceita os nomes dos campos, por exemplo:
                  // "Rua 1 Rack 1 Coluna 5 Linha B".
                  val partesBusca = interpretarBuscaEndereco(busca)

                  if (partesBusca == null) {
                      Toast.makeText(
                          this,
                          "Formato inválido. Use: Rua Rack Coluna Linha\nEx.: 1 1 5 B",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val encontrados = baseProdutos.values
                      .filter { produto ->
                          enderecoBateExatamente(
                              produto,
                              partesBusca
                          )
                      }
                      .sortedWith(
                          compareBy<EnderecoProduto> { numeroEndereco(it.rua) }
                              .thenBy { numeroEndereco(it.rack) }
                              .thenBy { numeroEndereco(it.coluna) }
                              .thenBy { textoEndereco(it.linha) }
                              .thenBy { textoEndereco(it.descricao) }
                      )

                  containerLista.removeAllViews()
                  consultas.clear()

                  if (encontrados.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = "Nenhum produto encontrado nesse endereço na base atual."
                      vazio.textSize = 16f
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 30, 20, 30)
                      containerLista.addView(vazio)
                  } else {
                      encontrados.forEach { adicionarConsulta(it) }
                      Toast.makeText(
                          this,
                          "${encontrados.size} produto(s) encontrado(s).",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  etEnderecoConsulta.setText("")
              }

              private fun interpretarBuscaEndereco(
                  busca: String
              ): List<String>? {
                  val tokens = busca
                      .replace(Regex("[,;/|]+"), " ")
                      .split(Regex("\\s+"))
                      .filter { it.isNotBlank() }
                      .toMutableList()

                  if (tokens.isEmpty()) return null

                  // Aceita tanto a forma curta "1 1 5 B" quanto a forma
                  // identificada "Rua 1 Rack 1 Coluna 5 Linha B".
                  val palavrasCampo = setOf(
                      "rua", "estacao", "rack", "coluna", "linha"
                  )

                  val possuiNomesDeCampo = tokens.any { it in palavrasCampo }

                  if (!possuiNomesDeCampo) {
                      return if (tokens.size in 1..4) tokens else null
                  }

                  val resultado = arrayOfNulls<String>(4)
                  var i = 0

                  while (i < tokens.size) {
                      val campo = tokens[i]
                      if (campo !in palavrasCampo || i + 1 >= tokens.size) {
                          return null
                      }

                      val indice = when (campo) {
                          "rua", "estacao" -> 0
                          "rack" -> 1
                          "coluna" -> 2
                          "linha" -> 3
                          else -> -1
                      }

                      if (indice < 0 || resultado[indice] != null) return null

                      resultado[indice] = tokens[i + 1]
                      i += 2
                  }

                  // Não permite pular um campo no formato identificado.
                  // Para buscas parciais, a forma curta deve ser usada.
                  if (resultado.any { it == null }) return null

                  return resultado.map { it!! }
              }

              private fun enderecoBateExatamente(
                  produto: EnderecoProduto,
                  partesBusca: List<String>
              ): Boolean {
                  if (partesBusca.isEmpty() || partesBusca.size > 4) return false

                  val valoresProduto = listOf(
                      produto.rua,
                      produto.rack,
                      produto.coluna,
                      produto.linha
                  )

                  return partesBusca.indices.all { indice ->
                      componenteEnderecoIgual(
                          valoresProduto[indice],
                          partesBusca[indice]
                      )
                  }
              }

              private fun componenteEnderecoIgual(
                  valorProduto: String,
                  valorBusca: String
              ): Boolean {
                  val produto = normalizarComponenteEndereco(valorProduto)
                  val busca = normalizarComponenteEndereco(valorBusca)

                  if (produto.isEmpty() || busca.isEmpty()) return false

                  // Para campos numéricos, "01" e "1" representam o mesmo
                  // endereço, mas "1" não casa com "10".
                  val numeroProduto = Regex("^\\d+$").matchEntire(produto)?.value
                  val numeroBusca = Regex("^\\d+$").matchEntire(busca)?.value

                  if (numeroProduto != null && numeroBusca != null) {
                      return numeroProduto.toIntOrNull() == numeroBusca.toIntOrNull()
                  }

                  // Para linha/texto, a comparação é exata.
                  return produto == busca
              }

              private fun normalizarComponenteEndereco(
                  valor: String
              ): String {
                  return normalizarTexto(valor)
                      .replace(
                          Regex("^(rua|estacao|rack|coluna|linha)\\s+"),
                          ""
                      )
                      .trim()
              }

              private fun enderecoCorresponde(
                  produto: EnderecoProduto,
                  busca: String
              ): Boolean {
                  val normalizadoBusca = normalizarTexto(busca)
                  if (normalizadoBusca.isEmpty()) return false
                  val endereco = normalizarTexto(
                      listOf(produto.rua, produto.rack, produto.coluna, produto.linha)
                          .filter { it.isNotBlank() }
                          .joinToString(" ")
                  )
                  val termos = normalizadoBusca.split(Regex("\\s+"))
                      .filter { it.isNotBlank() }
                  return endereco.isNotEmpty() && termos.all { endereco.contains(it) }
              }

              private fun normalizarTexto(texto: String): String {
                  return java.text.Normalizer.normalize(
                      texto.trim().lowercase(Locale.getDefault()),
                      java.text.Normalizer.Form.NFD
                  ).replace(Regex("\\p{InCombiningDiacriticalMarks}+"), "")
                      .replace(Regex("\\s+"), " ")
              }

              private fun extrairCodigoMate(entrada: String): String {
                  val numeros = entrada.filter { it.isDigit() }
                  return when {
                      numeros.length == 5 -> numeros
                      numeros.length >= 6 -> numeros.dropLast(1).takeLast(5)
                      else -> ""
                  }
              }

              private fun adicionarConsulta(produto: EnderecoProduto) {
                  consultas.add(
                      ItemConsulta(
                          codigo = produto.codigo,
                          descricao = produto.descricao,
                          rua = produto.rua,
                          rack = produto.rack,
                          coluna = produto.coluna,
                          linha = produto.linha,
                          timestamp = System.currentTimeMillis()
                      )
                  )

                  atualizarConsultas()
              }

