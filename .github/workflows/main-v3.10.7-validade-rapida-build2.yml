              private fun confirmarLimparConsultas() {
                  if (consultas.isEmpty()) {
                      Toast.makeText(
                          this,
                          "Não há consultas para limpar.",
                          Toast.LENGTH_SHORT
                      ).show()
                      return
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Limpar consultas?")
                      .setMessage(
                          "Todos os resultados de consulta desta sessão serão removidos."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("LIMPAR") { _, _ ->
                          consultas.clear()
                          atualizarConsultas()
                      }
