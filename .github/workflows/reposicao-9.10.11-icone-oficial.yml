          import base64
          from pathlib import Path
          from PIL import Image

          raw = base64.b64decode(Path('/tmp/app_icon.b64').read_text())
          source = Image.open(__import__('io').BytesIO(raw)).convert('RGB')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          res = Path('app/src/main/res')
          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / 'ic_launcher.png', format='PNG', optimize=True)
              icon.save(target / 'ic_launcher_round.png', format='PNG', optimize=True)
          print('Ícones do aplicativo gerados em todas as densidades.')
