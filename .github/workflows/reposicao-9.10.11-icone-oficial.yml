name: Build Android APK - 9.10.11 Ícone oficial e correções de interface/histórico

# 9.10.11: inclui o ícone oficial enviado pelo usuário; mantém as correções 9.10.10 de interface e histórico.
# 9.10.10: oculta barra de pesquisa e contadores duplicados; persiste horário de conclusão no aparelho e no Firestore.
# O teclado do Android é ocultado programaticamente, sem usar android:showSoftInputOnFocus no XML,
# mantendo o bipador físico funcionando e evitando erro de AAPT em compilações com SDK atual.
# Somente o formato novo em blocos é aceito. A publicação só fica "pronta" após
# todos os blocos serem enviados. O receptor valida blocos, quantidade e códigos
# antes de trocar a base local. A base anterior nunca é substituída por uma base incompleta.

on:
  push:
    branches: [ "main", "principal" ]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

# Evita acumular várias compilações da mesma branch.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f firebase/google-services.json ]; then
            echo "ERRO: firebase/google-services.json não encontrado."
            exit 1
          fi

          cp firebase/google-services.json app/google-services.json

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERRO: Nenhuma planilha XLSX encontrada dentro de dados/"
            exit 1
          fi

          echo "Planilha encontrada: $XLSX_FILE"
          cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx

          # Ícone oficial do app fornecido pelo usuário. O arquivo original é incorporado
          # ao workflow para não depender de um arquivo adicional no repositório.
          python3 -m pip install --quiet pillow
