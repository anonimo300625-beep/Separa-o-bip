      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

      - name: Configurar assinatura estável (um único Secret)
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: |
          if [ -z "$ANDROID_SIGNING_CONFIG" ]; then
            echo "ERRO: O Secret ANDROID_SIGNING_CONFIG não foi configurado."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import base64

          config = json.loads(os.environ["ANDROID_SIGNING_CONFIG"])
          required = ["keystore_base64", "password"]
          missing = [key for key in required if not config.get(key)]
          if missing:
              raise SystemExit("ERRO: Secret incompleto: " + ", ".join(missing))

          try:
              keystore_bytes = base64.b64decode(config["keystore_base64"], validate=True)
          except Exception as exc:
              raise SystemExit("ERRO: Base64 do keystore inválido ou incompleto. Substitua o conteúdo do Secret pelo novo arquivo fornecido.") from exc

          if len(keystore_bytes) < 1000:
              raise SystemExit("ERRO: Keystore inválido ou incompleto.")

          with open("app/reposicao-signing.jks", "wb") as f:
              f.write(keystore_bytes)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("ANDROID_KEYSTORE_PASSWORD=" + config["password"] + "\n")
              env.write("ANDROID_KEY_ALIAS=reposicao\n")
              env.write("ANDROID_KEY_PASSWORD=" + config["password"] + "\n")

          # GITHUB_ENV só fica disponível nos PRÓXIMOS passos.
          # Para validar neste mesmo passo, exportamos também no shell.
          with open("/tmp/signing_password", "w", encoding="utf-8") as f:
              f.write(config["password"])
          PY

          ANDROID_KEYSTORE_PASSWORD=$(cat /tmp/signing_password)
          ANDROID_KEY_ALIAS=reposicao
          ANDROID_KEY_PASSWORD=$(cat /tmp/signing_password)
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD

          echo "Validando a chave de assinatura..."
          keytool -list -keystore app/reposicao-signing.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias reposicao >/dev/null
          echo "Assinatura estável configurada e validada."

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 50
                  versionName "9.10.11"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              signingConfigs {
                  reposicaoStable {
                      storeFile file("reposicao-signing.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.reposicaoStable
                  }
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>

              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="barcode_ui"/>


                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <activity
                      android:name=".CaixasActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"/>

                  <service
                      android:name=".MonitoramentoReposicaoService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

