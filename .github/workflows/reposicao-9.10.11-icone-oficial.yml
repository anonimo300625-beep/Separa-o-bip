              @Deprecated("Deprecated in Java")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (requestCode == REQUEST_EXPORTAR_DIAGNOSTICO && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data
                      if (uri != null) {
                          try {
                              contentResolver.openOutputStream(uri)?.use { output ->
                                  output.write(exportacaoDiagnosticoPendente.toByteArray(Charsets.UTF_8))
                              }
                              DiagnosticLogger.info("DIAGNOSTICO", "Relatório salvo em arquivo TXT")
                              Toast.makeText(this, "Relatório de diagnóstico salvo com sucesso.", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              DiagnosticLogger.erro("DIAGNOSTICO", "Erro ao salvar relatório TXT", e)
                              Toast.makeText(this, "Erro ao salvar relatório: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                      exportacaoDiagnosticoPendente = ""
                      return
                  }

                  if (
                      requestCode == REQUEST_IMPORT_XLSX &&
                      resultCode == Activity.RESULT_OK
                  ) {
                      val uri = data?.data ?: return
                      importarPlanilha(uri)
                  }
              }

              private fun importarPlanilha(
                  uri: Uri
              ) {
                  try {
                      val arquivo =
                          File(
                              filesDir,
                              PLANILHA_INTERNA
                          )

                      val inputStream = contentResolver
                          .openInputStream(uri)
                          ?: throw Exception("Não foi possível abrir o arquivo selecionado.")

                      inputStream.use { input ->
                          FileOutputStream(arquivo).use { output ->
                              input.copyTo(output)
                          }
                      }

                      carregarPlanilha(
                          FileInputStream(arquivo)
                      )

                      publicarBaseEnderecosNoFirebase()
                      Toast.makeText(
                          this,
                          "Planilha atualizada localmente!\n${baseProdutos.size} produtos encontrados.\nSincronizando com os outros aparelhos...",
                          Toast.LENGTH_LONG
                      ).show()

                  } catch (e: Exception) {
                      DiagnosticLogger.erro("PLANILHA", "Erro ao importar planilha", e)
                      Toast.makeText(
                          this,
                          "Erro ao importar planilha: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun publicarBaseEnderecosNoFirebase() {
                  val versao = System.currentTimeMillis().toString()
                  val itens = baseProdutos.values.toList()
                  // 200 produtos por documento deixa margem confortável abaixo do limite
                  // de tamanho do documento do Firestore, mesmo com descrições maiores.
                  val tamanhoBloco = 200
                  val totalBlocos = (itens.size + tamanhoBloco - 1) / tamanhoBloco

                  if (itens.isEmpty()) {
                      Toast.makeText(this, "A base está vazia; sincronização cancelada.", Toast.LENGTH_LONG).show()
                      return
                  }

                  val agoraPublicacao = System.currentTimeMillis()
                  val metaPublicando = hashMapOf(
                      "versao" to versao,
                      "quantidade" to itens.size,
                      "totalBlocos" to totalBlocos,
                      "tamanhoBloco" to tamanhoBloco,
                      "iniciadoEm" to agoraPublicacao,
                      "estado" to "publicando"
                  )

                  tvStatusBase.text = "🔄 Preparando publicação..."

                  // Primeiro publica o estado "publicando". Nenhum outro aparelho tentará
                  // baixar a base enquanto os blocos ainda estão sendo enviados.
                  db.collection(COLECAO_BASE_META).document("atual").set(metaPublicando)
                      .addOnSuccessListener {
                          publicarBlocoSeguro(versao, itens, tamanhoBloco, totalBlocos, 0, 0)
                      }
                      .addOnFailureListener { e ->
                          DiagnosticLogger.firebase("base_enderecos_meta.publicar", e)
                          tvStatusBase.text = "⚠️ Não foi possível iniciar a publicação"
                          Toast.makeText(this, "A base anterior continua válida. Não foi possível iniciar a nova publicação.", Toast.LENGTH_LONG).show()
                      }
              }

              private fun publicarBlocoSeguro(
                  versao: String,
                  itens: List<EnderecoProduto>,
                  tamanhoBloco: Int,
                  totalBlocos: Int,
                  indice: Int,
                  tentativa: Int
              ) {
                  if (indice >= totalBlocos) {
                      finalizarPublicacaoBase(versao, itens.size, totalBlocos)
                      return
                  }

                  val inicio = indice * tamanhoBloco
                  val fim = minOf(inicio + tamanhoBloco, itens.size)
                  val lote = itens.subList(inicio, fim)
                  val produtos = lote.map { item ->
                      hashMapOf(
                          "codigo" to item.codigo,
                          "descricao" to item.descricao,
                          "rua" to item.rua,
                          "rack" to item.rack,
                          "coluna" to item.coluna,
                          "linha" to item.linha
                      )
                  }

                  val ref = db.collection(COLECAO_BASE_ITENS)
                      .document("${versao}_bloco_${indice.toString().padStart(4, '0')}")

                  val dadosBloco = hashMapOf(
                      "versao" to versao,
                      "bloco" to indice,
                      "totalBlocos" to totalBlocos,
                      "quantidade" to lote.size,
                      "produtos" to produtos
                  )

                  tvStatusBase.text = "🔄 Publicando base... ${indice + 1}/$totalBlocos blocos"

                  db.batch().set(ref, dadosBloco).commit()
                      .addOnSuccessListener {
                          publicarBlocoSeguro(versao, itens, tamanhoBloco, totalBlocos, indice + 1, 0)
                      }
                      .addOnFailureListener { e ->
                          DiagnosticLogger.firebase("base_enderecos_itens.bloco", e, "bloco=${indice + 1}/$totalBlocos tentativa=$tentativa")
                          if (tentativa < 3) {
                              Handler(Looper.getMainLooper()).postDelayed(
                                  { publicarBlocoSeguro(versao, itens, tamanhoBloco, totalBlocos, indice, tentativa + 1) },
                                  1000L * (tentativa + 1)
                              )
                          } else {
                              marcarPublicacaoFalha(versao)
                              tvStatusBase.text = "⚠️ Publicação interrompida no bloco ${indice + 1}/$totalBlocos"
                              Toast.makeText(this, "A nova base não foi liberada. A base anterior continua válida.", Toast.LENGTH_LONG).show()
                          }
                      }
              }

              private fun finalizarPublicacaoBase(versao: String, quantidade: Int, totalBlocos: Int) {
                  val agora = System.currentTimeMillis()
                  val metaPronta = hashMapOf(
                      "versao" to versao,
                      "quantidade" to quantidade,
                      "totalBlocos" to totalBlocos,
                      "tamanhoBloco" to 200,
                      "atualizadoEm" to agora,
                      "estado" to "pronta"
                  )

                  db.collection(COLECAO_BASE_META).document("atual").set(metaPronta)
                      .addOnSuccessListener {
                          getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                              .putString(KEY_BASE_VERSAO, versao)
                              .putInt(KEY_BASE_QUANTIDADE, quantidade)
                              .putLong(KEY_BASE_ATUALIZADA_EM, agora)
                              .apply()

                          tvStatusBase.text = "🟢 Base publicada • $quantidade produtos • agora"
                          Toast.makeText(
                              this,
                              "✅ Base publicada com sucesso: $quantidade produtos em $totalBlocos blocos.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                      .addOnFailureListener { e ->
                          DiagnosticLogger.firebase("base_enderecos_meta.finalizar", e, "versão=$versao")
                          tvStatusBase.text = "⚠️ Todos os blocos foram enviados, mas a base ainda não foi liberada"
                          Toast.makeText(this, "Os blocos foram enviados, porém a publicação final falhou. A base anterior continua válida.", Toast.LENGTH_LONG).show()
                      }
              }

              private fun marcarPublicacaoFalha(versao: String) {
                  db.collection(COLECAO_BASE_META).document("atual").update(
                      "versao", versao,
                      "estado", "falhou",
                      "falhouEm", System.currentTimeMillis()
                  )
              }

              private fun carregarBaseEnderecos() {
                  var carregouBaseSincronizada = false

                  // Primeiro carrega a planilha local/asset como fallback inicial.
                  val arquivoPlanilha = File(filesDir, PLANILHA_INTERNA)
                  try {
                      if (arquivoPlanilha.exists()) {
                          carregarPlanilha(FileInputStream(arquivoPlanilha))
                      } else {
                          assets.open("enderecos.xlsx").use { carregarPlanilha(it) }
                      }
                  } catch (_: Exception) {
                      // O cache sincronizado abaixo ainda pode recuperar a base.
                  }

                  // Depois aplica a última base sincronizada pelo Firebase.
                  val arquivoBase = File(filesDir, KEY_BASE_ARQUIVO)
                  if (arquivoBase.exists()) {
                      try {
                          val array = JSONArray(arquivoBase.readText(Charsets.UTF_8))
                          val sincronizada = mutableMapOf<String, EnderecoProduto>()
                          for (i in 0 until array.length()) {
                              val o = array.getJSONObject(i)
                              val codigo = o.optString("codigo").trim()
                              if (codigo.isNotBlank()) {
                                  sincronizada[codigo] = EnderecoProduto(
                                      codigo,
                                      o.optString("descricao"),
                                      o.optString("rua"),
                                      o.optString("rack"),
                                      o.optString("coluna"),
                                      o.optString("linha")
                                  )
                              }
                          }
                          if (sincronizada.isNotEmpty()) {
                              baseProdutos.clear()
                              baseProdutos.putAll(sincronizada)
                              carregouBaseSincronizada = true
                              atualizarInterface()
                          }
                      } catch (_: Exception) {
                          // Mantém a base anterior/local se o arquivo estiver corrompido.
                      }
                  }

                  // Compatibilidade com instalações antigas que ainda têm o cache em SharedPreferences.
                  if (!carregouBaseSincronizada) {
                      val cache = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getString(KEY_BASE_CACHE, null)
                      if (!cache.isNullOrBlank()) {
                          try {
                              val array = JSONArray(cache)
                              baseProdutos.clear()
                              for (i in 0 until array.length()) {
                                  val o = array.getJSONObject(i)
                                  val codigo = o.optString("codigo").trim()
                                  if (codigo.isNotBlank()) {
                                      baseProdutos[codigo] = EnderecoProduto(
                                          codigo,
                                          o.optString("descricao"),
                                          o.optString("rua"),
                                          o.optString("rack"),
                                          o.optString("coluna"),
                                          o.optString("linha")
                                      )
                                  }
                              }
                              atualizarInterface()
                          } catch (_: Exception) { }
                      }
                  }
              }

              private fun carregarPlanilha(
                  input: InputStream
              ) {
                  val arquivoTemp =
                      File(
                          cacheDir,
                          "planilha_temp.xlsx"
                      )

                  FileOutputStream(arquivoTemp)
                      .use { output ->
                          input.copyTo(output)
                      }

                  baseProdutos.clear()

                  ZipFile(arquivoTemp).use { zip ->
                      val sharedStrings =
                          mutableListOf<String>()

                      val shared =
                          zip.getEntry(
                              "xl/sharedStrings.xml"
                          )

                      if (shared != null) {
                          zip.getInputStream(shared)
                              .use {
                                  sharedStrings.addAll(
                                      lerSharedStrings(it)
                                  )
                              }
                      }

                      val sheet =
                          zip.entries()
                              .asSequence()
                              .firstOrNull {
                                  it.name.startsWith(
                                      "xl/worksheets/sheet"
                                  ) &&
                                  it.name.endsWith(".xml")
                              }
                              ?: throw Exception(
                                  "Nenhuma planilha encontrada."
                              )

                      zip.getInputStream(sheet)
                          .use {
                              val linhas =
                                  lerPlanilhaXML(
                                      it,
                                      sharedStrings
                                  )

                              processarLinhas(linhas)
                          }
                  }

                  arquivoTemp.delete()
              }

              private fun lerSharedStrings(
                  input: InputStream
              ): List<String> {
                  val resultado =
                      mutableListOf<String>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var textoAtual = ""
                  var event = parser.eventType

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              if (parser.name == "si") {
                                  textoAtual = ""
                              }
                          }

                          XmlPullParser.TEXT -> {
                              textoAtual += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              if (parser.name == "si") {
                                  resultado.add(textoAtual)
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun lerPlanilhaXML(
                  input: InputStream,
                  sharedStrings: List<String>
              ): List<List<String>> {
                  val resultado =
                      mutableListOf<List<String>>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var event = parser.eventType

                  var linhaAtual =
                      mutableMapOf<Int, String>()

                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              when (parser.name) {
                                  "row" -> {
                                      linhaAtual =
                                          mutableMapOf()
                                  }

                                  "c" -> {
                                      val referencia =
                                          parser.getAttributeValue(
                                              null,
                                              "r"
                                          ) ?: ""

                                      colunaAtual =
                                          numeroColuna(
                                              referencia
                                          )

                                      tipoCelula =
                                          parser.getAttributeValue(
                                              null,
                                              "t"
                                          ) ?: ""

                                      valor = ""
                                  }

                                  "v", "t" -> {
                                      valor = ""
                                  }
                              }
                          }

                          XmlPullParser.TEXT -> {
                              valor += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "c" -> {
                                      var final =
                                          valor.trim()

                                      if (
                                          tipoCelula == "s" &&
                                          final.isNotEmpty()
                                      ) {
                                          val indice =
                                              final.toIntOrNull()

                                          if (
                                              indice != null &&
                                              indice < sharedStrings.size
                                          ) {
                                              final =
                                                  sharedStrings[indice]
                                          }
                                      }

                                      linhaAtual[colunaAtual] =
                                          final
                                  }

                                  "row" -> {
                                      if (
                                          linhaAtual.isNotEmpty()
                                      ) {
                                          val max =
                                              linhaAtual.keys.maxOrNull()
                                                  ?: 0

                                          val lista =
                                              MutableList(
                                                  max + 1
                                              ) { "" }

                                          for (
                                              (indice, texto)
                                              in linhaAtual
                                          ) {
                                              if (
                                                  indice < lista.size
                                              ) {
                                                  lista[indice] =
                                                      texto
                                              }
                                          }

                                          resultado.add(lista)
                                      }
                                  }
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun numeroColuna(
                  referencia: String
              ): Int {
                  var resultado = 0

                  for (c in referencia) {
                      if (c.isDigit()) break

                      resultado =
                          resultado * 26 +
                          (
                              c.uppercaseChar() -
                              'A' +
                              1
                          )
                  }

                  return resultado - 1
              }

              private fun processarLinhas(
                  linhas: List<List<String>>
              ) {
                  if (linhas.isEmpty()) return

                  var indiceCabecalho = -1

                  for (i in linhas.indices) {
                      val texto =
                          linhas[i]
                              .joinToString("|")
                              .lowercase()

                      if (
                          texto.contains("cod material") &&
                          texto.contains("desc material")
                      ) {
                          indiceCabecalho = i
                          break
                      }
                  }

                  if (
                      indiceCabecalho == -1
                  ) {
                      throw Exception(
                          "Não foi possível localizar os cabeçalhos da planilha."
                      )
                  }

                  val cabecalho =
                      linhas[indiceCabecalho]

                  fun localizar(
                      nome: String
                  ): Int {
                      return cabecalho.indexOfFirst {
                          it.trim().equals(
                              nome,
                              ignoreCase = true
                          )
                      }
                  }

                  val codMaterial =
                      localizar("Cod Material")

                  val descMaterial =
                      localizar("Desc Material")

                  val estacao =
                      localizar("Estacao")

                  val rack =
                      localizar("Rack")

                  val linhaProd =
                      localizar("Linha prod alocado")

                  val colunaProd =
                      localizar("Coluna prod alocado")

                  if (
                      codMaterial < 0 ||
                      descMaterial < 0 ||
                      estacao < 0 ||
                      rack < 0 ||
                      linhaProd < 0 ||
                      colunaProd < 0
                  ) {
                      throw Exception(
                          "A planilha não possui todas as colunas necessárias."
                      )
                  }

                  for (
                      i in
                      (indiceCabecalho + 1)
                          until
                          linhas.size
                  ) {
                      val linha =
                          linhas[i]

                      fun valor(
                          indice: Int
                      ): String {
                          return if (
                              indice >= 0 &&
                              indice < linha.size
                          ) {
                              linha[indice].trim()
                          } else {
                              ""
                          }
                      }

                      val codigo =
                          valor(codMaterial)
                              .filter { it.isDigit() }
                              .takeLast(5)

                      if (
                          codigo.length != 5
                      ) {
                          continue
                      }

                      baseProdutos[codigo] =
                          EnderecoProduto(
                              codigo = codigo,
                              descricao = valor(descMaterial),
                              rua = valor(estacao),
                              rack = valor(rack),
                              coluna = valor(linhaProd),
                              linha = valor(colunaProd)
                          )
                  }

                  if (
                      baseProdutos.isEmpty()
                  ) {
                      throw Exception(
                          "Nenhum produto válido foi encontrado."
                      )
                  }
              }
          }
          EOF

