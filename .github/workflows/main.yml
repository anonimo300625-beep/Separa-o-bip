              // =========================================================
              // REPOSIÇÕES
              // =========================================================

              private fun adicionarReposicao(
                  produto: EnderecoProduto
              ) {

                  val existente =
                      registros.find {
                          it.codigo == produto.codigo &&
                          !it.concluido
                      }

                  if (existente != null) {

                      AlertDialog.Builder(this)
                          .setTitle("Código já solicitado")
                          .setMessage(
                              "O código ${produto.codigo} já possui " +
                              "${existente.quantidade} caixa(s) pendente(s).\n\n" +
                              "Adicionar mais uma caixa?"
                          )
                          .setNegativeButton(
                              "CANCELAR",
                              null
                          )
                          .setPositiveButton(
                              "ADICIONAR"
                          ) { _, _ ->

                              existente.quantidade += 1

                              salvarRegistros()

                              tvFeedback.text =
                                  "${existente.quantidade} cx ${produto.codigo} pendentes"

                              tvFeedback.visibility =
                                  View.VISIBLE

                              atualizarInterface()
                          }

                          .show()

                      return
                  }

                  val novo =
                      ItemReposicao(
                          id =
                              UUID.randomUUID().toString(),

                          codigo =
                              produto.codigo,

                          descricao =
                              produto.descricao,

                          quantidade = 1,

                          rua =
                              produto.rua,

                          rack =
                              produto.rack,

                          coluna =
                              produto.coluna,

                          linha =
                              produto.linha,

                          operador =
                              nomeOperador,

                          timestamp =
                              System.currentTimeMillis(),

                          concluido =
                              false
                      )

                  registros.add(novo)

                  salvarRegistros()

                  tvFeedback.text =
                      "Produto ${produto.codigo} adicionado à reposição."

                  tvFeedback.visibility =
                      View.VISIBLE

                  atualizarInterface()
              }

              private fun atualizarInterface() {

                  if (modoConsulta) {

                      atualizarConsultas()

                      return
                  }

                  val pendentes =
                      registros.filter {
                          !it.concluido
                      }

                  val concluidos =
                      registros.filter {
                          it.concluido
                      }

                  tvPendentes.text =
                      pendentes.sumOf {
                          it.quantidade
                      }.toString()

                  tvConcluidos.text =
                      concluidos.sumOf {
                          it.quantidade
                      }.toString()

                  tvTotal.text =
                      registros.sumOf {
                          it.quantidade
                      }.toString()

                  containerLista.removeAllViews()

                  val baseLista =
                      if (abaConcluidos)
                          concluidos
                      else
                          pendentes

                  val pesquisa =
                      etPesquisa.text
                          .toString()
                          .trim()
                          .lowercase()

                  var lista =
                      baseLista.filter { item ->

                          val produto =
                              produtoAtual(
                                  item.codigo,
                                  item.descricao,
                                  item.rua,
                                  item.rack,
                                  item.coluna,
                                  item.linha
                              )

                          if (pesquisa.isEmpty()) {

                              true

                          } else {

                              item.codigo.lowercase().contains(pesquisa) ||
                              produto.descricao.lowercase().contains(pesquisa) ||
                              produto.rua.lowercase().contains(pesquisa) ||
                              produto.rack.lowercase().contains(pesquisa) ||
                              produto.coluna.lowercase().contains(pesquisa) ||
                              produto.linha.lowercase().contains(pesquisa)
                          }
                      }

                  lista =
                      if (ordenarPorEndereco) {

                          lista.sortedWith(
                              compareBy<ItemReposicao> {

                                  val p =
                                      produtoAtual(
                                          it.codigo,
                                          it.descricao,
                                          it.rua,
                                          it.rack,
                                          it.coluna,
                                          it.linha
                                      )

                                  p.rua
                              }
                                  .thenBy {

                                      val p =
                                          produtoAtual(
                                              it.codigo,
                                              it.descricao,
                                              it.rua,
                                              it.rack,
                                              it.coluna,
                                              it.linha
                                          )

                                      p.rack
                                  }
                                  .thenBy {

                                      val p =
                                          produtoAtual(
                                              it.codigo,
                                              it.descricao,
                                              it.rua,
                                              it.rack,
                                              it.coluna,
                                              it.linha
                                          )

                                      p.coluna
                                  }
                                  .thenBy {

                                      val p =
                                          produtoAtual(
                                              it.codigo,
                                              it.descricao,
                                              it.rua,
                                              it.rack,
                                              it.coluna,
                                              it.linha
                                          )

                                      p.linha
                                  }
                          )

                      } else {

                          if (abaConcluidos) {

                              lista.sortedByDescending {
                                  it.timestamp
                              }

                          } else {

                              lista.sortedBy {
                                  it.timestamp
                              }
                          }
                      }

                  atualizarBotoes()

                  if (lista.isEmpty()) {

                      val vazio =
                          TextView(this)

                      vazio.text =
                          if (pesquisa.isNotEmpty())
                              "Nenhum registro encontrado."
                          else
                              if (abaConcluidos)
                                  "Nenhuma reposição concluída."
                              else
                                  "Nenhuma pendência no momento."

                      vazio.textSize = 16f

                      vazio.setPadding(
                          20,
                          30,
                          20,
                          30
                      )

                      containerLista.addView(vazio)

                      return
                  }

                  val formato =
                      SimpleDateFormat(
                          "dd/MM/yyyy HH:mm",
                          Locale.getDefault()
                      )

                  for (item in lista) {

                      val produto =
                          produtoAtual(
                              item.codigo,
                              item.descricao,
                              item.rua,
                              item.rack,
                              item.coluna,
                              item.linha
                          )

                      val view =
                          LayoutInflater.from(this)
                              .inflate(
                                  R.layout.item_reposicao,
                                  containerLista,
                                  false
                              )

                      val tvCodigo =
                          view.findViewById<TextView>(
                              R.id.tvCodigo
                          )

                      val tvProduto =
                          view.findViewById<TextView>(
                              R.id.tvProduto
                          )

                      val tvEndereco =
                          view.findViewById<TextView>(
                              R.id.tvEndereco
                          )

                      val tvDetalhes =
                          view.findViewById<TextView>(
                              R.id.tvDetalhes
                          )

                      val tvStatus =
                          view.findViewById<TextView>(
                              R.id.tvStatus
                          )

                      val btnAcao =
                          view.findViewById<Button>(
                              R.id.btnAcao
                          )

                      val btnExcluir =
                          view.findViewById<Button>(
                              R.id.btnExcluir
                          )

                      tvCodigo.text =
                          "${item.quantidade} cx ${item.codigo}"

                      tvProduto.text =
                          produto.descricao

                      tvEndereco.text =
                          "${formatarRua(produto.rua)} — ${formatarRack(produto.rack)}\n" +
                          "Coluna ${produto.coluna} — Linha ${produto.linha}"

                      val tempo =
                          calcularTempo(item.timestamp)

                      tvDetalhes.text =
                          "Solicitado por: ${item.operador}\n" +
                          formato.format(
                              Date(item.timestamp)
                          ) +
                          "\n⏱️ $tempo"

                      if (item.concluido) {

                          tvStatus.text =
                              "CONCLUÍDO"

                          tvStatus.setTextColor(
                              Color.parseColor("#1B5E20")
                          )

                          tvStatus.setBackgroundColor(
                              Color.parseColor("#C8E6C9")
                          )

                          btnAcao.text =
                              "DESFAZER"

                          btnExcluir.visibility =
                              View.VISIBLE

                          btnAcao.setOnClickListener {

                              item.concluido = false

                              salvarRegistros()

                              atualizarInterface()
                          }

                          btnExcluir.setOnClickListener {

                              AlertDialog.Builder(this)
                                  .setTitle(
                                      "Excluir registro?"
                                  )
                                  .setMessage(
                                      "Esse registro será apagado permanentemente."
                                  )
                                  .setNegativeButton(
                                      "CANCELAR",
                                      null
                                  )
                                  .setPositiveButton(
                                      "EXCLUIR"
                                  ) { _, _ ->

                                      registros.remove(item)

                                      salvarRegistros()

                                      atualizarInterface()
                                  }
                                  .show()
                          }

                      } else {

                          val minutos =
                              ((System.currentTimeMillis() -
                                      item.timestamp) / 60000)
                                  .toInt()

                          tvStatus.text =
                              when {

                                  minutos >= 30 ->
                                      "URGENTE"

                                  minutos >= 15 ->
                                      "AGUARDANDO"

                                  else ->
                                      "PENDENTE"
                              }

                          when {

                              minutos >= 30 -> {

                                  tvStatus.setTextColor(Color.WHITE)

                                  tvStatus.setBackgroundColor(
                                      Color.parseColor("#B71C1C")
                                  )
                              }

                              minutos >= 15 -> {

                                  tvStatus.setTextColor(
                                      Color.parseColor("#F57F17")
                                  )

                                  tvStatus.setBackgroundColor(
                                      Color.parseColor("#FFF59D")
                                  )
                              }

                              else -> {

                                  tvStatus.setTextColor(
                                      Color.parseColor("#B71C1C")
                                  )

                                  tvStatus.setBackgroundColor(
                                      Color.parseColor("#FFCDD2")
                                  )
                              }
                          }

                          btnAcao.text =
                              "CONCLUIR"

                          btnExcluir.visibility =
                              View.GONE

                          btnAcao.setOnClickListener {

                              item.concluido = true

                              salvarRegistros()

                              atualizarInterface()
                          }
                      }

                      containerLista.addView(view)
                  }
              }

              private fun atualizarBotoes() {

                  btnPendentes.setBackgroundColor(
                      if (!abaConcluidos)
                          Color.parseColor("#1565C0")
                      else
                          Color.parseColor("#E0E0E0")
                  )

                  btnConcluidos.setBackgroundColor(
                      if (abaConcluidos)
                          Color.parseColor("#1565C0")
                      else
                          Color.parseColor("#E0E0E0")
                  )

                  btnPendentes.setTextColor(
                      if (!abaConcluidos)
                          Color.WHITE
                      else
                          Color.BLACK
                  )

                  btnConcluidos.setTextColor(
                      if (abaConcluidos)
                          Color.WHITE
                      else
                          Color.BLACK
                  )

                  btnOrdemTempo.setBackgroundColor(
                      if (!ordenarPorEndereco)
                          Color.parseColor("#1565C0")
                      else
                          Color.parseColor("#E0E0E0")
                  )

                  btnOrdemEndereco.setBackgroundColor(
                      if (ordenarPorEndereco)
                          Color.parseColor("#1565C0")
                      else
                          Color.parseColor("#E0E0E0")
                  )

                  btnOrdemTempo.setTextColor(
                      if (!ordenarPorEndereco)
                          Color.WHITE
                      else
                          Color.BLACK
                  )

                  btnOrdemEndereco.setTextColor(
                      if (ordenarPorEndereco)
                          Color.WHITE
                      else
                          Color.BLACK
                  )
              }

              private fun calcularTempo(
                  timestamp: Long
              ): String {

                  val minutos =
                      ((System.currentTimeMillis() -
                              timestamp) / 60000)
                          .toInt()

                  return when {

                      minutos < 1 ->
                          "Solicitado agora"

                      minutos < 60 ->
                          "Há $minutos minuto(s)"

                      else -> {

                          val horas =
                              minutos / 60

                          val resto =
                              minutos % 60

                          "Há ${horas}h ${resto}min"
                      }
                  }
              }

              private fun formatarRua(
                  valor: String
              ): String {

                  val texto =
                      valor.trim()

                  return when {

                      texto.lowercase()
                          .startsWith("rua") ->
                          texto

                      texto.lowercase()
                          .startsWith("coméia") ->
                          texto

                      else ->
                          texto
                  }
              }

              private fun formatarRack(
                  valor: String
              ): String {

                  val texto =
                      valor.trim()

                  return if (
                      texto.lowercase()
                          .startsWith("rack")
                  ) {

                      texto

                  } else {

                      "Rack $texto"
                  }
              }

