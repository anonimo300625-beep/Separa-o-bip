                              R.layout.item_reposicao,
                              containerLista,
                              false
                          )

                  val tvCodigo =
                      card.findViewById<TextView>(
                          R.id.tvCodigo
                      )

                  val btnCopiar =
                      card.findViewById<ImageButton>(
                          R.id.btnCopiar
                      )

                  val tvStatus =
                      card.findViewById<TextView>(
                          R.id.tvStatus
                      )

                  val tvProduto =
                      card.findViewById<TextView>(
                          R.id.tvProduto
                      )

                  val tvEndereco =
                      card.findViewById<TextView>(
                          R.id.tvEndereco
                      )

                  val tvDetalhes =
                      card.findViewById<TextView>(
                          R.id.tvDetalhes
                      )

                  val btnAcao =
                      card.findViewById<Button>(
