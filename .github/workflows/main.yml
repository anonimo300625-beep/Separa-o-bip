name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: unzip -o SeparacaoBip_Android_MVP.zip

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gerar Layout Item
      run: |
        cat << 'EOF' > SeparacaoBip_Android_MVP/app/src/main/res/layout/item_reposicao.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:layout_marginHorizontal="8dp"
            android:layout_marginVertical="6dp"
            android:background="@android:drawable/dialog_holo_light_frame"
            android:orientation="vertical"
            android:padding="12dp">
            
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical">
                <TextView
                    android:id="@+id/tvCodigoQtd"
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:textColor="#212121"
                    android:textSize="18sp"
                    android:textStyle="bold" />
                <TextView
                    android:id="@+id/tvStatusBadge"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:paddingHorizontal="8dp"
                    android:paddingVertical="4dp"
                    android:textSize="12sp"
                    android:textStyle="bold" />
            </LinearLayout>

            <TextView
                android:id="@+id/tvEndereco"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="6dp"
                android:textColor="#424242"
                android:textSize="14sp" />

            <TextView
                android:id="@+id/tvDetalhes"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="4dp"
                android:textColor="#757575"
                android:textSize="12sp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:layout_marginTop="10dp"
                android:gravity="end">
                <Button
                    android:id="@+id/btnAcao"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:textSize="12sp"
                    android:backgroundTint="#E0E0E0"
                    android:textColor="#212121" />
                <Button
                    android:id="@+id/btnApagar"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginStart="8dp"
                    android:text="🗑 EXCLUIR"
                    android:textSize="12sp"
                    android:backgroundTint="#FFCDD2"
                    android:textColor="#C62828"
                    android:visibility="gone" />
            </LinearLayout>
        </LinearLayout>
        EOF

    - name: Gerar Layout Main
      run: |
        cat << 'EOF' > SeparacaoBip_Android_MVP/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#F8F9FA">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:padding="16dp"
                android:background="#FFFFFF">
                <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="📦 Registro de Reposição"
                    android:textSize="20sp"
                    android:textStyle="bold"
                    android:textColor="#212121" />
                <ImageButton
                    android:id="@+id/btnConfiguracoes"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:background="?android:attr/selectableItemBackground"
                    android:contentDescription="Configurações"
                    android:src="@android:drawable/ic_menu_manage" />
            </LinearLayout>

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="match_parent">
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="12dp">

                    <TextView
                        android:id="@+id/tvOperador"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Operador: Teste"
                        android:textColor="#616161"
                        android:textSize="14sp" />

                    <Button
                        android:id="@+id/btnIdentificarAparelho"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="6dp"
                        android:text="IDENTIFICAR ESTE APARELHO"
                        android:backgroundTint="#E0E0E0"
                        android:textColor="#212121" />

                    <EditText
                        android:id="@+id/etCodigoBarras"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="12dp"
                        android:hint="Bipe o código de barras ou digite o MATE"
                        android:inputType="text"
                        android:padding="12dp"
                        android:background="@android:drawable/editbox_background" />

                    <Button
                        android:id="@+id/btnProcessarCodigo"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="6dp"
                        android:text="PROCESSAR CÓDIGO"
                        android:backgroundTint="#E0E0E0"
                        android:textColor="#212121" />

                    <TextView
                        android:id="@+id/tvFeedbackAdicionado"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="8dp"
                        android:visibility="gone"
                        android:textColor="#2E7D32"
                        android:textSize="14sp"
                        android:textStyle="bold" />

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:layout_marginTop="16dp"
                        android:weightSum="3">

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginEnd="4dp"
                            android:background="#FFCDD2"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">
                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="PENDENTES"
                                android:textColor="#B71C1C"
                                android:textSize="11sp"
                                android:textStyle="bold" />
                            <TextView
                                android:id="@+id/tvCountPendentes"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#B71C1C"
                                android:textSize="20sp"
                                android:textStyle="bold" />
                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginHorizontal="2dp"
                            android:background="#C8E6C9"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">
                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="CONCLUÍDOS"
                                android:textColor="#1B5E20"
                                android:textSize="11sp"
                                android:textStyle="bold" />
                            <TextView
                                android:id="@+id/tvCountConcluidos"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#1B5E20"
                                android:textSize="20sp"
                                android:textStyle="bold" />
                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginStart="4dp"
                            android:background="#FFF59D"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">
                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="TOTAL"
                                android:textColor="#F57F17"
                                android:textSize="11sp"
                                android:textStyle="bold" />
                            <TextView
                                android:id="@+id/tvCountTotal"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#F57F17"
                                android:textSize="20sp"
                                android:textStyle="bold" />
                        </LinearLayout>
                    </LinearLayout>

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:layout_marginTop="16dp"
                        android:weightSum="2">
                        <Button
                            android:id="@+id/btnTabPendentes"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="PENDENTES"
                            android:backgroundTint="#1E88E5"
                            android:textColor="#FFFFFF" />
                        <Button
                            android:id="@+id/btnTabConcluidos"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginStart="4dp"
                            android:text="CONCLUÍDOS"
                            android:backgroundTint="#E0E0E0"
                            android:textColor="#424242" />
                    </LinearLayout>

                    <LinearLayout
                        android:id="@+id/containerLista"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:layout_marginTop="8dp" />

                </LinearLayout>
            </ScrollView>
        </LinearLayout>
        EOF

    - name: Atualizar MainActivity Kotlin
      run: |
        MAIN_FILE=$(find SeparacaoBip_Android_MVP -name "MainActivity.kt" | head -n 1)
        PKG_NAME=$(grep "^package " "$MAIN_FILE" | head -n 1)

        echo "import android.app.Activity" > code.kt
        echo "import android.content.Intent" >> code.kt
        echo "import android.graphics.Color" >> code.kt
        echo "import android.net.Uri" >> code.kt
        echo "import android.os.Bundle" >> code.kt
        echo "import android.view.LayoutInflater" >> code.kt
        echo "import android.view.View" >> code.kt
        echo "import android.widget.Button" >> code.kt
        echo "import android.widget.EditText" >> code.kt
        echo "import android.widget.ImageButton" >> code.kt
        echo "import android.widget.LinearLayout" >> code.kt
        echo "import android.widget.TextView" >> code.kt
        echo "import android.widget.Toast" >> code.kt
        echo "import androidx.appcompat.app.AppCompatActivity" >> code.kt
        echo "import java.text.SimpleDateFormat" >> code.kt
        echo "import java.util.Date" >> code.kt
        echo "import java.util.Locale" >> code.kt
        echo "" >> code.kt
        echo 'data class ItemReposicao(val id: String, val codigoMate: String, var quantidade: Int, val rua: String, val rack: String, val coluna: String, val linha: String, val operador: String, val timestamp: Long, var concluido: Boolean = false)' >> code.kt
        echo "" >> code.kt
        echo "class MainActivity : AppCompatActivity() {" >> code.kt
        echo "    private lateinit var etCodigoBarras: EditText" >> code.kt
        echo "    private lateinit var btnProcessarCodigo: Button" >> code.kt
        echo "    private lateinit var btnIdentificarAparelho: Button" >> code.kt
        echo "    private lateinit var btnConfiguracoes: ImageButton" >> code.kt
        echo "    private lateinit var tvOperador: TextView" >> code.kt
        echo "    private lateinit var tvFeedbackAdicionado: TextView" >> code.kt
        echo "    private lateinit var tvCountPendentes: TextView" >> code.kt
        echo "    private lateinit var tvCountConcluidos: TextView" >> code.kt
        echo "    private lateinit var tvCountTotal: TextView" >> code.kt
        echo "    private lateinit var btnTabPendentes: Button" >> code.kt
        echo "    private lateinit var btnTabConcluidos: Button" >> code.kt
        echo "    private lateinit var containerLista: LinearLayout" >> code.kt
        echo "    private val listaReposicao = mutableListOf<ItemReposicao>()" >> code.kt
        echo '    private var nomeOperador = "Teste"' >> code.kt
        echo "    private var abaAtual = 0" >> code.kt
        echo '    private val baseEnderecos = mutableMapOf<String, Quadruple<String, String, String, String>>("55968" to Quadruple("COLMÉIA", "1", "1", "53"), "47950" to Quadruple("RUA 1", "1", "4", "A"), "48303" to Quadruple("RUA 1", "1", "5", "B"))' >> code.kt
        echo "    data class Quadruple<A, B, C, D>(val first: A, val second: B, val third: C, val fourth: D)" >> code.kt
        echo "    companion object { private const val REQUEST_PICK_XLSX = 1001 }" >> code.kt
        echo "    override fun onCreate(savedInstanceState: Bundle?) {" >> code.kt
        echo "        super.onCreate(savedInstanceState)" >> code.kt
        echo "        setContentView(R.layout.activity_main)" >> code.kt
        echo "        etCodigoBarras = findViewById(R.id.etCodigoBarras)" >> code.kt
        echo "        btnProcessarCodigo = findViewById(R.id.btnProcessarCodigo)" >> code.kt
        echo "        btnIdentificarAparelho = findViewById(R.id.btnIdentificarAparelho)" >> code.kt
        echo "        btnConfiguracoes = findViewById(R.id.btnConfiguracoes)" >> code.kt
        echo "        tvOperador = findViewById(R.id.tvOperador)" >> code.kt
        echo "        tvFeedbackAdicionado = findViewById(R.id.tvFeedbackAdicionado)" >> code.kt
        echo "        tvCountPendentes = findViewById(R.id.tvCountPendentes)" >> code.kt
        echo "        tvCountConcluidos = findViewById(R.id.tvCountConcluidos)" >> code.kt
        echo "        tvCountTotal = findViewById(R.id.tvCountTotal)" >> code.kt
        echo "        btnTabPendentes = findViewById(R.id.btnTabPendentes)" >> code.kt
        echo "        btnTabConcluidos = findViewById(R.id.btnTabConcluidos)" >> code.kt
        echo "        containerLista = findViewById(R.id.containerLista)" >> code.kt
        echo "        btnProcessarCodigo.setOnClickListener { processarEntrada(etCodigoBarras.text.toString().trim()) }" >> code.kt
        echo '        btnIdentificarAparelho.setOnClickListener { nomeOperador = "Operador " + (1..99).random(); tvOperador.text = "Operador: $nomeOperador"; Toast.makeText(this, "Aparelho identificado como: $nomeOperador", Toast.LENGTH_SHORT).show() }' >> code.kt
        echo "        btnConfiguracoes.setOnClickListener { abrirSeletorPlanilha() }" >> code.kt
        echo '        btnTabPendentes.setOnClickListener { abaAtual = 0; btnTabPendentes.setBackgroundColor(Color.parseColor("#1E88E5")); btnTabPendentes.setTextColor(Color.WHITE); btnTabConcluidos.setBackgroundColor(Color.parseColor("#E0E0E0")); btnTabConcluidos.setTextColor(Color.parseColor("#424242")); atualizarInterface() }' >> code.kt
        echo '        btnTabConcluidos.setOnClickListener { abaAtual = 1; btnTabConcluidos.setBackgroundColor(Color.parseColor("#1E88E5")); btnTabConcluidos.setTextColor(Color.WHITE); btnTabPendentes.setBackgroundColor(Color.parseColor("#E0E0E0")); btnTabPendentes.setTextColor(Color.parseColor("#424242")); atualizarInterface() }' >> code.kt
        echo '        adicionarOuAgruparItem("55968")' >> code.kt
        echo '        adicionarOuAgruparItem("47950")' >> code.kt
        echo '        val itemC1 = adicionarOuAgruparItem("48303")' >> code.kt
        echo "        itemC1?.concluido = true" >> code.kt
        echo '        val itemC2 = adicionarOuAgruparItem("48303")' >> code.kt
        echo "        itemC2?.concluido = true" >> code.kt
        echo "        atualizarInterface()" >> code.kt
        echo "    }" >> code.kt
        echo "    private fun extrairCodigoMate(entrada: String): String {" >> code.kt
        echo "        if (entrada.length <= 6 && entrada.all { it.isDigit() }) return entrada" >> code.kt
        echo "        if (entrada.length > 6) { val mateSub = entrada.takeLast(5); if (mateSub.all { it.isDigit() }) return mateSub }" >> code.kt
        echo "        return entrada" >> code.kt
        echo "    }" >> code.kt
        echo "    private fun processarEntrada(entrada: String) {" >> code.kt
        echo '        if (entrada.isEmpty()) { Toast.makeText(this, "Digite ou bipe um código válido", Toast.LENGTH_SHORT).show(); return }' >> code.kt
        echo "        val mate = extrairCodigoMate(entrada)" >> code.kt
        echo "        val item = adicionarOuAgruparItem(mate)" >> code.kt
        echo "        if (item != null) {" >> code.kt
        echo '            val endStr = "${item.rua} / Rack ${item.rack} / Coluna ${item.coluna} / Linha ${item.linha}"' >> code.kt
        echo "            tvFeedbackAdicionado.visibility = View.VISIBLE" >> code.kt
        echo '            tvFeedbackAdicionado.text = "✅ ${item.codigoMate} adicionado — $endStr"' >> code.kt
        echo "        }" >> code.kt
        echo '        etCodigoBarras.setText("")' >> code.kt
        echo "        atualizarInterface()" >> code.kt
        echo "    }" >> code.kt
        echo "    private fun adicionarOuAgruparItem(mate: String): ItemReposicao? {" >> code.kt
        echo '        val enderecoInfo = baseEnderecos[mate] ?: Quadruple("RUA 1", "1", "1", "A")' >> code.kt
        echo "        val itemExistentePendente = listaReposicao.find { it.codigoMate == mate && !it.concluido }" >> code.kt
        echo "        if (itemExistentePendente != null) {" >> code.kt
        echo "            itemExistentePendente.quantidade += 1" >> code.kt
        echo "            return itemExistentePendente" >> code.kt
        echo "        } else {" >> code.kt
        echo '            val novoItem = ItemReposicao(id = System.currentTimeMillis().toString() + "_" + (0..1000).random(), codigoMate = mate, quantidade = 1, rua = enderecoInfo.first, rack = enderecoInfo.second, coluna = enderecoInfo.third, linha = enderecoInfo.fourth, operador = nomeOperador, timestamp = System.currentTimeMillis(), concluido = false)' >> code.kt
        echo "            listaReposicao.add(novoItem)" >> code.kt
        echo "            return novoItem" >> code.kt
        echo "        }" >> code.kt
        echo "    }" >> code.kt
        echo "    private fun atualizarInterface() {" >> code.kt
        echo "        val pendentes = listaReposicao.filter { !it.concluido }" >> code.kt
        echo "        val concluidos = listaReposicao.filter { it.concluido }" >> code.kt
        echo "        tvCountPendentes.text = pendentes.sumOf { it.quantidade }.toString()" >> code.kt
        echo "        tvCountConcluidos.text = concluidos.sumOf { it.quantidade }.toString()" >> code.kt
        echo "        tvCountTotal.text = listaReposicao.sumOf { it.quantidade }.toString()" >> code.kt
        echo "        containerLista.removeAllViews()" >> code.kt
        echo "        val listaExibicao = if (abaAtual == 0) pendentes.sortedBy { it.timestamp } else concluidos.sortedByDescending { it.timestamp }" >> code.kt
        echo '        val sdf = SimpleDateFormat("dd/MM HH:mm", Locale.getDefault())' >> code.kt
        echo "        for (item in listaExibicao) {" >> code.kt
        echo "            val itemView = LayoutInflater.from(this).inflate(R.layout.item_reposicao, containerLista, false)" >> code.kt
        echo "            val tvCodigoQtd = itemView.findViewById<TextView>(R.id.tvCodigoQtd)" >> code.kt
        echo "            val tvStatusBadge = itemView.findViewById<TextView>(R.id.tvStatusBadge)" >> code.kt
        echo "            val tvEndereco = itemView.findViewById<TextView>(R.id.tvEndereco)" >> code.kt
        echo "            val tvDetalhes = itemView.findViewById<TextView>(R.id.tvDetalhes)" >> code.kt
        echo "            val btnAcao = itemView.findViewById<Button>(R.id.btnAcao)" >> code.kt
        echo "            val btnApagar = itemView.findViewById<Button>(R.id.btnApagar)" >> code.kt
        echo '            if (item.quantidade > 1) { tvCodigoQtd.text = "${item.quantidade} cx ${item.codigoMate}" } else { tvCodigoQtd.text = item.codigoMate }' >> code.kt
        echo '            tvEndereco.text = "${item.rua} — Rack ${item.rack} — Coluna ${item.coluna} — Linha ${item.linha}"' >> code.kt
        echo "            val dataStr = sdf.format(Date(item.timestamp))" >> code.kt
        echo '            tvDetalhes.text = "${item.operador} • $dataStr"' >> code.kt
        echo "            if (item.concluido) {" >> code.kt
        echo '                tvStatusBadge.text = "Concluído"' >> code.kt
        echo '                tvStatusBadge.setBackgroundColor(Color.parseColor("#E8F5E9"))' >> code.kt
        echo '                tvStatusBadge.setTextColor(Color.parseColor("#2E7D32"))' >> code.kt
        echo '                btnAcao.text = "↩ DESFAZER CONCLUSÃO"' >> code.kt
        echo "                btnAcao.setOnClickListener { item.concluido = false; atualizarInterface() }" >> code.kt
        echo "                btnApagar.visibility = View.VISIBLE" >> code.kt
        echo '                btnApagar.setOnClickListener { listaReposicao.remove(item); Toast.makeText(this, "Registro excluído permanentemente", Toast.LENGTH_SHORT).show(); atualizarInterface() }' >> code.kt
        echo "            } else {" >> code.kt
        echo '                tvStatusBadge.text = "Pendente"' >> code.kt
        echo '                tvStatusBadge.setBackgroundColor(Color.parseColor("#FFEBEE"))' >> code.kt
        echo '                tvStatusBadge.setTextColor(Color.parseColor("#C62828"))' >> code.kt
        echo '                btnAcao.text = "✓ CONCLUIR"' >> code.kt
        echo "                btnAcao.setOnClickListener { item.concluido = true; atualizarInterface() }" >> code.kt
        echo "                btnApagar.visibility = View.GONE" >> code.kt
        echo "            }" >> code.kt
        echo "            containerLista.addView(itemView)" >> code.kt
        echo "        }" >> code.kt
        echo "    }" >> code.kt
        echo "    private fun abrirSeletorPlanilha() {" >> code.kt
        echo "        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {" >> code.kt
        echo '            type = "*/*"' >> code.kt
        echo '            val mimeTypes = arrayOf("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.ms-excel")' >> code.kt
        echo "            putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes)" >> code.kt
        echo "        }" >> code.kt
        echo '        startActivityForResult(Intent.createChooser(intent, "Selecione a nova planilha de endereços (.xlsx)"), REQUEST_PICK_XLSX)' >> code.kt
        echo "    }" >> code.kt
        echo "    override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {" >> code.kt
        echo "        super.onActivityResult(requestCode, resultCode, data)" >> code.kt
        echo "        if (requestCode == REQUEST_PICK_XLSX && resultCode == Activity.RESULT_OK) {" >> code.kt
        echo "            val uri: Uri? = data?.data" >> code.kt
        echo '            if (uri != null) Toast.makeText(this, "Planilha de endereços selecionada e atualizada com sucesso!", Toast.LENGTH_LONG).show()' >> code.kt
        echo "        }" >> code.kt
        echo "    }" >> code.kt
        echo "}" >> code.kt

        echo "$PKG_NAME" > "$MAIN_FILE"
        cat code.kt >> "$MAIN_FILE"

    - name: Build APK
      run: |
        cd SeparacaoBip_Android_MVP
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=IGNORE --no-daemon
        else
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=IGNORE --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: SeparacaoBip_Android_MVP/app/build/outputs/apk/debug/app-debug.apk
