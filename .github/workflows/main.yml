                  val dataFormatada =
                      SimpleDateFormat(
                          "dd/MM/yyyy HH:mm",
                          Locale("pt", "BR")
                      ).format(
                          Date(item.timestamp)
                      )

                  tvDetalhes.text =
                      "Operador: ${item.operador} • $dataFormatada"

                  if (item.concluido) {

                      tvStatus.text =
