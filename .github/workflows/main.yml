name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: unzip SeparacaoBip_Android_MVP.zip

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Fix JVM target compatibility
      run: |
        find SeparacaoBip_Android_MVP -name "build.gradle*" -exec sed -i 's/1.8/17/g' {} +
        find SeparacaoBip_Android_MVP -name "build.gradle*" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +

    - name: Build APK
      run: |
        cd SeparacaoBip_Android_MVP
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: SeparacaoBip_Android_MVP/app/build/outputs/apk/debug/app-debug.apk
