name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f firebase/google-services.json ]; then
            echo "ERRO: Arquivo firebase/google-services.json não encontrado."
            exit 1
          fi

          cp firebase/google-services.json app/google-services.json

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)

          if [ -z "$XLSX_FILE" ]; then
            echo "ERRO: Nenhuma planilha XLSX encontrada dentro da pasta dados/"
            exit 1
          fi

          echo "Planilha encontrada: $XLSX_FILE"

          cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx

      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 12
                  versionName "12.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')

              implementation 'com.google.firebase:firebase-firestore-ktx'

              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              implementation 'androidx.camera:camera-core:1.3.2'
              implementation 'androidx.camera:camera-camera2:1.3.2'
              implementation 'androidx.camera:camera-lifecycle:1.3.2'
              implementation 'androidx.camera:camera-view:1.3.2'

              implementation 'com.google.mlkit:barcode-scanning:17.2.0'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      - name: Criar ícone de cópia
        run: |
          cat << 'EOF' > app/src/main/res/drawable/ic_copiar.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#1565C0"
                  android:pathData="M16,1H4C2.9,1 2,1.9 2,3v14h2V3h12V1zM19,5H8C6.9,5 6,5.9 6,7v14c0,1.1 0.9,2 2,2h11c1.1,0 2,-0.9 2,-2V7C21,5.9 20.1,5 19,5zM19,21H8V7h11V21z"/>
          </vector>
          EOF

      - name: Criar layout principal
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F4F6F8">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:paddingStart="18dp"
                  android:paddingTop="18dp"
                  android:paddingEnd="18dp"
                  android:paddingBottom="16dp"
                  android:background="#1565C0">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              android:id="@+id/tvTitulo"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Registro de Reposição"
                              android:textColor="#FFFFFF"
                              android:textSize="24sp"
                              android:textStyle="bold"/>

                          <TextView
                              android:id="@+id/tvSubtitulo"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="3dp"
                              android:text="Controle inteligente de produtos"
                              android:textColor="#DCEBFF"
                              android:textSize="13sp"/>

                      </LinearLayout>

                      <ImageButton
                          android:id="@+id/btnConfiguracoes"
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:background="?android:attr/selectableItemBackgroundBorderless"
                          android:src="@android:drawable/ic_menu_manage"
                          android:contentDescription="Configurações"/>

                  </LinearLayout>

                  <TextView
                      android:id="@+id/tvOperador"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:padding="10dp"
                      android:text="👤 Operador: Operador 1"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:background="#3378C5"/>

              </LinearLayout>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnModoReposicao"
                              android:layout_width="0dp"
                              android:layout_height="52dp"
                              android:layout_weight="1"
                              android:text="📦 REPOSIÇÃO"
                              android:textSize="12sp"/>

                          <Button
                              android:id="@+id/btnModoConsulta"
                              android:layout_width="0dp"
                              android:layout_height="52dp"
                              android:layout_weight="1"
                              android:layout_marginStart="6dp"
                              android:text="🔎 CONSULTAR"
                              android:textSize="12sp"/>

                      </LinearLayout>

                      <Button
                          android:id="@+id/btnNomeOperador"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="8dp"
                          android:text="ALTERAR NOME DO OPERADOR"/>

                      <TextView
                          android:id="@+id/tvModoDescricao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="14dp"
                          android:padding="8dp"
                          android:textColor="#616161"
                          android:textSize="14sp"
                          android:gravity="center"/>

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="BIPAGEM / CÓDIGO DO PRODUTO"
                          android:textColor="#424242"
                          android:textSize="12sp"
                          android:textStyle="bold"/>

                      <EditText
                          android:id="@+id/etCodigo"
                          android:layout_width="match_parent"
                          android:layout_height="68dp"
                          android:layout_marginTop="5dp"
                          android:background="#FFFFFF"
                          android:hint="Bipe ou digite o Código Mate"
                          android:inputType="number"
                          android:maxLength="30"
                          android:imeOptions="actionDone"
                          android:paddingStart="18dp"
                          android:paddingEnd="18dp"
                          android:textSize="20sp"
                          android:textColor="#212121"/>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="7dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnProcessar"
                              android:layout_width="0dp"
                              android:layout_height="54dp"
                              android:layout_weight="1"
                              android:text="ADICIONAR REPOSIÇÃO"
                              android:textStyle="bold"/>

                          <Button
                              android:id="@+id/btnEscanear"
                              android:layout_width="0dp"
                              android:layout_height="54dp"
                              android:layout_weight="1"
                              android:layout_marginStart="6dp"
                              android:text="📷 ESCANEAR"
                              android:textSize="11sp"
                              android:textStyle="bold"/>

                      </LinearLayout>

                      <Button
                          android:id="@+id/btnLimparConsultas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="🗑 LIMPAR CONSULTAS"
                          android:visibility="gone"/>

                      <TextView
                          android:id="@+id/tvFeedback"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:padding="12dp"
                          android:textColor="#1B5E20"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          android:gravity="center"
                          android:background="#C8E6C9"
                          android:visibility="gone"/>

                      <TextView
                          android:id="@+id/tvTituloDashboard"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="📊 RESUMO DA OPERAÇÃO"
                          android:textColor="#424242"
                          android:textSize="13sp"
                          android:textStyle="bold"/>

                      <LinearLayout
                          android:id="@+id/containerContadores"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal"
                          android:weightSum="3">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="92dp"
                              android:layout_weight="1"
                              android:layout_marginEnd="4dp"
                              android:background="#FFCDD2"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="8dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="PENDENTES"
                                  android:textColor="#B71C1C"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvPendentes"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="0"
                                  android:textColor="#B71C1C"
                                  android:textSize="28sp"
                                  android:textStyle="bold"/>

                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="92dp"
                              android:layout_weight="1"
                              android:layout_marginStart="2dp"
                              android:layout_marginEnd="2dp"
                              android:background="#C8E6C9"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="8dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="CONCLUÍDOS"
                                  android:textColor="#1B5E20"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvConcluidos"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="0"
                                  android:textColor="#1B5E20"
                                  android:textSize="28sp"
                                  android:textStyle="bold"/>

                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="92dp"
                              android:layout_weight="1"
                              android:layout_marginStart="4dp"
                              android:background="#FFF59D"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="8dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="TOTAL"
                                  android:textColor="#F57F17"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvTotal"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="0"
                                  android:textColor="#F57F17"
                                  android:textSize="28sp"
                                  android:textStyle="bold"/>

                          </LinearLayout>

                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerLista"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:layout_marginTop="12dp"/>

                  </LinearLayout>

              </ScrollView>

          </LinearLayout>
          EOF

      - name: Criar MainActivity.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
          package com.separacao.bip

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class ItemReposicao(
              var codigo: String,
              var descricao: String,
              var rua: String,
              var rack: String,
              var coluna: String,
              var linha: String,
              var quantidade: Int = 1,
              var timestamp: Long = System.currentTimeMillis(),
              var operador: String = "",
              var concluido: Boolean = false
          )

          class MainActivity : AppCompatActivity() {

              // Propriedades mínimas necessárias para os trechos que você enviou
              private lateinit var containerLista: LinearLayout
              private lateinit var etPesquisa: EditText
              private lateinit var btnPendentes: Button
              private lateinit var btnConcluidos: Button
              private lateinit var tvPendentes: TextView
              private lateinit var tvConcluidos: TextView
              private lateinit var tvTotal: TextView
              private lateinit var tvFeedback: TextView
              private lateinit var tvOperador: TextView

              private val registros = mutableListOf<ItemReposicao>()
              private val baseProdutos = mutableListOf<ItemReposicao>()

              private var modoConsulta = false
              private var abaConcluidos = false
              private var ordenarPorEndereco = true
              private var nomeOperador = "Operador 1"

              private val PREFS = "prefs"
              private val KEY_OPERADOR = "operador"
              private val PLANILHA_INTERNA = "planilha_interna.xlsx"
              private val REQUEST_IMPORT_XLSX = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // NOTE: aqui você precisa setar setContentView(...) e inicializar as views.
              }

              private fun atualizarInterface() {

                  if (modoConsulta) {
                      atualizarConsultas()
                      return
                  }

                  containerLista.removeAllViews()

                  val textoPesquisa =
                      etPesquisa.text.toString()
                          .trim()
                          .lowercase()

                  var lista =
                      registros.filter {
                          if (abaConcluidos) {
                              it.concluido
                          } else {
                              !it.concluido
                          }
                      }

                  if (textoPesquisa.isNotEmpty()) {

                      lista =
                          lista.filter {

                              it.codigo.lowercase()
                                  .contains(textoPesquisa) ||

                              it.descricao.lowercase()
                                  .contains(textoPesquisa) ||

                              it.rua.lowercase()
                                  .contains(textoPesquisa) ||

                              it.rack.lowercase()
                                  .contains(textoPesquisa) ||

                              it.coluna.lowercase()
                                  .contains(textoPesquisa) ||

                              it.linha.lowercase()
                                  .contains(textoPesquisa)
                          }
                  }

                  lista =
                      if (ordenarPorEndereco) {

                          lista.sortedWith(
                              compareBy<ItemReposicao> {
                                  numeroOuTexto(it.rua)
                              }
                                  .thenBy {
                                      numeroOuTexto(it.rack)
                                  }
                                  .thenBy {
                                      numeroOuTexto(it.linha)
                                  }
                                  .thenBy {
                                      numeroOuTexto(it.coluna)
                                  }
                          )

                      } else {

                          lista.sortedBy {
                              it.timestamp
                          }
                      }

                  atualizarContadores()

                  btnPendentes.text =
                      "PENDENTES"

                  btnConcluidos.text =
                      "CONCLUÍDOS"

                  if (abaConcluidos) {

                      btnConcluidos.setBackgroundColor(
                          Color.parseColor("#2E7D32")
                      )

                      btnConcluidos.setTextColor(
                          Color.WHITE
                      )

                      btnPendentes.setBackgroundColor(
                          Color.parseColor("#E0E0E0")
                      )

                      btnPendentes.setTextColor(
                          Color.BLACK
                      )

                  } else {

                      btnPendentes.setBackgroundColor(
                          Color.parseColor("#1565C0")
                      )

                      btnPendentes.setTextColor(
                          Color.WHITE
                      )

                      btnConcluidos.setBackgroundColor(
                          Color.parseColor("#E0E0E0")
                      )

                      btnConcluidos.setTextColor(
                          Color.BLACK
                      )
                  }

                  if (lista.isEmpty()) {

                      val vazio =
                          TextView(this)

                      vazio.text =
                          if (abaConcluidos) {
                              "Nenhuma reposição concluída."
                          } else {
                              "Nenhum produto pendente de reposição."
                          }

                      vazio.textSize = 16f

                      vazio.gravity =
                          android.view.Gravity.CENTER

                      vazio.setTextColor(
                          Color.parseColor("#757575")
                      )

                      vazio.setPadding(
                          20,
                          40,
                          20,
                          40
                      )

                      containerLista.addView(vazio)

                      return
                  }

                  for (item in lista) {
                      adicionarCardReposicao(item)
                  }
              }

              private fun atualizarContadores() {

                  val pendentes =
                      registros.count {
                          !it.concluido
                      }

                  val concluidos =
                      registros.count {
                          it.concluido
                      }

                  val total =
                      registros.size

                  tvPendentes.text =
                      pendentes.toString()

                  tvConcluidos.text =
                      concluidos.toString()

                  tvTotal.text =
                      total.toString()
              }

              private fun adicionarCardReposicao(
                  item: ItemReposicao
              ) {

                  val card =
                      LayoutInflater.from(this)
                          .inflate(
                              R.layout.item_reposicao,
                              containerLista,
                              false
                          )

                  val tvCodigo =
                      card.findViewById<TextView>(
                          R.id.tvCodigo
                      )

                  val btnCopiar =
                      card.findViewById<ImageButton>(
                          R.id.btnCopiar
                      )

                  val tvStatus =
                      card.findViewById<TextView>(
                          R.id.tvStatus
                      )

                  val tvProduto =
                      card.findViewById<TextView>(
                          R.id.tvProduto
                      )

                  val tvEndereco =
                      card.findViewById<TextView>(
                          R.id.tvEndereco
                      )

                  val tvDetalhes =
                      card.findViewById<TextView>(
                          R.id.tvDetalhes
                      )

                  val btnAcao =
                      card.findViewById<Button>(
                          R.id.btnAcao
                      )

                  val btnExcluir =
                      card.findViewById<Button>(
                          R.id.btnExcluir
                      )

                  tvCodigo.text =
                      "${item.quantidade} CX • ${item.codigo}"

                  tvProduto.text =
                      item.descricao

                  tvEndereco.text =
                      "${item.rua} • ${item.rack} • Linha ${item.linha} • Coluna ${item.coluna}"

                  val dataFormatada =
                      SimpleDateFormat(
                          "dd/MM/yyyy HH:mm",
                          Locale("pt", "BR")
                      ).format(
                          Date(item.timestamp)
                      )

                  tvDetalhes.text =
                      "Operador: ${item.operador} • $dataFormatada"

                  if (item.concluido) {

                      tvStatus.text =
                          "✓ CONCLUÍDO"

                      tvStatus.setTextColor(
                          Color.parseColor("#1B5E20")
                      )

                      tvStatus.setBackgroundColor(
                          Color.parseColor("#C8E6C9")
                      )

                      btnAcao.text =
                          "REABRIR"

                      btnExcluir.visibility =
                          View.VISIBLE

                  } else {

                      tvStatus.text =
                          "PENDENTE"

                      tvStatus.setTextColor(
                          Color.parseColor("#B71C1C")
                      )

                      tvStatus.setBackgroundColor(
                          Color.parseColor("#FFCDD2")
                      )

                      btnAcao.text =
                          "CONCLUIR"

                      btnExcluir.visibility =
                          View.VISIBLE
                  }

                  btnCopiar.setOnClickListener {
                      copiarParaClipboard(item.codigo)
                  }

                  btnAcao.setOnClickListener {

                      if (item.concluido) {
                          reabrirReposicao(item)
                      } else {
                          concluirReposicao(item)
                      }
                  }

                  btnExcluir.setOnClickListener {
                      confirmarExcluir(item)
                  }

                  containerLista.addView(card)
              }

              private fun concluirReposicao(
                  item: ItemReposicao
              ) {

                  item.concluido = true

                  salvarRegistros()

                  salvarNoFirestore(item)

                  tvFeedback.text =
                      "✓ Reposição do produto ${item.codigo} concluída."

                  tvFeedback.setTextColor(
                      Color.parseColor("#1B5E20")
                  )

                  tvFeedback.setBackgroundColor(
                      Color.parseColor("#C8E6C9")
                  )

                  tvFeedback.visibility =
                      View.VISIBLE

                  atualizarInterface()
              }

              private fun reabrirReposicao(
                  item: ItemReposicao
              ) {

                  item.concluido = false

                  salvarRegistros()

                  salvarNoFirestore(item)

                  tvFeedback.text =
                      "↻ Produto ${item.codigo} voltou para pendentes."

                  tvFeedback.visibility =
                      View.VISIBLE

                  abaConcluidos = false

                  atualizarInterface()
              }

              private fun confirmarExcluir(
                  item: ItemReposicao
              ) {

                  AlertDialog.Builder(this)
                      .setTitle("Excluir registro?")
                      .setMessage(
                          "Deseja realmente excluir o registro do produto ${item.codigo}?"
                      )
                      .setNegativeButton(
                          "CANCELAR",
                          null
                      )
                      .setPositiveButton(
                          "EXCLUIR"
                      ) { _, _ ->

                          registros.remove(item)

                          salvarRegistros()

                          excluirDoFirestore(item)

                          tvFeedback.text =
                              "Registro ${item.codigo} excluído."

                          tvFeedback.visibility =
                              View.VISIBLE

                          atualizarInterface()
                      }
                      .show()
              }

              private fun numeroOuTexto(
                  valor: String
              ): String {

                  return valor
                      .trim()
                      .padStart(
                          10,
                          '0'
                      )
              }

              private fun carregarOperador() {

                  val prefs =
                      getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )

                  nomeOperador =
                      prefs.getString(
                          KEY_OPERADOR,
                          "Operador 1"
                      ) ?: "Operador 1"

                  atualizarNomeOperador()
              }

              private fun atualizarNomeOperador() {

                  tvOperador.text =
                      "👤 Operador: $nomeOperador"
              }

              private fun alterarNomeOperador() {

                  val input =
                      EditText(this)

                  input.setText(nomeOperador)

                  input.selectAll()

                  AlertDialog.Builder(this)
                      .setTitle("Nome do operador")
                      .setMessage(
                          "Digite o nome que será registrado nas reposições."
                      )
                      .setView(input)
                      .setNegativeButton(
                          "CANCELAR",
                          null
                      )
                      .setPositiveButton(
                          "SALVAR"
                      ) { _, _ ->

                          val novoNome =
                              input.text
                                  .toString()
                                  .trim()

                          if (novoNome.isNotEmpty()) {

                              nomeOperador =
                                  novoNome

                              getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                              )
                                  .edit()
                                  .putString(
                                      KEY_OPERADOR,
                                      nomeOperador
                                  )
                                  .apply()

                              atualizarNomeOperador()

                              Toast.makeText(
                                  this,
                                  "Nome do operador atualizado.",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                      .show()
              }

              private fun abrirConfiguracoes() {

                  val opcoes =
                      arrayOf(
                          "📥 Importar nova planilha",
                          "🗑 Limpar todas as reposições",
                          "ℹ Informações"
                      )

                  AlertDialog.Builder(this)
                      .setTitle("Configurações")
                      .setItems(opcoes) { _, which ->

                          when (which) {

                              0 ->
                                  importarPlanilha()

                              1 ->
                                  confirmarLimparRegistros()

                              2 ->
                                  mostrarInformacoes()
                          }
                      }
                      .show()
              }

              private fun importarPlanilha() {

                  val intent =
                      Intent(
                          Intent.ACTION_OPEN_DOCUMENT
                      )

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  )

                  intent.type =
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

                  intent.putExtra(
                      Intent.EXTRA_MIME_TYPES,
                      arrayOf(
                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                          "application/vnd.ms-excel.sheet.macroEnabled.12",
                          "application/vnd.ms-excel"
                      )
                  )

                  startActivityForResult(
                      intent,
                      REQUEST_IMPORT_XLSX
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == REQUEST_IMPORT_XLSX &&
                      resultCode == Activity.RESULT_OK
                  ) {

                      val uri =
                          data?.data

                      if (uri != null) {
                          copiarPlanilhaImportada(uri)
                      }
                  }
              }

              private fun copiarPlanilhaImportada(
                  uri: Uri
              ) {

                  try {

                      contentResolver
                          .openInputStream(uri)
                          ?.use { input ->

                              val destino =
                                  File(
                                      filesDir,
                                      PLANILHA_INTERNA
                                  )

                              FileOutputStream(destino)
                                  .use { output ->
                                      input.copyTo(output)
                                  }
                          }

                      baseProdutos.clear()

                      carregarBaseEnderecos()

                      Toast.makeText(
                          this,
                          "Planilha importada com sucesso. ${baseProdutos.size} produtos carregados.",
                          Toast.LENGTH_LONG
                      ).show()

                      atualizarInterface()

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "Erro ao importar a planilha.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun confirmarLimparRegistros() {

                  if (registros.isEmpty()) {

                      Toast.makeText(
                          this,
                          "Não há reposições para limpar.",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  AlertDialog.Builder(this)
                      .setTitle(
                          "Limpar todas as reposições?"
                      )
                      .setMessage(
                          "Todos os registros pendentes e concluídos serão removidos de TODOS os aparelhos sincronizados."
                      )
                      .setNegativeButton(
                          "CANCELAR",
                          null
                      )
                      .setPositiveButton(
                          "LIMPAR TUDO"
                      ) { _, _ ->

                          val copia =
                              registros.toList()

                          registros.clear()

                          salvarRegistros()

                          for (item in copia) {
                              excluirDoFirestore(item)
                          }

                          atualizarInterface()

                          Toast.makeText(
                              this,
                              "Todas as reposições foram removidas.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                      .show()
              }

