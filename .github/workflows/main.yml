              private fun salvarConsultas() {

                  try {

                      val array =
                          JSONArray()

                      for (consulta in consultas) {

                          val objeto =
                              JSONObject()

                          objeto.put(
                              "codigo",
                              consulta.codigo
                          )

                          objeto.put(
                              "timestamp",
                              consulta.timestamp
                          )

                          array.put(objeto)
                      }

                      getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                          .edit()
                          .putString(
