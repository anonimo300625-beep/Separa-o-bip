name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Criar Estrutura do Projeto
      run: |
        mkdir -p app/src/main/java/com/separacao/bip
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/assets

        if [ -f "dados/enderecos.csv" ]; then
          cp dados/enderecos.csv app/src/main/assets/enderecos.csv
        else
          echo "ERRO: dados/enderecos.csv não encontrado!"
          exit 1
        fi

    - name: Criar Arquivos Globais do Gradle
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.name = "ReposicaoApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

    - name: Configurar App Android
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.separacao.bip'
            compileSdk 34

            defaultConfig {
                applicationId "com.separacao.bip"
                minSdk 24
                targetSdk 34
                versionCode 3
                versionName "3.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:label="Reposição"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="stateAlwaysVisible">

                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>

                </activity>

            </application>

        </manifest>
        EOF

    - name: Gerar Layout dos Registros
      run: |
        cat << 'EOF' > app/src/main/res/layout/item_reposicao.xml
        <?xml version="1.0" encoding="utf-8"?>

        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:layout_marginLeft="8dp"
            android:layout_marginRight="8dp"
            android:layout_marginTop="6dp"
            android:layout_marginBottom="6dp"
            android:background="@android:drawable/dialog_holo_light_frame"
            android:orientation="vertical"
            android:padding="12dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical">

                <TextView
                    android:id="@+id/tvCodigoQtd"
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:textColor="#212121"
                    android:textSize="18sp"
                    android:textStyle="bold" />

                <TextView
                    android:id="@+id/tvStatusBadge"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:paddingLeft="8dp"
                    android:paddingRight="8dp"
                    android:paddingTop="4dp"
                    android:paddingBottom="4dp"
                    android:textSize="12sp"
                    android:textStyle="bold" />

            </LinearLayout>

            <TextView
                android:id="@+id/tvEndereco"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="6dp"
                android:textColor="#424242"
                android:textSize="14sp" />

            <TextView
                android:id="@+id/tvDetalhes"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="4dp"
                android:textColor="#757575"
                android:textSize="12sp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:layout_marginTop="10dp"
                android:gravity="end">

                <Button
                    android:id="@+id/btnAcao"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:textSize="12sp" />

                <Button
                    android:id="@+id/btnApagar"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginStart="8dp"
                    android:text="EXCLUIR"
                    android:textSize="12sp"
                    android:textColor="#C62828"
                    android:visibility="gone" />

            </LinearLayout>

        </LinearLayout>
        EOF

    - name: Gerar Layout Principal
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>

        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#F8F9FA">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:padding="16dp"
                android:background="#FFFFFF">

                <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="Registro de Reposição"
                    android:textSize="20sp"
                    android:textStyle="bold"
                    android:textColor="#212121" />

                <ImageButton
                    android:id="@+id/btnConfiguracoes"
                    android:layout_width="48dp"
                    android:layout_height="48dp"
                    android:background="?android:attr/selectableItemBackground"
                    android:contentDescription="Configurações"
                    android:src="@android:drawable/ic_menu_manage" />

            </LinearLayout>

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="match_parent">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="12dp">

                    <TextView
                        android:id="@+id/tvOperador"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Operador: Operador 1"
                        android:textColor="#616161"
                        android:textSize="14sp" />

                    <Button
                        android:id="@+id/btnIdentificarAparelho"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="6dp"
                        android:text="NOMEAR OPERADOR" />

                    <EditText
                        android:id="@+id/etCodigoBarras"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="12dp"
                        android:hint="Bipe o código ou digite o Código Mate"
                        android:inputType="text"
                        android:imeOptions="actionDone"
                        android:padding="12dp" />

                    <Button
                        android:id="@+id/btnProcessarCodigo"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="6dp"
                        android:text="PROCESSAR CÓDIGO" />

                    <TextView
                        android:id="@+id/tvFeedbackAdicionado"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="8dp"
                        android:visibility="gone"
                        android:textColor="#2E7D32"
                        android:textSize="14sp"
                        android:textStyle="bold" />

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:layout_marginTop="16dp"
                        android:weightSum="3">

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginEnd="4dp"
                            android:background="#FFCDD2"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">

                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="PENDENTES"
                                android:textColor="#B71C1C"
                                android:textSize="11sp"
                                android:textStyle="bold" />

                            <TextView
                                android:id="@+id/tvCountPendentes"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#B71C1C"
                                android:textSize="20sp"
                                android:textStyle="bold" />

                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginLeft="2dp"
                            android:layout_marginRight="2dp"
                            android:background="#C8E6C9"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">

                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="CONCLUÍDOS"
                                android:textColor="#1B5E20"
                                android:textSize="11sp"
                                android:textStyle="bold" />

                            <TextView
                                android:id="@+id/tvCountConcluidos"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#1B5E20"
                                android:textSize="20sp"
                                android:textStyle="bold" />

                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginStart="4dp"
                            android:background="#FFF59D"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">

                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="TOTAL"
                                android:textColor="#F57F17"
                                android:textSize="11sp"
                                android:textStyle="bold" />

                            <TextView
                                android:id="@+id/tvCountTotal"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#F57F17"
                                android:textSize="20sp"
                                android:textStyle="bold" />

                        </LinearLayout>

                    </LinearLayout>

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:layout_marginTop="16dp">

                        <Button
                            android:id="@+id/btnTabPendentes"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="PENDENTES" />

                        <Button
                            android:id="@+id/btnTabConcluidos"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginStart="4dp"
                            android:text="CONCLUÍDOS" />

                    </LinearLayout>

                    <LinearLayout
                        android:id="@+id/containerLista"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:layout_marginTop="8dp" />

                </LinearLayout>

            </ScrollView>

        </LinearLayout>
        EOF

    - name: Gerar MainActivity com salvamento permanente
      run: |
        cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
        package com.separacao.bip

        import android.app.Activity
        import android.app.AlertDialog
        import android.content.Context
        import android.content.Intent
        import android.graphics.Color
        import android.net.Uri
        import android.os.Bundle
        import android.view.LayoutInflater
        import android.view.View
        import android.view.inputmethod.EditorInfo
        import android.widget.Button
        import android.widget.EditText
        import android.widget.ImageButton
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.BufferedReader
        import java.io.InputStreamReader
        import java.io.OutputStreamWriter
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale

        data class ItemReposicao(
            val id: String,
            val codigoMate: String,
            var quantidade: Int,
            val rua: String,
            val rack: String,
            val coluna: String,
            val linha: String,
            val operador: String,
            val timestamp: Long,
            var concluido: Boolean = false
        )

        data class Quadruple<A, B, C, D>(
            val first: A,
            val second: B,
            val third: C,
            val fourth: D
        )

        class MainActivity : AppCompatActivity() {

            private lateinit var etCodigoBarras: EditText
            private lateinit var btnProcessarCodigo: Button
            private lateinit var btnIdentificarAparelho: Button
            private lateinit var btnConfiguracoes: ImageButton

            private lateinit var tvOperador: TextView
            private lateinit var tvFeedbackAdicionado: TextView

            private lateinit var tvCountPendentes: TextView
            private lateinit var tvCountConcluidos: TextView
            private lateinit var tvCountTotal: TextView

            private lateinit var btnTabPendentes: Button
            private lateinit var btnTabConcluidos: Button

            private lateinit var containerLista: LinearLayout

            private val listaReposicao = mutableListOf<ItemReposicao>()

            private var nomeOperador = "Operador 1"
            private var abaAtual = 0

            private val baseEnderecos =
                mutableMapOf<String, Quadruple<String, String, String, String>>()

            companion object {
                private const val REQUEST_PICK_CSV = 1001
                private const val REQUEST_CREATE_CSV = 1002

                private const val PREFS_NAME = "ReposicaoPrefs"
                private const val KEY_REGISTROS = "registros"
                private const val KEY_OPERADOR = "nome_operador"
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                setContentView(R.layout.activity_main)

                etCodigoBarras = findViewById(R.id.etCodigoBarras)
                btnProcessarCodigo = findViewById(R.id.btnProcessarCodigo)
                btnIdentificarAparelho = findViewById(R.id.btnIdentificarAparelho)
                btnConfiguracoes = findViewById(R.id.btnConfiguracoes)

                tvOperador = findViewById(R.id.tvOperador)
                tvFeedbackAdicionado = findViewById(R.id.tvFeedbackAdicionado)

                tvCountPendentes = findViewById(R.id.tvCountPendentes)
                tvCountConcluidos = findViewById(R.id.tvCountConcluidos)
                tvCountTotal = findViewById(R.id.tvCountTotal)

                btnTabPendentes = findViewById(R.id.btnTabPendentes)
                btnTabConcluidos = findViewById(R.id.btnTabConcluidos)

                containerLista = findViewById(R.id.containerLista)

                carregarOperadorSalvo()
                carregarBaseInicial()

                # CARREGA TODOS OS REGISTROS SALVOS
                carregarRegistrosSalvos()

                btnProcessarCodigo.setOnClickListener {
                    processarEntrada(etCodigoBarras.text.toString().trim())
                }

                btnIdentificarAparelho.setOnClickListener {
                    abrirDialogoNomeOperador()
                }

                btnConfiguracoes.setOnClickListener {
                    abrirMenuConfiguracoes()
                }

                etCodigoBarras.setOnEditorActionListener { _, actionId, _ ->

                    if (
                        actionId == EditorInfo.IME_ACTION_DONE ||
                        actionId == EditorInfo.IME_NULL
                    ) {

                        processarEntrada(etCodigoBarras.text.toString().trim())
                        true

                    } else {
                        false
                    }
                }

                btnTabPendentes.setOnClickListener {
                    abaAtual = 0
                    atualizarBotoesAbas()
                    atualizarInterface()
                }

                btnTabConcluidos.setOnClickListener {
                    abaAtual = 1
                    atualizarBotoesAbas()
                    atualizarInterface()
                }

                atualizarBotoesAbas()
                atualizarInterface()

                etCodigoBarras.requestFocus()
            }

            /*
             =====================================================
             OPERADOR
             =====================================================
            */

            private fun carregarOperadorSalvo() {

                val prefs =
                    getSharedPreferences(
                        PREFS_NAME,
                        Context.MODE_PRIVATE
                    )

                nomeOperador =
                    prefs.getString(
                        KEY_OPERADOR,
                        "Operador 1"
                    ) ?: "Operador 1"

                tvOperador.text = "Operador: $nomeOperador"
            }

            private fun salvarOperador(novoNome: String) {

                val prefs =
                    getSharedPreferences(
                        PREFS_NAME,
                        Context.MODE_PRIVATE
                    )

                prefs.edit()
                    .putString(KEY_OPERADOR, novoNome)
                    .apply()

                nomeOperador = novoNome
                tvOperador.text = "Operador: $nomeOperador"
            }

            /*
             =====================================================
             SALVAMENTO PERMANENTE DOS REGISTROS
             =====================================================
            */

            private fun salvarRegistros() {

                try {

                    val jsonArray = JSONArray()

                    for (item in listaReposicao) {

                        val json = JSONObject()

                        json.put("id", item.id)
                        json.put("codigoMate", item.codigoMate)
                        json.put("quantidade", item.quantidade)
                        json.put("rua", item.rua)
                        json.put("rack", item.rack)
                        json.put("coluna", item.coluna)
                        json.put("linha", item.linha)
                        json.put("operador", item.operador)
                        json.put("timestamp", item.timestamp)
                        json.put("concluido", item.concluido)

                        jsonArray.put(json)
                    }

                    val prefs =
                        getSharedPreferences(
                            PREFS_NAME,
                            Context.MODE_PRIVATE
                        )

                    prefs.edit()
                        .putString(
                            KEY_REGISTROS,
                            jsonArray.toString()
                        )
                        .apply()

                } catch (e: Exception) {

                    Toast.makeText(
                        this,
                        "Erro ao salvar registros",
                        Toast.LENGTH_SHORT
                    ).show()
                }
            }

            private fun carregarRegistrosSalvos() {

                try {

                    val prefs =
                        getSharedPreferences(
                            PREFS_NAME,
                            Context.MODE_PRIVATE
                        )

                    val dados =
                        prefs.getString(
                            KEY_REGISTROS,
                            null
                        ) ?: return

                    val jsonArray =
                        JSONArray(dados)

                    listaReposicao.clear()

                    for (i in 0 until jsonArray.length()) {

                        val json =
                            jsonArray.getJSONObject(i)

                        val item =
                            ItemReposicao(

                                id =
                                    json.getString("id"),

                                codigoMate =
                                    json.getString("codigoMate"),

                                quantidade =
                                    json.getInt("quantidade"),

                                rua =
                                    json.getString("rua"),

                                rack =
                                    json.getString("rack"),

                                coluna =
                                    json.getString("coluna"),

                                linha =
                                    json.getString("linha"),

                                operador =
                                    json.getString("operador"),

                                timestamp =
                                    json.getLong("timestamp"),

                                concluido =
                                    json.getBoolean("concluido")
                            )

                        listaReposicao.add(item)
                    }

                } catch (e: Exception) {

                    listaReposicao.clear()

                    Toast.makeText(
                        this,
                        "Não foi possível recuperar os registros anteriores.",
                        Toast.LENGTH_LONG
                    ).show()
                }
            }

            /*
             =====================================================
             BASE DE ENDEREÇOS
             =====================================================
            */

            private fun carregarBaseInicial() {

                try {

                    baseEnderecos.clear()

                    val reader =
                        BufferedReader(
                            InputStreamReader(
                                assets.open("enderecos.csv"),
                                Charsets.UTF_8
                            )
                        )

                    var linhaArquivo: String?
                    var primeiraLinha = true

                    while (
                        reader.readLine().also {
                            linhaArquivo = it
                        } != null
                    ) {

                        if (primeiraLinha) {
                            primeiraLinha = false
                            continue
                        }

                        val linha =
                            linhaArquivo?.trim() ?: continue

                        if (linha.isEmpty()) continue

                        val colunas =
                            linha.split(",")

                        if (colunas.size < 6) continue

                        val rua = colunas[0].trim()
                        val rack = colunas[1].trim()

                        val colunaApp = colunas[3].trim()
                        val linhaApp = colunas[4].trim()

                        val codigosTexto = colunas[5].trim()

                        val endereco =
                            Quadruple(
                                rua,
                                rack,
                                colunaApp,
                                linhaApp
                            )

                        val codigos =
                            codigosTexto.split(";")

                        for (codigoOriginal in codigos) {

                            val codigo =
                                codigoOriginal
                                    .trim()
                                    .filter { it.isDigit() }

                            if (codigo.length == 5) {
                                baseEnderecos[codigo] = endereco
                            }
                        }
                    }

                    reader.close()

                } catch (e: Exception) {

                    Toast.makeText(
                        this,
                        "Erro ao carregar base de endereços",
                        Toast.LENGTH_LONG
                    ).show()
                }
            }

            /*
             =====================================================
             IDENTIFICAÇÃO DO OPERADOR
             =====================================================
            */

            private fun abrirDialogoNomeOperador() {

                val input = EditText(this)

                input.setText(nomeOperador)

                AlertDialog.Builder(this)
                    .setTitle("Nome do Operador")
                    .setMessage("Digite o nome do operador:")
                    .setView(input)

                    .setPositiveButton("Salvar") { _, _ ->

                        val novoNome =
                            input.text.toString().trim()

                        if (novoNome.isNotEmpty()) {

                            salvarOperador(novoNome)

                            Toast.makeText(
                                this,
                                "Operador salvo!",
                                Toast.LENGTH_SHORT
                            ).show()
                        }
                    }

                    .setNegativeButton("Cancelar", null)
                    .show()
            }

            /*
             =====================================================
             CONFIGURAÇÕES
             =====================================================
            */

            private fun abrirMenuConfiguracoes() {

                val opcoes =
                    arrayOf(
                        "Importar Planilha de Endereços (.csv)",
                        "Exportar Modelo CSV",
                        "Visualizar Mapeamentos"
                    )

                AlertDialog.Builder(this)
                    .setTitle("Configurações")

                    .setItems(opcoes) { _, which ->

                        when (which) {

                            0 -> abrirSeletorPlanilha()
                            1 -> exportarPlanilhaModelo()
                            2 -> exibirMapeamentos()
                        }
                    }

                    .show()
            }

            /*
             =====================================================
             EXTRAÇÃO DO CÓDIGO MATE
             =====================================================
            */

            private fun extrairCodigoMate(entrada: String): String {

                val numeros =
                    entrada.filter { it.isDigit() }

                return when {

                    numeros.length == 5 ->
                        numeros

                    numeros.length >= 6 ->
                        numeros
                            .dropLast(1)
                            .takeLast(5)

                    else ->
                        ""
                }
            }

            /*
             =====================================================
             PROCESSAR CÓDIGO
             =====================================================
            */

            private fun processarEntrada(entrada: String) {

                if (entrada.isEmpty()) {

                    Toast.makeText(
                        this,
                        "Digite ou bipe um código válido",
                        Toast.LENGTH_SHORT
                    ).show()

                    return
                }

                val mate =
                    extrairCodigoMate(entrada)

                if (mate.length != 5) {

                    Toast.makeText(
                        this,
                        "Não foi possível identificar um Código Mate válido.",
                        Toast.LENGTH_LONG
                    ).show()

                    return
                }

                val item =
                    adicionarOuAgruparItem(mate)

                if (item != null) {

                    tvFeedbackAdicionado.visibility =
                        View.VISIBLE

                    tvFeedbackAdicionado.text =
                        "Código ${item.codigoMate} — " +
                        "${item.rua} — Rack ${item.rack} — " +
                        "Coluna ${item.coluna} — Linha ${item.linha}"
                }

                etCodigoBarras.setText("")
                etCodigoBarras.requestFocus()

                atualizarInterface()
            }

            /*
             =====================================================
             ADICIONAR OU AGRUPAR
             =====================================================
            */

            private fun adicionarOuAgruparItem(
                mate: String
            ): ItemReposicao? {

                val enderecoInfo =
                    baseEnderecos[mate]

                if (enderecoInfo == null) {

                    Toast.makeText(
                        this,
                        "Código Mate $mate não encontrado na base.",
                        Toast.LENGTH_LONG
                    ).show()

                    return null
                }

                val itemExistente =
                    listaReposicao.find {
                        it.codigoMate == mate &&
                        !it.concluido
                    }

                if (itemExistente != null) {

                    AlertDialog.Builder(this)

                        .setTitle("Código já solicitado")

                        .setMessage(
                            "O código $mate já possui " +
                            "${itemExistente.quantidade} caixa(s) pendente(s).\n\n" +
                            "Adicionar mais uma caixa?"
                        )

                        .setNegativeButton("Cancelar", null)

                        .setPositiveButton("Adicionar") { _, _ ->

                            itemExistente.quantidade += 1

                            # SALVA A ALTERAÇÃO
                            salvarRegistros()

                            tvFeedbackAdicionado.visibility =
                                View.VISIBLE

                            tvFeedbackAdicionado.text =
                                "${itemExistente.quantidade} cx $mate pendentes"

                            atualizarInterface()

                            etCodigoBarras.requestFocus()
                        }

                        .show()

                    return null
                }

                val novoItem =
                    ItemReposicao(

                        id =
                            System.currentTimeMillis().toString() +
                            "_" +
                            (0..1000).random(),

                        codigoMate = mate,
                        quantidade = 1,

                        rua = enderecoInfo.first,
                        rack = enderecoInfo.second,
                        coluna = enderecoInfo.third,
                        linha = enderecoInfo.fourth,

                        operador = nomeOperador,

                        timestamp = System.currentTimeMillis(),

                        concluido = false
                    )

                listaReposicao.add(novoItem)

                # SALVA IMEDIATAMENTE
                salvarRegistros()

                return novoItem
            }

            /*
             =====================================================
             ABAS
             =====================================================
            */

            private fun atualizarBotoesAbas() {

                if (abaAtual == 0) {

                    btnTabPendentes.setBackgroundColor(
                        Color.parseColor("#1E88E5")
                    )

                    btnTabPendentes.setTextColor(Color.WHITE)

                    btnTabConcluidos.setBackgroundColor(
                        Color.parseColor("#E0E0E0")
                    )

                    btnTabConcluidos.setTextColor(
                        Color.parseColor("#424242")
                    )

                } else {

                    btnTabConcluidos.setBackgroundColor(
                        Color.parseColor("#1E88E5")
                    )

                    btnTabConcluidos.setTextColor(Color.WHITE)

                    btnTabPendentes.setBackgroundColor(
                        Color.parseColor("#E0E0E0")
                    )

                    btnTabPendentes.setTextColor(
                        Color.parseColor("#424242")
                    )
                }
            }

            /*
             =====================================================
             ATUALIZAR INTERFACE
             =====================================================
            */

            private fun atualizarInterface() {

                val pendentes =
                    listaReposicao.filter {
                        !it.concluido
                    }

                val concluidos =
                    listaReposicao.filter {
                        it.concluido
                    }

                tvCountPendentes.text =
                    pendentes.sumOf {
                        it.quantidade
                    }.toString()

                tvCountConcluidos.text =
                    concluidos.sumOf {
                        it.quantidade
                    }.toString()

                tvCountTotal.text =
                    listaReposicao.sumOf {
                        it.quantidade
                    }.toString()

                containerLista.removeAllViews()

                val listaExibicao =

                    if (abaAtual == 0) {

                        pendentes.sortedBy {
                            it.timestamp
                        }

                    } else {

                        concluidos.sortedByDescending {
                            it.timestamp
                        }
                    }

                val sdf =
                    SimpleDateFormat(
                        "dd/MM HH:mm",
                        Locale.getDefault()
                    )

                for (item in listaExibicao) {

                    val itemView =
                        LayoutInflater.from(this)
                            .inflate(
                                R.layout.item_reposicao,
                                containerLista,
                                false
                            )

                    val tvCodigoQtd =
                        itemView.findViewById<TextView>(
                            R.id.tvCodigoQtd
                        )

                    val tvStatusBadge =
                        itemView.findViewById<TextView>(
                            R.id.tvStatusBadge
                        )

                    val tvEndereco =
                        itemView.findViewById<TextView>(
                            R.id.tvEndereco
                        )

                    val tvDetalhes =
                        itemView.findViewById<TextView>(
                            R.id.tvDetalhes
                        )

                    val btnAcao =
                        itemView.findViewById<Button>(
                            R.id.btnAcao
                        )

                    val btnApagar =
                        itemView.findViewById<Button>(
                            R.id.btnApagar
                        )

                    tvCodigoQtd.text =
                        "${item.quantidade} cx ${item.codigoMate}"

                    tvEndereco.text =
                        "${item.rua} — Rack ${item.rack} — " +
                        "Coluna ${item.coluna} — Linha ${item.linha}"

                    tvDetalhes.text =
                        "${item.operador} • " +
                        sdf.format(Date(item.timestamp))

                    if (item.concluido) {

                        tvStatusBadge.text = "Concluído"

                        tvStatusBadge.setBackgroundColor(
                            Color.parseColor("#E8F5E9")
                        )

                        tvStatusBadge.setTextColor(
                            Color.parseColor("#2E7D32")
                        )

                        btnAcao.text = "DESFAZER"

                        btnAcao.setOnClickListener {

                            item.concluido = false

                            # SALVA
                            salvarRegistros()

                            atualizarInterface()
                        }

                        btnApagar.visibility = View.VISIBLE

                        btnApagar.setOnClickListener {

                            AlertDialog.Builder(this)

                                .setTitle("Excluir registro?")

                                .setMessage(
                                    "Esse registro será apagado permanentemente."
                                )

                                .setNegativeButton(
                                    "Cancelar",
                                    null
                                )

                                .setPositiveButton(
                                    "Excluir"
                                ) { _, _ ->

                                    listaReposicao.remove(item)

                                    # SALVA A EXCLUSÃO
                                    salvarRegistros()

                                    Toast.makeText(
                                        this,
                                        "Registro excluído permanentemente",
                                        Toast.LENGTH_SHORT
                                    ).show()

                                    atualizarInterface()
                                }

                                .show()
                        }

                    } else {

                        tvStatusBadge.text = "Pendente"

                        tvStatusBadge.setBackgroundColor(
                            Color.parseColor("#FFEBEE")
                        )

                        tvStatusBadge.setTextColor(
                            Color.parseColor("#C62828")
                        )

                        btnAcao.text = "CONCLUIR"

                        btnAcao.setOnClickListener {

                            item.concluido = true

                            # SALVA A CONCLUSÃO
                            salvarRegistros()

                            atualizarInterface()
                        }

                        btnApagar.visibility = View.GONE
                    }

                    containerLista.addView(itemView)
                }
            }

            /*
             =====================================================
             IMPORTAR CSV
             =====================================================
            */

            private fun abrirSeletorPlanilha() {

                val intent =
                    Intent(Intent.ACTION_GET_CONTENT).apply {

                        type = "*/*"

                        addCategory(
                            Intent.CATEGORY_OPENABLE
                        )
                    }

                startActivityForResult(
                    Intent.createChooser(
                        intent,
                        "Selecione a planilha CSV"
                    ),
                    REQUEST_PICK_CSV
                )
            }

            private fun importarCSV(uri: Uri) {

                try {

                    val reader =
                        BufferedReader(
                            InputStreamReader(
                                contentResolver.openInputStream(uri),
                                Charsets.UTF_8
                            )
                        )

                    var linhaArquivo: String?
                    var primeiraLinha = true

                    val novaBase =
                        mutableMapOf<
                            String,
                            Quadruple<String, String, String, String>
                        >()

                    while (
                        reader.readLine().also {
                            linhaArquivo = it
                        } != null
                    ) {

                        if (primeiraLinha) {
                            primeiraLinha = false
                            continue
                        }

                        val linha =
                            linhaArquivo?.trim() ?: continue

                        if (linha.isEmpty()) continue

                        val colunas =
                            linha.split(",")

                        if (colunas.size < 6) continue

                        val rua = colunas[0].trim()
                        val rack = colunas[1].trim()
                        val coluna = colunas[3].trim()
                        val linhaPosicao = colunas[4].trim()
                        val codigosTexto = colunas[5].trim()

                        val endereco =
                            Quadruple(
                                rua,
                                rack,
                                coluna,
                                linhaPosicao
                            )

                        for (
                            codigoOriginal
                            in codigosTexto.split(";")
                        ) {

                            val codigo =
                                codigoOriginal
                                    .trim()
                                    .filter { it.isDigit() }

                            if (codigo.length == 5) {
                                novaBase[codigo] = endereco
                            }
                        }
                    }

                    reader.close()

                    if (novaBase.isEmpty()) {

                        Toast.makeText(
                            this,
                            "Nenhum código válido encontrado.",
                            Toast.LENGTH_LONG
                        ).show()

                        return
                    }

                    AlertDialog.Builder(this)

                        .setTitle("Atualizar base?")

                        .setMessage(
                            "Foram encontrados ${novaBase.size} códigos.\n\n" +
                            "A base atual será substituída."
                        )

                        .setNegativeButton(
                            "Cancelar",
                            null
                        )

                        .setPositiveButton(
                            "Atualizar"
                        ) { _, _ ->

                            baseEnderecos.clear()

                            baseEnderecos.putAll(novaBase)

                            Toast.makeText(
                                this,
                                "Base atualizada!",
                                Toast.LENGTH_LONG
                            ).show()
                        }

                        .show()

                } catch (e: Exception) {

                    Toast.makeText(
                        this,
                        "Erro ao importar CSV: ${e.message}",
                        Toast.LENGTH_LONG
                    ).show()
                }
            }

            /*
             =====================================================
             EXPORTAR MODELO CSV
             =====================================================
            */

            private fun exportarPlanilhaModelo() {

                val intent =
                    Intent(Intent.ACTION_CREATE_DOCUMENT).apply {

                        addCategory(Intent.CATEGORY_OPENABLE)

                        type = "text/csv"

                        putExtra(
                            Intent.EXTRA_TITLE,
                            "modelo_enderecos.csv"
                        )
                    }

                startActivityForResult(
                    intent,
                    REQUEST_CREATE_CSV
                )
            }

            private fun gerarCSVModelo(uri: Uri) {

                try {

                    val writer =
                        OutputStreamWriter(
                            contentResolver.openOutputStream(uri)
                        )

                    writer.write(
                        "Nome estacao,Nr Rack,Area Linha Separaçao,Linha,Coluna,Codigo Material\n"
                    )

                    writer.write(
                        "RUA 1,1,,5,B,48303;55968\n"
                    )

                    writer.flush()
                    writer.close()

                    Toast.makeText(
                        this,
                        "Modelo CSV salvo!",
                        Toast.LENGTH_LONG
                    ).show()

                } catch (e: Exception) {

                    Toast.makeText(
                        this,
                        "Erro ao salvar modelo",
                        Toast.LENGTH_LONG
                    ).show()
                }
            }

            /*
             =====================================================
             VISUALIZAR MAPEAMENTOS
             =====================================================
            */

            private fun exibirMapeamentos() {

                val sb = StringBuilder()

                sb.append(
                    "Total de códigos: ${baseEnderecos.size}\n\n"
                )

                for ((codigo, end) in baseEnderecos) {

                    sb.append("Código: $codigo\n")

                    sb.append(
                        "${end.first} — Rack ${end.second} — " +
                        "Coluna ${end.third} — Linha ${end.fourth}\n\n"
                    )
                }

                val tv = TextView(this)

                tv.text = sb.toString()

                tv.setPadding(
                    32,
                    32,
                    32,
                    32
                )

                val scroll = ScrollView(this)

                scroll.addView(tv)

                AlertDialog.Builder(this)
                    .setTitle("Mapeamentos")
                    .setView(scroll)
                    .setPositiveButton("OK", null)
                    .show()
            }

            /*
             =====================================================
             RESULTADO DE IMPORTAÇÃO / EXPORTAÇÃO
             =====================================================
            */

            override fun onActivityResult(
                requestCode: Int,
                resultCode: Int,
                data: Intent?
            ) {

                super.onActivityResult(
                    requestCode,
                    resultCode,
                    data
                )

                if (
                    requestCode == REQUEST_PICK_CSV &&
                    resultCode == Activity.RESULT_OK
                ) {

                    data?.data?.let {
                        importarCSV(it)
                    }

                } else if (
                    requestCode == REQUEST_CREATE_CSV &&
                    resultCode == Activity.RESULT_OK
                ) {

                    data?.data?.let {
                        gerarCSVModelo(it)
                    }
                }
            }
        }
