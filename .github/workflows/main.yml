                                  mostrarResumoOperacao()

                              3 ->
                                  confirmarEncerrarOperacao()
                          }
                      }
                      .show()
              }

              private fun mostrarResumoOperacao() {

                  val pendentes =
                      registros.filter {
                          !it.concluido
                      }

                  val concluidos =
                      registros.filter {
                          it.concluido
                      }

                  val operadores =
                      registros
                          .groupBy {
                              it.operador
                          }
                          .entries
                          .sortedByDescending {
                              it.value.size
                          }
                          .joinToString("\n") {

                              "👤 ${it.key}: ${it.value.sumOf { r -> r.quantidade }} caixa(s)"
                          }

                  AlertDialog.Builder(this)
                      .setTitle("📊 Resumo da operação")
                      .setMessage(
                          "🔴 Pendentes: ${pendentes.sumOf { it.quantidade }} caixa(s)\n\n" +
                          "🟢 Concluídos: ${concluidos.sumOf { it.quantidade }} caixa(s)\n\n" +
                          "🟡 Total: ${registros.sumOf { it.quantidade }} caixa(s)\n\n" +
                          "OPERADORES:\n$operadores"
                      )
                      .setPositiveButton(
                          "OK",
                          null
                      )
                      .show()
              }

              private fun confirmarEncerrarOperacao() {

                  if (registros.isEmpty()) {

                      Toast.makeText(
                          this,
                          "Não existem registros para encerrar.",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  val pendentes =
                      registros.count {
                          !it.concluido
                      }

                  val mensagem =
                      if (pendentes > 0) {

                          "Ainda existem $pendentes pendência(s).\n\n" +
                          "Deseja realmente apagar todos os registros da operação?"

                      } else {

                          "Todos os registros de reposição serão apagados permanentemente.\n\n" +
                          "As consultas NÃO serão apagadas."
                      }

                  AlertDialog.Builder(this)
                      .setTitle("⚠️ Encerrar operação?")
                      .setMessage(mensagem)
                      .setNegativeButton(
                          "CANCELAR",
                          null
                      )
                      .setPositiveButton(
                          "ENCERRAR"
                      ) { _, _ ->

                          registros.clear()

                          salvarRegistros()

                          atualizarInterface()

                          Toast.makeText(
                              this,
                              "Operação encerrada. Os registros foram removidos.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                      .show()
              }

              private fun selecionarPlanilha() {

                  val intent =
                      Intent(
                          Intent.ACTION_OPEN_DOCUMENT
                      )

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  )

                  intent.type =
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

                  startActivityForResult(
                      intent,
                      REQUEST_IMPORT_XLSX
                  )
              }

              private fun mostrarInformacoesBase() {

                  AlertDialog.Builder(this)
                      .setTitle("Base de endereços")
                      .setMessage(
                          "Produtos mapeados: ${baseProdutos.size}\n\n" +
                          "Os endereços mostrados nas consultas e reposições utilizam sempre a planilha atualmente carregada."
                      )
                      .setPositiveButton(
                          "OK",
                          null
                      )
                      .show()
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode ==
                      REQUEST_IMPORT_XLSX &&
                      resultCode ==
                      Activity.RESULT_OK
                  ) {

                      val uri =
                          data?.data ?: return

                      importarPlanilha(uri)
                  }
              }

              private fun importarPlanilha(
                  uri: Uri
              ) {

                  try {

                      val arquivo =
                          File(
                              filesDir,
                              PLANILHA_INTERNA
                          )

                      contentResolver
                          .openInputStream(uri)
                          ?.use { input ->

                              FileOutputStream(arquivo)
                                  .use { output ->

                                      input.copyTo(output)
                                  }
                          }

                      carregarPlanilha(
                          FileInputStream(arquivo)
                      )

                      atualizarInterface()

                      Toast.makeText(
                          this,
                          "Planilha atualizada!\n${baseProdutos.size} produtos encontrados.",
                          Toast.LENGTH_LONG
                      ).show()

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "Erro ao importar planilha: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              // =========================================================
              // CARREGAMENTO DA PLANILHA
              // =========================================================

              private fun carregarBaseEnderecos() {

                  val arquivo =
                      File(
                          filesDir,
                          PLANILHA_INTERNA
                      )

                  try {

                      if (arquivo.exists()) {

                          carregarPlanilha(
                              FileInputStream(arquivo)
                          )

                      } else {

                          assets
                              .open("enderecos.xlsx")
                              .use { input ->

                                  carregarPlanilha(input)
                              }
                      }

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "Erro ao carregar a planilha de endereços.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun carregarPlanilha(
                  input: InputStream
              ) {

                  val arquivoTemp =
                      File(
                          cacheDir,
                          "planilha_temp.xlsx"
                      )

                  FileOutputStream(arquivoTemp)
                      .use { output ->

                          input.copyTo(output)
                      }

                  baseProdutos.clear()

                  ZipFile(arquivoTemp).use { zip ->

                      val sharedStrings =
                          mutableListOf<String>()

                      val shared =
                          zip.getEntry(
                              "xl/sharedStrings.xml"
                          )

                      if (shared != null) {

                          zip.getInputStream(shared)
                              .use {

                                  sharedStrings.addAll(
                                      lerSharedStrings(it)
                                  )
                              }
                      }

                      val sheet =
                          zip.entries()
                              .asSequence()
                              .firstOrNull {
                                  it.name.startsWith(
                                      "xl/worksheets/sheet"
                                  ) &&
                                  it.name.endsWith(
                                      ".xml"
                                  )
                              }

                      if (sheet == null) {

                          throw Exception(
                              "Nenhuma planilha encontrada."
                          )
                      }

                      zip.getInputStream(sheet)
                          .use {

                              val linhas =
                                  lerPlanilhaXML(
                                      it,
                                      sharedStrings
                                  )

                              processarLinhas(linhas)
                          }
                  }

                  arquivoTemp.delete()
              }

              private fun lerSharedStrings(
                  input: InputStream
              ): List<String> {

                  val resultado =
                      mutableListOf<String>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var textoAtual = ""

                  var event =
                      parser.eventType

                  while (
                      event !=
                      XmlPullParser.END_DOCUMENT
                  ) {

                      when (event) {

                          XmlPullParser.START_TAG -> {

                              if (parser.name == "si") {

                                  textoAtual = ""
                              }
                          }

                          XmlPullParser.TEXT -> {

                              textoAtual += parser.text
                          }

                          XmlPullParser.END_TAG -> {

                              if (parser.name == "si") {

                                  resultado.add(textoAtual)
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun lerPlanilhaXML(
                  input: InputStream,
                  sharedStrings: List<String>
              ): List<List<String>> {

                  val resultado =
                      mutableListOf<List<String>>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var event =
                      parser.eventType

                  var linhaAtual =
                      mutableMapOf<Int, String>()

                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""

                  while (
                      event !=
                      XmlPullParser.END_DOCUMENT
                  ) {

                      when (event) {

                          XmlPullParser.START_TAG -> {

                              when (parser.name) {

                                  "row" -> {

                                      linhaAtual =
                                          mutableMapOf()
                                  }

                                  "c" -> {

                                      val referencia =
                                          parser.getAttributeValue(
                                              null,
                                              "r"
                                          ) ?: ""

                                      colunaAtual =
                                          numeroColuna(referencia)

                                      tipoCelula =
                                          parser.getAttributeValue(
                                              null,
                                              "t"
                                          ) ?: ""

                                      valor = ""
                                  }

                                  "v", "t" -> {

                                      valor = ""
                                  }
                              }
                          }

                          XmlPullParser.TEXT -> {

                              valor += parser.text
                          }

                          XmlPullParser.END_TAG -> {

                              when (parser.name) {

                                  "c" -> {

                                      var final =
                                          valor.trim()

                                      if (
                                          tipoCelula == "s" &&
                                          final.isNotEmpty()
                                      ) {

                                          val indice =
                                              final.toIntOrNull()

                                          if (
                                              indice != null &&
                                              indice < sharedStrings.size
                                          ) {

                                              final =
                                                  sharedStrings[indice]
                                          }
                                      }

                                      linhaAtual[colunaAtual] =
                                          final
                                  }

                                  "row" -> {

                                      if (
                                          linhaAtual.isNotEmpty()
                                      ) {

                                          val max =
                                              linhaAtual.keys.maxOrNull()
                                                  ?: 0

                                          val lista =
                                              MutableList(max + 1) {
                                                  ""
                                              }

                                          for (
                                              (indice, texto) in linhaAtual
                                          ) {

                                              if (
                                                  indice < lista.size
                                              ) {

                                                  lista[indice] =
                                                      texto
                                              }
                                          }

                                          resultado.add(lista)
                                      }
                                  }
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun numeroColuna(
                  referencia: String
              ): Int {

                  var resultado = 0

                  for (c in referencia) {

                      if (c.isDigit()) break

                      resultado =
                          resultado * 26 +
                          (
                              c.uppercaseChar() -
                              'A' +
                              1
                          )
                  }

                  return resultado - 1
              }

              private fun processarLinhas(
                  linhas: List<List<String>>
              ) {

                  if (linhas.isEmpty()) return

                  var indiceCabecalho = -1

                  for (i in linhas.indices) {

                      val texto =
                          linhas[i]
                              .joinToString("|")
                              .lowercase()

                      if (
                          texto.contains("cod material") &&
                          texto.contains("desc material")
                      ) {

                          indiceCabecalho = i
                          break
                      }
                  }

                  if (indiceCabecalho == -1) {

                      throw Exception(
                          "Não foi possível localizar os cabeçalhos da planilha."
                      )
                  }

                  val cabecalho =
                      linhas[indiceCabecalho]

                  fun localizar(nome: String): Int {

                      return cabecalho.indexOfFirst {

                          it.trim().equals(
                              nome,
                              ignoreCase = true
                          )
                      }
                  }

                  val codMaterial =
                      localizar("Cod Material")

                  val descMaterial =
                      localizar("Desc Material")

                  val estacao =
                      localizar("Estacao")

                  val rack =
                      localizar("Rack")

                  val linhaProd =
                      localizar("Linha prod alocado")

                  val colunaProd =
                      localizar("Coluna prod alocado")

                  if (
                      codMaterial < 0 ||
                      descMaterial < 0 ||
                      estacao < 0 ||
                      rack < 0 ||
                      linhaProd < 0 ||
                      colunaProd < 0
                  ) {

                      throw Exception(
                          "A planilha não possui todas as colunas necessárias."
                      )
                  }

                  for (
                      i in
                      (indiceCabecalho + 1)
                          until linhas.size
                  ) {

                      val linha =
                          linhas[i]

                      fun valor(indice: Int): String {

                          return if (
                              indice >= 0 &&
                              indice < linha.size
                          ) {

                              linha[indice].trim()

                          } else {

                              ""
                          }
                      }

                      val codigoBruto =
                          valor(codMaterial)

                      val codigo =
                          codigoBruto
                              .filter {
                                  it.isDigit()
                              }
                              .takeLast(5)

                      if (codigo.length != 5) {

                          continue
                      }

                      val descricao =
                          valor(descMaterial)

                      val rua =
                          valor(estacao)

                      val rackValor =
                          valor(rack)

                      val valorLinhaPlanilha =
                          valor(linhaProd)

                      val valorColunaPlanilha =
                          valor(colunaProd)

                      /*
                       * Normalização:
                       *
                       * Coluna deve ser número.
                       * Linha deve ser letra.
                       *
                       * Caso a planilha venha com os campos
                       * invertidos, o aplicativo corrige automaticamente.
                       */

                      val primeiro =
                          valorLinhaPlanilha.trim()

                      val segundo =
                          valorColunaPlanilha.trim()

                      val coluna: String
                      val linhaEndereco: String

                      if (
                          primeiro.any { it.isDigit() } &&
                          segundo.any { it.isLetter() }
                      ) {

                          coluna = primeiro
                          linhaEndereco = segundo

                      } else if (
                          segundo.any { it.isDigit() } &&
                          primeiro.any { it.isLetter() }
                      ) {

                          coluna = segundo
                          linhaEndereco = primeiro

                      } else {

                          coluna = primeiro
                          linhaEndereco = segundo
                      }

                      baseProdutos[codigo] =
                          EnderecoProduto(
                              codigo = codigo,
                              descricao = descricao,
                              rua = rua,
                              rack = rackValor,
                              coluna = coluna,
                              linha = linhaEndereco
                          )
                  }

                  if (baseProdutos.isEmpty()) {

                      throw Exception(
                          "Nenhum produto válido foi encontrado."
                      )
                  }
              }
          }
          EOF

      - name: Criar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-reposicao-v6
          path: app/build/outputs/apk/debug/app-debug.apk
