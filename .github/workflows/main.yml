name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)

          if [ -z "$XLSX_FILE" ]; then
            echo "ERRO: Nenhuma planilha XLSX encontrada dentro da pasta dados/"
            exit 1
          fi

          echo "Planilha encontrada: $XLSX_FILE"

          cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx

      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Criar layout principal
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F5F5F5">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="14dp"
                  android:background="#FFFFFF">

                  <TextView
                      android:id="@+id/tvTitulo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Registro de Reposição"
                      android:textColor="#212121"
                      android:textSize="20sp"
                      android:textStyle="bold"/>

                  <ImageButton
                      android:id="@+id/btnConfiguracoes"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="?android:attr/selectableItemBackground"
                      android:src="@android:drawable/ic_menu_manage"
                      android:contentDescription="Configurações"/>

              </LinearLayout>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnModoReposicao"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="📦 REPOSIÇÃO"
                              android:textSize="12sp"/>

                          <Button
                              android:id="@+id/btnModoConsulta"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="5dp"
                              android:text="🔎 CONSULTAR"
                              android:textSize="12sp"/>

                      </LinearLayout>

                      <TextView
                          android:id="@+id/tvOperador"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:text="Operador: Operador 1"
                          android:textColor="#616161"
                          android:textSize="14sp"/>

                      <Button
                          android:id="@+id/btnNomeOperador"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="ALTERAR NOME DO OPERADOR"/>

                      <TextView
                          android:id="@+id/tvModoDescricao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:textColor="#616161"
                          android:textSize="14sp"/>

                      <EditText
                          android:id="@+id/etCodigo"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:hint="Bipe ou digite o Código Mate"
                          android:inputType="number"
                          android:maxLength="30"
                          android:imeOptions="actionDone"
                          android:padding="14dp"/>

                      <Button
                          android:id="@+id/btnProcessar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="ADICIONAR REPOSIÇÃO"/>

                      <Button
                          android:id="@+id/btnLimparConsultas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="🗑 LIMPAR CONSULTAS"
                          android:visibility="gone"/>

                      <TextView
                          android:id="@+id/tvFeedback"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:textColor="#2E7D32"
                          android:textSize="14sp"
                          android:textStyle="bold"
                          android:visibility="gone"/>

                      <LinearLayout
                          android:id="@+id/containerContadores"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="14dp"
                          android:orientation="horizontal"
                          android:weightSum="3">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginEnd="4dp"
                              android:background="#FFCDD2"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="10dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="PENDENTES"
                                  android:textColor="#B71C1C"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvPendentes"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="#B71C1C"
                                  android:textSize="22sp"
                                  android:textStyle="bold"/>

                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="2dp"
                              android:layout_marginEnd="2dp"
                              android:background="#C8E6C9"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="10dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="CONCLUÍDOS"
                                  android:textColor="#1B5E20"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvConcluidos"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="#1B5E20"
                                  android:textSize="22sp"
                                  android:textStyle="bold"/>

                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="4dp"
                              android:background="#FFF59D"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="10dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="TOTAL"
                                  android:textColor="#F57F17"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>

                              <TextView
                                  android:id="@+id/tvTotal"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="#F57F17"
                                  android:textSize="22sp"
                                  android:textStyle="bold"/>

                          </LinearLayout>

                      </LinearLayout>

                      <EditText
                          android:id="@+id/etPesquisa"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:hint="🔍 Pesquisar código, produto ou endereço"
                          android:inputType="text"
                          android:padding="12dp"/>

                      <LinearLayout
                          android:id="@+id/containerOrdenacao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnOrdemTempo"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="⏰ ORDEM DE SOLICITAÇÃO"
                              android:textSize="10sp"/>

                          <Button
                              android:id="@+id/btnOrdemEndereco"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="5dp"
                              android:text="📍 POR ENDEREÇO"
                              android:textSize="10sp"/>

                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerAbas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnPendentes"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="PENDENTES"/>

                          <Button
                              android:id="@+id/btnConcluidos"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="5dp"
                              android:text="CONCLUÍDOS"/>

                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/containerLista"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="vertical"/>

                  </LinearLayout>

              </ScrollView>

          </LinearLayout>
          EOF

      - name: Criar layout dos registros
        run: |
          cat << 'EOF' > app/src/main/res/layout/item_reposicao.xml
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="6dp"
              android:background="#FFFFFF"
              android:orientation="vertical"
              android:padding="14dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/tvCodigo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textColor="#212121"
                      android:textSize="19sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:padding="6dp"
                      android:textStyle="bold"/>

              </LinearLayout>

              <TextView
                  android:id="@+id/tvProduto"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="5dp"
                  android:textColor="#424242"
                  android:textSize="15sp"/>

              <TextView
                  android:id="@+id/tvEndereco"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#1565C0"
                  android:textSize="15sp"
                  android:textStyle="bold"/>

              <TextView
                  android:id="@+id/tvDetalhes"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="5dp"
                  android:textColor="#757575"
                  android:textSize="12sp"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:gravity="end"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btnAcao"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"/>

                  <Button
                      android:id="@+id/btnExcluir"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="6dp"
                      android:text="EXCLUIR"
                      android:visibility="gone"/>

              </LinearLayout>

          </LinearLayout>
          EOF

      - name: Criar MainActivity
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
          package com.separacao.bip

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.util.Xml
          import android.view.LayoutInflater
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.UUID
          import java.util.zip.ZipFile

          data class EnderecoProduto(
              val codigo: String,
              val descricao: String,
              val rua: String,
              val rack: String,
              val coluna: String,
              val linha: String
          )

          data class ItemReposicao(
              val id: String,
              val codigo: String,
              val descricao: String,
              var quantidade: Int,
              val rua: String,
              val rack: String,
              val coluna: String,
              val linha: String,
              val operador: String,
              val timestamp: Long,
              var concluido: Boolean
          )

          data class ItemConsulta(
              val codigo: String,
              val timestamp: Long
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var tvTitulo: TextView
              private lateinit var tvOperador: TextView
              private lateinit var tvModoDescricao: TextView

              private lateinit var etCodigo: EditText
              private lateinit var etPesquisa: EditText

              private lateinit var btnProcessar: Button
              private lateinit var btnLimparConsultas: Button

              private lateinit var btnModoReposicao: Button
              private lateinit var btnModoConsulta: Button
              private lateinit var btnNomeOperador: Button
              private lateinit var btnConfiguracoes: ImageButton

              private lateinit var btnOrdemTempo: Button
              private lateinit var btnOrdemEndereco: Button

              private lateinit var tvFeedback: TextView

              private lateinit var containerContadores: LinearLayout
              private lateinit var containerOrdenacao: LinearLayout
              private lateinit var containerAbas: LinearLayout
              private lateinit var containerLista: LinearLayout

              private lateinit var tvPendentes: TextView
              private lateinit var tvConcluidos: TextView
              private lateinit var tvTotal: TextView

              private lateinit var btnPendentes: Button
              private lateinit var btnConcluidos: Button

              private val baseProdutos =
                  mutableMapOf<String, EnderecoProduto>()

              private val registros =
                  mutableListOf<ItemReposicao>()

              private val consultas =
                  mutableListOf<ItemConsulta>()

              private var nomeOperador = "Operador 1"

              private var modoConsulta = false
              private var abaConcluidos = false

              private var ordenarPorEndereco = false

              companion object {

                  const val PREFS = "reposicao_prefs"

                  const val KEY_REGISTROS = "registros"
                  const val KEY_CONSULTAS = "consultas"
                  const val KEY_OPERADOR = "operador"

                  const val REQUEST_IMPORT_XLSX = 500

                  const val PLANILHA_INTERNA =
                      "enderecos_atualizados.xlsx"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContentView(R.layout.activity_main)

                  inicializarViews()

                  carregarOperador()
                  carregarRegistros()
                  carregarConsultas()

                  carregarBaseEnderecos()

                  configurarEventos()

                  atualizarModo()
                  atualizarInterface()

                  etCodigo.requestFocus()
              }

              private fun inicializarViews() {

                  tvTitulo = findViewById(R.id.tvTitulo)
                  tvOperador = findViewById(R.id.tvOperador)
                  tvModoDescricao = findViewById(R.id.tvModoDescricao)

                  etCodigo = findViewById(R.id.etCodigo)
                  etPesquisa = findViewById(R.id.etPesquisa)

                  btnProcessar =
                      findViewById(R.id.btnProcessar)

                  btnLimparConsultas =
                      findViewById(R.id.btnLimparConsultas)

                  btnModoReposicao =
                      findViewById(R.id.btnModoReposicao)

                  btnModoConsulta =
                      findViewById(R.id.btnModoConsulta)

                  btnNomeOperador =
                      findViewById(R.id.btnNomeOperador)

                  btnConfiguracoes =
                      findViewById(R.id.btnConfiguracoes)

                  btnOrdemTempo =
                      findViewById(R.id.btnOrdemTempo)

                  btnOrdemEndereco =
                      findViewById(R.id.btnOrdemEndereco)

                  tvFeedback =
                      findViewById(R.id.tvFeedback)

                  containerContadores =
                      findViewById(R.id.containerContadores)

                  containerOrdenacao =
                      findViewById(R.id.containerOrdenacao)

                  containerAbas =
                      findViewById(R.id.containerAbas)

                  containerLista =
                      findViewById(R.id.containerLista)

                  tvPendentes =
                      findViewById(R.id.tvPendentes)

                  tvConcluidos =
                      findViewById(R.id.tvConcluidos)

                  tvTotal =
                      findViewById(R.id.tvTotal)

                  btnPendentes =
                      findViewById(R.id.btnPendentes)

                  btnConcluidos =
                      findViewById(R.id.btnConcluidos)
              }

              private fun configurarEventos() {

                  btnModoReposicao.setOnClickListener {

                      modoConsulta = false

                      atualizarModo()
                      atualizarInterface()
                  }

                  btnModoConsulta.setOnClickListener {

                      modoConsulta = true

                      atualizarModo()
                      atualizarConsultas()
                  }

                  btnProcessar.setOnClickListener {

                      processarCodigo()
                  }

                  etCodigo.setOnEditorActionListener {
                          _,
                          actionId,
                          _ ->

                      if (actionId == EditorInfo.IME_ACTION_DONE) {

                          processarCodigo()

                          true

                      } else {

                          false
                      }
                  }

                  btnNomeOperador.setOnClickListener {

                      alterarNomeOperador()
                  }

                  btnConfiguracoes.setOnClickListener {

                      abrirConfiguracoes()
                  }

                  btnPendentes.setOnClickListener {

                      abaConcluidos = false

                      atualizarInterface()
                  }

                  btnConcluidos.setOnClickListener {

                      abaConcluidos = true

                      atualizarInterface()
                  }

                  btnLimparConsultas.setOnClickListener {

                      confirmarLimparConsultas()
                  }

                  btnOrdemTempo.setOnClickListener {

                      ordenarPorEndereco = false

                      atualizarInterface()
                  }

                  btnOrdemEndereco.setOnClickListener {

                      ordenarPorEndereco = true

                      atualizarInterface()
                  }

                  etPesquisa.addTextChangedListener(
                      object : TextWatcher {

                          override fun beforeTextChanged(
                              s: CharSequence?,
                              start: Int,
                              count: Int,
                              after: Int
                          ) {}

                          override fun onTextChanged(
                              s: CharSequence?,
                              start: Int,
                              before: Int,
                              count: Int
                          ) {

                              if (!modoConsulta) {

                                  atualizarInterface()
                              }
                          }

                          override fun afterTextChanged(
                              s: Editable?
                          ) {}
                      }
                  )
              }

              private fun atualizarModo() {

                  tvFeedback.visibility = View.GONE

                  etCodigo.setText("")
                  etPesquisa.setText("")

                  if (modoConsulta) {

                      tvTitulo.text =
                          "Consulta de Endereços"

                      tvModoDescricao.text =
                          "Bipe ou digite o Código Mate para consultar vários produtos."

                      btnProcessar.text =
                          "CONSULTAR ENDEREÇO"

                      btnLimparConsultas.visibility =
                          View.VISIBLE

                      containerContadores.visibility =
                          View.GONE

                      containerOrdenacao.visibility =
                          View.GONE

                      containerAbas.visibility =
                          View.GONE

                      etPesquisa.visibility =
                          View.GONE

                      btnModoConsulta.setBackgroundColor(
                          Color.parseColor("#1565C0")
                      )

                      btnModoConsulta.setTextColor(Color.WHITE)

                      btnModoReposicao.setBackgroundColor(
                          Color.parseColor("#E0E0E0")
                      )

                      btnModoReposicao.setTextColor(Color.BLACK)

                  } else {

                      tvTitulo.text =
                          "Registro de Reposição"

                      tvModoDescricao.text =
                          "Bipe ou digite o produto para solicitar reposição."

                      btnProcessar.text =
                          "ADICIONAR REPOSIÇÃO"

                      btnLimparConsultas.visibility =
                          View.GONE

                      containerContadores.visibility =
                          View.VISIBLE

                      containerOrdenacao.visibility =
                          View.VISIBLE

                      containerAbas.visibility =
                          View.VISIBLE

                      etPesquisa.visibility =
                          View.VISIBLE

                      btnModoReposicao.setBackgroundColor(
                          Color.parseColor("#1565C0")
                      )

                      btnModoReposicao.setTextColor(Color.WHITE)

                      btnModoConsulta.setBackgroundColor(
                          Color.parseColor("#E0E0E0")
                      )

                      btnModoConsulta.setTextColor(Color.BLACK)
                  }

                  etCodigo.requestFocus()
              }

              private fun processarCodigo() {

                  val entrada =
                      etCodigo.text.toString().trim()

                  val codigo =
                      extrairCodigoMate(entrada)

                  if (codigo.length != 5) {

                      Toast.makeText(
                          this,
                          "Digite os 5 números do Código Mate ou bipe o código de barras.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val produto =
                      baseProdutos[codigo]

                  if (produto == null) {

                      Toast.makeText(
                          this,
                          "Código $codigo não encontrado na planilha.",
                          Toast.LENGTH_LONG
                      ).show()

                      etCodigo.setText("")
                      etCodigo.requestFocus()

                      return
                  }

                  if (modoConsulta) {

                      adicionarConsulta(produto)

                  } else {

                      adicionarReposicao(produto)
                  }

                  etCodigo.setText("")
                  etCodigo.requestFocus()
              }

              private fun extrairCodigoMate(
                  entrada: String
              ): String {

                  val numeros =
                      entrada.filter { it.isDigit() }

                  return when {

                      numeros.length == 5 ->
                          numeros

                      numeros.length >= 6 ->
                          numeros
                              .dropLast(1)
                              .takeLast(5)

                      else ->
                          ""
                  }
              }

              private fun produtoAtual(
                  codigo: String,
                  fallbackDescricao: String = "",
                  fallbackRua: String = "",
                  fallbackRack: String = "",
                  fallbackColuna: String = "",
                  fallbackLinha: String = ""
              ): EnderecoProduto {

                  return baseProdutos[codigo]
                      ?: EnderecoProduto(
                          codigo,
                          fallbackDescricao,
                          fallbackRua,
                          fallbackRack,
                          fallbackColuna,
                          fallbackLinha
                      )
              }

              // =========================================================
              // CONSULTAS
              // =========================================================

              private fun adicionarConsulta(
                  produto: EnderecoProduto
              ) {

                  consultas.add(
                      ItemConsulta(
                          codigo = produto.codigo,
                          timestamp =
                              System.currentTimeMillis()
                      )
                  )

                  salvarConsultas()

                  atualizarConsultas()
              }

