      - name: Criar styles.xml
        run: |
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
              </style>
          </resources>
          EOF

      - name: Criar MainActivity.kt completo
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
          package com.separacao.bip

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.firebase.FirebaseApp
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import java.io.File
          import java.io.FileOutputStream
          import java.lang.Exception
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class ItemReposicao(
              var codigo: String = "",
              var descricao: String = "",
              var rua: String = "",
              var rack: String = "",
              var coluna: String = "",
              var linha: String = "",
              var quantidade: Int = 1,
              var timestamp: Long = System.currentTimeMillis(),
              var operador: String = "",
              var concluido: Boolean = false
          )

          class MainActivity : AppCompatActivity() {

              // Views
              private lateinit var containerLista: LinearLayout
              private lateinit var etCodigo: EditText
              private lateinit var btnModoReposicao: Button
              private lateinit var btnModoConsulta: Button
              private lateinit var btnNomeOperador: Button
              private lateinit var btnProcessar: Button
              private lateinit var btnEscanear: Button
              private lateinit var btnLimparConsultas: Button
              private lateinit var tvPendentes: TextView
              private lateinit var tvConcluidos: TextView
              private lateinit var tvTotal: TextView
              private lateinit var tvFeedback: TextView
              private lateinit var tvOperador: TextView

              private val registros = mutableListOf<ItemReposicao>()
              private val baseProdutos = mutableListOf<ItemReposicao>()

              private var modoConsulta = false
              private var abaConcluidos = false
              private var ordenarPorEndereco = true
              private var nomeOperador = "Operador 1"

              private val PREFS = "prefs"
              private val KEY_OPERADOR = "operador"
              private val PLANILHA_INTERNA = "planilha_interna.xlsx"
              private val REQUEST_IMPORT_XLSX = 1001
              private val REGISTROS_FILE = "registros.json"

              private val gson = Gson()
              private var firestore: FirebaseFirestore? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  // Inicializa Firebase se possível
                  try {
                      FirebaseApp.initializeApp(this)
                      firestore = FirebaseFirestore.getInstance()
                  } catch (e: Exception) {
                      // ignora — opera em modo local
                      firestore = null
                  }

                  // Bind das views
                  containerLista = findViewById(R.id.containerLista)
                  etCodigo = findViewById(R.id.etCodigo)
                  btnModoReposicao = findViewById(R.id.btnModoReposicao)
                  btnModoConsulta = findViewById(R.id.btnModoConsulta)
                  btnNomeOperador = findViewById(R.id.btnNomeOperador)
                  btnProcessar = findViewById(R.id.btnProcessar)
                  btnEscanear = findViewById(R.id.btnEscanear)
                  btnLimparConsultas = findViewById(R.id.btnLimparConsultas)
                  tvPendentes = findViewById(R.id.tvPendentes)
                  tvConcluidos = findViewById(R.id.tvConcluidos)
                  tvTotal = findViewById(R.id.tvTotal)
                  tvFeedback = findViewById(R.id.tvFeedback)
                  tvOperador = findViewById(R.id.tvOperador)

                  // Carregar dados
                  carregarOperador()
                  carregarRegistros()
                  carregarBaseEnderecos()
                  atualizarInterface()

                  // Listeners básicos
                  btnNomeOperador.setOnClickListener { alterarNomeOperador() }
                  btnModoReposicao.setOnClickListener {
                      abaConcluidos = false
                      atualizarInterface()
                  }
                  btnModoConsulta.setOnClickListener {
                      abaConcluidos = true
                      atualizarInterface()
                  }
                  btnProcessar.setOnClickListener {
                      // exemplo simples: adiciona um registro com o código do campo
                      val codigo = etCodigo.text.toString().trim()
                      if (codigo.isNotEmpty()) {
                          val item = ItemReposicao(
                              codigo = codigo,
                              descricao = "Produto $codigo",
                              rua = "A",
                              rack = "1",
                              linha = "1",
                              coluna = "1",
                              operador = nomeOperador
                          )
                          registros.add(0, item)
                          salvarRegistros()
                          salvarNoFirestore(item)
                          tvFeedback.text = "✓ Reposição adicionada: $codigo"
                          tvFeedback.visibility = View.VISIBLE
                          atualizarInterface()
                      } else {
                          Toast.makeText(this, "Digite ou bipe um código.", Toast.LENGTH_SHORT).show()
                      }
                  }
                  btnLimparConsultas.setOnClickListener { confirmarLimparRegistros() }
                  btnEscanear.setOnClickListener {
                      Toast.makeText(this, "Função de escanear não implementada neste stub.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun atualizarInterface() {
                  if (modoConsulta) {
                      atualizarConsultas()
                      return
                  }

                  containerLista.removeAllViews()

                  val textoPesquisa =
                      etCodigo.text.toString()
                          .trim()
                          .lowercase()

                  var lista =
                      registros.filter {
                          if (abaConcluidos) {
                              it.concluido
                          } else {
                              !it.concluido
                          }
                      }

                  if (textoPesquisa.isNotEmpty()) {

                      lista =
                          lista.filter {

                              it.codigo.lowercase()
                                  .contains(textoPesquisa) ||

                              it.descricao.lowercase()
                                  .contains(textoPesquisa) ||

                              it.rua.lowercase()
                                  .contains(textoPesquisa) ||

                              it.rack.lowercase()
                                  .contains(textoPesquisa) ||

                              it.coluna.lowercase()
                                  .contains(textoPesquisa) ||

                              it.linha.lowercase()
                                  .contains(textoPesquisa)
                          }
                  }

                  lista =
                      if (ordenarPorEndereco) {
                          lista.sortedWith(
                              compareBy<ItemReposicao> {
                                  numeroOuTexto(it.rua)
                              }
                                  .thenBy {
                                      numeroOuTexto(it.rack)
                                  }
                                  .thenBy {
                                      numeroOuTexto(it.linha)
                                  }
                                  .thenBy {
                                      numeroOuTexto(it.coluna)
                                  }
                          )
                      } else {
                          lista.sortedBy { it.timestamp }
                      }

                  atualizarContadores()

                  btnModoReposicao.text = "PENDENTES"
                  btnModoConsulta.text = "CONCLUÍDOS"

                  if (abaConcluidos) {
                      btnModoConsulta.setBackgroundColor(Color.parseColor("#2E7D32"))
                      btnModoConsulta.setTextColor(Color.WHITE)
                      btnModoReposicao.setBackgroundColor(Color.parseColor("#E0E0E0"))
                      btnModoReposicao.setTextColor(Color.BLACK)
                  } else {
                      btnModoReposicao.setBackgroundColor(Color.parseColor("#1565C0"))
                      btnModoReposicao.setTextColor(Color.WHITE)
                      btnModoConsulta.setBackgroundColor(Color.parseColor("#E0E0E0"))
                      btnModoConsulta.setTextColor(Color.BLACK)
                  }

                  if (lista.isEmpty()) {
                      val vazio = TextView(this)
                      vazio.text = if (abaConcluidos) "Nenhuma reposição concluída." else "Nenhum produto pendente de reposição."
                      vazio.textSize = 16f
                      vazio.gravity = android.view.Gravity.CENTER
                      vazio.setTextColor(Color.parseColor("#757575"))
                      vazio.setPadding(20, 40, 20, 40)
                      containerLista.addView(vazio)
                      return
                  }

                  for (item in lista) {
                      adicionarCardReposicao(item)
                  }
              }

              private fun atualizarContadores() {
                  val pendentes = registros.count { !it.concluido }
                  val concluidos = registros.count { it.concluido }
                  val total = registros.size

                  tvPendentes.text = pendentes.toString()
                  tvConcluidos.text = concluidos.toString()
                  tvTotal.text = total.toString()
              }

              private fun adicionarCardReposicao(item: ItemReposicao) {
                  val card = LayoutInflater.from(this).inflate(R.layout.item_reposicao, containerLista, false)

                  val tvCodigo = card.findViewById<TextView>(R.id.tvCodigo)
                  val btnCopiar = card.findViewById<ImageButton>(R.id.btnCopiar)
                  val tvStatus = card.findViewById<TextView>(R.id.tvStatus)
                  val tvProduto = card.findViewById<TextView>(R.id.tvProduto)
                  val tvEndereco = card.findViewById<TextView>(R.id.tvEndereco)
                  val tvDetalhes = card.findViewById<TextView>(R.id.tvDetalhes)
                  val btnAcao = card.findViewById<Button>(R.id.btnAcao)
                  val btnExcluir = card.findViewById<Button>(R.id.btnExcluir)

                  tvCodigo.text = "${item.quantidade} CX • ${item.codigo}"
                  tvProduto.text = item.descricao
                  tvEndereco.text = "${item.rua} • ${item.rack} • Linha ${item.linha} • Coluna ${item.coluna}"

                  val dataFormatada = SimpleDateFormat("dd/MM/yyyy HH:mm", Locale("pt", "BR")).format(Date(item.timestamp))
                  tvDetalhes.text = "Operador: ${item.operador} • $dataFormatada"

                  if (item.concluido) {
                      tvStatus.text = "✓ CONCLUÍDO"
                      tvStatus.setTextColor(Color.parseColor("#1B5E20"))
                      tvStatus.setBackgroundColor(Color.parseColor("#C8E6C9"))
                      btnAcao.text = "REABRIR"
                      btnExcluir.visibility = View.VISIBLE
                  } else {
                      tvStatus.text = "PENDENTE"
                      tvStatus.setTextColor(Color.parseColor("#B71C1C"))
                      tvStatus.setBackgroundColor(Color.parseColor("#FFCDD2"))
                      btnAcao.text = "CONCLUIR"
                      btnExcluir.visibility = View.VISIBLE
                  }

                  btnCopiar.setOnClickListener { copiarParaClipboard(item.codigo) }
                  btnAcao.setOnClickListener {
                      if (item.concluido) reabrirReposicao(item) else concluirReposicao(item)
                  }
                  btnExcluir.setOnClickListener { confirmarExcluir(item) }

                  containerLista.addView(card)
              }

              private fun concluirReposicao(item: ItemReposicao) {
                  item.concluido = true
                  salvarRegistros()
                  salvarNoFirestore(item)
                  tvFeedback.text = "✓ Reposição do produto ${item.codigo} concluída."
                  tvFeedback.setTextColor(Color.parseColor("#1B5E20"))
                  tvFeedback.setBackgroundColor(Color.parseColor("#C8E6C9"))
                  tvFeedback.visibility = View.VISIBLE
                  atualizarInterface()
              }

              private fun reabrirReposicao(item: ItemReposicao) {
                  item.concluido = false
                  salvarRegistros()
                  salvarNoFirestore(item)
                  tvFeedback.text = "↻ Produto ${item.codigo} voltou para pendentes."
                  tvFeedback.visibility = View.VISIBLE
                  abaConcluidos = false
                  atualizarInterface()
              }

              private fun confirmarExcluir(item: ItemReposicao) {
                  AlertDialog.Builder(this)
                      .setTitle("Excluir registro?")
                      .setMessage("Deseja realmente excluir o registro do produto ${item.codigo}?")
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("EXCLUIR") { _, _ ->
                          registros.remove(item)
                          salvarRegistros()
                          excluirDoFirestore(item)
                          tvFeedback.text = "Registro ${item.codigo} excluído."
                          tvFeedback.visibility = View.VISIBLE
                          atualizarInterface()
                      }
                      .show()
              }

              private fun numeroOuTexto(valor: String): String {
                  return valor.trim().padStart(10, '0')
              }

              private fun carregarOperador() {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  nomeOperador = prefs.getString(KEY_OPERADOR, "Operador 1") ?: "Operador 1"
                  atualizarNomeOperador()
              }

              private fun atualizarNomeOperador() {
                  tvOperador.text = "👤 Operador: $nomeOperador"
              }

              private fun alterarNomeOperador() {
                  val input = EditText(this)
                  input.setText(nomeOperador)
                  input.selectAll()
                  AlertDialog.Builder(this)
                      .setTitle("Nome do operador")
                      .setMessage("Digite o nome que será registrado nas reposições.")
                      .setView(input)
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("SALVAR") { _, _ ->
                          val novoNome = input.text.toString().trim()
                          if (novoNome.isNotEmpty()) {
                              nomeOperador = novoNome
                              getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_OPERADOR, nomeOperador).apply()
                              atualizarNomeOperador()
                              Toast.makeText(this, "Nome do operador atualizado.", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .show()
              }

              private fun abrirConfiguracoes() {
                  val opcoes = arrayOf("📥 Importar nova planilha", "🗑 Limpar todas as reposições", "ℹ Informações")
                  AlertDialog.Builder(this)
                      .setTitle("Configurações")
                      .setItems(opcoes) { _, which ->
                          when (which) {
                              0 -> importarPlanilha()
                              1 -> confirmarLimparRegistros()
                              2 -> mostrarInformacoes()
                          }
                      }
                      .show()
              }

              private fun importarPlanilha() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  intent.addCategory(Intent.CATEGORY_OPENABLE)
                  intent.type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                  intent.putExtra(Intent.EXTRA_MIME_TYPES, arrayOf(
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                      "application/vnd.ms-excel.sheet.macroEnabled.12",
                      "application/vnd.ms-excel"
                  ))
                  startActivityForResult(intent, REQUEST_IMPORT_XLSX)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQUEST_IMPORT_XLSX && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data
                      if (uri != null) copiarPlanilhaImportada(uri)
                  }
              }

              private fun copiarPlanilhaImportada(uri: Uri) {
                  try {
                      contentResolver.openInputStream(uri)?.use { input ->
                          val destino = File(filesDir, PLANILHA_INTERNA)
                          FileOutputStream(destino).use { output -> input.copyTo(output) }
                      }
                      baseProdutos.clear()
                      carregarBaseEnderecos()
                      Toast.makeText(this, "Planilha importada com sucesso. ${baseProdutos.size} produtos carregados.", Toast.LENGTH_LONG).show()
                      atualizarInterface()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Erro ao importar a planilha.", Toast.LENGTH_LONG).show()
                  }
              }

              private fun confirmarLimparRegistros() {
                  if (registros.isEmpty()) {
                      Toast.makeText(this, "Não há reposições para limpar.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Limpar todas as reposições?")
                      .setMessage("Todos os registros pendentes e concluídos serão removidos de TODOS os aparelhos sincronizados.")
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("LIMPAR TUDO") { _, _ ->
                          val copia = registros.toList()
                          registros.clear()
                          salvarRegistros()
                          for (item in copia) {
                              excluirDoFirestore(item)
                          }
                          atualizarInterface()
                          Toast.makeText(this, "Todas as reposições foram removidas.", Toast.LENGTH_LONG).show()
                      }
                      .show()
              }

              private fun salvarRegistros() {
                  try {
                      val json = gson.toJson(registros)
                      val file = File(filesDir, REGISTROS_FILE)
                      file.writeText(json)
                  } catch (e: Exception) {
                      // log se necessário
                  }
              }

              private fun carregarRegistros() {
                  try {
                      val file = File(filesDir, REGISTROS_FILE)
                      if (file.exists()) {
                          val json = file.readText()
                          val type = object : TypeToken<MutableList<ItemReposicao>>() {}.type
                          val lista: MutableList<ItemReposicao> = gson.fromJson(json, type) ?: mutableListOf()
                          registros.clear()
                          registros.addAll(lista)
                      }
                  } catch (e: Exception) {
                      // ignora
                  }
              }

              private fun salvarNoFirestore(item: ItemReposicao) {
                  try {
                      firestore?.collection("reposicoes")?.document(item.timestamp.toString())?.set(item)
                  } catch (e: Exception) {
                      // ignora falhas online
                  }
              }

              private fun excluirDoFirestore(item: ItemReposicao) {
                  try {
                      firestore?.collection("reposicoes")?.document(item.timestamp.toString())?.delete()
                  } catch (e: Exception) {
                      // ignora falhas online
                  }
              }

              private fun atualizarConsultas() {
                  // implementação simples de placeholder para o modo consulta
                  containerLista.removeAllViews()
                  val info = TextView(this)
                  info.text = "Modo consulta (placeholder)"
                  info.textSize = 16f
                  info.setPadding(20, 40, 20, 40)
                  containerLista.addView(info)
              }

              private fun carregarBaseEnderecos() {
                  // Placeholder: se quiser eu implemento leitura real do XLSX para popular baseProdutos.
                  baseProdutos.clear()
              }

              private fun copiarParaClipboard(text: String) {
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = ClipData.newPlainText("codigo", text)
                  clipboard.setPrimaryClip(clip)
                  Toast.makeText(this, "Copiado: $text", Toast.LENGTH_SHORT).show()
              }

              private fun mostrarInformacoes() {
                  AlertDialog.Builder(this)
                      .setTitle("Informações")
                      .setMessage("App de reposição - versão de build gerado pela workflow.")
                      .setPositiveButton("OK", null)
                      .show()
              }
          }
