                  containerLista.removeAllViews()

                  if (consultas.isEmpty()) {

                      val vazio =
                          TextView(this)

                      vazio.text =
                          "Nenhuma consulta realizada ainda."

                      vazio.textSize = 16f

                      vazio.setTextColor(
                          Color.parseColor("#757575")
                      )

                      vazio.setPadding(
                          20,
                          30,
                          20,
                          30
                      )

                      containerLista.addView(vazio)

                      return
                  }

                  for (consulta in consultas.reversed()) {

                      val produto =
                          baseProdutos[consulta.codigo]

                      val card =
                          LinearLayout(this)

                      card.orientation =
                          LinearLayout.VERTICAL

                      card.setPadding(
