              private fun carregarBaseEnderecos() {

                  try {

                      baseProdutos.clear()

                      val arquivoInterno =
                          File(
                              filesDir,
                              PLANILHA_INTERNA
                          )

                      if (arquivoInterno.exists()) {

                          FileInputStream(arquivoInterno)
                              .use { input ->
                                  lerPlanilhaXlsx(input)
                              }

                      } else {

                          assets
                              .open("enderecos.xlsx")
                              .use { input ->
                                  lerPlanilhaXlsx(input)
                              }
                      }

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "Erro ao carregar a planilha de endereços.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun lerPlanilhaXlsx(
                  inputStream: InputStream
              ) {

                  val arquivoTemporario =
                      File(
                          cacheDir,
                          "planilha_temp.xlsx"
                      )

                  FileOutputStream(arquivoTemporario)
                      .use { output ->
                          inputStream.copyTo(output)
                      }

                  ZipFile(arquivoTemporario)
                      .use { zip ->

                          val sharedStrings =
                              carregarSharedStrings(zip)

                          val sheetEntry =
                              encontrarPrimeiraPlanilha(zip)

                          if (sheetEntry == null) {
                              return
                          }

                          zip.getInputStream(sheetEntry)
                              .use { sheetInput ->
                                  lerSheet(
                                      sheetInput,
                                      sharedStrings
                                  )
                              }
                      }

                  arquivoTemporario.delete()
              }

              private fun encontrarPrimeiraPlanilha(
                  zip: ZipFile
              ): java.util.zip.ZipEntry? {

                  return zip.entries()
                      .asSequence()
                      .firstOrNull {
                          it.name.startsWith(
                              "xl/worksheets/sheet"
                          ) &&
                          it.name.endsWith(
                              ".xml"
                          )
                      }
              }

              private fun carregarSharedStrings(
                  zip: ZipFile
              ): List<String> {

                  val entry =
                      zip.getEntry(
                          "xl/sharedStrings.xml"
                      ) ?: return emptyList()

                  val lista =
                      mutableListOf<String>()

                  zip.getInputStream(entry)
                      .use { input ->

                          val parser =
                              Xml.newPullParser()

                          parser.setInput(
                              input,
                              "UTF-8"
                          )

                          var dentroDeTexto =
                              false

                          var textoAtual =
                              StringBuilder()

                          while (
                              parser.eventType !=
                              XmlPullParser.END_DOCUMENT
                          ) {

                              when (
                                  parser.eventType
                              ) {

                                  XmlPullParser.START_TAG -> {

                                      if (
                                          parser.name == "si"
                                      ) {
                                          textoAtual =
                                              StringBuilder()
                                      }

                                      if (
                                          parser.name == "t"
                                      ) {
                                          dentroDeTexto =
                                              true
                                      }
                                  }

                                  XmlPullParser.TEXT -> {

                                      if (
                                          dentroDeTexto
                                      ) {
                                          textoAtual.append(
                                              parser.text
                                          )
                                      }
                                  }

                                  XmlPullParser.END_TAG -> {

                                      if (
                                          parser.name == "t"
                                      ) {
                                          dentroDeTexto =
                                              false
                                      }

                                      if (
                                          parser.name == "si"
                                      ) {
                                          lista.add(
                                              textoAtual.toString()
                                          )
                                      }
                                  }
                              }

                              parser.next()
                          }
                      }

                  return lista
              }

              private fun lerSheet(
                  inputStream: InputStream,
                  sharedStrings: List<String>
              ) {

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      inputStream,
                      "UTF-8"
                  )

                  var linha =
                      mutableMapOf<String, String>()

                  var referenciaAtual =
                      ""

                  var tipoAtual =
                      ""

                  var dentroDeValor =
                      false

                  var valorAtual =
                      StringBuilder()

                  var primeiraLinha =
                      true

                  while (
                      parser.eventType !=
                      XmlPullParser.END_DOCUMENT
                  ) {

                      when (
                          parser.eventType
                      ) {

                          XmlPullParser.START_TAG -> {

                              when (
                                  parser.name
                              ) {

                                  "row" -> {
                                      linha =
                                          mutableMapOf()
                                  }

                                  "c" -> {

                                      referenciaAtual =
                                          parser.getAttributeValue(
                                              null,
                                              "r"
                                          ) ?: ""

                                      tipoAtual =
                                          parser.getAttributeValue(
                                              null,
                                              "t"
                                          ) ?: ""

                                      valorAtual =
                                          StringBuilder()
                                  }

                                  "v" -> {
                                      dentroDeValor =
                                          true
                                  }

                                  "t" -> {

                                      if (
                                          tipoAtual == "inlineStr"
                                      ) {
                                          dentroDeValor =
                                              true
                                      }
                                  }
                              }
                          }

                          XmlPullParser.TEXT -> {

                              if (
                                  dentroDeValor
                              ) {

                                  valorAtual.append(
                                      parser.text
                                  )
                              }
                          }

                          XmlPullParser.END_TAG -> {

                              when (
                                  parser.name
                              ) {

                                  "v",
                                  "t" -> {
                                      dentroDeValor =
                                          false
                                  }

                                  "c" -> {

                                      val coluna =
                                          referenciaAtual.filter {
                                              it.isLetter()
                                          }

                                      var valor =
                                          valorAtual
                                              .toString()
                                              .trim()

                                      if (
                                          tipoAtual == "s"
                                      ) {

                                          val indice =
                                              valor.toIntOrNull()

                                          if (
                                              indice != null &&
                                              indice in sharedStrings.indices
                                          ) {

                                              valor =
                                                  sharedStrings[indice]
                                          }
                                      }

                                      linha[coluna] =
                                          valor
                                  }

                                  "row" -> {

                                      if (primeiraLinha) {

                                          primeiraLinha =
                                              false

                                      } else {

                                          processarLinhaPlanilha(
                                              linha
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      parser.next()
                  }
              }

              private fun processarLinhaPlanilha(
                  linha: Map<String, String>
              ) {

                  if (linha.isEmpty()) {
                      return
                  }

                  val valores =
                      linha.entries
                          .sortedBy {
                              colunaParaNumero(
                                  it.key
                              )
                          }
                          .map {
                              it.value.trim()
                          }

                  if (valores.size < 8) {
                      return
                  }

                  val codigo =
                      valores
                          .getOrNull(0)
                          ?.filter {
                              it.isDigit()
                          } ?: ""

                  if (codigo.length != 5) {
                      return
                  }

                  val descricao =
                      valores.getOrNull(1) ?: ""

                  val rua =
                      valores.getOrNull(4) ?: ""

                  val rack =
                      valores.getOrNull(5) ?: ""

                  val linhaProd =
                      valores.getOrNull(6) ?: ""

                  val colunaProd =
                      valores.getOrNull(7) ?: ""

                  baseProdutos[codigo] =
                      EnderecoProduto(
                          codigo = codigo,
                          descricao = descricao,
                          rua = rua,
                          rack = rack,
                          coluna = colunaProd,
                          linha = linhaProd
                      )
              }

              private fun colunaParaNumero(
                  coluna: String
              ): Int {

                  var resultado =
                      0

                  for (
                      caractere in coluna.uppercase()
                  ) {

                      resultado =
                          resultado * 26 +
                          (
                              caractere.code -
                              'A'.code +
                              1
                          )
                  }

                  return resultado
              }

              private fun salvarRegistros() {

                  try {

                      val array =
                          JSONArray()

                      for (item in registros) {

                          val objeto =
                              JSONObject()

                          objeto.put(
                              "id",
                              item.id
                          )

                          objeto.put(
                              "codigo",
                              item.codigo
                          )

                          objeto.put(
                              "descricao",
                              item.descricao
                          )

