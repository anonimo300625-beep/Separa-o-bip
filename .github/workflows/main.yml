              private fun confirmarLimparConsultas() {

                  if (consultas.isEmpty()) {

                      Toast.makeText(
                          this,
                          "Não há consultas para limpar.",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Limpar consultas?")
                      .setMessage(
                          "Todos os resultados de consulta salvos neste aparelho serão removidos."
                      )
                      .setNegativeButton(
                          "CANCELAR",
                          null
                      )
                      .setPositiveButton(
                          "LIMPAR"
                      ) { _, _ ->

                          consultas.clear()

                          salvarConsultas()

                          atualizarConsultas()
                      }
                      .show()
              }

              private fun adicionarReposicao(
                  produto: EnderecoProduto
              ) {

                  val existente =
                      registros.find {
                          it.codigo == produto.codigo &&
                          !it.concluido
                      }

                  if (existente != null) {

                      AlertDialog.Builder(this)
                          .setTitle("Código já solicitado")
                          .setMessage(
                              "O código ${produto.codigo} já possui ${existente.quantidade} caixa(s) pendente(s).\n\nAdicionar mais uma caixa?"
                          )
                          .setNegativeButton(
                              "CANCELAR",
                              null
                          )
                          .setPositiveButton(
                              "ADICIONAR"
                          ) { _, _ ->

                              existente.quantidade += 1

                              salvarRegistros()

                              salvarNoFirestore(existente)

                              tvFeedback.text =
                                  "✓ ${existente.quantidade} cx ${produto.codigo} pendentes"

                              tvFeedback.visibility =
                                  View.VISIBLE

                              atualizarInterface()
                          }
                          .show()

                      return
                  }

                  val novo =
                      ItemReposicao(

                          id =
                              UUID.randomUUID().toString(),

                          codigo =
                              produto.codigo,

                          descricao =
                              produto.descricao,

                          quantidade =
                              1,

                          rua =
                              produto.rua,

                          rack =
                              produto.rack,

                          coluna =
                              produto.coluna,

                          linha =
                              produto.linha,

                          operador =
                              nomeOperador,

                          timestamp =
                              System.currentTimeMillis(),

                          concluido =
                              false
                      )

                  registros.add(novo)

                  salvarRegistros()

                  salvarNoFirestore(novo)

                  tvFeedback.text =
                      "✓ Produto ${produto.codigo} adicionado à reposição."

                  tvFeedback.visibility =
                      View.VISIBLE

                  atualizarInterface()
              }              private fun atualizarInterface() {

                  if (modoConsulta) {
                      atualizarConsultas()
                      return
                  }

                  containerLista.removeAllViews()

                  val textoPesquisa =
                      etPesquisa.text.toString()
                          .trim()
                          .lowercase()

                  var lista =
                      registros.filter {
                          if (abaConcluidos) {
                              it.concluido
                          } else {
                              !it.concluido
                          }
                      }

                  if (textoPesquisa.isNotEmpty()) {

                      lista =
                          lista.filter {

                              it.codigo.lowercase()
                                  .contains(textoPesquisa) ||

                              it.descricao.lowercase()
                                  .contains(textoPesquisa) ||

                              it.rua.lowercase()
                                  .contains(textoPesquisa) ||

                              it.rack.lowercase()
                                  .contains(textoPesquisa) ||

                              it.coluna.lowercase()
                                  .contains(textoPesquisa) ||

                              it.linha.lowercase()
                                  .contains(textoPesquisa)
                          }
                  }

                  lista =
                      if (ordenarPorEndereco) {

                          lista.sortedWith(
                              compareBy<ItemReposicao> {
                                  numeroOuTexto(it.rua)
                              }
                                  .thenBy {
                                      numeroOuTexto(it.rack)
                                  }
                                  .thenBy {
                                      numeroOuTexto(it.linha)
                                  }
                                  .thenBy {
                                      numeroOuTexto(it.coluna)
                                  }
                          )

                      } else {

                          lista.sortedBy {
                              it.timestamp
                          }
                      }

                  atualizarContadores()

                  btnPendentes.text =
                      "PENDENTES"

                  btnConcluidos.text =
                      "CONCLUÍDOS"

                  if (abaConcluidos) {

                      btnConcluidos.setBackgroundColor(
                          Color.parseColor("#2E7D32")
                      )

                      btnConcluidos.setTextColor(
                          Color.WHITE
                      )

                      btnPendentes.setBackgroundColor(
                          Color.parseColor("#E0E0E0")
                      )

                      btnPendentes.setTextColor(
                          Color.BLACK
                      )

                  } else {

                      btnPendentes.setBackgroundColor(
                          Color.parseColor("#1565C0")
                      )

                      btnPendentes.setTextColor(
                          Color.WHITE
                      )

                      btnConcluidos.setBackgroundColor(
                          Color.parseColor("#E0E0E0")
                      )

                      btnConcluidos.setTextColor(
                          Color.BLACK
                      )
                  }

                  if (lista.isEmpty()) {

                      val vazio =
                          TextView(this)

                      vazio.text =
                          if (abaConcluidos) {
                              "Nenhuma reposição concluída."
                          } else {
                              "Nenhum produto pendente de reposição."
                          }

                      vazio.textSize = 16f

                      vazio.gravity =
                          android.view.Gravity.CENTER

                      vazio.setTextColor(
                          Color.parseColor("#757575")
                      )

                      vazio.setPadding(
                          20,
                          40,
                          20,
                          40
                      )

                      containerLista.addView(vazio)

                      return
                  }

                  for (item in lista) {
                      adicionarCardReposicao(item)
                  }
              }

              private fun atualizarContadores() {

                  val pendentes =
                      registros.count {
                          !it.concluido
                      }

                  val concluidos =
                      registros.count {
                          it.concluido
                      }

                  val total =
                      registros.size

                  tvPendentes.text =
                      pendentes.toString()

                  tvConcluidos.text =
                      concluidos.toString()

                  tvTotal.text =
                      total.toString()
              }

