              private fun salvarRegistros() {

                  val array =
                      JSONArray()

                  for (item in registros) {

                      val obj =
                          JSONObject()

                      obj.put("id", item.id)
                      obj.put("codigo", item.codigo)
                      obj.put("descricao", item.descricao)
                      obj.put("quantidade", item.quantidade)
                      obj.put("rua", item.rua)
                      obj.put("rack", item.rack)
                      obj.put("coluna", item.coluna)
                      obj.put("linha", item.linha)
                      obj.put("operador", item.operador)
                      obj.put("timestamp", item.timestamp)
                      obj.put("concluido", item.concluido)

                      array.put(obj)
                  }

                  getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          KEY_REGISTROS,
                          array.toString()
                      )
                      .apply()
              }

              private fun carregarRegistros() {

                  try {

                      val texto =
                          getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                              .getString(
                                  KEY_REGISTROS,
                                  null
                              ) ?: return

                      val array =
                          JSONArray(texto)

                      registros.clear()

                      for (
                          i in 0 until array.length()
                      ) {

                          val obj =
                              array.getJSONObject(i)

                          registros.add(
                              ItemReposicao(
                                  id =
                                      obj.getString("id"),

                                  codigo =
                                      obj.getString("codigo"),

                                  descricao =
                                      obj.optString("descricao", ""),

                                  quantidade =
                                      obj.getInt("quantidade"),

                                  rua =
                                      obj.optString("rua", ""),

                                  rack =
                                      obj.optString("rack", ""),

                                  coluna =
                                      obj.optString("coluna", ""),

                                  linha =
                                      obj.optString("linha", ""),

                                  operador =
                                      obj.optString(
                                          "operador",
                                          "Operador"
                                      ),

                                  timestamp =
                                      obj.getLong("timestamp"),

                                  concluido =
                                      obj.getBoolean("concluido")
                              )
                          )
                      }

                  } catch (e: Exception) {

                      registros.clear()
                  }
              }

              private fun salvarConsultas() {

                  val array =
                      JSONArray()

                  for (consulta in consultas) {

                      val obj =
                          JSONObject()

                      obj.put(
                          "codigo",
                          consulta.codigo
                      )

                      obj.put(
                          "timestamp",
                          consulta.timestamp
                      )

                      array.put(obj)
                  }

                  getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          KEY_CONSULTAS,
                          array.toString()
                      )
                      .apply()
              }

              private fun carregarConsultas() {

                  try {

                      val texto =
                          getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                              .getString(
                                  KEY_CONSULTAS,
                                  null
                              ) ?: return

                      val array =
                          JSONArray(texto)

                      consultas.clear()

                      for (
                          i in 0 until array.length()
                      ) {

                          val obj =
                              array.getJSONObject(i)

                          consultas.add(
                              ItemConsulta(
                                  codigo =
                                      obj.getString("codigo"),

                                  timestamp =
                                      obj.getLong("timestamp")
                              )
                          )
                      }

                  } catch (e: Exception) {

                      consultas.clear()
                  }
              }

