name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: unzip -o SeparacaoBip_Android_MVP.zip

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Capturar Causa Exata do Erro
      run: |
        cd SeparacaoBip_Android_MVP
        chmod +x gradlew || true
        
        # Executa a compilação e salva o log completo
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon > build_log.txt 2>&1 || true
        else
          gradle assembleDebug --no-daemon > build_log.txt 2>&1 || true
        fi
        
        echo "=== ERRO ENCONTRADO ==="
        grep -i -E "e: |error:|Caused by:|FAILURE:" build_log.txt -A 3 -B 1 || cat build_log.txt | tail -n 100
        
        # Se falhou, interrompe a pipeline mostrando o log
        if grep -q "BUILD FAILED" build_log.txt; then
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: SeparacaoBip_Android_MVP/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: SeparacaoBip_Android_MVP/app/build/outputs/apk/debug/app-debug.apk
