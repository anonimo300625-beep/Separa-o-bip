name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Criar Estrutura do Projeto
      run: |
        mkdir -p app/src/main/java/com/separacao/bip
        mkdir -p app/src/main/res/layout

    - name: Criar Arquivos Globais do Gradle
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ReposicaoApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

    - name: Configurar App Android
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.separacao.bip'
            compileSdk 34

            defaultConfig {
                applicationId "com.separacao.bip"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Reposição"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="stateAlwaysVisible">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Gerar Layout Item
      run: |
        cat << 'EOF' > app/src/main/res/layout/item_reposicao.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:layout_marginLeft="8dp"
            android:layout_marginRight="8dp"
            android:layout_marginTop="6dp"
            android:layout_marginBottom="6dp"
            android:background="@android:drawable/dialog_holo_light_frame"
            android:orientation="vertical"
            android:padding="12dp">
            
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical">
                <TextView
                    android:id="@+id/tvCodigoQtd"
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:textColor="#212121"
                    android:textSize="18sp"
                    android:textStyle="bold" />
                <TextView
                    android:id="@+id/tvStatusBadge"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:paddingLeft="8dp"
                    android:paddingRight="8dp"
                    android:paddingTop="4dp"
                    android:paddingBottom="4dp"
                    android:textSize="12sp"
                    android:textStyle="bold" />
            </LinearLayout>

            <TextView
                android:id="@+id/tvEndereco"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="6dp"
                android:textColor="#424242"
                android:textSize="14sp" />

            <TextView
                android:id="@+id/tvDetalhes"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="4dp"
                android:textColor="#757575"
                android:textSize="12sp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:layout_marginTop="10dp"
                android:gravity="end">
                <Button
                    android:id="@+id/btnAcao"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:textSize="12sp"
                    android:textColor="#212121" />
                <Button
                    android:id="@+id/btnApagar"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginStart="8dp"
                    android:text="🗑 EXCLUIR"
                    android:textSize="12sp"
                    android:textColor="#C62828"
                    android:visibility="gone" />
            </LinearLayout>
        </LinearLayout>
        EOF

    - name: Gerar Layout Main
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#F8F9FA">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:padding="16dp"
                android:background="#FFFFFF">
                <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="📦 Reposição"
                    android:textSize="20sp"
                    android:textStyle="bold"
                    android:textColor="#212121" />
                <ImageButton
                    android:id="@+id/btnConfiguracoes"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:background="?android:attr/selectableItemBackground"
                    android:contentDescription="Configurações"
                    android:src="@android:drawable/ic_menu_manage" />
            </LinearLayout>

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="match_parent">
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="12dp">

                    <TextView
                        android:id="@+id/tvOperador"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Operador: Operador 1"
                        android:textColor="#616161"
                        android:textSize="14sp" />

                    <Button
                        android:id="@+id/btnIdentificarAparelho"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="6dp"
                        android:text="NOMEAR OPERADOR"
                        android:textColor="#212121" />

                    <EditText
                        android:id="@+id/etCodigoBarras"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="12dp"
                        android:hint="Bipe o código de barras ou digite o MATE"
                        android:inputType="text"
                        android:imeOptions="actionDone"
                        android:padding="12dp"
                        android:focusable="true"
                        android:focusableInTouchMode="true"
                        android:background="@android:drawable/editbox_background" />

                    <Button
                        android:id="@+id/btnProcessarCodigo"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="6dp"
                        android:text="PROCESSAR CÓDIGO"
                        android:textColor="#212121" />

                    <TextView
                        android:id="@+id/tvFeedbackAdicionado"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="8dp"
                        android:visibility="gone"
                        android:textColor="#2E7D32"
                        android:textSize="14sp"
                        android:textStyle="bold" />

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:layout_marginTop="16dp"
                        android:weightSum="3">

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginEnd="4dp"
                            android:background="#FFCDD2"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">
                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="PENDENTES"
                                android:textColor="#B71C1C"
                                android:textSize="11sp"
                                android:textStyle="bold" />
                            <TextView
                                android:id="@+id/tvCountPendentes"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#B71C1C"
                                android:textSize="20sp"
                                android:textStyle="bold" />
                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginLeft="2dp"
                            android:layout_marginRight="2dp"
                            android:background="#C8E6C9"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">
                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="CONCLUÍDOS"
                                android:textColor="#1B5E20"
                                android:textSize="11sp"
                                android:textStyle="bold" />
                            <TextView
                                android:id="@+id/tvCountConcluidos"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#1B5E20"
                                android:textSize="20sp"
                                android:textStyle="bold" />
                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_marginStart="4dp"
                            android:layout_weight="1"
                            android:background="#FFF59D"
                            android:orientation="vertical"
                            android:padding="10dp"
                            android:gravity="center">
                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="TOTAL"
                                android:textColor="#F57F17"
                                android:textSize="11sp"
                                android:textStyle="bold" />
                            <TextView
                                android:id="@+id/tvCountTotal"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="0"
                                android:textColor="#F57F17"
                                android:textSize="20sp"
                                android:textStyle="bold" />
                        </LinearLayout>
                    </LinearLayout>

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:layout_marginTop="16dp"
                        android:weightSum="2">
                        <Button
                            android:id="@+id/btnTabPendentes"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="PENDENTES"
                            android:textColor="#FFFFFF" />
                        <Button
                            android:id="@+id/btnTabConcluidos"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:layout_marginStart="4dp"
                            android:text="CONCLUÍDOS"
                            android:textColor="#424242" />
                    </LinearLayout>

                    <LinearLayout
                        android:id="@+id/containerLista"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:layout_marginTop="8dp" />

                </LinearLayout>
            </ScrollView>
        </LinearLayout>
        EOF

    - name: Gerar MainActivity
      run: |
        cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
        package com.separacao.bip

        import android.app.Activity
        import android.app.AlertDialog
        import android.content.Intent
        import android.graphics.Color
        import android.net.Uri
        import android.os.Bundle
        import android.view.LayoutInflater
        import android.view.View
        import android.view.inputmethod.EditorInfo
        import android.widget.Button
        import android.widget.EditText
        import android.widget.ImageButton
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.BufferedReader
        import java.io.InputStreamReader
        import java.io.OutputStreamWriter
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale

        data class ItemReposicao(
            val id: String,
            val codigoMate: String,
            var quantidade: Int,
            val rua: String,
            val rack: String,
            val coluna: String,
            val linha: String,
            val operador: String,
            val timestamp: Long,
            var concluido: Boolean = false
        )

        data class Quadruple<A, B, C, D>(val first: A, val second: B, val third: C, val fourth: D)

        class MainActivity : AppCompatActivity() {
            private lateinit var etCodigoBarras: EditText
            private lateinit var btnProcessarCodigo: Button
            private lateinit var btnIdentificarAparelho: Button
            private lateinit var btnConfiguracoes: ImageButton
            private lateinit var tvOperador: TextView
            private lateinit var tvFeedbackAdicionado: TextView
            private lateinit var tvCountPendentes: TextView
            private lateinit var tvCountConcluidos: TextView
            private lateinit var tvCountTotal: TextView
            private lateinit var btnTabPendentes: Button
            private lateinit var btnTabConcluidos: Button
            private lateinit var containerLista: LinearLayout
            private val listaReposicao = mutableListOf<ItemReposicao>()
            private var nomeOperador = "Operador 1"
            private var abaAtual = 0

            // Base de Mapeamento: Código -> Endereço
            private val baseEnderecos = mutableMapOf<String, Quadruple<String, String, String, String>>()

            companion object {
                private const val REQUEST_PICK_CSV = 1001
                private const val REQUEST_CREATE_CSV = 1002
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                etCodigoBarras = findViewById(R.id.etCodigoBarras)
                btnProcessarCodigo = findViewById(R.id.btnProcessarCodigo)
                btnIdentificarAparelho = findViewById(R.id.btnIdentificarAparelho)
                btnConfiguracoes = findViewById(R.id.btnConfiguracoes)
                tvOperador = findViewById(R.id.tvOperador)
                tvFeedbackAdicionado = findViewById(R.id.tvFeedbackAdicionado)
                tvCountPendentes = findViewById(R.id.tvCountPendentes)
                tvCountConcluidos = findViewById(R.id.tvCountConcluidos)
                tvCountTotal = findViewById(R.id.tvCountTotal)
                btnTabPendentes = findViewById(R.id.btnTabPendentes)
                btnTabConcluidos = findViewById(R.id.btnTabConcluidos)
                containerLista = findViewById(R.id.containerLista)

                carregarBaseInicial()

                btnProcessarCodigo.setOnClickListener { processarEntrada(etCodigoBarras.text.toString().trim()) }
                
                btnIdentificarAparelho.setOnClickListener { abrirDialogoNomeOperador() }

                btnConfiguracoes.setOnClickListener { abrirMenuConfiguracoes() }

                // Listener para disparar assim que o leitor de código de barras enviar 'Enter'
                etCodigoBarras.setOnEditorActionListener { _, actionId, _ ->
                    if (actionId == EditorInfo.IME_ACTION_DONE || actionId == EditorInfo.IME_NULL) {
                        processarEntrada(etCodigoBarras.text.toString().trim())
                        true
                    } else {
                        false
                    }
                }

                btnTabPendentes.setOnClickListener {
                    abaAtual = 0
                    btnTabPendentes.setBackgroundColor(Color.parseColor("#1E88E5"))
                    btnTabPendentes.setTextColor(Color.WHITE)
                    btnTabConcluidos.setBackgroundColor(Color.parseColor("#E0E0E0"))
                    btnTabConcluidos.setTextColor(Color.parseColor("#424242"))
                    atualizarInterface()
                }

                btnTabConcluidos.setOnClickListener {
                    abaAtual = 1
                    btnTabConcluidos.setBackgroundColor(Color.parseColor("#1E88E5"))
                    btnTabConcluidos.setTextColor(Color.WHITE)
                    btnTabPendentes.setBackgroundColor(Color.parseColor("#E0E0E0"))
                    btnTabPendentes.setTextColor(Color.parseColor("#424242"))
                    atualizarInterface()
                }

                // Foco automático no EditText para permitir bipe direto
                etCodigoBarras.requestFocus()
                atualizarInterface()
            }

            override fun onResume() {
                super.onResume()
                etCodigoBarras.requestFocus()
            }

            private fun carregarBaseInicial() {
                // Carrega base padrão de demonstração suportando múltiplos códigos separados por ';'
                adicionarMapeamento("55968", Quadruple("COLMÉIA", "1", "1", "53"))
                adicionarMapeamento("47950;88410;12399", Quadruple("RUA 2", "3", "5", "B"))
                adicionarMapeamento("48303;99102", Quadruple("RUA 1", "2", "8", "C"))
            }

            private fun adicionarMapeamento(codigosStr: String, endereco: Quadruple<String, String, String, String>) {
                val codigos = codigosStr.split(";")
                for (c in codigos) {
                    val cLimpo = c.trim()
                    if (cLimpo.isNotEmpty()) {
                        baseEnderecos[cLimpo] = endereco
                    }
                }
            }

            private fun abrirDialogoNomeOperador() {
                val input = EditText(this)
                input.setText(nomeOperador)
                AlertDialog.Builder(this)
                    .setTitle("Nome do Operador")
                    .setMessage("Digite o nome desejado para o operador:")
                    .setView(input)
                    .setPositiveButton("Salvar") { _, _ ->
                        val novoNome = input.text.toString().trim()
                        if (novoNome.isNotEmpty()) {
                            nomeOperador = novoNome
                            tvOperador.text = "Operador: $nomeOperador"
                        }
                    }
                    .setNegativeButton("Cancelar", null)
                    .show()
            }

            private fun abrirMenuConfiguracoes() {
                val opcoes = arrayOf("Importar Planilha (.csv)", "Exportar Planilha Modelo (.csv)", "Visualizar/Editar Mapeamentos")
                AlertDialog.Builder(this)
                    .setTitle("Configurações de Endereços")
                    .setItems(opcoes) { _, which ->
                        when (which) {
                            0 -> abrirSeletorPlanilha()
                            1 -> exportarPlanilhaModelo()
                            2 -> exibirMapeamentos()
                        }
                    }
                    .show()
            }

            private fun extrairCodigoMate(entrada: String): String {
                if (entrada.length <= 6 && entrada.all { it.isDigit() }) return entrada
                if (entrada.length > 6) {
                    val mateSub = entrada.takeLast(5)
                    if (mateSub.all { it.isDigit() }) return mateSub
                }
                return entrada
            }

            private fun processarEntrada(entrada: String) {
                if (entrada.isEmpty()) {
                    Toast.makeText(this, "Digite ou bipe um código válido", Toast.LENGTH_SHORT).show()
                    return
                }
                val mate = extrairCodigoMate(entrada)
                val item = adicionarOuAgruparItem(mate)
                if (item != null) {
                    val endStr = item.rua + " / Rack " + item.rack + " / Coluna " + item.coluna + " / Linha " + item.linha
                    tvFeedbackAdicionado.visibility = View.VISIBLE
                    tvFeedbackAdicionado.text = "✅ " + item.codigoMate + " adicionado — " + endStr
                }
                etCodigoBarras.setText("")
                etCodigoBarras.requestFocus()
                atualizarInterface()
            }

            private fun adicionarOuAgruparItem(mate: String): ItemReposicao? {
                val enderecoInfo = baseEnderecos[mate] ?: Quadruple("RUA 1", "1", "4", "A")
                val itemExistentePendente = listaReposicao.find { it.codigoMate == mate && !it.concluido }
                if (itemExistentePendente != null) {
                    itemExistentePendente.quantidade += 1
                    return itemExistentePendente
                } else {
                    val novoItem = ItemReposicao(
                        id = System.currentTimeMillis().toString() + "_" + (0..1000).random(),
                        codigoMate = mate,
                        quantidade = 1,
                        rua = enderecoInfo.first,
                        rack = enderecoInfo.second,
                        coluna = enderecoInfo.third,
                        linha = enderecoInfo.fourth,
                        operador = nomeOperador,
                        timestamp = System.currentTimeMillis(),
                        concluido = false
                    )
                    listaReposicao.add(novoItem)
                    return novoItem
                }
            }

            private fun atualizarInterface() {
                val pendentes = listaReposicao.filter { !it.concluido }
                val concluidos = listaReposicao.filter { it.concluido }
                tvCountPendentes.text = pendentes.sumOf { it.quantidade }.toString()
                tvCountConcluidos.text = concluidos.sumOf { it.quantidade }.toString()
                tvCountTotal.text = listaReposicao.sumOf { it.quantidade }.toString()
                containerLista.removeAllViews()

                val listaExibicao = if (abaAtual == 0) pendentes.sortedBy { it.timestamp } else concluidos.sortedByDescending { it.timestamp }
                val sdf = SimpleDateFormat("dd/MM HH:mm", Locale.getDefault())

                for (item in listaExibicao) {
                    val itemView = LayoutInflater.from(this).inflate(R.layout.item_reposicao, containerLista, false)
                    val tvCodigoQtd = itemView.findViewById<TextView>(R.id.tvCodigoQtd)
                    val tvStatusBadge = itemView.findViewById<TextView>(R.id.tvStatusBadge)
                    val tvEndereco = itemView.findViewById<TextView>(R.id.tvEndereco)
                    val tvDetalhes = itemView.findViewById<TextView>(R.id.tvDetalhes)
                    val btnAcao = itemView.findViewById<Button>(R.id.btnAcao)
                    val btnApagar = itemView.findViewById<Button>(R.id.btnApagar)

                    if (item.quantidade > 1) {
                        tvCodigoQtd.text = item.quantidade.toString() + " cx " + item.codigoMate
                    } else {
                        tvCodigoQtd.text = item.codigoMate
                    }
                    tvEndereco.text = item.rua + " — Rack " + item.rack + " — Coluna " + item.coluna + " — Linha " + item.linha
                    val dataStr = sdf.format(Date(item.timestamp))
                    tvDetalhes.text = item.operador + " • " + dataStr

                    if (item.concluido) {
                        tvStatusBadge.text = "Concluído"
                        tvStatusBadge.setBackgroundColor(Color.parseColor("#E8F5E9"))
                        tvStatusBadge.setTextColor(Color.parseColor("#2E7D32"))
                        btnAcao.text = "↩ DESFAZER CONCLUSÃO"
                        btnAcao.setOnClickListener {
                            item.concluido = false
                            atualizarInterface()
                        }
                        btnApagar.visibility = View.VISIBLE
                        btnApagar.setOnClickListener {
                            listaReposicao.remove(item)
                            Toast.makeText(this, "Registro excluído permanentemente", Toast.LENGTH_SHORT).show()
                            atualizarInterface()
                        }
                    } else {
                        tvStatusBadge.text = "Pendente"
                        tvStatusBadge.setBackgroundColor(Color.parseColor("#FFEBEE"))
                        tvStatusBadge.setTextColor(Color.parseColor("#C62828"))
                        btnAcao.text = "✓ CONCLUIR"
                        btnAcao.setOnClickListener {
                            item.concluido = true
                            atualizarInterface()
                        }
                        btnApagar.visibility = View.GONE
                    }
                    containerLista.addView(itemView)
                }
            }

            private fun abrirSeletorPlanilha() {
                val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                    type = "*/*"
                }
                startActivityForResult(Intent.createChooser(intent, "Selecione a planilha de endereços (.csv)"), REQUEST_PICK_CSV)
            }

            private fun exportarPlanilhaModelo() {
                val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                    addCategory(Intent.CATEGORY_OPENABLE)
                    type = "text/csv"
                    putExtra(Intent.EXTRA_TITLE, "modelo_enderecos.csv")
                }
                startActivityForResult(intent, REQUEST_CREATE_CSV)
            }

            private fun exibirMapeamentos() {
                val sb = StringBuilder()
                for ((codigo, end) in baseEnderecos) {
                    sb.append("Cód: ").append(codigo).append(" -> ").append(end.first).append(", R:").append(end.second).append(", C:").append(end.third).append(", L:").append(end.fourth).append("\n")
                }
                val tv = TextView(this)
                tv.text = if (sb.isEmpty()) "Nenhum endereço cadastrado." else sb.toString()
                tv.setPadding(32, 32, 32, 32)
                
                val sv = ScrollView(this)
                sv.addView(tv)

                AlertDialog.Builder(this)
                    .setTitle("Mapeamentos Cadastrados")
                    .setView(sv)
                    .setPositiveButton("OK", null)
                    .show()
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == REQUEST_PICK_CSV && resultCode == Activity.RESULT_OK) {
                    val uri: Uri? = data?.data
                    if (uri != null) {
                        importarCSV(uri)
                    }
                } else if (requestCode == REQUEST_CREATE_CSV && resultCode == Activity.RESULT_OK) {
                    val uri: Uri? = data?.data
                    if (uri != null) {
                        gerarCSVModelo(uri)
                    }
                }
            }

            private fun importarCSV(uri: Uri) {
                try {
                    val inputStream = contentResolver.openInputStream(uri)
                    val reader = BufferedReader(InputStreamReader(inputStream))
                    var linha: String?
                    var importados = 0
                    baseEnderecos.clear()
                    while (reader.readLine().also { linha = it } != null) {
                        val colunas = linha!!.split(";")
                        if (colunas.size >= 5) {
                            val cods = colunas[0].trim()
                            val rua = colunas[1].trim()
                            val rack = colunas[2].trim()
                            val col = colunas[3].trim()
                            val lin = colunas[4].trim()
                            if (cods.toLowerCase(Locale.ROOT) != "codigo") {
                                adicionarMapeamento(cods, Quadruple(rua, rack, col, lin))
                                importados++
                            }
                        }
                    }
                    reader.close()
                    Toast.makeText(this, "Planilha importada com sucesso! $importados cadastros.", Toast.LENGTH_LONG).show()
                } catch (e: Exception) {
                    Toast.makeText(this, "Erro ao ler arquivo CSV: " + e.message, Toast.LENGTH_LONG).show()
                }
            }

            private fun gerarCSVModelo(uri: Uri) {
                try {
                    val outputStream = contentResolver.openOutputStream(uri)
                    val writer = OutputStreamWriter(outputStream)
                    writer.write("CODIGO;RUA;RACK;COLUNA;LINHA\n")
                    writer.write("55968;COLMÉIA;1;1;53\n")
                    writer.write("47950;88410;12399;RUA 2;3;5;B\n")
                    writer.write("48303;99102;RUA 1;2;8;C\n")
                    writer.flush()
                    writer.close()
                    Toast.makeText(this, "Modelo CSV salvo com sucesso!", Toast.LENGTH_LONG).show()
                } catch (e: Exception) {
                    Toast.makeText(this, "Erro ao salvar arquivo modelo: " + e.message, Toast.LENGTH_LONG).show()
                }
            }
        }
        EOF

    - name: Configurar Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Compilar APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-reposicao-debug
        path: app/build/outputs/apk/debug/app-debug.apk
