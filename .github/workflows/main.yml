name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f firebase/google-services.json ]; then
            echo "AVISO: Arquivo firebase/google-services.json não encontrado — operações com Firestore serão no modo mock."
          else
            cp firebase/google-services.json app/google-services.json
          fi

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)

          if [ -z "$XLSX_FILE" ]; then
            echo "AVISO: Nenhuma planilha XLSX encontrada dentro da pasta dados/ — a base de produtos ficará vazia."
          else
            echo "Planilha encontrada: $XLSX_FILE"
            cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx
          fi

      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 12
                  versionName "12.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')

              implementation 'com.google.firebase:firebase-firestore-ktx'

              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              implementation 'androidx.camera:camera-core:1.3.2'
              implementation 'androidx.camera:camera-camera2:1.3.2'
              implementation 'androidx.camera:camera-lifecycle:1.3.2'
              implementation 'androidx.camera:camera-view:1.3.2'

              implementation 'com.google.mlkit:barcode-scanning:17.2.0'

              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      - name: Criar ícone de cópia
        run: |
          cat << 'EOF' > app/src/main/res/drawable/ic_copiar.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#1565C0"
                  android:pathData="M16,1H4C2.9,1 2,1.9 2,3v14h2V3h12V1zM19,5H8C6.9,5 6,5.9 6,7v14c0,1.1 0.9,2 2,2h11c1.1,0 2,-0.9 2,-2V7C21,5.9 20.1,5 19,5zM19,21H8V7h11V21z"/>
          </vector>
          EOF

      - name: Criar layout principal
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F4F6F8">

              <LinearLayout
