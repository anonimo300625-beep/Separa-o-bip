    - name: Corrigir comentários inválidos do Kotlin
      run: |
        sed -i 's/^[[:space:]]*# /            \/\/ /' app/src/main/java/com/separacao/bip/MainActivity.kt

    - name: Configurar Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Compilar APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-reposicao-debug
        path: app/build/outputs/apk/debug/app-debug.apk
