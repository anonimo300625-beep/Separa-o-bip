              private fun iniciarSincronizacaoFirestore() {

                  firestoreListener?.remove()

                  firestoreListener =
                      firestore.collection(COLLECTION_REPOSICOES)
                          .addSnapshotListener { snapshot, error ->

                              if (error != null) {
                                  if (primeiraCargaFirestore) {
                                      primeiraCargaFirestore = false
                                      Toast.makeText(
                                          this,
                                          "Não foi possível conectar ao Firestore. Usando dados locais.",
                                          Toast.LENGTH_LONG
                                      ).show()
                                  }
                                  return@addSnapshotListener
                              }

                              if (snapshot == null) {
                                  return@addSnapshotListener
                              }

                              registros.clear()

                              for (documento in snapshot.documents) {

                                  val id = documento.getString("id")
                                      ?: documento.id

                                  val codigo = documento.getString("codigo") ?: ""
                                  val descricao = documento.getString("descricao") ?: ""

                                  val quantidade =
                                      (documento.getLong("quantidade") ?: 1L).toInt()

                                  val rua = documento.getString("rua") ?: ""
                                  val rack = documento.getString("rack") ?: ""
                                  val coluna = documento.getString("coluna") ?: ""
                                  val linha = documento.getString("linha") ?: ""
                                  val operador = documento.getString("operador") ?: "Operador 1"

                                  val timestamp =
                                      documento.getLong("timestamp")
                                          ?: System.currentTimeMillis()

                                  val concluido =
                                      documento.getBoolean("concluido") ?: false

                                  registros.add(
                                      ItemReposicao(
                                          id = id,
                                          codigo = codigo,
                                          descricao = descricao,
                                          quantidade = quantidade,
                                          rua = rua,
                                          rack = rack,
                                          coluna = coluna,
                                          linha = linha,
                                          operador = operador,
                                          timestamp = timestamp,
                                          concluido = concluido
                                      )
                                  )
                              }

                              salvarRegistros()

                              if (!modoConsulta) {
                                  atualizarInterface()
                              }

                              if (primeiraCargaFirestore) {
                                  primeiraCargaFirestore = false

                                  Toast.makeText(
                                      this,
                                      "✓ Reposições sincronizadas com a nuvem.",
                                      Toast.LENGTH_SHORT
                                  ).show()
                              }
                          }
              }

              private fun salvarNoFirestore(item: ItemReposicao) {

                  val dados = hashMapOf<String, Any>(
                      "id" to item.id,
                      "codigo" to item.codigo,
                      "descricao" to item.descricao,
                      "quantidade" to item.quantidade,
                      "rua" to item.rua,
                      "rack" to item.rack,
                      "coluna" to item.coluna,
                      "linha" to item.linha,
                      "operador" to item.operador,
                      "timestamp" to item.timestamp,
                      "concluido" to item.concluido
                  )

                  firestore.collection(COLLECTION_REPOSICOES)
                      .document(item.id)
                      .set(dados)
                      .addOnFailureListener {
                          Toast.makeText(
                              this,
                              "Alteração salva localmente. A sincronização será tentada novamente.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
              }

              private fun excluirDoFirestore(item: ItemReposicao) {

                  firestore.collection(COLLECTION_REPOSICOES)
                      .document(item.id)
                      .delete()
                      .addOnFailureListener {
                          Toast.makeText(
                              this,
                              "Não foi possível excluir da nuvem neste momento.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
              }

