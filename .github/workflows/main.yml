name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/separacao/bip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f firebase/google-services.json ]; then
            echo "ERRO: Arquivo firebase/google-services.json não encontrado."
            exit 1
          fi

          cp firebase/google-services.json app/google-services.json

          XLSX_FILE=$(find dados -type f \( -iname "*.xlsx" -o -iname "*.xlsm" \) | head -n 1)

          if [ -z "$XLSX_FILE" ]; then
            echo "ERRO: Nenhuma planilha XLSX encontrada dentro da pasta dados/"
            exit 1
          fi

          echo "Planilha encontrada: $XLSX_FILE"

          cp "$XLSX_FILE" app/src/main/assets/enderecos.xlsx

      - name: Criar arquivos Gradle
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ReposicaoApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

      - name: Configurar aplicativo Android
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.separacao.bip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.separacao.bip"
                  minSdk 24
                  targetSdk 34
                  versionCode 12
                  versionName "12.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-firestore-ktx'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.camera:camera-core:1.3.2'
              implementation 'androidx.camera:camera-camera2:1.3.2'
              implementation 'androidx.camera:camera-lifecycle:1.3.2'
              implementation 'androidx.camera:camera-view:1.3.2'
              implementation 'com.google.mlkit:barcode-scanning:17.2.0'
          }
          EOF

      - name: Criar AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:label="Reposição"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Criar ícone de cópia
        run: |
          cat << 'EOF' > app/src/main/res/drawable/ic_copiar.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M16,1H4C2.9,1 2,1.9 2,3v14h2V3h12V1zM19,5H8C6.9,5 6,5.9 6,7v14c0,1.1 0.9,2 2,2h11c1.1,0 2,-0.9 2,-2V7C21,5.9 20.1,5 19,5zM19,21H8V7h11V21z"/>
          </vector>
          EOF

      - name: Criar layout principal
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F4F6F8">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:paddingStart="18dp"
                  android:paddingTop="18dp"
                  android:paddingEnd="18dp"
                  android:paddingBottom="16dp"
                  android:background="#1565C0">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              android:id="@+id/tvTitulo"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Registro de Reposição"
                              android:textColor="#FFFFFF"
                              android:textSize="24sp"
                              android:textStyle="bold"/>
                          <TextView
                              android:id="@+id/tvSubtitulo"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="3dp"
                              android:text="Controle inteligente de produtos"
                              android:textColor="#DCEBFF"
                              android:textSize="13sp"/>
                      </LinearLayout>
                      <ImageButton
                          android:id="@+id/btnConfiguracoes"
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:background="?android:attr/selectableItemBackgroundBorderless"
                          android:src="@android:drawable/ic_menu_manage"
                          android:contentDescription="Configurações"/>
                  </LinearLayout>
                  <TextView
                      android:id="@+id/tvOperador"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:padding="10dp"
                      android:text="👤 Operador: Operador 1"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:background="#3378C5"/>
              </LinearLayout>
              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fillViewport="true">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="12dp">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">
                          <Button
                              android:id="@+id/btnModoReposicao"
                              android:layout_width="0dp"
                              android:layout_height="52dp"
                              android:layout_weight="1"
                              android:text="📦 REPOSIÇÃO"
                              android:textSize="12sp"/>
                          <Button
                              android:id="@+id/btnModoConsulta"
                              android:layout_width="0dp"
                              android:layout_height="52dp"
                              android:layout_weight="1"
                              android:layout_marginStart="6dp"
                              android:text="🔎 CONSULTAR"
                              android:textSize="12sp"/>
                      </LinearLayout>
                      <Button
                          android:id="@+id/btnNomeOperador"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="8dp"
                          android:text="ALTERAR NOME DO OPERADOR"/>
                      <TextView
                          android:id="@+id/tvModoDescricao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="14dp"
                          android:padding="8dp"
                          android:textColor="#616161"
                          android:textSize="14sp"
                          android:gravity="center"/>
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="BIPAGEM / CÓDIGO DO PRODUTO"
                          android:textColor="#424242"
                          android:textSize="12sp"
                          android:textStyle="bold"/>
                      <EditText
                          android:id="@+id/etCodigo"
                          android:layout_width="match_parent"
                          android:layout_height="68dp"
                          android:layout_marginTop="5dp"
                          android:background="#FFFFFF"
                          android:hint="Bipe ou digite o Código Mate"
                          android:inputType="number"
                          android:maxLength="30"
                          android:imeOptions="actionDone"
                          android:paddingStart="18dp"
                          android:paddingEnd="18dp"
                          android:textSize="20sp"
                          android:textColor="#212121"/>
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="7dp"
                          android:orientation="horizontal">
                          <Button
                              android:id="@+id/btnProcessar"
                              android:layout_width="0dp"
                              android:layout_height="54dp"
                              android:layout_weight="1"
                              android:text="ADICIONAR REPOSIÇÃO"
                              android:textStyle="bold"/>
                          <Button
                              android:id="@+id/btnEscanear"
                              android:layout_width="0dp"
                              android:layout_height="54dp"
                              android:layout_weight="1"
                              android:layout_marginStart="6dp"
                              android:text="📷 ESCANEAR"
                              android:textSize="11sp"
                              android:textStyle="bold"/>
                      </LinearLayout>
                      <Button
                          android:id="@+id/btnLimparConsultas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="🗑 LIMPAR CONSULTAS"
                          android:visibility="gone"/>
                      <TextView
                          android:id="@+id/tvFeedback"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:padding="12dp"
                          android:textColor="#1B5E20"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          android:gravity="center"
                          android:background="#C8E6C9"
                          android:visibility="gone"/>
                      <TextView
                          android:id="@+id/tvTituloDashboard"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="📊 RESUMO DA OPERAÇÃO"
                          android:textColor="#424242"
                          android:textSize="13sp"
                          android:textStyle="bold"/>
                      <LinearLayout
                          android:id="@+id/containerContadores"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal"
                          android:weightSum="3">
                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="92dp"
                              android:layout_weight="1"
                              android:layout_marginEnd="4dp"
                              android:background="#FFCDD2"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="8dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="PENDENTES"
                                  android:textColor="#B71C1C"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>
                              <TextView
                                  android:id="@+id/tvPendentes"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="0"
                                  android:textColor="#B71C1C"
                                  android:textSize="28sp"
                                  android:textStyle="bold"/>
                          </LinearLayout>
                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="92dp"
                              android:layout_weight="1"
                              android:layout_marginStart="2dp"
                              android:layout_marginEnd="2dp"
                              android:background="#C8E6C9"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="8dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="CONCLUÍDOS"
                                  android:textColor="#1B5E20"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>
                              <TextView
                                  android:id="@+id/tvConcluidos"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="0"
                                  android:textColor="#1B5E20"
                                  android:textSize="28sp"
                                  android:textStyle="bold"/>
                          </LinearLayout>
                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="92dp"
                              android:layout_weight="1"
                              android:layout_marginStart="4dp"
                              android:background="#FFF59D"
                              android:gravity="center"
                              android:orientation="vertical"
                              android:padding="8dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="TOTAL"
                                  android:textColor="#F57F17"
                                  android:textSize="10sp"
                                  android:textStyle="bold"/>
                              <TextView
                                  android:id="@+id/tvTotal"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="0"
                                  android:textColor="#F57F17"
                                  android:textSize="28sp"
                                  android:textStyle="bold"/>
                          </LinearLayout>
                      </LinearLayout>
                      <EditText
                          android:id="@+id/etPesquisa"
                          android:layout_width="match_parent"
                          android:layout_height="54dp"
                          android:layout_marginTop="16dp"
                          android:background="#FFFFFF"
                          android:hint="🔍 Pesquisar código, produto ou endereço"
                          android:inputType="text"
                          android:paddingStart="14dp"
                          android:paddingEnd="14dp"/>
                      <LinearLayout
                          android:id="@+id/containerOrdenacao"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:orientation="horizontal">
                          <Button
                              android:id="@+id/btnOrdemTempo"
                              android:layout_width="0dp"
                              android:layout_height="48dp"
                              android:layout_weight="1"
                              android:text="⏰ ORDEM DE SOLICITAÇÃO"
                              android:textSize="10sp"/>
                          <Button
                              android:id="@+id/btnOrdemEndereco"
                              android:layout_width="0dp"
                              android:layout_height="48dp"
                              android:layout_weight="1"
                              android:layout_marginStart="6dp"
                              android:text="📍 POR ENDEREÇO"
                              android:textSize="10sp"/>
                      </LinearLayout>
                      <LinearLayout
                          android:id="@+id/containerAbas"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">
                          <Button
                              android:id="@+id/btnPendentes"
                              android:layout_width="0dp"
                              android:layout_height="52dp"
                              android:layout_weight="1"
                              android:text="PENDENTES"/>
                          <Button
                              android:id="@+id/btnConcluidos"
                              android:layout_width="0dp"
                              android:layout_height="52dp"
                              android:layout_weight="1"
                              android:layout_marginStart="6dp"
                              android:text="CONCLUÍDOS"/>
                      </LinearLayout>
                      <LinearLayout
                          android:id="@+id/containerLista"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="vertical"/>
                  </LinearLayout>
              </ScrollView>
          </LinearLayout>
          EOF

      - name: Criar layout dos registros
        run: |
          cat << 'EOF' > app/src/main/res/layout/item_reposicao.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginTop="8dp"
              android:background="#FFFFFF"
              android:orientation="vertical"
              android:padding="16dp">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <TextView
                      android:id="@+id/tvCodigo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textColor="#1565C0"
                      android:textSize="20sp"
                      android:textStyle="bold"/>
                  <ImageButton
                      android:id="@+id/btnCopiar"
                      android:layout_width="38dp"
                      android:layout_height="38dp"
                      android:layout_marginEnd="8dp"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_copiar"
                      android:contentDescription="Copiar código"/>
                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:paddingStart="8dp"
                      android:paddingTop="6dp"
                      android:paddingEnd="8dp"
                      android:paddingBottom="6dp"
                      android:textStyle="bold"
                      android:textSize="11sp"/>
              </LinearLayout>
              <TextView
                  android:id="@+id/tvProduto"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#212121"
                  android:textSize="16sp"
                  android:textStyle="bold"/>
              <TextView
                  android:id="@+id/tvEndereco"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:padding="10dp"
                  android:background="#E3F2FD"
                  android:textColor="#1565C0"
                  android:textSize="15sp"
                  android:textStyle="bold"/>
              <TextView
                  android:id="@+id/tvDetalhes"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#757575"
                  android:textSize="12sp"/>
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:gravity="end"
                  android:orientation="horizontal">
                  <Button
                      android:id="@+id/btnAcao"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:textStyle="bold"/>
                  <Button
                      android:id="@+id/btnExcluir"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:layout_marginStart="6dp"
                      android:text="EXCLUIR"/>
              </LinearLayout>
          </LinearLayout>
          EOF

      - name: Criar layout da câmera
        run: |
          cat << 'EOF' > app/src/main/res/layout/dialog_scanner.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="500dp"
              android:background="#000000">
              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:background="#99000000">
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="📷 ESCANEANDO CÓDIGO"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:gravity="center"/>
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="Aponte a câmera para o código de barras"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:gravity="center"/>
              </LinearLayout>
              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:padding="16dp"
                  android:text="A leitura será automática • Sem som"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp"
                  android:gravity="center"
                  android:background="#99000000"/>
          </FrameLayout>
          EOF

      - name: Criar MainActivity simplificada
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MainActivity.kt
          package com.separacao.bip

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

      - name: Criar arquivo strings.xml
        run: |
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Reposição</string>
          </resources>
          EOF

      - name: Criar arquivo styles.xml
        run: |
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
          </resources>
          EOF

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew build -x lint

      - name: Upload APK como artefato
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: app/build/outputs/apk/**/*.apk
