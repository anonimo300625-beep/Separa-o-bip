              private fun abrirScanner() {

                  codigoDetectado = false

                  val view =
                      LayoutInflater.from(this)
                          .inflate(R.layout.dialog_scanner, null)

                  val previewView =
                      view.findViewById<PreviewView>(R.id.previewView)

                  dialogScanner =
                      AlertDialog.Builder(this)
                          .setView(view)
                          .setNegativeButton("CANCELAR") { _, _ ->
                              pararCamera()
                          }
                          .create()

                  dialogScanner?.setOnDismissListener {
                      pararCamera()
                  }

                  dialogScanner?.show()

                  iniciarCamera(previewView)
              }

              private fun iniciarCamera(previewView: PreviewView) {

                  cameraExecutor =
                      Executors.newSingleThreadExecutor()

                  val cameraProviderFuture =
                      ProcessCameraProvider.getInstance(this)

                  cameraProviderFuture.addListener({

                      try {

                          val cameraProvider =
                              cameraProviderFuture.get()

                          val preview =
                              Preview.Builder()
                                  .build()
                                  .also {
                                      it.setSurfaceProvider(
                                          previewView.surfaceProvider
                                      )
                                  }

                          val options =
                              BarcodeScannerOptions.Builder()
                                  .setBarcodeFormats(
                                      Barcode.FORMAT_ALL_FORMATS
                                  )
                                  .build()

                          val scanner =
                              BarcodeScanning.getClient(options)

                          val analysis =
                              ImageAnalysis.Builder()
                                  .setBackpressureStrategy(
                                      ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST
                                  )
                                  .build()

                          analysis.setAnalyzer(cameraExecutor!!) {
                              imageProxy ->
                              analisarCodigo(scanner, imageProxy)
                          }

                          cameraProvider.unbindAll()

                          cameraProvider.bindToLifecycle(
                              this,
                              CameraSelector.DEFAULT_BACK_CAMERA,
                              preview,
                              analysis
                          )

                      } catch (e: Exception) {

                          runOnUiThread {

                              Toast.makeText(
                                  this,
                                  "Não foi possível iniciar a câmera.",
                                  Toast.LENGTH_LONG
                              ).show()

                              dialogScanner?.dismiss()
                          }
                      }

                  }, ContextCompat.getMainExecutor(this))
              }

              private fun analisarCodigo(
                  scanner: com.google.mlkit.vision.barcode.BarcodeScanner,
                  imageProxy: ImageProxy
              ) {

                  if (codigoDetectado) {
                      imageProxy.close()
                      return
                  }

                  val mediaImage = imageProxy.image

                  if (mediaImage == null) {
                      imageProxy.close()
                      return
                  }

                  val image =
                      InputImage.fromMediaImage(
                          mediaImage,
                          imageProxy.imageInfo.rotationDegrees
                      )

                  scanner.process(image)
                      .addOnSuccessListener { codigos ->

                          if (
                              !codigoDetectado &&
                              codigos.isNotEmpty()
                          ) {

                              val valor =
                                  codigos.firstOrNull()?.rawValue

                              if (!valor.isNullOrBlank()) {

                                  codigoDetectado = true

                                  runOnUiThread {

                                      dialogScanner?.dismiss()

                                      etCodigo.setText(valor)

                                      processarCodigo()
                                  }
                              }
                          }
                      }
                      .addOnCompleteListener {
                          imageProxy.close()
                      }
              }

              private fun pararCamera() {
                  try {
                      cameraExecutor?.shutdown()
                  } catch (_: Exception) {
                  }

                  cameraExecutor = null
              }

              private fun vibrarConfirmacao() {

                  try {

                      if (
                          android.os.Build.VERSION.SDK_INT >=
                          android.os.Build.VERSION_CODES.S
                      ) {

                          val manager =
                              getSystemService(
                                  Context.VIBRATOR_MANAGER_SERVICE
                              ) as VibratorManager

                          manager.defaultVibrator.vibrate(
                              VibrationEffect.createOneShot(
                                  120,
                                  VibrationEffect.DEFAULT_AMPLITUDE
                              )
                          )

                      } else {

                          @Suppress("DEPRECATION")
                          val vibrator =
                              getSystemService(
                                  Context.VIBRATOR_SERVICE
                              ) as Vibrator

                          if (
                              android.os.Build.VERSION.SDK_INT >=
                              android.os.Build.VERSION_CODES.O
                          ) {

                              vibrator.vibrate(
                                  VibrationEffect.createOneShot(
                                      120,
                                      VibrationEffect.DEFAULT_AMPLITUDE
                                  )
                              )

                          } else {

                              @Suppress("DEPRECATION")
                              vibrator.vibrate(120)
                          }
                      }

                  } catch (_: Exception) {
                  }
              }

              private fun processarCodigo() {

                  val entrada =
                      etCodigo.text.toString().trim()

                  val codigo =
                      extrairCodigoMate(entrada)

                  if (codigo.length != 5) {

                      Toast.makeText(
                          this,
                          "Digite os 5 números do Código Mate ou bipe o código de barras.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val produto =
                      baseProdutos[codigo]

                  if (produto == null) {

                      Toast.makeText(
                          this,
                          "Código $codigo não encontrado na planilha.",
                          Toast.LENGTH_LONG
                      ).show()

                      etCodigo.setText("")
                      etCodigo.requestFocus()

                      return
                  }

                  vibrarConfirmacao()

                  tvFeedback.text =
                      "✓ Produto encontrado: ${produto.codigo}"

                  tvFeedback.setTextColor(
                      Color.parseColor("#1B5E20")
                  )

                  tvFeedback.setBackgroundColor(
                      Color.parseColor("#C8E6C9")
                  )

                  tvFeedback.visibility = View.VISIBLE

                  if (modoConsulta) {
                      adicionarConsulta(produto)
                  } else {
                      adicionarReposicao(produto)
                  }

                  etCodigo.setText("")
                  etCodigo.requestFocus()
              }

              private fun extrairCodigoMate(
                  entrada: String
              ): String {

                  val numeros =
                      entrada.filter { it.isDigit() }

                  return when {

                      numeros.length == 5 ->
                          numeros

                      numeros.length >= 6 ->
                          numeros.dropLast(1).takeLast(5)

                      else ->
                          ""
                  }
              }

              private fun copiarParaClipboard(texto: String) {

                  val clipboard =
                      getSystemService(
                          Context.CLIPBOARD_SERVICE
                      ) as ClipboardManager

                  val clip =
                      ClipData.newPlainText(
                          "Código",
                          texto
                      )

                  clipboard.setPrimaryClip(clip)

                  Toast.makeText(
                      this,
                      "Código $texto copiado!",
                      Toast.LENGTH_SHORT
                  ).show()
              }

