              private fun importarPlanilha(
                  uri: Uri
              ) {
                  try {
                      val arquivo =
                          File(
                              filesDir,
                              PLANILHA_INTERNA
                          )

                      val inputStream = contentResolver
                          .openInputStream(uri)
                          ?: throw Exception("Não foi possível abrir o arquivo selecionado.")

                      inputStream.use { input ->
                          FileOutputStream(arquivo).use { output ->
                              input.copyTo(output)
                          }
                      }

                      carregarPlanilha(
                          FileInputStream(arquivo)
                      )

                      publicarBaseEnderecosNoFirebase()
                      Toast.makeText(
                          this,
                          "Planilha atualizada localmente!\n${baseProdutos.size} produtos encontrados.\nSincronizando com os outros aparelhos...",
                          Toast.LENGTH_LONG
                      ).show()

                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Erro ao importar planilha: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun publicarBaseEnderecosNoFirebase() {
                  val versao = System.currentTimeMillis().toString()
                  val itens = baseProdutos.values.toList()
                  if (itens.isEmpty()) {
                      Toast.makeText(this, "A base está vazia; sincronização cancelada.", Toast.LENGTH_LONG).show()
                      return
                  }
                  fun enviarLote(inicio: Int) {
                      if (inicio >= itens.size) {
                          db.collection(COLECAO_BASE_META).document("atual").set(
                              hashMapOf("versao" to versao, "quantidade" to itens.size, "atualizadoEm" to System.currentTimeMillis()),
                              SetOptions.merge()
                          ).addOnSuccessListener {
                              getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_BASE_VERSAO, versao).apply()
                              Toast.makeText(this, "✅ Base publicada no Firebase para os outros aparelhos.", Toast.LENGTH_LONG).show()
                          }.addOnFailureListener {
                              Toast.makeText(this, "⚠️ Base local atualizada, mas não foi possível publicar no Firebase. Tente Recarregar sincronização.", Toast.LENGTH_LONG).show()
                          }
                          return
                      }
                      val fim = minOf(inicio + 400, itens.size)
                      val batch = db.batch()
                      for (i in inicio until fim) {
                          val item = itens[i]
                          val ref = db.collection(COLECAO_BASE_ITENS).document("${versao}_${item.codigo}")
                          batch.set(ref, hashMapOf(
                              "versao" to versao, "codigo" to item.codigo, "descricao" to item.descricao,
                              "rua" to item.rua, "rack" to item.rack, "coluna" to item.coluna, "linha" to item.linha
                          ))
                      }
                      batch.commit().addOnSuccessListener { enviarLote(fim) }
                          .addOnFailureListener { Toast.makeText(this, "⚠️ Falha ao publicar a base no Firebase: ${it.message}", Toast.LENGTH_LONG).show() }
                  }
                  enviarLote(0)
              }

              private fun carregarBaseEnderecos() {
                  val cache = getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_BASE_CACHE, null)
                  if (!cache.isNullOrBlank()) {
                      try {
                          val array = JSONArray(cache)
                          baseProdutos.clear()
                          for (i in 0 until array.length()) {
                              val o = array.getJSONObject(i)
                              val codigo = o.optString("codigo").trim()
                              if (codigo.isNotBlank()) baseProdutos[codigo] = EnderecoProduto(codigo, o.optString("descricao"), o.optString("rua"), o.optString("rack"), o.optString("coluna"), o.optString("linha"))
                          }
                          atualizarInterface()
                      } catch (_: Exception) { }
                  }
                  val arquivo =
                      File(
                          filesDir,
                          PLANILHA_INTERNA
                      )

                  try {
                      if (arquivo.exists()) {
                          carregarPlanilha(
                              FileInputStream(arquivo)
                          )
                      } else {
                          assets
                              .open("enderecos.xlsx")
                              .use { input ->
                                  carregarPlanilha(input)
                              }
                      }
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Erro ao carregar a planilha de endereços.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun carregarPlanilha(
                  input: InputStream
              ) {
                  val arquivoTemp =
                      File(
                          cacheDir,
                          "planilha_temp.xlsx"
                      )

                  FileOutputStream(arquivoTemp)
                      .use { output ->
                          input.copyTo(output)
                      }

                  baseProdutos.clear()

                  ZipFile(arquivoTemp).use { zip ->
                      val sharedStrings =
                          mutableListOf<String>()

                      val shared =
                          zip.getEntry(
                              "xl/sharedStrings.xml"
                          )

                      if (shared != null) {
                          zip.getInputStream(shared)
                              .use {
                                  sharedStrings.addAll(
                                      lerSharedStrings(it)
                                  )
                              }
                      }

                      val sheet =
                          zip.entries()
                              .asSequence()
                              .firstOrNull {
                                  it.name.startsWith(
                                      "xl/worksheets/sheet"
                                  ) &&
                                  it.name.endsWith(".xml")
                              }
                              ?: throw Exception(
                                  "Nenhuma planilha encontrada."
                              )

                      zip.getInputStream(sheet)
                          .use {
                              val linhas =
                                  lerPlanilhaXML(
                                      it,
                                      sharedStrings
                                  )

                              processarLinhas(linhas)
                          }
                  }

                  arquivoTemp.delete()
              }

              private fun lerSharedStrings(
                  input: InputStream
              ): List<String> {
                  val resultado =
                      mutableListOf<String>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var textoAtual = ""
                  var event = parser.eventType

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              if (parser.name == "si") {
                                  textoAtual = ""
                              }
                          }

                          XmlPullParser.TEXT -> {
                              textoAtual += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              if (parser.name == "si") {
                                  resultado.add(textoAtual)
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun lerPlanilhaXML(
                  input: InputStream,
                  sharedStrings: List<String>
              ): List<List<String>> {
                  val resultado =
                      mutableListOf<List<String>>()

                  val parser =
                      Xml.newPullParser()

                  parser.setInput(
                      input,
                      "UTF-8"
                  )

                  var event = parser.eventType

                  var linhaAtual =
                      mutableMapOf<Int, String>()

                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""

                  while (
                      event != XmlPullParser.END_DOCUMENT
                  ) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              when (parser.name) {
                                  "row" -> {
                                      linhaAtual =
                                          mutableMapOf()
                                  }

                                  "c" -> {
                                      val referencia =
                                          parser.getAttributeValue(
                                              null,
                                              "r"
                                          ) ?: ""

                                      colunaAtual =
                                          numeroColuna(
                                              referencia
                                          )

                                      tipoCelula =
                                          parser.getAttributeValue(
                                              null,
                                              "t"
                                          ) ?: ""

                                      valor = ""
                                  }

                                  "v", "t" -> {
                                      valor = ""
                                  }
                              }
                          }

                          XmlPullParser.TEXT -> {
                              valor += parser.text
                          }

                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "c" -> {
                                      var final =
                                          valor.trim()

                                      if (
                                          tipoCelula == "s" &&
                                          final.isNotEmpty()
                                      ) {
                                          val indice =
                                              final.toIntOrNull()

                                          if (
                                              indice != null &&
                                              indice < sharedStrings.size
                                          ) {
                                              final =
                                                  sharedStrings[indice]
                                          }
                                      }

                                      linhaAtual[colunaAtual] =
                                          final
                                  }

                                  "row" -> {
                                      if (
                                          linhaAtual.isNotEmpty()
                                      ) {
                                          val max =
                                              linhaAtual.keys.maxOrNull()
                                                  ?: 0

                                          val lista =
                                              MutableList(
                                                  max + 1
                                              ) { "" }

                                          for (
                                              (indice, texto)
                                              in linhaAtual
                                          ) {
                                              if (
                                                  indice < lista.size
                                              ) {
                                                  lista[indice] =
                                                      texto
                                              }
                                          }

                                          resultado.add(lista)
                                      }
                                  }
                              }
                          }
                      }

                      event = parser.next()
                  }

                  return resultado
              }

              private fun numeroColuna(
                  referencia: String
              ): Int {
                  var resultado = 0

                  for (c in referencia) {
                      if (c.isDigit()) break

                      resultado =
                          resultado * 26 +
                          (
                              c.uppercaseChar() -
                              'A' +
                              1
                          )
                  }

                  return resultado - 1
              }

              private fun processarLinhas(
                  linhas: List<List<String>>
              ) {
                  if (linhas.isEmpty()) return

                  var indiceCabecalho = -1

                  for (i in linhas.indices) {
                      val texto =
                          linhas[i]
                              .joinToString("|")
                              .lowercase()

                      if (
                          texto.contains("cod material") &&
                          texto.contains("desc material")
                      ) {
                          indiceCabecalho = i
                          break
                      }
                  }

                  if (
                      indiceCabecalho == -1
                  ) {
                      throw Exception(
                          "Não foi possível localizar os cabeçalhos da planilha."
                      )
                  }

                  val cabecalho =
                      linhas[indiceCabecalho]

                  fun localizar(
                      nome: String
                  ): Int {
                      return cabecalho.indexOfFirst {
                          it.trim().equals(
                              nome,
                              ignoreCase = true
                          )
                      }
                  }

                  val codMaterial =
                      localizar("Cod Material")

                  val descMaterial =
                      localizar("Desc Material")

                  val estacao =
                      localizar("Estacao")

                  val rack =
                      localizar("Rack")

                  val linhaProd =
                      localizar("Linha prod alocado")

                  val colunaProd =
                      localizar("Coluna prod alocado")

                  if (
                      codMaterial < 0 ||
                      descMaterial < 0 ||
                      estacao < 0 ||
                      rack < 0 ||
                      linhaProd < 0 ||
                      colunaProd < 0
                  ) {
                      throw Exception(
                          "A planilha não possui todas as colunas necessárias."
                      )
                  }

                  for (
                      i in
                      (indiceCabecalho + 1)
                          until
                          linhas.size
                  ) {
                      val linha =
                          linhas[i]

                      fun valor(
                          indice: Int
                      ): String {
                          return if (
                              indice >= 0 &&
                              indice < linha.size
                          ) {
                              linha[indice].trim()
                          } else {
                              ""
                          }
                      }

                      val codigo =
                          valor(codMaterial)
                              .filter { it.isDigit() }
                              .takeLast(5)

                      if (
                          codigo.length != 5
                      ) {
                          continue
                      }

                      baseProdutos[codigo] =
                          EnderecoProduto(
                              codigo = codigo,
                              descricao = valor(descMaterial),
                              rua = valor(estacao),
                              rack = valor(rack),
                              coluna = valor(linhaProd),
                              linha = valor(colunaProd)
                          )
                  }

                  if (
                      baseProdutos.isEmpty()
                  ) {
                      throw Exception(
                          "Nenhum produto válido foi encontrado."
                      )
                  }
              }
          }
          EOF

