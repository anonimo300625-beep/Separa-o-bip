          package com.separacao.bip

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.util.Xml
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import org.xmlpull.v1.XmlPullParser
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.UUID
          import java.util.zip.ZipFile

          private const val STATUS_DISPONIVEL = "disponivel"

          private data class CaixaFechada(
              val id: String,
              val codigo: String,
              val descricao: String,
              val localizacao: String,
              val validade: String,
              val temValidade: Boolean,
              val validadeOrdem: Int?,
              val dataEntrada: Long,
              val operador: String,
              val dispositivo: String,
              val status: String = STATUS_DISPONIVEL
          )

          class CaixasActivity : AppCompatActivity() {

              private lateinit var tvOperador: TextView
              private lateinit var tvLocalizacaoAtual: TextView
              private lateinit var tvQuantidadeEstoque: TextView
              private lateinit var etBipagem: EditText
              private lateinit var tvEtapaEntrada: TextView
              private lateinit var tvProduto: TextView
              private lateinit var tvFeedback: TextView
              private lateinit var containerEntrada: LinearLayout
              private lateinit var containerEstoque: LinearLayout
              private lateinit var containerListaCaixas: LinearLayout
              private lateinit var btnEntrada: Button
              private lateinit var btnEstoque: Button
              private lateinit var btnProcessar: Button
              private lateinit var btnSemValidade: Button
              private lateinit var btnLimparLocal: Button
              private lateinit var btnFiltrosEstoque: Button
              private lateinit var btnExportarEstoque: Button
              private lateinit var tvFiltroEstoque: TextView

              private val db by lazy { FirebaseFirestore.getInstance() }
              private var caixasListener: ListenerRegistration? = null
              private val caixas = mutableListOf<CaixaFechada>()
              private val descricoesProdutos = mutableMapOf<String, String>()
              private var nomeOperador = "Operador 1"
              private var dispositivoId = ""
              private var localizacaoAtual = ""
              private var codigoPendente = ""
              private var modoEstoque = false
              private var processandoEntrada = false

              private var filtroValidade = "todos"
              private var filtroProximidade = "todas"
              private var filtroLocalizacao = "todos"
              private var filtroCodigo = "todos"
              private var ordenacao = "fefo"

              companion object {
                  private const val PREFS = "reposicao_prefs"
                  private const val KEY_OPERADOR = "operador"
                  private const val KEY_DISPOSITIVO = "dispositivo_id"
                  private const val COLECAO_CAIXAS = "caixas_fechadas"
                  private const val REQUEST_EXPORTAR = 700
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_caixas)
                  inicializarViews()
                  carregarIdentificacao()
                  carregarDescricoesProdutos()
                  configurarEventos()
                  atualizarTelaEntrada()
                  iniciarSincronizacaoCaixas()
              }

              override fun onDestroy() {
                  caixasListener?.remove()
                  caixasListener = null
                  super.onDestroy()
              }

              private fun inicializarViews() {
                  tvOperador = findViewById(R.id.tvCaixasOperador)
                  tvLocalizacaoAtual = findViewById(R.id.tvLocalizacaoAtual)
                  tvQuantidadeEstoque = findViewById(R.id.tvQuantidadeEstoque)
                  etBipagem = findViewById(R.id.etBipagem)
                  tvEtapaEntrada = findViewById(R.id.tvEtapaEntrada)
                  tvProduto = findViewById(R.id.tvProdutoCaixa)
                  tvFeedback = findViewById(R.id.tvFeedbackCaixas)
                  containerEntrada = findViewById(R.id.containerEntradaCaixas)
                  containerEstoque = findViewById(R.id.containerEstoqueCaixas)
                  containerListaCaixas = findViewById(R.id.containerListaCaixas)
                  btnEntrada = findViewById(R.id.btnEntradaCaixas)
                  btnEstoque = findViewById(R.id.btnEstoqueCaixas)
                  btnProcessar = findViewById(R.id.btnProcessarBipagem)
                  btnSemValidade = findViewById(R.id.btnSemValidade)
                  btnLimparLocal = findViewById(R.id.btnLimparLocal)
                  btnFiltrosEstoque = findViewById(R.id.btnFiltrosEstoque)
                  btnExportarEstoque = findViewById(R.id.btnExportarEstoque)
                  tvFiltroEstoque = findViewById(R.id.tvFiltroEstoque)
              }

              private fun carregarIdentificacao() {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  nomeOperador = prefs.getString(KEY_OPERADOR, "Operador 1") ?: "Operador 1"
                  dispositivoId = prefs.getString(KEY_DISPOSITIVO, null) ?: UUID.randomUUID().toString().also {
                      prefs.edit().putString(KEY_DISPOSITIVO, it).apply()
                  }
                  tvOperador.text = "Operador: $nomeOperador"
              }

              private fun configurarEventos() {
                  btnEntrada.setOnClickListener {
                      modoEstoque = false
                      atualizarTelaEntrada()
                  }
                  btnEstoque.setOnClickListener {
                      modoEstoque = true
                      atualizarTelaEstoque()
                  }
                  btnProcessar.setOnClickListener { processarEntradaDigitada() }
                  btnSemValidade.setOnClickListener { confirmarSemValidade() }
                  btnLimparLocal.setOnClickListener {
                      if (codigoPendente.isNotBlank()) {
                          AlertDialog.Builder(this)
                              .setTitle("Limpar entrada atual?")
                              .setMessage("A caixa $codigoPendente ainda está aguardando a validade.")
                              .setNegativeButton("VOLTAR", null)
                              .setPositiveButton("LIMPAR") { _, _ ->
                                  codigoPendente = ""
                                  etBipagem.setText("")
                                  tvProduto.text = ""
                                  atualizarEtapaEntrada()
                              }
                              .show()
                      } else {
                          localizacaoAtual = ""
                          etBipagem.setText("")
                          atualizarLocalizacaoAtual()
                          atualizarEtapaEntrada()
                          etBipagem.requestFocus()
                      }
                  }
                  btnFiltrosEstoque.setOnClickListener { abrirFiltrosEstoque() }
                  btnExportarEstoque.setOnClickListener { exportarEstoqueCompleto() }
                  etBipagem.setOnEditorActionListener { _, _, _ ->
                      processarEntradaDigitada()
                      true
                  }
              }

              private fun processarEntradaDigitada() {
                  val valor = etBipagem.text.toString().trim()
                  if (valor.isBlank()) return

                  val localDetectada = detectarLocalizacao(valor)
                  if (localDetectada != null) {
                      if (codigoPendente.isNotBlank()) {
                          Toast.makeText(this, "Finalize a caixa $codigoPendente antes de trocar de localização.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      localizacaoAtual = localDetectada
                      etBipagem.setText("")
                      atualizarLocalizacaoAtual()
                      atualizarEtapaEntrada()
                      mostrarFeedback("📍 Localização #$localDetectada selecionada.")
                      return
                  }

                  val validade = normalizarValidade(valor)
                  if (validade != null) {
                      if (localizacaoAtual.isBlank()) {
                          Toast.makeText(this, "Primeiro bipe a localização da caixaria.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      if (codigoPendente.isBlank()) {
                          Toast.makeText(this, "Primeiro bipe o código da caixa.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      etBipagem.setText("")
                      registrarCaixa(validade)
                      return
                  }

                  val codigo = extrairCodigo(valor)
                  if (codigo.length == 5) {
                      if (localizacaoAtual.isBlank()) {
                          Toast.makeText(this, "Primeiro bipe a localização da caixaria.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      if (codigoPendente.isNotBlank()) {
                          Toast.makeText(this, "A caixa $codigoPendente está aguardando a validade.", Toast.LENGTH_LONG).show()
                          etBipagem.setText("")
                          return
                      }
                      codigoPendente = codigo
                      etBipagem.setText("")
                      atualizarProdutoInformativo(codigo)
                      atualizarEtapaEntrada()
                      return
                  }

                  Toast.makeText(this, "Leitura não reconhecida. Use #localização, código de 5 números ou validade MM/AA.", Toast.LENGTH_LONG).show()
                  etBipagem.setText("")
              }

              private fun detectarLocalizacao(valor: String): String? {
                  val texto = valor.trim().replace(" ", "")
                  if (texto.startsWith("#")) {
                      val numeros = texto.removePrefix("#").filter { it.isDigit() }
                      return if (numeros.length >= 4) numeros else null
                  }

                  // Alguns bipadores devolvem #3002 como 33002. Nesse formato,
                  // o primeiro 3 adicional representa o caractere #.
                  if (codigoPendente.isBlank() && texto.matches(Regex("33\\d{3}"))) {
                      val possivelLocal = texto.substring(1)
                      if (possivelLocal.startsWith("3")) return possivelLocal
                  }
                  return null
              }

              private fun atualizarLocalizacaoAtual() {
                  tvLocalizacaoAtual.text = if (localizacaoAtual.isBlank()) {
                      "📍 Nenhuma localização selecionada"
