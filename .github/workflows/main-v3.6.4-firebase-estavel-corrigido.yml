                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("SALVAR") { _, _ ->
                          val novo =
                              input.text.toString().trim()

                          if (novo.isNotEmpty()) {
                              nomeOperador = novo

                              getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                              )
                                  .edit()
                                  .putString(
                                      KEY_OPERADOR,
                                      novo
                                  )
