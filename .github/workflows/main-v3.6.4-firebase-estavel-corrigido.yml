              private fun atualizarTextoFiltro() {
                  val validadeTexto = when (filtroValidade) { "com" -> "Com validade"; "sem" -> "Sem validade"; else -> "Todos" }
                  val proximidadeTexto = when (filtroProximidade) {
                      "vencidas" -> "Vencidas"
                      "ate6" -> "Até 6 meses"
                      "7a12" -> "7–12 meses"
                      "14a24" -> "14–24 meses"
                      else -> "Todas"
                  }
                  val localTexto = if (filtroLocalizacao == "todos") "Todas" else "#${filtroLocalizacao}"
                  val codigoTexto = if (filtroCodigo == "todos") "Todos" else "Código: $filtroCodigo"
                  val ordemTexto = when (ordenacao) { "codigo" -> "Código"; "local" -> "Localização"; "entrada" -> "Entrada"; else -> "FEFO" }
                  tvFiltroEstoque.text = "Filtros: $validadeTexto • $proximidadeTexto • $localTexto • $codigoTexto\nOrdenação interna: $ordemTexto"
              }

              private fun atualizarListaEstoque() {
                  containerListaCaixas.removeAllViews()
                  val agora = Date()
                  val cal = java.util.Calendar.getInstance()
                  cal.time = agora
                  val anoAtual = cal.get(java.util.Calendar.YEAR)
                  val mesAtualNumero = cal.get(java.util.Calendar.MONTH) + 1
                  val mesAtual = anoAtual * 12 + mesAtualNumero
                  val cal6 = cal.clone() as java.util.Calendar
                  cal6.add(java.util.Calendar.MONTH, 6)
                  val limite6 = cal6.get(java.util.Calendar.YEAR) * 12 + (cal6.get(java.util.Calendar.MONTH) + 1)
                  val cal12 = cal.clone() as java.util.Calendar
                  cal12.add(java.util.Calendar.MONTH, 12)
                  val limite12 = cal12.get(java.util.Calendar.YEAR) * 12 + (cal12.get(java.util.Calendar.MONTH) + 1)
                  val cal13 = cal.clone() as java.util.Calendar
                  cal13.add(java.util.Calendar.MONTH, 13)
                  val limite13 = cal13.get(java.util.Calendar.YEAR) * 12 + (cal13.get(java.util.Calendar.MONTH) + 1)
                  val cal24 = cal.clone() as java.util.Calendar
                  cal24.add(java.util.Calendar.MONTH, 24)
                  val limite24 = cal24.get(java.util.Calendar.YEAR) * 12 + (cal24.get(java.util.Calendar.MONTH) + 1)

                  val filtradas = caixas.filter {
                      val passaValidade = when (filtroValidade) { "com" -> it.temValidade; "sem" -> !it.temValidade; else -> true }
                      val validadeMes = if (it.temValidade) {
                          val ordem = it.validadeOrdem ?: Int.MAX_VALUE
                          if (ordem == Int.MAX_VALUE) null else {
                              val ano = ordem / 100
                              val mes = ordem % 100
                              ano * 12 + mes
                          }
                      } else null
                      val passaProximidade = when (filtroProximidade) {
                          "vencidas" -> it.temValidade && (validadeMes ?: Int.MAX_VALUE) < mesAtual
                          "ate6" -> it.temValidade && (validadeMes ?: Int.MAX_VALUE) in mesAtual..limite6
                          "7a12" -> it.temValidade && (validadeMes ?: Int.MIN_VALUE) > limite6 && (validadeMes ?: Int.MIN_VALUE) <= limite12
                          "14a24" -> it.temValidade && (validadeMes ?: Int.MIN_VALUE) > limite13 && (validadeMes ?: Int.MIN_VALUE) <= limite24
                          else -> true
                      }
                      val passaLocal = filtroLocalizacao == "todos" || it.localizacao == filtroLocalizacao
                      val passaCodigo = filtroCodigo == "todos" || it.codigo.contains(filtroCodigo)
                      passaValidade && passaProximidade && passaLocal && passaCodigo
                  }

                  val ordenadas = when (ordenacao) {
                      "codigo" -> filtradas.sortedWith(compareBy<CaixaFechada> { it.codigo }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE }.thenBy { it.localizacao })
                      "local" -> filtradas.sortedWith(compareBy<CaixaFechada> { it.localizacao }.thenBy { it.codigo }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE })
                      "entrada" -> filtradas.sortedByDescending { it.dataEntrada }
                      else -> filtradas.sortedWith(compareBy<CaixaFechada> { if (it.temValidade) 0 else 1 }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE }.thenBy { it.codigo }.thenBy { it.localizacao })
                  }

                  if (ordenadas.isEmpty()) {
                      containerListaCaixas.addView(TextView(this).apply {
                          text = "Nenhuma caixa encontrada com os filtros atuais."
                          textSize = 16f
                          setTextColor(Color.parseColor("#757575"))
                          setPadding(20, 40, 20, 40)
                          gravity = Gravity.CENTER
                      })
                      return
                  }

                  // O estoque é apresentado agrupado por localização.
                  // Os filtros continuam valendo, mas o botão de refazer sempre atua
                  // sobre TODOS os registros disponíveis daquela localização.
                  val grupos = ordenadas.groupBy { it.localizacao }
                  // As localizações são sempre apresentadas da menor para a maior.
                  // A ordenação escolhida nos filtros vale apenas para os registros dentro de cada localização.
                  val locaisOrdenados = grupos.keys.sortedWith(
                      compareBy<String> { it.toIntOrNull() ?: Int.MAX_VALUE }.thenBy { it }
                  )

                  for (local in locaisOrdenados) {
                      val grupo = grupos[local].orEmpty()
                      val grupoOrdenado = when (ordenacao) {
                          "codigo" -> grupo.sortedWith(compareBy<CaixaFechada> { it.codigo }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE })
                          "entrada" -> grupo.sortedByDescending { it.dataEntrada }
                          else -> grupo.sortedWith(
                              compareBy<CaixaFechada> { if (it.temValidade) 0 else 1 }
                                  .thenBy { it.validadeOrdem ?: Int.MAX_VALUE }
                                  .thenBy { it.codigo }
                          )
                      }
                      adicionarCabecalhoLocalizacao(local, grupo, grupoOrdenado, ordenacao == "fefo")
                  }
              }

              private fun adicionarCabecalhoLocalizacao(localizacao: String, grupo: List<CaixaFechada>, caixasDoGrupo: List<CaixaFechada>, destacarFefo: Boolean) {
                  val bloco = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(0, 10, 0, 0)
                      }
                  }

                  val conteudo = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding(0, 0, 0, 4)
                  }

                  val cabecalho = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(14, 12, 6, 12)
                      setBackgroundColor(Color.parseColor("#E8EEF7"))
                  }

                  val titulo = TextView(this).apply {
                      text = "▶  #$localizacao  •  ${grupo.size} caixa${if (grupo.size == 1) "" else "s"}"
                      textSize = 17f
                      setTextColor(Color.parseColor("#1565C0"))
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  cabecalho.addView(titulo)

                  val menu = Button(this).apply {
                      text = "⋮"
                      textSize = 24f
                      setTextColor(Color.parseColor("#555555"))
                      setBackgroundColor(Color.TRANSPARENT)
                      contentDescription = "Opções da localização"
                      layoutParams = LinearLayout.LayoutParams(48, 48)
                      setPadding(0, 0, 0, 0)
                      setOnClickListener { abrirMenuLocalizacao(this, localizacao) }
                  }
                  cabecalho.addView(menu)

                  for (caixa in caixasDoGrupo) {
                      adicionarCardCaixa(caixa, destacarFefo, conteudo)
                  }

                  cabecalho.setOnClickListener {
                      val expandido = conteudo.visibility == View.VISIBLE
                      conteudo.visibility = if (expandido) View.GONE else View.VISIBLE
                      titulo.text = "${if (expandido) "▶" else "▼"}  #$localizacao  •  ${grupo.size} caixa${if (grupo.size == 1) "" else "s"}"
                  }

                  bloco.addView(cabecalho)
                  bloco.addView(conteudo)
                  containerListaCaixas.addView(bloco)
              }

              private fun abrirMenuLocalizacao(anchor: View, localizacao: String) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add("Refazer esta localização")
                  popup.setOnMenuItemClickListener { item ->
                      if (item.title.toString() == "Refazer esta localização") {
                          confirmarRefazerLocalizacao(localizacao)
                          true
                      } else false
                  }
                  popup.show()
              }

              private fun confirmarRefazerLocalizacao(localizacao: String) {
                  val quantidadeReal = caixas.count { it.localizacao == localizacao }
                  AlertDialog.Builder(this)
                      .setTitle("Refazer localização #$localizacao?")
                      .setMessage(
                          "Esta ação removerá do estoque todos os registros da localização #$localizacao " +
                              "($quantidadeReal caixa${if (quantidadeReal == 1) "" else "s"}).\n\n" +
                              "Depois disso, a localização ficará selecionada na entrada para você bipar novamente todas as caixas.\n\n" +
                              "As outras localizações não serão alteradas."
                      )
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("REFazer LOCALIZAÇÃO") { _, _ -> refazerLocalizacao(localizacao) }
                      .show()
              }

              private fun refazerLocalizacao(localizacao: String) {
                  val registros = caixas.filter { it.localizacao == localizacao }
                  if (registros.isEmpty()) {
                      iniciarNovaEntradaNaLocalizacao(localizacao)
                      return
                  }

                  val batches = registros.chunked(400).map { grupo ->
                      db.batch().apply {
                          grupo.forEach { caixa ->
                              delete(db.collection(COLECAO_CAIXAS).document(caixa.id))
                          }
                      }
                  }

                  fun executar(indice: Int) {
                      if (indice >= batches.size) {
                          Toast.makeText(this, "Localização #$localizacao limpa. Refaça a bipagem de todas as caixas.", Toast.LENGTH_LONG).show()
                          iniciarNovaEntradaNaLocalizacao(localizacao)
                          return
                      }
                      batches[indice].commit()
                          .addOnSuccessListener { executar(indice + 1) }
                          .addOnFailureListener { e ->
                              Toast.makeText(this, "Não foi possível refazer a localização: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                  }
                  executar(0)
              }

              private fun iniciarNovaEntradaNaLocalizacao(localizacao: String) {
                  localizacaoAtual = localizacao
                  codigoPendente = ""
                  etBipagem.setText("")
                  tvProduto.text = ""
                  mostrarFeedback("📍 #$localizacao pronta para nova conferência. Bipe todas as caixas desta localização.")
                  modoEstoque = false
                  atualizarTelaEntrada()
                  etBipagem.requestFocus()
              }

              private fun adicionarCardCaixa(caixa: CaixaFechada, destacarFefo: Boolean, destino: LinearLayout = containerListaCaixas) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 14, 12, 14)
                      setBackgroundColor(Color.WHITE)
                  }
                  card.layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 5, 0, 5) }

                  val topo = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titulo = TextView(this).apply {
                      text = caixa.codigo
                      textSize = 19f
                      setTextColor(Color.parseColor("#1565C0"))
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  topo.addView(titulo)

                  val menu = Button(this).apply {
                      text = "⋮"
                      textSize = 24f
                      setTextColor(Color.parseColor("#555555"))
                      setBackgroundColor(Color.TRANSPARENT)
                      contentDescription = "Mais opções"
                      layoutParams = LinearLayout.LayoutParams(48, 48)
                      setPadding(0, 0, 0, 0)
                      setOnClickListener { abrirMenuCaixa(this, caixa) }
                  }
                  topo.addView(menu)
                  card.addView(topo)

                  val descricao = caixa.descricao.ifBlank { descricoesProdutos[caixa.codigo].orEmpty() }
                  if (descricao.isNotBlank()) {
                      card.addView(TextView(this).apply {
                          text = descricao
                          textSize = 14f
                          setTextColor(Color.parseColor("#555555"))
                          setPadding(0, 1, 0, 6)
                      })
                  }

                  val validadeTexto = if (caixa.temValidade) {
                      if (destacarFefo) "📅 Validade: ${caixa.validade} • FEFO" else "📅 Validade: ${caixa.validade}"
                  } else "📅 Sem validade"
                  card.addView(TextView(this).apply {
                      text = validadeTexto
                      textSize = 15f
                      setTextColor(Color.parseColor("#333333"))
                      setPadding(0, 1, 0, 2)
                  })
                  card.addView(TextView(this).apply {
                      text = "📍 #${caixa.localizacao}"
                      textSize = 15f
                      setTextColor(Color.parseColor("#333333"))
                  })
                  destino.addView(card)
              }

              private fun abrirMenuCaixa(anchor: View, caixa: CaixaFechada) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add("Detalhes do registro")
                  popup.menu.add("Excluir")
                  popup.setOnMenuItemClickListener { item ->
                      when (item.title.toString()) {
                          "Detalhes do registro" -> { mostrarDetalhesCaixa(caixa); true }
                          "Excluir" -> { confirmarExcluir(caixa); true }
                          else -> false
                      }
                  }
                  popup.show()
              }

              private fun mostrarDetalhesCaixa(caixa: CaixaFechada) {
                  val descricao = caixa.descricao.ifBlank { descricoesProdutos[caixa.codigo].orEmpty() }.ifBlank { "Não encontrada" }
                  val validade = if (caixa.temValidade) caixa.validade else "Sem validade"
                  val texto = "Código: ${caixa.codigo}\n" +
                      "Descrição: $descricao\n" +
                      "Validade: $validade\n" +
                      "Localização: #${caixa.localizacao}\n" +
                      "Registrado por: ${caixa.operador.ifBlank { "Não informado" }}\n" +
                      "Data/hora: ${formatarData(caixa.dataEntrada)}\n" +
                      "Dispositivo: ${caixa.dispositivo.ifBlank { "Não informado" }}\n" +
                      "Status: ${caixa.status}"
                  AlertDialog.Builder(this)
                      .setTitle("Detalhes da caixa")
                      .setMessage(texto)
                      .setPositiveButton("FECHAR", null)
                      .show()
              }

              private fun confirmarExcluir(caixa: CaixaFechada) {
                  AlertDialog.Builder(this)
                      .setTitle("Excluir caixa?")
                      .setMessage("Código: ${caixa.codigo}\nLocal: #${caixa.localizacao}\n" + (if (caixa.temValidade) "Validade: ${caixa.validade}" else "Sem validade") + "\n\nUse somente para corrigir um cadastro feito por engano.")
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("EXCLUIR") { _, _ ->
                          db.collection(COLECAO_CAIXAS).document(caixa.id).delete()
                              .addOnSuccessListener { Toast.makeText(this, "Caixa removida do estoque.", Toast.LENGTH_SHORT).show() }
                              .addOnFailureListener { e -> Toast.makeText(this, "Erro ao excluir: ${e.message}", Toast.LENGTH_LONG).show() }
                      }
                      .show()
              }

              private fun exportarEstoqueCompleto() {
                  if (caixas.isEmpty()) {
                      Toast.makeText(this, "Não há caixas disponíveis para exportar.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val porCodigo = caixas.groupBy { it.codigo }
                  val linhas = mutableListOf<String>()
                  linhas.add("Código;Descrição;Validade da caixa;Tem validade;Localização;Quantidade de caixas do código;Validade mais próxima do código;Localização FEFO;Registrado por;Data de entrada")
                  val caixasOrdenadas = caixas.sortedWith(compareBy<CaixaFechada> { it.codigo }.thenBy { if (it.temValidade) 0 else 1 }.thenBy { it.validadeOrdem ?: Int.MAX_VALUE }.thenBy { it.localizacao })
                  for (caixa in caixasOrdenadas) {
                      val grupo = porCodigo[caixa.codigo].orEmpty()
                      val comValidade = grupo.filter { it.temValidade && it.validadeOrdem != null }
                      val primeira = comValidade.minWithOrNull(compareBy<CaixaFechada> { it.validadeOrdem }.thenBy { it.localizacao })
                      val validadeMaisProxima = primeira?.validade ?: "Sem validade"
                      val localFefo = primeira?.localizacao?.let { "#$it" } ?: "-"
                      val descricao = caixa.descricao.ifBlank { descricoesProdutos[caixa.codigo].orEmpty() }
                      linhas.add(listOf(
                          caixa.codigo,
                          descricao,
                          if (caixa.temValidade) caixa.validade else "Sem validade",
                          if (caixa.temValidade) "SIM" else "NÃO",
                          "#${caixa.localizacao}",
                          grupo.size.toString(),
                          validadeMaisProxima,
                          localFefo,
                          caixa.operador,
                          formatarData(caixa.dataEntrada)
                      ).joinToString(";") { escaparCsv(it) })
                  }
                  exportacaoPendente = linhas.joinToString("\n")
                  val nome = "estoque_caixas_${SimpleDateFormat("yyyyMMdd_HHmm", Locale.getDefault()).format(Date())}.csv"
                  val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "text/csv"
                      putExtra(Intent.EXTRA_TITLE, nome)
                  }
                  startActivityForResult(intent, REQUEST_EXPORTAR)
              }

              private var exportacaoPendente = ""

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQUEST_EXPORTAR && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          contentResolver.openOutputStream(uri)?.use { output ->
                              output.write(byteArrayOf(0xEF.toByte(), 0xBB.toByte(), 0xBF.toByte()))
                              output.write(exportacaoPendente.toByteArray(Charsets.UTF_8))
                          }
                          Toast.makeText(this, "Estoque exportado com sucesso.", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Erro ao exportar: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun escaparCsv(valor: String): String {
                  return if (valor.contains(";") || valor.contains("\"") || valor.contains("\n")) "\"${valor.replace("\"", "\"\"")}\"" else valor
              }

              private fun extrairCodigo(valor: String): String {
                  val texto = valor.trim()
                  if (!texto.matches(Regex("\\d{5}"))) return ""
                  return texto
              }

              private fun normalizarValidade(valor: String): String? {
                  val texto = valor.trim()
                  val match = Regex("^(0[1-9]|1[0-2])[/.-](\\d{2}|\\d{4})$").find(texto) ?: return null
                  val mes = match.groupValues[1]
                  val ano = match.groupValues[2]
                  return if (ano.length == 2) "$mes/$ano" else "$mes/${ano.takeLast(2)}"
              }

              private fun validadeParaOrdem(validade: String): Int? {
                  val match = Regex("^(\\d{2})/(\\d{2})$").find(validade) ?: return null
                  return (2000 + match.groupValues[2].toInt()) * 100 + match.groupValues[1].toInt()
              }

              private fun formatarData(timestamp: Long): String {
                  if (timestamp <= 0) return "-"
                  return SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.getDefault()).format(Date(timestamp))
              }

              // Usa exatamente a mesma planilha atualmente carregada pelo módulo principal.
              // Isso evita que a área de estoque fique com uma base antiga quando o usuário
              // atualiza a planilha pelo aplicativo.
              private fun carregarDescricoesProdutos() {
                  val temp = java.io.File(cacheDir, "enderecos_caixas_temp.xlsx")
                  try {
                      val planilhaAtual = java.io.File(filesDir, "enderecos_atualizados.xlsx")
                      if (planilhaAtual.exists()) {
                          java.io.FileInputStream(planilhaAtual).use { input ->
                              FileOutputStream(temp).use { output -> input.copyTo(output) }
                          }
                      } else {
                          assets.open("enderecos.xlsx").use { input ->
                              FileOutputStream(temp).use { output -> input.copyTo(output) }
                          }
                      }

                      ZipFile(temp).use { zip ->
                          val sharedStrings = mutableListOf<String>()
                          val shared = zip.getEntry("xl/sharedStrings.xml")
                          if (shared != null) {
                              zip.getInputStream(shared).use {
                                  sharedStrings.addAll(lerSharedStrings(it))
                              }
                          }
                          val sheet = zip.entries().asSequence().firstOrNull {
                              it.name.startsWith("xl/worksheets/sheet") && it.name.endsWith(".xml")
                          } ?: throw Exception("Nenhuma planilha encontrada.")
                          zip.getInputStream(sheet).use {
                              processarLinhasPlanilha(lerPlanilhaXML(it, sharedStrings))
                          }
                      }
                  } catch (_: Exception) {
                      // A entrada continua funcionando mesmo se a descrição não puder ser carregada.
                  } finally {
                      temp.delete()
                  }
              }

              private fun lerSharedStrings(input: InputStream): List<String> {
                  val resultado = mutableListOf<String>()
                  val parser = Xml.newPullParser()
                  parser.setInput(input, "UTF-8")
                  var textoAtual = ""
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> if (parser.name == "si") textoAtual = ""
                          XmlPullParser.TEXT -> textoAtual += parser.text
                          XmlPullParser.END_TAG -> if (parser.name == "si") resultado.add(textoAtual)
                      }
                      event = parser.next()
                  }
                  return resultado
              }

              private fun lerPlanilhaXML(input: InputStream, sharedStrings: List<String>): List<List<String>> {
                  val resultado = mutableListOf<List<String>>()
                  val parser = Xml.newPullParser()
                  parser.setInput(input, "UTF-8")
                  var event = parser.eventType
                  var linhaAtual = mutableMapOf<Int, String>()
                  var colunaAtual = 0
                  var tipoCelula = ""
                  var valor = ""
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> when (parser.name) {
                              "row" -> linhaAtual = mutableMapOf()
                              "c" -> {
                                  val referencia = parser.getAttributeValue(null, "r") ?: ""
                                  colunaAtual = numeroColuna(referencia)
                                  tipoCelula = parser.getAttributeValue(null, "t") ?: ""
                                  valor = ""
                              }
                              "v", "t" -> valor = ""
                          }
                          XmlPullParser.TEXT -> valor += parser.text
                          XmlPullParser.END_TAG -> when (parser.name) {
                              "c" -> {
                                  var final = valor.trim()
                                  if (tipoCelula == "s" && final.isNotEmpty()) {
                                      val indice = final.toIntOrNull()
                                      if (indice != null && indice < sharedStrings.size) final = sharedStrings[indice]
                                  }
                                  linhaAtual[colunaAtual] = final
                              }
                              "row" -> if (linhaAtual.isNotEmpty()) {
                                  val max = linhaAtual.keys.maxOrNull() ?: 0
                                  val lista = MutableList(max + 1) { "" }
                                  for ((indice, texto) in linhaAtual) if (indice < lista.size) lista[indice] = texto
                                  resultado.add(lista)
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return resultado
              }

              private fun numeroColuna(referencia: String): Int {
                  var resultado = 0
                  for (c in referencia) {
                      if (c.isDigit()) break
                      resultado = resultado * 26 + (c.uppercaseChar() - 'A' + 1)
                  }
                  return resultado - 1
              }

              private fun processarLinhasPlanilha(linhas: List<List<String>>) {
                  if (linhas.isEmpty()) return
                  var indiceCabecalho = -1
                  for (i in linhas.indices) {
                      val texto = linhas[i].joinToString("|").lowercase()
                      if (texto.contains("cod material") && texto.contains("desc material")) {
                          indiceCabecalho = i
                          break
                      }
                  }
                  if (indiceCabecalho < 0) return
                  val cabecalho = linhas[indiceCabecalho]
                  fun localizar(nome: String) = cabecalho.indexOfFirst { it.trim().equals(nome, ignoreCase = true) }
                  val cod = localizar("Cod Material")
                  val desc = localizar("Desc Material")
                  if (cod < 0 || desc < 0) return
                  for (i in (indiceCabecalho + 1) until linhas.size) {
                      val linha = linhas[i]
                      fun valor(indice: Int) = if (indice >= 0 && indice < linha.size) linha[indice].trim() else ""
                      val codigo = valor(cod).filter { it.isDigit() }.takeLast(5)
                      if (codigo.length == 5) descricoesProdutos[codigo] = valor(desc)
                  }
              }
          }
          EOF

      - name: Criar serviço de monitoramento em segundo plano
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/MonitoramentoReposicaoService.kt
          package com.separacao.bip

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import java.util.UUID

          class MonitoramentoReposicaoService : Service() {

              private val db by lazy { FirebaseFirestore.getInstance() }
              private var firestoreListener: ListenerRegistration? = null
              private var snapshotInicial = true

              private val dispositivoId: String by lazy {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs.getString(KEY_DISPOSITIVO, null) ?: run {
                      val androidId = android.provider.Settings.Secure.getString(
                          contentResolver,
                          android.provider.Settings.Secure.ANDROID_ID
                      )
                      val id = androidId?.takeIf { it.isNotBlank() }
                          ?: UUID.randomUUID().toString()
                      prefs.edit().putString(KEY_DISPOSITIVO, id).apply()
                      id
                  }
              }

              companion object {
                  private const val PREFS = "reposicao_prefs"
                  private const val KEY_NOTIFICACOES_ATIVAS = "notificacoes_ativas"
                  private const val KEY_DISPOSITIVO = "dispositivo_id"
                  private const val COLECAO_REPOSICOES = "reposicoes"
                  private const val CANAL_MONITORAMENTO = "monitoramento_reposicoes"
                  private const val CANAL_NOTIFICACOES = "novas_reposicoes"
                  private const val NOTIFICACAO_MONITORAMENTO = 7001
                  private const val STATUS_PENDENTE = "pendente"
              }

              override fun onCreate() {
                  super.onCreate()
                  criarCanais()
                  promoverParaForeground()
                  iniciarMonitoramento()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (!notificacoesAtivas()) {
                      pararMonitoramento()
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (firestoreListener == null) {
                      iniciarMonitoramento()
                  }

                  return START_STICKY
              }

              override fun onDestroy() {
                  pararMonitoramento()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun notificacoesAtivas(): Boolean {
                  if (!getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getBoolean(KEY_NOTIFICACOES_ATIVAS, false)
                  ) return false

                  return Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) == PackageManager.PERMISSION_GRANTED
              }

              private fun criarCanais() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return

                  val monitoramento = NotificationChannel(
                      CANAL_MONITORAMENTO,
                      "Monitoramento de reposições",
                      NotificationManager.IMPORTANCE_LOW
                  ).apply {
                      description = "Indica que o monitoramento em segundo plano está ativo"
                      setShowBadge(false)
                  }

                  val novas = NotificationChannel(
                      CANAL_NOTIFICACOES,
                      "Novas reposições",
                      NotificationManager.IMPORTANCE_HIGH
                  ).apply {
                      description = "Avisos de novas pendências de reposição"
                      enableVibration(true)
                  }

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.createNotificationChannel(monitoramento)
                  manager.createNotificationChannel(novas)
              }

              private fun promoverParaForeground() {
                  val intent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      NOTIFICACAO_MONITORAMENTO,
                      intent,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                  )

                  val notification = NotificationCompat.Builder(this, CANAL_MONITORAMENTO)
                      .setSmallIcon(android.R.drawable.ic_popup_sync)
                      .setContentTitle("Monitoramento ativo")
                      .setContentText("Aguardando novas reposições")
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICACAO_MONITORAMENTO,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                      )
                  } else {
                      startForeground(NOTIFICACAO_MONITORAMENTO, notification)
                  }
              }

              private fun iniciarMonitoramento() {
                  if (!notificacoesAtivas()) return
                  firestoreListener?.remove()
                  snapshotInicial = true

                  firestoreListener = db.collection(COLECAO_REPOSICOES)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) return@addSnapshotListener

                          val primeira = snapshotInicial
                          snapshotInicial = false

                          if (!primeira) {
                              snapshot.documentChanges
                                  .filter { it.type == DocumentChange.Type.ADDED }
                                  .forEach { change ->
                                      val doc = change.document
                                      val status = doc.getString("status")
                                          ?: if (doc.getBoolean("concluido") == true) "concluido" else STATUS_PENDENTE
                                      val criador = doc.getString("dispositivo") ?: ""

                                      if (status == STATUS_PENDENTE && criador != dispositivoId) {
                                          mostrarNotificacao(
                                              id = doc.getString("id") ?: doc.id,
                                              codigo = doc.getString("codigo") ?: return@forEach,
                                              descricao = doc.getString("descricao") ?: "",
                                              rua = doc.getString("rua") ?: "",
                                              rack = doc.getString("rack") ?: ""
                                          )
                                      }
                                  }
                          }
                      }
              }

              private fun pararMonitoramento() {
                  firestoreListener?.remove()
                  firestoreListener = null
              }

              private fun mostrarNotificacao(
                  id: String,
                  codigo: String,
                  descricao: String,
                  rua: String,
                  rack: String
              ) {
                  if (!notificacoesAtivas()) return

                  val endereco = if (rua.isNotBlank() || rack.isNotBlank()) {
                      "${rua.ifBlank { "Sem rua" }} — ${rack.ifBlank { "Sem rack" }}"
                  } else {
                      "Sem endereço cadastrado"
                  }

                  val texto = "${codigo} • ${descricao.ifBlank { "Produto" }}\n$endereco"
                  val intent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      (id.hashCode() and 0x7fffffff),
                      intent,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                  )

                  val notification = NotificationCompat.Builder(this, CANAL_NOTIFICACOES)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("Nova reposição pendente")
                      .setContentText("Código $codigo — ${descricao.ifBlank { "Produto" }}")
                      .setStyle(NotificationCompat.BigTextStyle().bigText(texto))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setContentIntent(pendingIntent)
                      .setAutoCancel(true)
                      .build()

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.notify((id.hashCode() and 0x7fffffff), notification)
              }
          }
          EOF

      - name: Criar receptor de inicialização do aparelho
        run: |
          cat << 'EOF' > app/src/main/java/com/separacao/bip/BootReceiver.kt
          package com.separacao.bip

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.content.ContextCompat

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != Intent.ACTION_BOOT_COMPLETED) return

                  val prefs = context.getSharedPreferences("reposicao_prefs", Context.MODE_PRIVATE)
                  val ativo = prefs.getBoolean("notificacoes_ativas", false)
                  if (!ativo) return

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(
                          context,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) return

                  val serviceIntent = Intent(context, MonitoramentoReposicaoService::class.java)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent)
                      } else {
                          context.startService(serviceIntent)
                      }
                  } catch (_: Exception) {
                      // O sistema pode impedir o início em determinadas condições.
                  }
              }
          }
          EOF

