              private fun dadosFirestore(
                  item: ItemReposicao
              ): HashMap<String, Any> {
                  return hashMapOf(
                      "id" to item.id,
                      "codigo" to item.codigo,
                      "descricao" to item.descricao,
                      "quantidade" to item.quantidade,
                      "rua" to item.rua,
                      "rack" to item.rack,
                      "coluna" to item.coluna,
                      "linha" to item.linha,
                      "operador" to item.operador,
                      "timestamp" to item.timestamp,
                      "concluido" to item.concluido,
                      "status" to item.status,
                      "separador" to item.separador,
                      "dispositivo" to item.dispositivo
                  )
              }

              private fun itemParaJson(item: ItemReposicao): JSONObject {
                  return JSONObject().apply {
                      put("id", item.id)
                      put("codigo", item.codigo)
                      put("descricao", item.descricao)
                      put("quantidade", item.quantidade)
                      put("rua", item.rua)
                      put("rack", item.rack)
                      put("coluna", item.coluna)
                      put("linha", item.linha)
                      put("operador", item.operador)
                      put("timestamp", item.timestamp)
                      put("concluido", item.concluido)
                      put("status", item.status)
                      put("separador", item.separador)
                      put("dispositivo", item.dispositivo)
                  }
              }

              private fun jsonParaItem(obj: JSONObject): ItemReposicao {
                  return ItemReposicao(
                      id = obj.getString("id"),
                      codigo = obj.getString("codigo"),
                      descricao = obj.optString("descricao", ""),
                      quantidade = obj.optInt("quantidade", 1),
                      rua = obj.optString("rua", ""),
                      rack = obj.optString("rack", ""),
                      coluna = obj.optString("coluna", ""),
                      linha = obj.optString("linha", ""),
                      operador = obj.optString("operador", ""),
                      timestamp = obj.optLong("timestamp", 0L),
                      status = obj.optString("status", if (obj.optBoolean("concluido", false)) STATUS_CONCLUIDO else STATUS_PENDENTE),
                      separador = obj.optString("separador", ""),
                      dispositivo = obj.optString("dispositivo", "")
                  )
              }

              private fun dadosFila(): JSONArray {
                  return try {
                      JSONArray(getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_FILA_FIREBASE, "[]") ?: "[]")
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }

              private fun salvarFila(fila: JSONArray) {
                  getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putString(KEY_FILA_FIREBASE, fila.toString())
                      .apply()
              }

              private fun colocarNaFilaSalvar(item: ItemReposicao) {
                  val filaAtual = dadosFila()
                  val nova = JSONObject().apply {
                      put("operacao", "salvar")
                      put("id", item.id)
                      put("dados", itemParaJson(item))
                  }
                  val resultado = JSONArray()
                  for (i in 0 until filaAtual.length()) {
                      val atual = filaAtual.optJSONObject(i) ?: continue
                      if (atual.optString("id") != item.id) resultado.put(atual)
                  }
                  resultado.put(nova)
                  salvarFila(resultado)
              }

              private fun colocarNaFilaExcluir(item: ItemReposicao) {
                  val filaAtual = dadosFila()
                  val resultado = JSONArray()
                  for (i in 0 until filaAtual.length()) {
                      val atual = filaAtual.optJSONObject(i) ?: continue
                      if (atual.optString("id") != item.id) resultado.put(atual)
                  }
                  resultado.put(JSONObject().apply {
                      put("operacao", "excluir")
                      put("id", item.id)
                  })
                  salvarFila(resultado)
              }

              private fun aplicarFilaNaMemoria() {
                  val fila = dadosFila()
                  for (i in 0 until fila.length()) {
                      val op = fila.optJSONObject(i) ?: continue
                      val id = op.optString("id")
                      if (op.optString("operacao") == "excluir") {
                          registros.removeAll { it.id == id }
                      } else {
                          val dados = op.optJSONObject("dados") ?: continue
                          val item = try { jsonParaItem(dados) } catch (_: Exception) { continue }
                          val indice = registros.indexOfFirst { it.id == item.id }
                          if (indice >= 0) registros[indice] = item else registros.add(item)
                      }
                  }
              }

              private fun salvarNoFirestore(item: ItemReposicao) {
                  colocarNaFilaSalvar(item)
                  enviarFilaFirebase()
              }

              private fun excluirDoFirestore(item: ItemReposicao) {
                  colocarNaFilaExcluir(item)
                  enviarFilaFirebase()
              }

              private fun enviarFilaFirebase() {
                  val fila = dadosFila()
                  if (fila.length() == 0) return
                  val primeira = fila.optJSONObject(0) ?: return
                  val id = primeira.optString("id")
                  val operacao = primeira.optString("operacao")
                  val referencia = db.collection(COLECAO_REPOSICOES).document(id)
                  val tarefa = if (operacao == "excluir") {
                      referencia.delete()
                  } else {
                      val dados = primeira.optJSONObject("dados") ?: return
                      val mapa = hashMapOf<String, Any>(
                          "id" to dados.optString("id"),
                          "codigo" to dados.optString("codigo"),
                          "descricao" to dados.optString("descricao"),
                          "quantidade" to dados.optInt("quantidade", 1),
                          "rua" to dados.optString("rua"),
                          "rack" to dados.optString("rack"),
                          "coluna" to dados.optString("coluna"),
                          "linha" to dados.optString("linha"),
                          "operador" to dados.optString("operador"),
                          "timestamp" to dados.optLong("timestamp", 0L),
                          "concluido" to dados.optBoolean("concluido", false),
                          "status" to dados.optString("status"),
                          "separador" to dados.optString("separador"),
                          "dispositivo" to dados.optString("dispositivo")
                      )
                      referencia.set(mapa, SetOptions.merge())
                  }
                  tarefa.addOnSuccessListener {
                      val atual = dadosFila()
                      val nova = JSONArray()
                      for (i in 0 until atual.length()) {
                          val op = atual.optJSONObject(i) ?: continue
                          if (!(op.optString("id") == id && i == 0)) nova.put(op)
                      }
                      salvarFila(nova)
                      aplicarFilaNaMemoria()
                      salvarRegistros()
                      enviarFilaFirebase()
                  }.addOnFailureListener {
                      sincronizacaoHandler.removeCallbacksAndMessages("firebase_retry")
                      sincronizacaoHandler.postAtTime({ enviarFilaFirebase() }, "firebase_retry", android.os.SystemClock.uptimeMillis() + 10000L)
                  }
              }

              private fun iniciarSincronizacaoFirestore() {
                  firestoreListener?.remove()
                  firestoreSnapshotInicial = true
                  firestoreListener = db.collection(COLECAO_REPOSICOES)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) return@addSnapshotListener
                          val remotos = snapshot.documents.mapNotNull { doc ->
                              try {
                                  ItemReposicao(
                                      id = doc.getString("id") ?: doc.id,
                                      codigo = doc.getString("codigo") ?: return@mapNotNull null,
                                      descricao = doc.getString("descricao") ?: "",
                                      quantidade = (doc.getLong("quantidade") ?: 1L).toInt(),
                                      rua = doc.getString("rua") ?: "",
                                      rack = doc.getString("rack") ?: "",
                                      coluna = doc.getString("coluna") ?: "",
                                      linha = doc.getString("linha") ?: "",
                                      operador = doc.getString("operador") ?: "",
                                      timestamp = doc.getLong("timestamp") ?: 0L,
                                      status = doc.getString("status") ?: if (doc.getBoolean("concluido") == true) STATUS_CONCLUIDO else STATUS_PENDENTE,
                                      separador = doc.getString("separador") ?: "",
                                      dispositivo = doc.getString("dispositivo") ?: ""
                                  )
                              } catch (_: Exception) { null }
                          }
                          registros.clear()
                          registros.addAll(remotos)
                          aplicarFilaNaMemoria()
                          salvarRegistros()
                          atualizarInterface()
                          enviarFilaFirebase()
                      }
              }

              private fun sincronizarAgoraComFirebase() {
                  enviarFilaFirebase()
                  db.collection(COLECAO_REPOSICOES).get(Source.SERVER)
                      .addOnSuccessListener { snapshot ->
                          val remotos = snapshot.documents.mapNotNull { doc ->
                              try {
                                  ItemReposicao(
                                      id = doc.getString("id") ?: doc.id,
                                      codigo = doc.getString("codigo") ?: return@mapNotNull null,
                                      descricao = doc.getString("descricao") ?: "",
                                      quantidade = (doc.getLong("quantidade") ?: 1L).toInt(),
                                      rua = doc.getString("rua") ?: "",
                                      rack = doc.getString("rack") ?: "",
                                      coluna = doc.getString("coluna") ?: "",
                                      linha = doc.getString("linha") ?: "",
                                      operador = doc.getString("operador") ?: "",
                                      timestamp = doc.getLong("timestamp") ?: 0L,
                                      status = doc.getString("status") ?: if (doc.getBoolean("concluido") == true) STATUS_CONCLUIDO else STATUS_PENDENTE,
                                      separador = doc.getString("separador") ?: "",
                                      dispositivo = doc.getString("dispositivo") ?: ""
                                  )
                              } catch (_: Exception) { null }
                          }
                          registros.clear()
                          registros.addAll(remotos)
                          aplicarFilaNaMemoria()
                          salvarRegistros()
                          atualizarInterface()
                          enviarFilaFirebase()
                      }
                      .addOnFailureListener {
                          aplicarFilaNaMemoria()
                          salvarRegistros()
                          atualizarInterface()
                      }
                  sincronizarBaseEnderecos(false)
              }

              private fun sincronizarBaseEnderecos(forcar: Boolean) {
                  db.collection(COLECAO_BASE_META).document("atual").get(Source.SERVER)
                      .addOnSuccessListener { meta ->
                          val versao = meta.getString("versao") ?: return@addOnSuccessListener
                          val local = getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_BASE_VERSAO, "") ?: ""
                          if (!forcar && versao == local) return@addOnSuccessListener
                          db.collection(COLECAO_BASE_ITENS).whereEqualTo("versao", versao).get(Source.SERVER)
                              .addOnSuccessListener { snap ->
                                  val novaBase = mutableMapOf<String, EnderecoProduto>()
                                  for (doc in snap.documents) {
                                      val codigo = doc.getString("codigo")?.trim().orEmpty()
                                      if (codigo.isBlank()) continue
                                      novaBase[codigo] = EnderecoProduto(
                                          codigo, doc.getString("descricao") ?: "", doc.getString("rua") ?: "",
                                          doc.getString("rack") ?: "", doc.getString("coluna") ?: "", doc.getString("linha") ?: ""
                                      )
                                  }
                                  if (novaBase.isEmpty()) return@addOnSuccessListener
                                  baseProdutos.clear()
                                  baseProdutos.putAll(novaBase)
                                  val cache = JSONArray()
                                  novaBase.values.forEach { item -> cache.put(JSONObject().apply {
                                      put("codigo", item.codigo); put("descricao", item.descricao); put("rua", item.rua); put("rack", item.rack); put("coluna", item.coluna); put("linha", item.linha)
                                  }) }
                                  getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_BASE_VERSAO, versao).putString(KEY_BASE_CACHE, cache.toString()).apply()
                                  atualizarInterface()
                              }
                      }
              }

